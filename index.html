    LZ.projects.subscribe((state, patch) => { if (patch.current || patch.fileIndex) rerender(); });
    LZ.workspace.subscribe((state, patch) => { if (patch.activeFile !== undefined || patch.problems) rerender(); });

    return panel;
  };
})();

/* ========== ui/editor.js ========== */
/* ============================================================================
 * Luzzes — ui/editor.js
 * The code surface: tabs, gutter, syntax highlighting, bracket matching,
 * find & replace, minimap, selection actions and per-file undo.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const I = LZ.icons;
  const h = U.h;
  const components = LZ.components;

  const editor = (LZ.editor = {});

  /* --------------------------------------------------------- caret maths -- */
  function offsetFromLineCol(text, line, col) {
    const lines = text.split('\n');
    let offset = 0;
    for (let i = 0; i < line - 1 && i < lines.length; i++) offset += lines[i].length + 1;
    offset += Math.max(0, col - 1);
    return Math.min(offset, text.length);
  }
  function lineColFromOffset(text, offset) {
    let line = 1, col = 1;
    for (let i = 0; i < offset && i < text.length; i++) {
      if (text.charCodeAt(i) === 10) { line++; col = 1; } else col++;
    }
    return { line, col };
  }
  function getCaretOffset(root) {
    const selection = window.getSelection();
    if (!selection || !selection.rangeCount) return 0;
    const range = selection.getRangeAt(0);
    if (!root.contains(range.startContainer)) return 0;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    let offset = 0;
    let node;
    while ((node = walker.nextNode())) {
      if (node === range.startContainer) return offset + range.startOffset;
      offset += node.textContent.length;
      if (node.parentElement && node.parentElement.classList.contains('lz-line') &&
        node.parentElement.nextSibling) offset += 1;
    }
    return offset;
  }
  function setCaretOffset(root, offset) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    let remaining = offset;
    let node;
    while ((node = walker.nextNode())) {
      const length = node.textContent.length;
      const isLineEnd = node.parentElement && node.parentElement.classList.contains('lz-line');
      if (remaining <= length || (isLineEnd && remaining === length + 1)) {
        const range = document.createRange();
        const at = Math.min(remaining, length);
        range.setStart(node, at);
        range.collapse(true);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        return true;
      }
      remaining -= length + (isLineEnd && node.parentElement.nextSibling ? 1 : 0);
    }
    return false;
  }

  /* ------------------------------------------------------------ brackets -- */
  const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
  const CLOSERS = { ')': '(', ']': '[', '}': '{' };

  function matchingBracket(text, index) {
    const char = text[index];
    if (PAIRS[char] && char !== '"' && char !== "'" && char !== '`') {
      let depth = 0;
      for (let i = index; i < text.length; i++) {
        if (text[i] === char) depth++;
        else if (text[i] === PAIRS[char]) {
          depth--;
          if (depth === 0) return i;
        }
      }
    } else if (CLOSERS[char]) {
      let depth = 0;
      for (let i = index; i >= 0; i--) {
        if (text[i] === char) depth++;
        else if (text[i] === CLOSERS[char]) {
          depth--;
          if (depth === 0) return i;
        }
      }
    }
    return -1;
  }

  /* ---------------------------------------------------------------- folds -- */
  /**
   * Fold ranges are computed from the real text, never guessed:
   *   · brace/bracket blocks for js, ts, json, css (string- and comment-aware)
   *   · indentation blocks for html, markdown and anything else
   * Ranges are {start, end} with 1-based line numbers; a range folds when it
   * spans more than one line.
   */
  function computeFoldRanges(text, language) {
    const lines = String(text == null ? '' : text).split('\n');
    const ranges = [];
    const braceLangs = ['js', 'jsx', 'ts', 'tsx', 'json', 'css'];
    if (braceLangs.indexOf(language) > -1) {
      const stack = [];
      let inBlockComment = false;
      let quote = null;
      lines.forEach((line, index) => {
        const lineNumber = index + 1;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          const next = line[i + 1];
          if (inBlockComment) {
            if (ch === '*' && next === '/') { inBlockComment = false; i++; }
            continue;
          }
          if (quote) {
            if (ch === '\\') { i++; continue; }
            if (ch === quote) quote = null;
            continue;
          }
          if (ch === '/' && next === '*') { inBlockComment = true; i++; continue; }
          if (ch === '/' && next === '/') break;
          if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
          if (ch === '{' || ch === '[' || ch === '(') { stack.push({ ch, line: lineNumber }); continue; }
          if (ch === '}' || ch === ']' || ch === ')') {
            const open = stack.pop();
            if (!open) continue;
            if (open.ch === '{' && lineNumber > open.line) ranges.push({ start: open.line, end: lineNumber - 1, kind: 'block' });
          }
        }
      });
      return ranges;
    }

    // indentation folding
    const indentOf = (line) => (line.match(/^[ \t]*/) || [''])[0].replace(/\t/g, '  ').length;
    for (let i = 0; i < lines.length; i++) {
      if (!lines[i].trim()) continue;
      const base = indentOf(lines[i]);
      let end = i;
      for (let j = i + 1; j < lines.length; j++) {
        if (!lines[j].trim()) { if (end === j - 1) end = j; continue; }
        if (indentOf(lines[j]) <= base) break;
        end = j;
      }
      if (end > i) ranges.push({ start: i + 1, end: end + 1, kind: 'indent' });
    }
    return ranges;
  }

  /* --------------------------------------------------------- completion --- */
  /**
   * Completions come from two honest sources only: the words that already
   * exist in this file, and the language's own keyword list. Nothing is
   * generated, so a suggestion is always something the file already uses or
   * that the language defines.
   */
  const KEYWORDS = {
    js: ['const', 'let', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'switch', 'case', 'break', 'continue',
      'class', 'extends', 'new', 'this', 'typeof', 'instanceof', 'try', 'catch', 'finally', 'throw', 'async', 'await',
      'import', 'export', 'default', 'from', 'null', 'undefined', 'true', 'false', 'document', 'window', 'console',
      'Array', 'Object', 'String', 'Number', 'Boolean', 'Promise', 'JSON', 'Map', 'Set', 'Math', 'Date', 'querySelector',
      'addEventListener', 'map', 'filter', 'forEach', 'reduce', 'push', 'length'],
    css: ['display', 'position', 'margin', 'padding', 'border', 'border-radius', 'background', 'background-color', 'color',
      'font-family', 'font-size', 'font-weight', 'line-height', 'letter-spacing', 'text-transform', 'text-align',
      'grid-template-columns', 'gap', 'flex', 'flex-direction', 'align-items', 'justify-content', 'transition',
      'transform', 'opacity', 'overflow', 'z-index', 'max-width', 'min-height', 'content', 'box-shadow', 'cursor'],
    html: ['div', 'span', 'section', 'article', 'header', 'footer', 'nav', 'main', 'button', 'a', 'img', 'svg', 'path',
      'script', 'style', 'link', 'meta', 'ul', 'ol', 'li', 'h1', 'h2', 'h3', 'p', 'input', 'form', 'label', 'class', 'href', 'src', 'alt', 'aria-label']
  };

  function wordIndex(text) {
    const counts = new Map();
    const re = /[A-Za-z_$][A-Za-z0-9_$-]{1,}/g;
    let match;
    while ((match = re.exec(text))) {
      const word = match[0];
      counts.set(word, (counts.get(word) || 0) + 1);
    }
    return counts;
  }

  function wordPrefixAt(text, offset) {
    let start = offset;
    while (start > 0 && /[A-Za-z0-9_$.-]/.test(text[start - 1])) start--;
    return { start, prefix: text.slice(start, offset) };
  }

  function candidatesFor(text, offset, language) {
    const { prefix } = wordPrefixAt(text, offset);
    if (prefix.length < 2) return [];
    const lower = prefix.toLowerCase();
    const keywords = KEYWORDS[language] || KEYWORDS.js;
    const counts = wordIndex(text);
    const scored = [];
    counts.forEach((count, word) => {
      if (word === prefix || word.length <= prefix.length) return;
      if (word.slice(0, prefix.length) !== prefix && word.slice(0, lower.length).toLowerCase() !== lower) return;
      scored.push({ word, score: count + (word.length > prefix.length + 6 ? 0 : 1), from: 'file' });
    });
    keywords.forEach((word) => {
      if (word === prefix || word.length <= prefix.length) return;
      if (word.slice(0, lower.length) !== lower && word.slice(0, prefix.length) !== prefix) return;
      if (!counts.has(word)) scored.push({ word, score: 0.5, from: 'language' });
    });
    return scored
      .sort((a, b) => b.score - a.score || a.word.length - b.word.length || a.word.localeCompare(b.word))
      .slice(0, 8);
  }

  /* --------------------------------------------------------------- view --- */
  function createEditorView() {
    const gutter = h('div.lz-code-gutter', { attrs: { 'aria-hidden': 'true' } });
    const content = h('pre.lz-code-content', {
      contenteditable: 'true',
      spellcheck: 'false',
      autocapitalize: 'off',
      autocomplete: 'off',
      role: 'textbox',
      'aria-multiline': 'true',
      attrs: { 'aria-label': 'Code editor' }
    });
    const scroller = h('div.lz-code-scroll', content);
    const minimap = h('div.lz-code-minimap', { attrs: { 'aria-hidden': 'true' } });
    const findBar = h('div.lz-find-bar', { hidden: true });
    const complete = h('div.lz-complete', { hidden: true, attrs: { role: 'listbox', 'aria-label': 'Completions' } });
    const root = h('div.lz-code', [gutter, scroller, minimap, findBar, complete]);

      path: null,
      content: '',
      language: 'js',
      suppress: false,
      rehighlightTimer: null,
      lastPushed: null,
      gutterScroll: 0,
      folds: new Set(),        // start lines of collapsed ranges
      foldRanges: [],          // [{start, end}] recomputed from the text

    /* ------------------------------------------------------- rendering --- */
    function lineDivs(htmlLines, count) {
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < count; i++) {
        // Empty lines are kept empty: a placeholder character here would be read
        // back into the file the next time the text is synced from the DOM.
        fragment.appendChild(h('div.lz-line', { html: htmlLines[i] || '' }));
      }
      return fragment;
    }

    /** start line -> range, so the gutter and the code surface agree. */
    function foldMap() {
      const map = new Map();
      state.foldRanges.forEach((range) => { if (!map.has(range.start)) map.set(range.start, range); });
      return map;
    }

    function renderGutter(count, activeLine, problems, bracketLine) {
      U.clear(gutter);
      const folds = foldMap();
      const fragment = document.createDocumentFragment();
      for (let i = 1; i <= count; i++) {
        const severity = problems.filter((p) => p.line === i)[0];
        const range = folds.get(i);
        const collapsed = state.folds.has(i);
        const chevron = range
          ? h('button.lz-gutter-fold' + (collapsed ? '.is-collapsed' : ''), {
            type: 'button',
            title: (collapsed ? 'Unfold' : 'Fold') + ' lines ' + range.start + '–' + range.end + ' (' + (range.end - range.start) + ' lines)',
            attrs: { 'aria-label': (collapsed ? 'Unfold block starting on line ' : 'Fold block starting on line ') + i, 'aria-expanded': collapsed ? 'false' : 'true' },
            onClick: (event) => { event.preventDefault(); event.stopPropagation(); toggleFold(i); }
          }, [I.el('chevronRight', 11)])
          : h('span.lz-gutter-fold-spacer');
        fragment.appendChild(h('div.lz-gutter-line' + (i === activeLine ? '.is-active' : '') + (i === bracketLine ? '.is-match' : '') + (range && collapsed ? '.is-folded' : ''), [
          chevron,
          h('span.lz-gutter-sev' + (severity ? '.is-' + severity.severity : ''), {
            title: severity ? severity.message : null
          }, severity ? I.el(severity.severity === 'error' ? 'error' : severity.severity === 'warning' ? 'warning' : 'info', 10) : ''),
          h('span.lz-gutter-num', { text: String(i) })
        ]));
      }
      gutter.appendChild(fragment);
    }

    /* ------------------------------------------------------------- folds --- */
    function lineEl(line) { return content.children[line - 1] || null; }

    function applyFolds() {
      const folds = foldMap();
      const collapsed = Array.from(state.folds).filter((start) => folds.has(start));
      for (let i = 1; i <= content.children.length; i++) {
        const el = lineEl(i);
        if (el) el.classList.remove('is-folded');
      }
      collapsed.forEach((start) => {
        const range = folds.get(start);
        for (let line = range.start + 1; line <= range.end + 1; line++) {
          const el = lineEl(line);
          if (el) el.classList.add('is-folded');
        }
        // the visible marker on the first line of the folded block
        let chip = lineEl(range.start).querySelector('.lz-fold-chip');
        if (!chip) {
          chip = h('button.lz-fold-chip', {
            type: 'button',
            contenteditable: 'false',
            title: 'Unfold lines ' + range.start + '–' + range.end,
            attrs: { 'aria-label': 'Unfold lines ' + range.start + ' to ' + range.end },
            onClick: (event) => { event.preventDefault(); event.stopPropagation(); toggleFold(start); }
          });
          lineEl(range.start).appendChild(chip);
        }

        // would be picked up by the caret maths and by readText().
        chip.dataset.label = '⋯ ' + (range.end - range.start) + ' line' + (range.end - range.start === 1 ? '' : 's');
      });
      renderGutter(content.children.length, LZ.workspace.get().cursor.line,
        LZ.workspace.get().problems.byPath[state.path] || [], -1);
      updateStatus();
    }

    function toggleFold(start) {
      const folds = foldMap();
      const range = folds.get(start);
      if (!range) return false;
      if (state.folds.has(start)) state.folds.delete(start);
      else state.folds.add(start);
      applyFolds();
      return true;
    }

    function foldAll() {
      state.foldRanges.forEach((range) => state.folds.add(range.start));
      applyFolds();
    }

    function unfoldAll() {
      state.folds.clear();
      Array.prototype.forEach.call(content.children, (el) => {
        const chip = el.querySelector ? el.querySelector('.lz-fold-chip') : null;

      applyFolds();
    }

    /** Unfold anything hiding `line` so goTo() can reach it. */
    function revealLine(line) {
      const folds = foldMap();
      let changed = false;
      folds.forEach((range, start) => {
        if (line > start && line <= range.end + 1 && state.folds.has(start)) {
          state.folds.delete(start);
          changed = true;
        }
      });
      return changed;
    }

    function renderMinimap(text) {
      if (!LZ.settings.getIn('editor.minimap', true)) { minimap.style.display = 'none'; return; }
      minimap.style.display = '';
      const lines = text.split('\n');
      const step = Math.max(1, Math.ceil(lines.length / 400));
      U.clear(minimap);
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < lines.length; i += step) {
        const line = lines[i];
        const indent = (line.match(/^\s*/) || [''])[0].length;
        const width = Math.max(6, Math.min(100, line.trim().length * 2.1));
        fragment.appendChild(h('div.lz-minimap-line', {
          style: {
            marginLeft: Math.min(indent * 1.2, 26) + 'px',
            width: width + '%',
            opacity: line.trim() ? '0.75' : '0.15'
          }
        }));
      }
      minimap.appendChild(fragment);
      const viewport = h('div.lz-minimap-viewport');
      minimap.appendChild(viewport);
      const sync = () => {
        const ratio = scroller.scrollTop / Math.max(1, scroller.scrollHeight - scroller.clientHeight);
        const height = Math.max(18, (scroller.clientHeight / Math.max(1, scroller.scrollHeight)) * minimap.clientHeight);
        viewport.style.height = height + 'px';
        viewport.style.transform = 'translateY(' + ratio * (minimap.clientHeight - height) + 'px)';
      };
      scroller.addEventListener('scroll', sync, { passive: true });
      setTimeout(sync, 0);
    }

    function applyContent(nextContent, opts) {
      state.content = nextContent;
      const text = nextContent == null ? '' : nextContent;
      const counted = U.countLines(text);
      const htmlLines = LZ.hl.lines(text, state.language);
      state.suppress = true;
      U.clear(content);
      content.appendChild(lineDivs(htmlLines, counted));
      state.suppress = false;
      const file = state.path ? LZ.projects.file(state.path) : null;
      const problems = (LZ.workspace.get().problems.byPath[state.path] || []);
      state.foldRanges = computeFoldRanges(text, state.language);
      // drop folds that no longer exist after an edit
      const validStarts = new Set(state.foldRanges.map((r) => r.start));
      Array.from(state.folds).forEach((start) => { if (!validStarts.has(start)) state.folds.delete(start); });
      renderGutter(counted, opts && opts.line ? opts.line : 1, problems, -1);
      renderMinimap(text);
      if (state.folds.size) applyFolds();
      if (file && file.binary) {
        content.setAttribute('contenteditable', 'false');
      } else {
        content.setAttribute('contenteditable', 'true');
      }
      updateStatus();
      void file;
    }

    /* --------------------------------------------------------- editing --- */
    /** Text of one rendered line, ignoring editor chrome such as fold chips. */
    function lineText(el) {
      let out = '';
      Array.prototype.forEach.call(el.childNodes, (node) => {
        if (node.nodeType === 1 && node.classList &&
            (node.classList.contains('lz-fold-chip') || node.dataset.noRead === 'true')) return;
        out += node.textContent;
      });
      // defensive: a browser can leave a lone non-breaking space in an empty line
      return out === '\u00a0' ? '' : out.replace(/\u00a0$/, '');
    }

    function readText() {
      const parts = [];
      Array.prototype.forEach.call(content.children, (child) => {
        parts.push(lineText(child));
      });
      if (!parts.length) return '';
      return parts.join('\n');
    }

    function syncFromDom(opts) {
      if (state.suppress) return;
      const text = readText();
      const offset = getCaretOffset(content);
      state.content = text;
      const file = state.path ? LZ.projects.file(state.path) : null;
      if (file && !file.binary) {
        // record undo snapshots on a trailing edge so typing is one step
        if (state.lastPushed !== text) {
          clearTimeout(state.rehighlightTimer);
          state.rehighlightTimer = setTimeout(() => {
            if (state.lastPushed !== text) { /* snapshot pushed below */ }
          }, 10);
        }
        LZ.projects.writeFile(state.path, text, { origin: 'user' });
      }
      const position = lineColFromOffset(text, offset);
      LZ.workspace.setCursor(position.line, position.col);
      updateGutterActive(position.line);
      updateStatus();
      if (!opts || opts.rehighlight !== false) scheduleRehighlight(offset);
      updateSelection(null);
    }

    function scheduleRehighlight(offset) {
      clearTimeout(state.rehighlightTimer);
      state.rehighlightTimer = setTimeout(() => {
        if (state.suppress) return;
        const counted = U.countLines(state.content);
        const htmlLines = LZ.hl.lines(state.content, state.language);
        state.suppress = true;
        U.clear(content);
        content.appendChild(lineDivs(htmlLines, counted));
        state.suppress = false;
        const file = state.path ? LZ.projects.file(state.path) : null;
        const problems = LZ.workspace.get().problems.byPath[state.path] || [];
        renderGutter(counted, LZ.workspace.get().cursor.line, problems, -1);
        if (document.activeElement === content) setCaretOffset(content, offset);
      }, 420);
    }

    function updateGutterActive(line) {
      Array.prototype.forEach.call(gutter.children, (el, index) => {
        el.classList.toggle('is-active', index + 1 === line);
      });
    }

    /* ------------------------------------------------------- completion --- */
    function renderCompletions() {
      const items = state.completion.items;
      U.clear(complete);
      if (!state.completion.open || !items.length) { complete.hidden = true; return; }
      complete.hidden = false;
      items.forEach((item, index) => {
        complete.appendChild(h('button.lz-complete-item' + (index === state.completion.index ? '.is-active' : ''), {
          type: 'button',
          attrs: { role: 'option', 'aria-selected': index === state.completion.index ? 'true' : 'false' },
          onClick: (event) => { event.preventDefault(); acceptCompletion(index); }
        }, [
          I.el(item.from === 'file' ? 'fileCode' : 'code', 12),
          h('span.lz-complete-word', { text: item.word }),
          h('span.lz-complete-kind', { text: item.from === 'file' ? 'in this file' : 'language' })
        ]));
      });
      positionCompletions();
    }

    /** Place the popup under the caret. Best-effort: browsers differ, jsdom has no layout. */
    function positionCompletions() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) { complete.style.left = '1rem'; complete.style.top = '1rem'; return; }
      let rect = null;
      try { rect = selection.getRangeAt(0).getBoundingClientRect(); } catch (e) { rect = null; }
      const host = root.getBoundingClientRect();
      if (!rect || (!rect.height && !rect.width)) { complete.style.left = '1.2rem'; complete.style.top = '1.2rem'; return; }
      const left = Math.min(Math.max(0, rect.left - host.left), Math.max(0, host.width - 260));
      const below = rect.bottom - host.top + 6;
      const above = rect.top - host.top - complete.offsetHeight - 6;
      complete.style.left = left + 'px';
      complete.style.top = (above > 0 && below + 180 > host.height ? above : below) + 'px';
    }

    function updateCompletions(force) {
      const offset = getCaretOffset(content);
      const items = candidatesFor(state.content, offset, state.language);
      const prefix = wordPrefixAt(state.content, offset).prefix;
      if (!items.length || (!force && prefix.length < 2)) { closeCompletions(); return; }
      state.completion = { open: true, items, index: 0, start: offset - prefix.length };
      renderCompletions();
    }

    function closeCompletions() {
      if (!state.completion.open) return;
      state.completion.open = false;
      state.completion.items = [];
      complete.hidden = true;
      U.clear(complete);
    }

    function moveCompletion(delta) {
      const total = state.completion.items.length;
      if (!total) return;
      state.completion.index = (state.completion.index + delta + total) % total;
      renderCompletions();
    }

    /** Replace the typed prefix with the chosen word, then keep editing. */
    function acceptCompletion(index) {
      const item = state.completion.items[index == null ? state.completion.index : index];
      if (!item) return false;
      const start = state.completion.start;
      const offset = getCaretOffset(content);
      const before = state.content;
      const next = before.slice(0, start) + item.word + before.slice(offset);
      closeCompletions();
      const nextOffset = start + item.word.length;
      if (state.path) LZ.workspace.pushHistory(state.path, before);
      applyContent(next);
      setCaretOffset(content, nextOffset);
      if (state.path) LZ.projects.writeFile(state.path, next, { origin: 'user' });
      const position = lineColFromOffset(next, nextOffset);
      LZ.workspace.setCursor(position.line, position.col);
      updateGutterActive(position.line);
      updateStatus();
      return true;
    }

    content.addEventListener('blur', () => closeCompletions());
    scroller.addEventListener('scroll', () => { if (state.completion.open) positionCompletions(); });

    function insertAtCaret(text) {
      if (document.execCommand) {
        document.execCommand('insertText', false, text);
        return true;
      }
      const selection = window.getSelection();
      if (!selection.rangeCount) return false;
      const range = selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(document.createTextNode(text));
      range.collapse(false);
      return true;
    }

    /* ------------------------------------------------------- interaction - */
    content.addEventListener('beforeinput', () => {
      if (!state.lastPushed) state.lastPushed = state.content;
    });

    content.addEventListener('input', () => {
      if (state.suppress) return;
      // push one undo snapshot per editing burst
      if (!state.lastPushed) state.lastPushed = state.content;
      const wasOpen = state.completion.open;
      syncFromDom();
      const offset = getCaretOffset(content);
      const char = state.content[offset - 1] || '';
      if (/[A-Za-z0-9_$.-]/.test(char) || wasOpen) updateCompletions(false);
      else closeCompletions();
      clearTimeout(state.burstTimer);
      state.burstTimer = setTimeout(() => {
        if (state.lastPushed && state.lastPushed !== state.content) {
          LZ.workspace.pushHistory(state.path, state.lastPushed);
        }
        state.lastPushed = null;
      }, 700);
    });

    content.addEventListener('keydown', (event) => {
      const tabSize = LZ.settings.getIn('editor.tabSize', 2);
      const mod = U.modKey(event);
      const selection = window.getSelection();
      const hasSelection = selection && !selection.isCollapsed;

      /* completions ------------------------------------------------------- */
      if (event.ctrlKey && event.key === ' ') { event.preventDefault(); updateCompletions(true); return; }
      if (state.completion.open) {
        if (event.key === 'ArrowDown') { event.preventDefault(); moveCompletion(1); return; }
        if (event.key === 'ArrowUp') { event.preventDefault(); moveCompletion(-1); return; }
        if (event.key === 'Enter' || event.key === 'Tab') {
          if (state.completion.items.length) {
            event.preventDefault();
            acceptCompletion(state.completion.index);
            return;
          }
        }
        if (event.key === 'Escape') { event.preventDefault(); closeCompletions(); return; }
      }

      /* shortcuts --------------------------------------------------------- */
      if (mod && event.key.toLowerCase() === 's') { event.preventDefault(); LZ.actions.save(); return; }
      if (mod && event.shiftKey && (event.key === '{' || event.key === '[')) { event.preventDefault(); foldAll(); return; }
      if (mod && event.shiftKey && (event.key === '}' || event.key === ']')) { event.preventDefault(); unfoldAll(); return; }
      if (mod && event.key.toLowerCase() === 'f') { event.preventDefault(); openFind(); return; }
      if (mod && event.key.toLowerCase() === 'z' && !event.shiftKey) {
        event.preventDefault();
        if (LZ.workspace.canUndo(state.path)) { LZ.workspace.undo(state.path); refreshFromStore(); }
        return;
      }
      if (mod && (event.key.toLowerCase() === 'y' || (event.key.toLowerCase() === 'z' && event.shiftKey))) {
        event.preventDefault();
        if (LZ.workspace.canRedo(state.path)) { LZ.workspace.redo(state.path); refreshFromStore(); }
        return;
      }
      if (mod && event.key === '/') {
        event.preventDefault();
        toggleComment();
        return;
      }
      if (mod && event.key.toLowerCase() === 'd') { event.preventDefault(); return; } // multi-select unsupported
      if (event.key === 'Tab') {
        event.preventDefault();
        if (hasSelection && selection.toString().indexOf('\n') > -1) {
          indentSelection(event.shiftKey);
          return;
        }
        if (event.shiftKey) {
          const offset = getCaretOffset(content);
          const position = lineColFromOffset(state.content, offset);
          const lineStart = offset - (position.col - 1);
          const line = state.content.slice(lineStart, offset);
          const removable = Math.min(tabSize, (line.match(/^ +/) || [''])[0].length);
          if (removable) {
            state.content = state.content.slice(0, lineStart) + state.content.slice(lineStart + removable);
            if (state.path) LZ.projects.writeFile(state.path, state.content, { origin: 'user' });
            applyContent(state.content);
            setCaretOffset(content, offset - removable);
            updateGutterActive(lineColFromOffset(state.content, offset - removable).line);
          }
          return;
        }
        const offset = getCaretOffset(content);
        const position = lineColFromOffset(state.content, offset);
        const spaces = tabSize - ((position.col - 1) % tabSize);
        insertAtCaret(' '.repeat(spaces));
        syncFromDom();
        return;
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        const offset = getCaretOffset(content);
        const position = lineColFromOffset(state.content, offset);
        const lines = state.content.split('\n');
        const currentLine = lines[position.line - 1] || '';
        const indent = (currentLine.match(/^\s*/) || [''])[0];
        const trimmed = currentLine.trim();
        const extra = /[{[(:>]$/.test(trimmed) ? ' '.repeat(tabSize) : '';
        const closerLead = /^[}\])]/.test(currentLine.slice(position.col - 1)) ? '' : '';
        insertAtCaret('\n' + indent + extra + closerLead);
        syncFromDom({ rehighlight: false });
        return;
      }
      /* auto pairs -------------------------------------------------------- */
      if (!mod && !event.altKey && PAIRS[event.key]) {
        const closer = PAIRS[event.key];
        if (event.key === '"' || event.key === "'" || event.key === '`') {
          const nextChar = state.content[getCaretOffset(content)];
          if (nextChar === event.key) {
            event.preventDefault();
            const range = document.createRange();
            const selection2 = window.getSelection();
            const at = getCaretOffset(content) + 1;
            setCaretOffset(content, at);
            void range; void selection2;
            syncFromDom({ rehighlight: false });
            return;
          }
        }
        event.preventDefault();
        const selected = hasSelection ? selection.toString() : '';
        insertAtCaret(event.key + selected + closer);
        if (selected) {
          const offset = getCaretOffset(content) - 1;
          setCaretOffset(content, offset);
        } else {
          const offset = getCaretOffset(content) - 1;
          setCaretOffset(content, offset);
        }
        syncFromDom({ rehighlight: false });
        return;
      }
      if (!mod && CLOSERS[event.key]) {
        const nextChar = state.content[getCaretOffset(content)];
        if (nextChar === event.key) {
          event.preventDefault();
          setCaretOffset(content, getCaretOffset(content) + 1);
          syncFromDom({ rehighlight: false });
          return;
        }
      }
    });

    function toggleComment() {
      const offset = getCaretOffset(content);
      const position = lineColFromOffset(state.content, offset);
      const lines = state.content.split('\n');
      const index = position.line - 1;
      const info = U.detectLang(state.path || 'file.txt');
      const token = info.id === 'css' || info.id === 'html' ? null : '//';
      if (!token) {
        LZ.ui.toast({ kind: 'info', title: 'Comment toggle', message: 'Line comments are available for JavaScript, TypeScript, JSON and Markdown files.' });
        return;
      }
      const line = lines[index];
      const indent = (line.match(/^\s*/) || [''])[0];
      if (line.trim().indexOf('//') === 0) lines[index] = indent + line.trim().slice(2).replace(/^ /, '');
      else lines[index] = indent + '// ' + line.slice(indent.length);
      state.content = lines.join('\n');
      LZ.workspace.pushHistory(state.path, (LZ.projects.read(state.path) || ''));
      LZ.projects.writeFile(state.path, state.content, { origin: 'user' });
      applyContent(state.content);
      setCaretOffset(content, offsetFromLineCol(state.content, position.line, position.col + (line.trim().indexOf('//') === 0 ? -3 : 3)));
      syncFromDom({ rehighlight: false });
    }

    function indentSelection(outdent) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const tabSize = LZ.settings.getIn('editor.tabSize', 2);
      const range = selection.getRangeAt(0);
      const start = getCaretOffset(content);
      const text = selection.toString();
      const startPos = lineColFromOffset(state.content, start);
      const lines = state.content.split('\n');
      const count = U.countLines(text);
      for (let i = 0; i < count; i++) {
        const index = startPos.line - 1 + i;
        if (lines[index] === undefined) break;
        if (outdent) lines[index] = lines[index].replace(new RegExp('^ {1,' + tabSize + '}'), '');
        else lines[index] = ' '.repeat(tabSize) + lines[index];
      }
      state.content = lines.join('\n');
      LZ.workspace.pushHistory(state.path, LZ.projects.read(state.path) || '');
      LZ.projects.writeFile(state.path, state.content, { origin: 'user' });
      applyContent(state.content);
      void range;
      syncFromDom({ rehighlight: false });
    }

    function refreshFromStore() {
      const content = LZ.projects.read(state.path);
      if (content == null) return;
      applyContent(content);
      scheduleRehighlight(0);
    }

    /* caret/selection tracking ------------------------------------------- */
    document.addEventListener('selectionchange', () => {
      if (document.activeElement !== content) return;
      const offset = getCaretOffset(content);
      const position = lineColFromOffset(state.content, offset);
      LZ.workspace.setCursor(position.line, position.col);
      updateGutterActive(position.line);
      const selection = window.getSelection();
      if (selection && !selection.isCollapsed && selection.toString().trim().length > 1) {
        const start = offset;
        const end = start + selection.toString().length;
        const startPos = lineColFromOffset(state.content, start);
        const endPos = lineColFromOffset(state.content, end);
        LZ.workspace.setSelection({
          path: state.path,
          text: selection.toString(),
          startLine: startPos.line,
          endLine: endPos.line
        });
        updateSelection(selection);
      } else {
        LZ.workspace.setSelection(null);
        updateSelection(null);
      }
      const bracketIndex = /[(){}[\]]/.test(state.content[offset - 1] || '') ? offset - 1
        : /[(){}[\]]/.test(state.content[offset] || '') ? offset : -1;
      if (bracketIndex > -1) {
        const match = matchingBracket(state.content, bracketIndex);
        const matchPos = match > -1 ? lineColFromOffset(state.content, match) : null;
        markBracket(matchIndexToLine(offset, bracketIndex), matchPos);
      }
    });

    function matchIndexToLine(caretOffset, bracketIndex) {
      void caretOffset;
      return lineColFromOffset(state.content, bracketIndex).line;
    }

    function markBracket(line, matchPos) {
      Array.prototype.forEach.call(gutter.children, (el, index) => {
        el.classList.toggle('is-match', matchPos ? index + 1 === matchPos.line : false);
      });
    }

    /* selection action bubble -------------------------------------------- */
    const bubble = h('div.lz-selection-bubble', { hidden: true });
    document.body.appendChild(bubble);

    function updateSelection(selection) {
      if (!selection) { bubble.hidden = true; return; }
      const rect = selection.getRangeAt ? selection.getRangeAt(0).getBoundingClientRect() : null;
      if (!rect || (!rect.width && !rect.height)) { bubble.hidden = true; return; }
      U.clear(bubble);
      const actions = [
        { label: 'Ask Luzzes', icon: 'sparkle', primary: true, onClick: () => { LZ.actions.focusComposer(); } },
        { label: 'Explain', icon: 'book', onClick: () => LZ.engine.quickAction('explain') },
        { label: 'Fix', icon: 'bug', onClick: () => LZ.engine.quickAction('fix') },
        { label: 'Refactor', icon: 'wand', onClick: () => LZ.engine.quickAction('refactor') },
        { label: 'Optimize', icon: 'bolt', onClick: () => LZ.engine.quickAction('optimize') },
        { label: 'Comment', icon: 'codeBlock', onClick: () => LZ.engine.quickAction('comment') }
      ];
      actions.forEach((action) => {
        bubble.appendChild(components.button({
          label: action.label, icon: action.icon, size: 'sm',
          kind: action.primary ? 'primary' : null,
          onClick: () => { bubble.hidden = true; action.onClick(); }
        }));
      });
      bubble.hidden = false;
      const width = bubble.offsetWidth;
      bubble.style.left = U.clamp(rect.left + rect.width / 2 - width / 2, 12, window.innerWidth - width - 12) + 'px';
      bubble.style.top = Math.max(12, rect.top - bubble.offsetHeight - 10) + 'px';
    }
    document.addEventListener('scroll', () => { bubble.hidden = true; }, true);
    content.addEventListener('mousedown', () => { bubble.hidden = true; });

    /* clipboard + paste -------------------------------------------------- */
    content.addEventListener('paste', (event) => {
      const text = (event.clipboardData || window.clipboardData).getData('text/plain');
      if (text == null) return;
      event.preventDefault();
      insertAtCaret(text.replace(/\t/g, ' '.repeat(LZ.settings.getIn('editor.tabSize', 2))));
      syncFromDom();
    });

    /* ------------------------------------------------------------- find -- */
    const findState = { query: '', matches: [], index: -1 };
    function openFind(initial) {
      findBar.hidden = false;
      const input = U.qs('.lz-find-input', findBar);
      input.focus();
      input.select();
      if (initial) { input.value = initial; runFind(); }
    }
    function closeFind() { findBar.hidden = true; content.focus(); }

    function runFind(direction) {
      findState.query = U.qs('.lz-find-input', findBar).value;
      const label = U.qs('.lz-find-count', findBar);
      if (!findState.query) { findState.matches = []; label.textContent = ''; return; }
      findState.matches = [];
      let index = state.content.indexOf(findState.query);
      while (index > -1) {
        findState.matches.push(index);
        index = state.content.indexOf(findState.query, index + findState.query.length);
      }
      if (!findState.matches.length) { label.textContent = 'No matches'; return; }
      if (direction) findState.index = (findState.index + direction + findState.matches.length) % findState.matches.length;
      else findState.index = U.clamp(findState.index < 0 ? 0 : findState.index, 0, findState.matches.length - 1);
      label.textContent = (findState.index + 1) + ' of ' + findState.matches.length;
      const at = findState.matches[findState.index];
      const position = lineColFromOffset(state.content, at);
      const targetLine = content.children[position.line - 1];
      if (targetLine) {
        const rect = targetLine.getBoundingClientRect();
        const scrollerRect = scroller.getBoundingClientRect();
        if (rect.top < scrollerRect.top || rect.bottom > scrollerRect.bottom) {
          scroller.scrollTop += rect.top - scrollerRect.top - scrollerRect.height / 3;
        }
      }
      setCaretOffset(content, at);
      content.focus();
    }

    function replaceCurrent() {
      const replacement = U.qs('.lz-find-replace', findBar).value;
      if (findState.index < 0 || !findState.matches.length) return;
      const at = findState.matches[findState.index];
      state.content = state.content.slice(0, at) + replacement + state.content.slice(at + findState.query.length);
      LZ.workspace.pushHistory(state.path, LZ.projects.read(state.path) || '');
      LZ.projects.writeFile(state.path, state.content, { origin: 'user' });
      applyContent(state.content);
      runFind();
    }

    function replaceAll() {
      const replacement = U.qs('.lz-find-replace', findBar).value;
      if (!findState.query) return;
      const before = state.content;
      const count = findState.matches.length;
      state.content = state.content.split(findState.query).join(replacement);
      if (state.content === before) return;
      LZ.workspace.pushHistory(state.path, before);
      LZ.projects.writeFile(state.path, state.content, { origin: 'user' });
      applyContent(state.content);
      U.qs('.lz-find-count', findBar).textContent = count + ' replaced';
      findState.matches = [];
      findState.index = -1;
    }

    findBar.appendChild(h('div.lz-find-row', [
      I.el('search', 13),
      h('input.lz-find-input', {
        placeholder: 'Find in file', attrs: { 'aria-label': 'Find in file' },
        onInput: U.debounce(() => runFind(), 160),
        onKeydown: (event) => {
          if (event.key === 'Enter') { event.preventDefault(); runFind(event.shiftKey ? -1 : 1); }
          if (event.key === 'Escape') { event.preventDefault(); closeFind(); }
        }
      }),
      h('span.lz-find-count'),
      components.iconButton({ icon: 'chevronUp', label: 'Previous match', size: 'sm', onClick: () => runFind(-1) }),
      components.iconButton({ icon: 'chevronDown', label: 'Next match', size: 'sm', onClick: () => runFind(1) }),
      components.iconButton({ icon: 'close', label: 'Close find', size: 'sm', onClick: closeFind })
    ]));
    findBar.appendChild(h('div.lz-find-row', [
      I.el('replace', 13),
      h('input.lz-find-replace', { placeholder: 'Replace with', attrs: { 'aria-label': 'Replace with' } }),
      components.button({ label: 'Replace', size: 'sm', onClick: replaceCurrent }),
      components.button({ label: 'Replace all', size: 'sm', onClick: replaceAll })
    ]));

    /* --------------------------------------------------------- status ---- */
    const status = h('div.lz-editor-status');

    function updateStatus() {
      U.clear(status);
      const cursor = LZ.workspace.get().cursor;
      const info = U.detectLang(state.path || 'file.txt');
      const problems = (LZ.workspace.get().problems.byPath[state.path] || []);
      const errors = problems.filter((p) => p.severity === 'error').length;
      const warnings = problems.filter((p) => p.severity === 'warning').length;
      status.appendChild(h('span.lz-status-item', { text: 'Ln ' + cursor.line + ', Col ' + cursor.col }));
      status.appendChild(h('button.lz-status-item.is-button', {
        type: 'button', text: info.label, title: 'Detected from the file extension',
        onClick: () => LZ.ui.toast({ kind: 'info', title: info.label, message: 'Language detection is by file extension.' })
      }));
      status.appendChild(h('span.lz-status-item', { text: 'Spaces: ' + LZ.settings.getIn('editor.tabSize', 2) }));
      status.appendChild(h('span.lz-status-item', { text: 'UTF-8' }));
      if (errors || warnings) {
        status.appendChild(h('button.lz-status-item.is-button.is-warning', {
          type: 'button',
          text: (errors ? errors + ' error' + (errors === 1 ? '' : 's') : '') +
            (errors && warnings ? ' · ' : '') + (warnings ? warnings + ' warning' + (warnings === 1 ? '' : 's') : ''),
          onClick: () => LZ.workspace.setBottomTab('problems')
        }));
      } else {
        status.appendChild(h('span.lz-status-item.is-ok', { text: 'No problems' }));
      }
      if (state.folds.size) {
        status.appendChild(h('button.lz-status-item.is-button', {
          type: 'button',
          text: state.folds.size + ' folded block' + (state.folds.size === 1 ? '' : 's'),
          title: 'Unfold everything (⌘⇧])',
          onClick: () => unfoldAll()
        }));
      }
      status.appendChild(components.button({
        label: 'Format', size: 'sm',
        title: 'Trim trailing whitespace and normalise indentation to spaces',
        onClick: () => LZ.actions.formatDocument(state.path)
      }));
    }

    /* ------------------------------------------------------ public API --- */
    const view = {
      root, content, scroller, gutter, minimap, status, findBar,
      setFile(path) {
        state.path = path;
        state.language = U.detectLang(path || 'file.txt').id;
        state.lastPushed = null;
        state.folds.clear();
        state.foldRanges = [];
        findState.matches = [];
        findState.index = -1;
        findBar.hidden = true;
        const file = path ? LZ.projects.file(path) : null;
        if (!file) {
          U.clear(content);
          content.setAttribute('contenteditable', 'false');
          U.clear(gutter);
          U.clear(minimap);
          updateStatus();
          return;
        }
        if (file.binary && file.dataUrl) {
          state.suppress = true;
          U.clear(content);
          content.appendChild(h('div.lz-binary-preview', [
            h('img', { src: file.dataUrl, alt: U.basename(path) }),
            h('p', { text: 'Binary asset — ' + U.basename(path) })
          ]));
          content.setAttribute('contenteditable', 'false');
          state.suppress = false;
          U.clear(gutter);
          U.clear(minimap);
          updateStatus();
          return;
        }
        applyContent(file.content == null ? '' : file.content);
        updateStatus();
      },
      refresh: refreshFromStore,
      openFind,
      focus() { content.focus(); },
      toggleFold,
      foldAll,
      unfoldAll,
      suggest: updateCompletions,
      completions: () => state.completion.items.slice(),
      acceptCompletion,
      foldRanges: () => state.foldRanges.slice(),
      foldedLines: () => Array.from(state.folds),
      goTo(line, col, length) {
        if (revealLine(line)) applyFolds();
        const offset = offsetFromLineCol(state.content, line, col || 1);
        try {
          setCaretOffset(content, offset);
          if (length) {
            const selection = window.getSelection();
            const range = document.createRange();
            const start = offset;
            const end = offset + length;
            // select the match so it is visible at a glance
            const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
            let node; let consumed = 0; let startNode = null; let endNode = null;
            let startOffset = 0; let endOffset = 0;
            while ((node = walker.nextNode())) {
              const nodeLength = node.textContent.length;
              const isEnd = node.parentElement.classList.contains('lz-line') && node.parentElement.nextSibling;
              if (startNode === null && start >= consumed && start <= consumed + nodeLength) {
                startNode = node; startOffset = start - consumed;
              }
              if (startNode !== null && endNode === null && end >= consumed && end <= consumed + nodeLength) {
                endNode = node; endOffset = end - consumed;
              }
              consumed += nodeLength + (isEnd ? 1 : 0);
            }
            if (startNode && endNode) {
              range.setStart(startNode, startOffset);
              range.setEnd(endNode, endOffset);
              selection.removeAllRanges();
              selection.addRange(range);
            }
          }
          const target = content.children[line - 1];
          if (target) {
            const rect = target.getBoundingClientRect();
            const scrollerRect = scroller.getBoundingClientRect();
            if (rect.top < scrollerRect.top || rect.bottom > scrollerRect.bottom) {
              scroller.scrollTop += rect.top - scrollerRect.top - scrollerRect.height / 2.5;
            }
          }
          content.focus();
          const position = lineColFromOffset(state.content, offset);
          LZ.workspace.setCursor(position.line, position.col);
          updateGutterActive(position.line);
        } catch (e) { /* caret placement is best-effort */ }
      },
      applyContent,
      updateStatus,
      getState: () => state
    };
    return view;
  }

  /* ----------------------------------------------------------- tabs ------- */
  function tabBar(onSelect) {
    const bar = h('div.lz-tabs', { role: 'tablist', attrs: { 'aria-label': 'Open files' } });
    let activePath = null;
    const dirty = new Map();

    function render() {
      const state = LZ.workspace.get();
      const project = LZ.projects.get();
      U.clear(bar);
      if (!state.openFiles.length) {
        bar.appendChild(h('span.lz-tabs-empty', { text: 'No open files' }));
        return;
      }
      state.openFiles.forEach((path) => {
        const file = project.fileIndex[path];
        const isActive = path === state.activeFile;
        const problems = state.problems.byPath[path];
        const worst = problems && problems.length ? problems[0].severity : null;
        const tab = h('div.lz-tab' + (isActive ? '.is-active' : ''), {
          role: 'tab',
          tabindex: isActive ? '0' : '-1',
          'aria-selected': String(isActive),
          onClick: () => onSelect(path),
          onKeydown: (event) => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); onSelect(path); }
          },
          onContextmenu: (event) => components.contextMenu(event, [
            { label: 'Close', icon: 'close', shortcut: 'mod+w', onSelect: () => LZ.workspace.closeFile(path) },
            { label: 'Close others', onSelect: () => LZ.workspace.closeOtherFiles(path) },
            { label: 'Close all', onSelect: () => { LZ.workspace.get().openFiles.forEach((p) => LZ.workspace.closeFile(p)); } },
            { separator: true },
            { label: 'Reveal in files', icon: 'folder', onSelect: () => { LZ.ui.set({ activeLeftSection: 'files', sidebarCollapsed: false }); } },
            { label: 'Copy path', icon: 'copy', onSelect: () => U.copyText(path) },
            { label: 'Download', icon: 'download', onSelect: () => LZ.projects.downloadFile(path) }
          ]),
          title: path
        }, [
          I.el(I.fileIconName(path), 13),
          h('span.lz-tab-label', { text: U.basename(path) }),
          dirty.get(path) ? h('span.lz-tab-dot') : null,
          worst ? h('span.lz-tab-badge.is-' + worst, { title: problems.length + ' problem(s)' }) : null,
          components.iconButton({
            icon: 'close', label: 'Close ' + U.basename(path), size: 'sm',
            onClick: (event) => { event.stopPropagation(); LZ.workspace.closeFile(path); }
          })
        ]);
        if (isActive) tab.classList.add('is-active');
        if (!file) tab.classList.add('is-missing');
        bar.appendChild(tab);
      });
      const active = U.qs('.lz-tab.is-active', bar);
      if (active && active !== activePath) {
        activePath = active;
        if (active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    }

    LZ.workspace.subscribe((state, patch) => {
      if (patch.openFiles || patch.activeFile !== undefined || patch.problems) render();
    });
    LZ.projects.subscribe((state, patch) => {
      if (patch.current || patch.fileIndex) render();
    });
    LZ.projects.subscribe((state) => {
      // reflect dirty state per open file
      const state2 = LZ.projects.get();
      const changed = state2.openFiles !== undefined;
      void changed;
      const openFiles = LZ.workspace.get().openFiles;
      let anyChanged = false;
      openFiles.forEach((path) => {
        const file = LZ.projects.file(path);
        const current = file ? file.content : null;
        if (window.__lzTabCache === undefined) window.__lzTabCache = new Map();
        if (window.__lzTabCache.get(path) !== current) {
          window.__lzTabCache.set(path, current);
          anyChanged = true;
        }
      });
      if (anyChanged) render();
    });
    render();
    return bar;
  }

  /* ------------------------------------------------------------- render --- */
  editor.render = function () {
    const view = createEditorView();
    editor.activeView = view;
    const tabs = tabBar((path) => LZ.workspace.openFile(path));
    const container = h('div.lz-editor', [tabs, view.root, view.status]);
    const welcome = h('div.lz-editor-welcome');

    function renderWelcome() {
      U.clear(welcome);
      const project = LZ.projects.get().current;
      const hasFiles = project && project.files.length;
      welcome.appendChild(components.emptyState({
        icon: hasFiles ? 'code' : 'plus',
        title: hasFiles ? 'No file open' : 'Your project is empty.',
        message: hasFiles ? 'Pick a file from the tree, or press ⌘K and search.' : 'Create your first file to start building.',
        action: hasFiles
          ? components.button({ label: 'Open index.html', kind: 'primary', size: 'sm', onClick: () => { const entry = LZ.workspace.entryFile(); if (entry) LZ.workspace.openFile(entry); } })
          : components.button({ label: 'Create a file', kind: 'primary', size: 'sm', onClick: () => LZ.actions.promptNewFile('') })
      }));
    }

    function syncEditor() {
      const path = LZ.workspace.get().activeFile;
      const hasFile = !!path && !!LZ.projects.file(path);
      welcome.hidden = hasFile;
      view.root.hidden = !hasFile;
      view.status.hidden = !hasFile;
      if (hasFile) {
        if (view.getState().path !== path) view.setFile(path);
      }
    }

    LZ.workspace.subscribe((state, patch) => {
      if (patch.activeFile !== undefined || patch.openFiles) syncEditor();
      if (patch.problems) view.updateStatus();
    });
    LZ.bus.on('file:changed', (payload) => {
      const active = LZ.workspace.get().activeFile;
      if (payload.path === active && payload.origin !== 'user' && payload.origin !== 'undo' && payload.origin !== 'redo') {
        view.applyContent(LZ.projects.read(active));
      }
    });
    LZ.bus.on('file:deleted', () => syncEditor());
    LZ.bus.on('lint:done', () => view.updateStatus());
    LZ.settings.subscribe((state, patch) => {
      if (patch.editor) {
        view.root.classList.toggle('is-wrap', LZ.settings.getIn('editor.wordWrap', false));
        view.root.style.setProperty('--lz-editor-font', LZ.settings.getIn('editor.fontSize', 13) + 'px');
        view.root.classList.toggle('no-lines', !LZ.settings.getIn('editor.lineNumbers', true));
        view.root.classList.toggle('no-active-line', !LZ.settings.getIn('editor.activeLine', true));
        view.minimap.style.display = LZ.settings.getIn('editor.minimap', true) ? '' : 'none';
        if (view.getState().path) view.applyContent(view.getState().content);
      }
    });

    renderWelcome();
    syncEditor();
    const settings = LZ.settings.get();
    view.root.classList.toggle('is-wrap', !!settings.editor.wordWrap);
    view.root.classList.toggle('no-lines', !settings.editor.lineNumbers);
    view.root.classList.toggle('no-active-line', !settings.editor.activeLine);
    view.root.style.setProperty('--lz-editor-font', settings.editor.fontSize + 'px');

    return h('div.lz-editor-host', [container, welcome]);
  };

  editor.utils = { offsetFromLineCol, lineColFromOffset, getCaretOffset, setCaretOffset };
})();

/* ========== ui/chat.js ========== */
/* ============================================================================
 * Luzzes — ui/chat.js
 * The assistant panel: messages, streamed markdown, tool activity, reviewable
 * diffs and the composer. Every simulated element is labelled as such.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const I = LZ.icons;
  const h = U.h;
  const components = LZ.components;

  const chat = (LZ.chat = {});

  /* ------------------------------------------------------------- helpers -- */
  function modeChip(message) {
    if (message.mode === 'demo' || message.demo) return components.chip({ label: 'Demo mode · scripted', kind: 'warn', title: 'This reply was drafted locally from static analysis. No model endpoint was contacted.' });
    if (message.mode === 'local') return components.chip({ label: 'Local model', kind: 'ok', title: 'Streamed from a model server running on your machine.' });
    if (message.mode === 'connected') return components.chip({ label: 'Connected provider', kind: 'ok', title: 'Streamed from the provider you configured.' });
    return null;
  }

  /** Render markdown and wire up the code-block affordances. */
  function renderMarkdown(container, text, message) {
    container.innerHTML = LZ.md.render(text || '');
    U.qsa('.md-code-btn', container).forEach((button) => {
      const figure = button.closest('.md-code');
      const code = U.qs('code', figure);
      const action = button.dataset.codeAction;
      const fileHint = figure.getAttribute('data-file');
      if (action === 'copy') {
        button.addEventListener('click', async () => {
          const ok = await U.copyText(code.textContent);
          button.textContent = ok ? 'Copied' : 'Copy failed';
          button.classList.add(ok ? 'is-ok' : 'is-error');
          setTimeout(() => { button.textContent = 'Copy'; button.classList.remove('is-ok', 'is-error'); }, 1600);
        });
      }
      if (action === 'insert') {
        button.addEventListener('click', () => {
          const view = LZ.editor && LZ.editor.activeView;
          if (view && LZ.workspace.get().activeFile) {
            view.content.focus();
            document.execCommand('insertText', false, code.textContent);
            LZ.ui.toast({ kind: 'success', title: 'Inserted at the cursor', message: LZ.workspace.get().activeFile });
          } else {
            U.copyText(code.textContent).then(() => LZ.ui.toast({ kind: 'info', title: 'No file open', message: 'Copied the block instead.' }));
          }
        });
      }
      if (action === 'apply') {
        const hasProposal = message && message.patchIds && message.patchIds.some((id) => {
          const patch = LZ.ai.patch(id);
          return patch && fileHint && patch.path === U.normalizePath(fileHint);
        });
        if (hasProposal) {
          button.hidden = true;
          return;
        }
        button.addEventListener('click', () => {
          const path = fileHint ? U.normalizePath(fileHint) : LZ.workspace.get().activeFile;
          if (!path) {
            LZ.ui.toast({ kind: 'warning', title: 'Nothing to apply to', message: 'Open a file first, or ask Luzzes to return the path in the code block.' });
            return;
          }
          const current = LZ.projects.read(path);
          if (current == null) {
            LZ.ui.toast({ kind: 'info', title: 'New file', message: path + ' does not exist yet.' });
          }
          const before = current == null ? '' : current;
          if (current != null && current !== code.textContent) {
            const model = LZ.diff.compute(current, code.textContent);
            if (model.stats.added + model.stats.removed > Math.max(8, model.oldLineCount * 0.6)) {
              LZ.ui.toast({
                kind: 'warning',
                title: 'Large replacement',
                message: 'That block would replace most of ' + path + '. Review the diff before applying.'
              });
            }
          }
          const patch = LZ.ai.addPatch({
            path,
            before: current == null ? null : before,
            after: code.textContent,
            summary: 'Applied from chat',
            notes: ['The block was taken verbatim from the assistant\'s reply. Nothing else in the file changed.'],
            origin: 'chat',
            originLabel: 'From the reply',
            messageId: message ? message.id : null
          });
          LZ.ui.toast({ kind: 'info', title: 'Diff ready', message: path + ' — review it in the conversation.' });
          LZ.chat.scrollToPatch(patch.id);
          LZ.ai.updateMessage(message.id, { patchIds: (message.patchIds || []).concat([patch.id]) });
        });
      }
    });
    U.qsa('.md-code-body', container).forEach((code) => {
      // keep copy buttons aligned with the labelled file, if any
      const figure = code.closest('.md-code');
      const cap = U.qs('.md-code-lang', figure);
      if (cap && cap.textContent.length > 24) cap.textContent = U.truncate(cap.textContent, 24);
    });
  }

  /* ---------------------------------------------------------- diff card --- */
  function patchCard(patch) {
    const model = LZ.diff.compute(patch.before || '', patch.after || '');
    let mode = 'unified';
    const body = h('div.lz-diff-body');

    function renderDiff() {
      const rows = LZ.diff.compute(patch.before || '', patch.after || '').rows;
      body.innerHTML = mode === 'unified'
        ? LZ.diff.render({ rows, hunks: model.hunks }, { lang: U.detectLang(patch.path).id })
        : LZ.diff.renderSplit({ rows, hunks: model.hunks }, { lang: U.detectLang(patch.path).id });
    }

    const modeToggle = components.segmented({
      label: 'Diff layout',
      value: 'unified',
      options: [{ value: 'unified', label: 'Unified' }, { value: 'split', label: 'Split' }],
      onChange: (value) => { mode = value; renderDiff(); }
    });

    const actions = h('div.lz-patch-actions');
    const statusSlot = h('span.lz-patch-status');

    function paint() {
      const applied = patch.status === 'applied';
      const rejected = patch.status === 'rejected';
      U.clear(actions);
      actions.appendChild(components.button({
        label: applied ? 'Applied' : rejected ? 'Rejected' : 'Apply all',
        icon: applied ? 'check' : 'apply',
        kind: applied || rejected ? null : 'primary',
        size: 'sm',
        disabled: applied || rejected || null,
        onClick: () => { LZ.engine.applyPatch(patch.id); refresh(); }
      }));
      actions.appendChild(components.button({
        label: 'Reject', icon: 'reject', size: 'sm',
        disabled: applied || rejected || null,
        onClick: () => { LZ.engine.rejectPatch(patch.id); refresh(); }
      }));
      actions.appendChild(components.button({
        label: 'Copy patch', icon: 'copy', size: 'sm',
        onClick: async () => {
          const text = LZ.diff.unified(patch.before || '', patch.after || '', 'a/' + patch.path, 'b/' + patch.path);
          const ok = await U.copyText(text);
          LZ.ui.toast({ kind: ok ? 'success' : 'error', title: ok ? 'Patch copied' : 'Copy failed', message: patch.path });
        }
      }));
      if (applied) {
        actions.appendChild(components.button({
          label: 'Undo', icon: 'undo', size: 'sm',
          onClick: () => {
            LZ.workspace.undo(patch.path);
            LZ.ai.setPatchStatus(patch.id, 'pending');
            LZ.workspace.refreshPreview('change undone');
            refresh();
          }
        }));
      }
      U.clear(statusSlot);
      if (applied) statusSlot.appendChild(components.chip({ label: 'Applied', kind: 'ok', icon: 'check' }));
      if (rejected) statusSlot.appendChild(components.chip({ label: 'Rejected', kind: 'muted', icon: 'reject' }));
      if (patch.status === 'pending') statusSlot.appendChild(components.chip({ label: 'Awaiting your review', kind: 'warn' }));
    }

    function refresh() {
      paint();
      renderDiff();
    }

    const card = h('div.lz-patch', [
      h('div.lz-patch-head', [
        h('div.lz-patch-title', [
          I.el('fileCode', 14),
          h('button.lz-patch-path', {
            type: 'button', text: patch.path,
            onClick: () => { LZ.workspace.openFile(patch.path); }
          }),
          components.chip({
            label: patch.originLabel || 'Proposed change',
            kind: patch.origin === 'local-pass' ? 'info' : patch.origin === 'demo-script' ? 'warn' : 'muted',
            title: patch.origin === 'local-pass'
              ? 'Produced by a deterministic transformation of this file — not by a language model.'
              : patch.origin === 'demo-script'
                ? 'Part of the scripted demo conversation in demo mode.'
                : 'Returned by the configured model.'
          })
        ]),
        h('div.lz-patch-meta', [
          h('span.lz-patch-stat.is-add', { text: '+' + model.stats.added }),
          h('span.lz-patch-stat.is-del', { text: '−' + model.stats.removed }),
          statusSlot
        ])
      ]),
      patch.notes && patch.notes.length ? h('ul.lz-patch-notes', patch.notes.map((note) => h('li', { text: note }))) : null,
      h('div.lz-patch-toolbar', [modeToggle, actions]),
      body
    ]);

    renderDiff();
    paint();
    return card;
  }

  chat.scrollToPatch = function () {
    setTimeout(() => {
      const cards = U.qsa('.lz-patch');
      const last = cards[cards.length - 1];
      if (last) last.scrollIntoView({ behavior: U.prefersReducedMotion() ? 'auto' : 'smooth', block: 'nearest' });
    }, 60);
  };

  /* ------------------------------------------------------------ activity -- */
  function activityList(steps) {
    if (!steps || !steps.length) return null;
    const list = h('ol.lz-activity', { attrs: { 'aria-label': 'Tool activity' } });
    steps.forEach((step) => {
      list.appendChild(h('li.lz-activity-item.is-' + step.status, [
        h('span.lz-activity-mark', step.status === 'running'
          ? components.spinner(11)
          : I.el(step.status === 'done' ? 'check' : step.status === 'error' ? 'error' : step.status === 'skipped' ? 'minus' : 'dot', 12)),
        h('span.lz-activity-label', { text: step.label }),
        step.detail ? h('span.lz-activity-detail', { text: step.detail }) : null
      ]));
    });
    return h('details.lz-activity-wrap', { open: true }, [
      h('summary', [I.el('layers', 12), h('span', { text: 'Activity · ' + steps.length + ' step' + (steps.length === 1 ? '' : 's') })]),
      list
    ]);
  }

  /* -------------------------------------------------------------- message - */
  function messageEl(message, opts) {
    const isUser = message.role === 'user';
    const wrap = h('article.lz-msg' + (isUser ? '.is-user' : '.is-ai'), {
      id: 'msg-' + message.id,
      attrs: { 'aria-label': isUser ? 'Your message' : 'Luzzes reply' }
    });

    if (isUser) {
      const attachments = message.attachments && message.attachments.length
        ? h('div.lz-msg-attachments', message.attachments.map((a) => components.chip({
          label: a.label + (a.scope ? ' · ' + U.truncate(a.scope, 46) : ''),
          icon: a.kind === 'action' ? 'wand' : 'file',
          kind: 'muted'
        })))
        : null;
      wrap.appendChild(h('div.lz-msg-head', [
        h('span.lz-msg-author', { text: 'You' }),
        h('time.lz-msg-time', { text: U.fmtClock(message.at) })
      ]));
      if (attachments) wrap.appendChild(attachments);
      wrap.appendChild(h('div.lz-msg-body.is-user', h('p', { text: message.content })));
      if (message.selection) {
        wrap.appendChild(h('details.lz-msg-selection', [
          h('summary', { text: 'Selection · ' + message.selection.path + ' lines ' + message.selection.startLine + '–' + message.selection.endLine }),
          h('pre', { text: message.selection.text })
        ]));
      }
      return wrap;
    }

    const body = h('div.lz-msg-body');
    wrap.appendChild(h('div.lz-msg-head', [
      h('span.lz-msg-avatar', I.el('sparkle', 12)),
      h('span.lz-msg-author', { text: 'Luzzes' }),
      modeChip(message),
      message.model ? h('span.lz-msg-model', { text: message.model }) : null,
      h('time.lz-msg-time', { text: U.fmtClock(message.at) }),
      h('span.lz-msg-spacer'),
      message.latency ? h('span.lz-msg-latency', { text: Math.round(message.latency) + ' ms', title: 'Time from request to the end of the stream' }) : null
    ]));

    if (message.plan && message.plan.length) {
      wrap.appendChild(h('ol.lz-msg-plan', message.plan.map((step, index) => h('li', [
        h('span.lz-msg-plan-index', { text: String(index + 1) }),
        h('div', [
          h('p.lz-msg-plan-title', { text: step.title }),
          step.detail ? h('p.lz-msg-plan-detail', { text: step.detail }) : null,
          step.files ? h('p.lz-msg-plan-files', { text: step.files.join(' · ') }) : null
        ])
      ]))));
    }

    if (message.status === 'error') {
      const error = message.error || {};
      const details = h('details.lz-error-details', [
        h('summary', { text: 'View details' }),
        h('pre', { text: (error.message || 'Unknown error') + (error.detail ? '\n\n' + error.detail : '') })
      ]);
      wrap.appendChild(h('div.lz-error-card', [
        h('div.lz-error-head', [I.el('warning', 16), h('p', { text: 'Luzzes couldn\'t complete that request.' })]),
        h('p.lz-error-message', { text: error.message || '' }),
        h('p.lz-error-hint', {
          text: error.code === 'config'
            ? 'Check the provider configuration, then try again.'
            : 'Check your model connection and try again. If you are using a browser-side request, the endpoint needs to allow this origin (CORS).'
        }),
        h('div.lz-error-actions', [
          components.button({ label: 'Retry', icon: 'refresh', kind: 'primary', size: 'sm', onClick: () => LZ.engine.retry(message.id) }),
          components.button({ label: 'Settings', icon: 'settings', size: 'sm', onClick: () => LZ.actions.openSettings('ai') }),
          components.button({ label: 'Use demo mode', icon: 'sparkle', size: 'sm', onClick: () => { LZ.engine.setProvider('demo'); LZ.ui.toast({ kind: 'info', title: 'Switched to demo mode', message: 'No model endpoint will be contacted.' }); } })
        ]),
        details
      ]));
      return wrap;
    }

    body.appendChild(h('div.lz-msg-content'));
    U.qs('.lz-msg-content', body);
    wrap.appendChild(body);

    if (message.patchIds && message.patchIds.length) {
      message.patchIds.forEach((id) => {
        const patch = LZ.ai.patch(id);
        if (patch) wrap.appendChild(patchCard(patch));
      });
    }

    if (message.note) {
      wrap.appendChild(h('p.lz-msg-note', [I.el('info', 12), h('span', { text: message.note })]));
    }
    if (message.status === 'stopped') {
      wrap.appendChild(h('p.lz-msg-note', [I.el('pause', 12), h('span', { text: message.note || 'Stopped.' })]));
    }

    const tools = message.tools || [];
    if (tools.length && LZ.settings.getIn('ai.showToolActivity', true)) {
      wrap.appendChild(activityList(tools));
    }

    const actions = h('div.lz-msg-actions');
    const content = U.qs('.lz-msg-content', wrap);
    renderMarkdown(content, message.content, message);
    actions.appendChild(components.button({
      label: 'Copy', icon: 'copy', size: 'sm',
      onClick: async (event) => {
        const ok = await U.copyText(message.content || '');
        const button = event.currentTarget;
        U.qs('.lz-btn-label', button).textContent = ok ? 'Copied' : 'Failed';
        setTimeout(() => { U.qs('.lz-btn-label', button).textContent = 'Copy'; }, 1500);
      }
    }));
    if (message.action) {
      actions.appendChild(components.button({
        label: 'Run again', icon: 'refresh', size: 'sm',
        onClick: () => LZ.engine.quickAction(message.action)
      }));
    }
    if (message.patchIds && message.patchIds.length) {
      const pending = message.patchIds.filter((id) => { const p = LZ.ai.patch(id); return p && p.status === 'pending'; });
      if (pending.length > 1) {
        actions.appendChild(components.button({
          label: 'Apply all ' + pending.length, icon: 'apply', size: 'sm', kind: 'primary',
          onClick: () => {
            pending.forEach((id) => LZ.engine.applyPatch(id));
            opts.refresh();
          }
        }));
      }
    }
    wrap.appendChild(actions);

    // One re-render per animation frame at most: a streaming reply notifies the
    // store on every delta, and re-entering the stream renderer from inside a
    // store notification would recurse.
    let queued = false;
    function scheduleRefresh() {
      if (queued) return;
      queued = true;
      const run = () => { queued = false; opts.refresh(); };
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(run);
      else setTimeout(run, 16);
    }

    let lastContent = message.content;
    let lastSignature = '';
    wrap.update = (patch) => {
      if (patch.content !== undefined && patch.content !== lastContent) {
        lastContent = patch.content;
        renderMarkdown(content, patch.content, Object.assign({}, message, patch));
      }
      const signature = String(patch.status || '') + '|' + (patch.patchIds || []).join(',');
      if (signature !== lastSignature) {
        lastSignature = signature;
        scheduleRefresh();
      }
    };
    return wrap;
  }

  /* ------------------------------------------------------------ composer -- */
  function composer(opts) {
    const textarea = h('textarea.lz-composer-input', {
      rows: '1',
      placeholder: 'Ask Luzzes about this project…',
      attrs: { 'aria-label': 'Message Luzzes' },
      onInput: () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(200, textarea.scrollHeight) + 'px';
        updateSendState();
      },
      onKeydown: (event) => {
        if ((event.key === 'Enter' && !event.shiftKey) || (event.key === 'Enter' && U.modKey(event))) {
          event.preventDefault();
          submit();
        }
      }
    });

    const sendButton = components.button({
      label: 'Send', icon: 'send', kind: 'primary', size: 'sm',
      onClick: () => submit()
    });
    const stopButton = components.button({
      label: 'Stop', icon: 'stop', size: 'sm', hidden: true,
      onClick: () => LZ.engine.stop()
    });

    const contextRow = h('div.lz-composer-context');
    const quickRow = h('div.lz-composer-actions');

    function updateContext() {
      U.clear(contextRow);
      const file = LZ.workspace.get().activeFile;
      const selection = LZ.workspace.get().selection;
      const provider = LZ.engine.provider();
      contextRow.appendChild(components.chip({
        label: provider ? (provider.kind === 'demo' ? 'Demo mode' : provider.kind === 'local' ? 'Local model' : 'Connected provider') : 'No provider',
        kind: provider && provider.kind === 'demo' ? 'warn' : 'ok',
        icon: provider && provider.kind === 'demo' ? 'sparkle' : provider && provider.kind === 'local' ? 'cpu' : 'globe',
        onClick: () => LZ.actions.openSettings('ai'),
        title: 'Change provider'
      }));
      contextRow.appendChild(components.chip({
        label: file ? U.basename(file) : 'no file open',
        icon: 'fileCode',
        kind: 'muted',
        title: 'Include the active file in context'
      }));
      if (selection && selection.text) {
        contextRow.appendChild(components.chip({
          label: 'selection · ' + U.truncate(selection.path || '', 24) + ' ' + selection.startLine + '–' + selection.endLine,
          icon: 'cursor',
          kind: 'info',
          title: selection.text.slice(0, 240)
        }));
      }
      const problems = LZ.workspace.get().problems.counts;
      if (problems.error || problems.warning) {
        contextRow.appendChild(components.chip({
          label: problems.error + ' errors · ' + problems.warning + ' warnings',
          icon: 'warning',
          kind: problems.error ? 'error' : 'warn',
          onClick: () => LZ.workspace.setBottomTab('problems')
        }));
      }
    }

    function updateQuickActions() {
      U.clear(quickRow);
      const hasSelection = !!LZ.workspace.get().selection;
      const hasFile = !!LZ.workspace.get().activeFile;
      LZ.prompts.ACTION_ORDER.forEach((kind) => {
        const action = LZ.prompts.actions[kind];
        if (action.needsSelection && !hasSelection) return;
        if ((kind === 'docs') && !hasFile) return;
        const button = components.button({
          label: action.label, size: 'sm', title: action.hint,
          onClick: () => LZ.engine.quickAction(kind)
        });
        quickRow.appendChild(button);
      });
    }

    function updateSendState() {
      const busy = ['thinking', 'streaming'].indexOf(LZ.ai.get().status) > -1;
      sendButton.hidden = busy;
      stopButton.hidden = !busy;
      sendButton.disabled = !textarea.value.trim() && !LZ.workspace.get().selection;
      sendButton.classList.toggle('is-disabled', !!sendButton.disabled);
      textarea.disabled = busy;
    }

    function submit() {
      const text = textarea.value.trim();
      if (!text) {
        const selection = LZ.workspace.get().selection;
        if (selection && selection.text) {
          textarea.value = 'Explain this selection and flag anything risky.';
          textarea.focus();
        }
        return;
      }
      textarea.value = '';
      textarea.style.height = 'auto';
      LZ.engine.send(text);
      updateSendState();
    }

    const composerEl = h('form.lz-composer', {
      onSubmit: (event) => { event.preventDefault(); submit(); }
    }, [
      quickRow,
      h('div.lz-composer-box', [
        textarea,
        h('div.lz-composer-controls', [sendButton, stopButton])
      ]),
      contextRow,
      h('p.lz-composer-hint', [
        h('span', { text: 'Enter sends · Shift+Enter adds a line' }),
        h('span.lz-composer-hint-sep'),
        h('span', { text: LZ.engine.provider() && LZ.engine.provider().kind === 'demo' ? 'Demo mode: replies are scripted locally' : 'Context is sent to the configured endpoint only' })
      ])
    ]);

    LZ.ai.subscribe((state, patch) => {
      if (patch.status) updateSendState();
      if (patch.conversation) updateContext();
    });
    LZ.workspace.subscribe((state, patch) => {
      if (patch.activeFile !== undefined || patch.selection !== undefined || patch.problems) {
        updateContext();
        updateQuickActions();
      }
    });
    LZ.bus.on('ai:provider', () => { updateContext(); updateSendState(); });

    composerEl.focus = () => textarea.focus();
    composerEl.setValue = (value) => { textarea.value = value; updateSendState(); };
    updateContext();
    updateQuickActions();
    updateSendState();
    return composerEl;
  }

  /* --------------------------------------------------------------- panel -- */
  chat.render = function () {
    const header = h('header.lz-ai-head', [
      h('div.lz-ai-head-left', [
        h('span.lz-ai-wordmark', [I.el('sparkle', 13), h('span', { text: 'LUZZES' })]),
        h('span.lz-ai-status')
      ]),
      h('div.lz-ai-head-right', [
        components.iconButton({ icon: 'history', label: 'Conversation options', onClick: (event) => components.popover(event.currentTarget, [
