    workspace.set({ tests: result });
    workspace.output({
      kind: result.status === 'passed' ? 'success' : result.status === 'no-tests' ? 'info' : 'error',
      text: result.status === 'passed'
        ? result.totals.passed + ' passed in ' + U.formatDuration(result.duration)
        : result.status === 'no-tests'
          ? 'No tests found. Add window.__luzzesTests in a test .html file.'
          : (result.message || (result.totals.failed + ' failed'))
    });
    return result;
  };

  /* ------------------------------------------- reference resolution ------- */
  /** Resolve a project-relative reference (used by the preview + editor links). */
  workspace.resolvePath = function (basePath, reference) {
    const project = LZ.projects.get().current;
    if (!project) return null;
    const clean = String(reference).split('#')[0].split('?')[0];
    if (!clean || /^[a-z]+:/i.test(clean)) return null;
    const base = U.dirname(basePath || '');
    const candidates = [
      U.normalizePath(U.joinPath(base, clean)),
      U.normalizePath(clean.replace(/^\.?\//, '')),
      U.normalizePath(U.joinPath('public', clean))
    ];
    for (const c of candidates) {
      if (project.files.some((f) => f.path === c)) return c;
    }
    return null;
  };

  workspace.entryFile = function () {
    const files = LZ.projects.fileList();
    const preferred = LZ.store.local.get('preview-entry', null);
    if (preferred && files.some((f) => f.path === preferred)) return preferred;
    const byName = (re) => (files.find((f) => re.test(f.path)) || {}).path;
    return byName(/(^|\/)index\.html$/i) || byName(/(^|\/)preview\.html$/i) || byName(/\.html$/i) || (files[0] ? files[0].path : null);
  };
})();

/* ========== state/ai.js ========== */
/* ============================================================================
 * Luzzes — state/ai.js
 * Conversation state, streaming status, tool activity and pending patches.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;

  const ai = LZ.ai = LZ.createStore({
    status: 'ready',        // ready | thinking | streaming | error
    conversation: { messages: [], createdAt: Date.now(), model: 'demo-luzzes-1', demo: true },
    activity: [],           // [{id, label, detail, status}]
    patches: [],            // [{id, path, before, after, status, messageId}]
    error: null,
    lastRequestAt: null,
    stats: { turns: 0, toolRuns: 0, lastLatency: null, tokens: 0 }
  });

  ai.pushMessage = function (message) {
    const conversation = ai.get().conversation;
    const message0 = Object.assign({
      id: U.uid('msg'),
      at: Date.now(),
      role: 'assistant',
      content: '',
      status: 'complete'
    }, message);
    const messages = conversation.messages.concat([message0]);
    ai.set({ conversation: Object.assign({}, conversation, { messages }) });
    LZ.bus.emit('ai:message', message0);
    return message0;
  };

  ai.updateMessage = function (id, patch) {
    const conversation = ai.get().conversation;
    let found = false;
    const messages = conversation.messages.map((m) => {
      if (m.id !== id) return m;
      found = true;
      return Object.assign({}, m, patch);
    });
    if (!found) return null;
    ai.set({ conversation: Object.assign({}, conversation, { messages }) });
    return messages.find((m) => m.id === id);
  };

  ai.appendToMessage = function (id, chunk) {
    const conversation = ai.get().conversation;
    const messages = conversation.messages.map((m) => (m.id === id ? Object.assign({}, m, { content: (m.content || '') + chunk }) : m));
    ai.set({ conversation: Object.assign({}, conversation, { messages }) });
  };

  ai.clearConversation = function () {
    const conversation = { messages: [], createdAt: Date.now(), model: ai.get().conversation.model, demo: ai.get().conversation.demo };
    ai.set({ conversation, activity: [], patches: [], error: null });
    const project = LZ.projects.get().current;
    if (project) LZ.store.saveConversation(project.id, []);
  };

  ai.loadConversation = async function (projectId) {
    const saved = await LZ.store.getConversation(projectId);
    if (saved && Array.isArray(saved.messages)) {
      ai.set({
        conversation: {
          messages: saved.messages,
          createdAt: saved.createdAt || Date.now(),
          model: saved.model || ai.get().conversation.model,
          demo: !!saved.demo
        }
      });
      return true;
    }
    return false;
  };

  const persistConversation = U.debounce(() => {
    const project = LZ.projects.get().current;
    if (!project) return;
    const conv = ai.get().conversation;
    LZ.store.saveConversation(project.id, {
      messages: conv.messages,
      createdAt: conv.createdAt,
      model: conv.model,
      demo: conv.demo
    });
  }, 500);
  ai.subscribe((state, patch) => { if (patch.conversation) persistConversation(); });

  /* ---------------------------------------------------- tool activity ----- */
  let activityId = 0;
  ai.startActivity = function (label, detail) {
    const entry = { id: ++activityId, label, detail: detail || '', status: 'running', startedAt: Date.now() };
    ai.set({ activity: ai.get().activity.concat([entry]) });
    return entry;
  };
  ai.finishActivity = function (id, status, detail) {
    const activity = ai.get().activity.map((a) => (
      a.id === id ? Object.assign({}, a, { status: status || 'done', detail: detail || a.detail, endedAt: Date.now() }) : a
    ));
    ai.set({ activity });
    if (status !== 'skipped') {
      ai.set({ stats: Object.assign({}, ai.get().stats, { toolRuns: ai.get().stats.toolRuns + (status === 'error' ? 0 : 1) }) });
    }
  };
  ai.clearActivity = function () { ai.set({ activity: [] }); };

  /* -------------------------------------------------------- patches ------- */
  ai.addPatch = function (patch) {
    const entry = Object.assign({ id: U.uid('patch'), status: 'pending', createdAt: Date.now() }, patch);
    ai.set({ patches: ai.get().patches.concat([entry]) });
    return entry;
  };
  ai.patch = function (id) { return ai.get().patches.find((p) => p.id === id) || null; };
  ai.setPatchStatus = function (id, status) {
    ai.set({ patches: ai.get().patches.map((p) => (p.id === id ? Object.assign({}, p, { status }) : p)) });
  };
  ai.pendingPatchCount = function () {
    return ai.get().patches.filter((p) => p.status === 'pending').length;
  };

  /* --------------------------------------------------------- provider ----- */
  ai.setProviderState = function (patch) {
    ai.set(Object.assign({
      status: ai.get().status,
      error: null
    }, patch));
  };
})();

/* ========== ai/prompts.js ========== */
/* ============================================================================
 * Luzzes — ai/prompts.js
 * System persona, context packing and the quick-action instruction set.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const prompts = (LZ.prompts = {});

  prompts.SYSTEM = [
    'You are Luzzes, an expert software engineer embedded in a browser-based coding workspace.',
    '',
    'Voice: calm, precise, senior. No filler, no exclamation marks, no emoji. Do not open with courtesies.',
    'State the problem or plan first, then the change, then anything that still needs attention.',
    '',
    'How you work:',
    '1. Read the provided project context before answering. Refer to files by path.',
    '2. When you change code, return the complete file content in a fenced block whose info string starts with the language and adds file=<path> — for example: ```tsx file=src/components/Hero.tsx',
    '3. Prefer the smallest correct change. Preserve existing public APIs, exports and prop names unless the user asks otherwise.',
    '4. Never claim you ran a command, compiler, test suite or benchmark. You cannot execute anything. Describe what the user should run instead.',
    '5. If something is uncertain, say what you would check and where.',
    '6. Cite line numbers only when you have them in the context.',
    '7. Keep answers proportionate: short questions get short answers; architecture questions get structure.',
    '',
    'When you receive static analysis or diagnostics from the workspace, treat them as ground truth and reference the rule that fired.'
  ].join('\n');

  /**
   * Pack project context into a compact, token-friendly transcript.
   * Files are chosen by the caller (relevance scoring) — this only formats.
   */
  prompts.buildContext = function (opts) {
    const { files, entry, problems, selection, userText } = opts;
    const parts = [];

    if (userText) parts.push('User request: ' + userText);

    if (files && files.length) {
      parts.push('\nProject files (relevant excerpts):');
      files.forEach((f) => {
        const lines = String(f.content || '').split('\n');
        const truncated = lines.length > 320;
        const body = truncated ? lines.slice(0, 320).join('\n') + '\n… (' + (lines.length - 320) + ' more lines)' : lines.join('\n');
        parts.push('\n--- ' + f.path + ' (' + lines.length + ' lines) ---\n' + body);
      });
    }

    if (selection && selection.text) {
      parts.push('\nSelected code in ' + (selection.path || 'the active file') + ' (lines ' + selection.startLine + '-' + selection.endLine + '):\n' + selection.text);
    }

    if (problems && problems.length) {
      parts.push('\nStatic analysis (computed locally, ground truth):');
      problems.slice(0, 24).forEach((p) => {
        parts.push('- ' + p.path + ':' + p.line + ' [' + p.severity + '] ' + p.rule + ' — ' + p.message);
      });
    }

    if (entry) parts.push('\nPreview entry point: ' + entry);
    return parts.join('\n');
  };

  prompts.buildMessages = function (opts) {
    const { history, userText, context, instruction } = opts;
    const messages = [{ role: 'system', content: prompts.SYSTEM }];
    (history || []).slice(-8).forEach((m) => {
      if (!m.content) return;
      messages.push({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content });
    });
    messages.push({
      role: 'user',
      content: [instruction ? instruction : '', context, userText].filter(Boolean).join('\n\n')
    });
    return messages;
  };

  /* ------------------------------------------------------ quick actions --- */
  prompts.actions = {
    explain: {
      label: 'Explain',
      icon: 'book',
      instruction: 'Explain what this code does, in order of execution. Then note anything subtle: side effects, lifecycle, edge cases, and one risk worth knowing about. Do not rewrite it unless asked.',
      needsSelection: true,
      hint: 'Walk through the logic and flag the subtle parts.'
    },
    fix: {
      label: 'Fix',
      icon: 'bug',
      instruction: 'Identify the defect, state the root cause in one sentence, then return a corrected version of the affected code block. If the cause is not in the provided context, say exactly what you need to see.',
      needsSelection: false,
      hint: 'Find the root cause and return a corrected file.'
    },
    refactor: {
      label: 'Refactor',
      icon: 'wand',
      instruction: 'Refactor for clarity and cohesion without changing behaviour or public APIs. Extract only what earns its place. Return the full refactored file, then list the invariants you preserved.',
      needsSelection: true,
      hint: 'Restructure without changing behaviour.'
    },
    optimize: {
      label: 'Optimize',
      icon: 'bolt',
      instruction: 'Find the actual hot path. State the complexity before and after, then return the optimized code. Do not micro-optimize code that runs once.',
      needsSelection: true,
      hint: 'Target the real hot path, not incidental code.'
    },
    tests: {
      label: 'Generate tests',
      icon: 'beaker',
      instruction: 'Write tests for the behaviour in this file. Use plain DOM assertions compatible with the workspace test harness (window.__luzzesTests with name/fn entries and window.assert). Cover the happy path, a boundary and one failure mode. Do not claim the tests pass — they must be run.',
      needsSelection: false,
      hint: 'Produce a runnable test harness for this project.'
    },
    ui: {
      label: 'Improve UI',
      icon: 'sparkle',
      instruction: 'Improve the visual design: hierarchy, spacing rhythm, type scale and colour restraint. Keep the DOM structure and class names stable where possible. Return the updated files and explain which design decisions changed.',
      needsSelection: false,
      hint: 'Tighten hierarchy, spacing and type.'
    },
    review: {
      label: 'Review',
      icon: 'shield',
      instruction: 'Review this code as if it were a pull request from a colleague you respect. Lead with defects, then design concerns, then nits. Quantify impact. Be specific: file, line, and what breaks.',
      needsSelection: false,
      hint: 'A pull-request review with the defects first.'
    },
    feature: {
      label: 'Add feature',
      icon: 'plus',
      instruction: 'Plan the feature as a short ordered list of changes across files, then implement it. Keep the existing structure and conventions.',
      needsSelection: false,
      hint: 'Plan the change set, then implement it.'
    },
    docs: {
      label: 'Generate documentation',
      icon: 'document',
      instruction: 'Write reference documentation for this file: purpose, exported API with parameters and return values, usage example, and notes on configuration or edge cases. Be accurate — only document what is present.',
      needsSelection: false,
      hint: 'Reference docs generated from the real exports.'
    },
    comment: {
      label: 'Add comments',
      icon: 'codeBlock',
      instruction: 'Add concise comments that explain intent and non-obvious decisions. Do not narrate what the code obviously does. Keep every existing line of code intact.',
      needsSelection: true,
      hint: 'Explain intent, not syntax.'
    }
  };

  prompts.actionInstruction = function (kind) {
    const action = prompts.actions[kind];
    return action ? action.instruction : '';
  };

  prompts.ACTION_ORDER = ['explain', 'fix', 'refactor', 'optimize', 'tests', 'ui', 'review', 'feature', 'docs'];

  /* ------------------------------------------------------------ openers --- */
  prompts.emptyStateSuggestions = function (project) {
    const files = project && project.files ? project.files : [];
    const entry = files.find((f) => /index\.html$/i.test(f.path));
    const component = files.find((f) => /\.(tsx|jsx)$/i.test(f.path));
    const out = [];
    if (entry) out.push({ text: 'Review ' + entry.path + ' and suggest three concrete improvements', kind: 'review' });
    if (component) out.push({ text: 'Explain how ' + component.path + ' is structured and where it could break', kind: 'explain' });
    out.push({ text: 'Find the highest-impact problem in this project right now', kind: 'fix' });
    out.push({ text: 'Write tests for the main interactive element on the page', kind: 'tests' });
    out.push({ text: 'Make the design feel more premium without changing the structure', kind: 'ui' });
    return out.slice(0, 4);
  };

  prompts.titleFromText = function (text) {
    const clean = U.truncate(U.md ? U.md.plain(text) : text, 64);
    return clean || 'Untitled conversation';
  };
})();

/* ========== ai/analysis.js ========== */
/* ============================================================================
 * Luzzes — ai/analysis.js
 *
 * Real, deterministic static analysis. Everything here is computed from the
 * actual bytes of the project — it is the honest half of demo mode, and it is
 * also what the engine hands to a connected model as ground truth.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const analysis = (LZ.analysis = {});

  /* --------------------------------------------------------- project ------ */
  analysis.project = function (files) {
    const languages = new Map();
    let bytes = 0, lines = 0;
    const todos = [], tests = [];
    files.forEach((f) => {
      const content = f.content || '';
      bytes += content.length;
      lines += U.countLines(content);
      const info = U.detectLang(f.path);
      languages.set(info.label, (languages.get(info.label) || 0) + 1);
      const todoRe = /(TODO|FIXME|HACK)\b[:\s]*(.*)/g;
      let m;
      while ((m = todoRe.exec(content)) && todos.length < 40) {
        const pos = content.slice(0, m.index).split('\n').length;
        todos.push({ path: f.path, line: pos, kind: m[1], text: m[2].slice(0, 120) });
      }
      if (/(test|spec)\.(js|ts|jsx|tsx|html)$/i.test(f.path)) tests.push(f.path);
    });
    const entry = (files.find((f) => /(^|\/)index\.html$/i.test(f.path)) || files.find((f) => /\.html$/i.test(f.path)) || {}).path || null;
    return {
      fileCount: files.length,
      bytes,
      lines,
      languages: Array.from(languages.entries()).sort((a, b) => b[1] - a[1]),
      todos,
      tests,
      entry,
      hasPackageJson: files.some((f) => /(^|\/)package\.json$/i.test(f.path)),
      hasReadme: files.some((f) => /(^|\/)readme\.md$/i.test(f.path)),
      largest: files.slice().sort((a, b) => (b.content || '').length - (a.content || '').length).slice(0, 5)
        .map((f) => ({ path: f.path, lines: U.countLines(f.content || '') }))
    };
  };

  /* ------------------------------------------------------------ html ------ */
  analysis.scanHtml = function (text) {
    const out = {
      headings: [], buttons: [], links: [], sections: [], ids: [], classes: new Set(),
      scripts: [], stylesheets: [], images: [], forms: [], lang: null, hasViewport: false,
      hasMetaDescription: false, hasTitle: false
    };
    let m;
    const headRe = /<h([1-6])\b[^>]*>([\s\S]*?)<\/h\1>/gi;
    while ((m = headRe.exec(text))) out.headings.push({ level: Number(m[1]), text: stripTags(m[2]).trim().slice(0, 120) });
    const btnRe = /<button\b([^>]*)>([\s\S]*?)<\/button>/gi;
    while ((m = btnRe.exec(text))) {
      const attrs = m[1];
      const cls = (attrs.match(/class\s*=\s*["']([^"']+)["']/) || [])[1] || '';
      const id = (attrs.match(/id\s*=\s*["']([^"']+)["']/) || [])[1] || '';
      out.buttons.push({ text: stripTags(m[2]).trim().slice(0, 80), id, className: cls, type: (attrs.match(/type\s*=\s*["']([^"']+)["']/) || [])[1] || null });
    }
    const linkRe = /<a\b([^>]*)>([\s\S]*?)<\/a>/gi;
    while ((m = linkRe.exec(text))) {
      out.links.push({ href: (m[1].match(/href\s*=\s*["']([^"']+)["']/) || [])[1] || '', text: stripTags(m[2]).trim().slice(0, 80) });
    }
    const sectionRe = /<(section|main|header|footer|nav|aside)\b([^>]*)>/gi;
    while ((m = sectionRe.exec(text))) {
      out.sections.push({ tag: m[1].toLowerCase(), id: (m[2].match(/id\s*=\s*["']([^"']+)["']/) || [])[1] || '' });
    }
    const idRe = /\bid\s*=\s*["']([^"']+)["']/g;
    while ((m = idRe.exec(text))) out.ids.push(m[1]);
    const classRe = /\bclass\s*=\s*["']([^"']+)["']/g;
    while ((m = classRe.exec(text))) m[1].split(/\s+/).filter(Boolean).forEach((c) => out.classes.add(c));
    const scriptRe = /<script\b([^>]*)>/gi;
    while ((m = scriptRe.exec(text))) {
      const src = (m[1].match(/src\s*=\s*["']([^"']+)["']/) || [])[1];
      out.scripts.push({ src: src || null, inline: !src });
    }
    const linkSheetRe = /<link\b[^>]*rel\s*=\s*["']stylesheet["'][^>]*>/gi;
    while ((m = linkSheetRe.exec(text))) out.stylesheets.push((m[0].match(/href\s*=\s*["']([^"']+)["']/) || [])[1] || '');
    const imgRe = /<img\b[^>]*>/gi;
    while ((m = imgRe.exec(text))) out.images.push({ alt: (m[0].match(/alt\s*=\s*["']([^"']*)["']/) || [])[1] || null, src: (m[0].match(/src\s*=\s*["']([^"']+)["']/) || [])[1] || '' });
    const formRe = /<form\b[^>]*>/gi;
    while ((m = formRe.exec(text))) out.forms.push(m[0]);
    out.lang = (text.match(/<html\b[^>]*lang\s*=\s*["']([^"']+)["']/i) || [])[1] || null;
    out.hasViewport = /<meta\b[^>]*name\s*=\s*["']viewport["']/i.test(text);
    out.hasMetaDescription = /<meta\b[^>]*name\s*=\s*["']description["']/i.test(text);
    out.hasTitle = /<title>[\s\S]*?<\/title>/i.test(text);
    out.classes = Array.from(out.classes).sort();
    return out;
  };

  function stripTags(html) {
    return String(html).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ');
  }
  analysis.stripTags = stripTags;

  /* ---------------------------------------------------------- modules ----- */
  analysis.scanModule = function (text, path) {
    const out = { imports: [], exports: [], functions: [], classes: [], types: [], hooks: [], jsx: [], events: [], state: [] };
    let m;
    const importRe = /^\s*import\s+([\s\S]*?)\s+from\s+['"]([^'"]+)['"]/gm;
    while ((m = importRe.exec(text))) out.imports.push({ source: m[2], specifiers: m[1].replace(/\s+/g, ' ').trim() });
    const exportRe = /^\s*export\s+(?:default\s+)?(?:async\s+)?(function|const|let|class|type|interface|enum)\s+([A-Za-z_$][\w$]*)/gm;
    while ((m = exportRe.exec(text))) {
      const line = text.slice(0, m.index).split('\n').length;
      out.exports.push({ kind: m[1], name: m[2], line });
    }
    const fnRe = /^\s*(?:export\s+)?(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(([^)]*)\)/gm;
    while ((m = fnRe.exec(text))) {
      out.functions.push({ name: m[1], params: m[2].split(',').map((p) => p.trim()).filter(Boolean), line: text.slice(0, m.index).split('\n').length });
    }
    const clsRe = /^\s*(?:export\s+)?class\s+([A-Za-z_$][\w$]*)(?:\s+extends\s+([\w$.]+))?/gm;
    while ((m = clsRe.exec(text))) out.classes.push({ name: m[1], extends: m[2] || null, line: text.slice(0, m.index).split('\n').length });
    const typeRe = /^\s*(?:export\s+)?(?:type|interface)\s+([A-Za-z_$][\w$]*)/gm;
    while ((m = typeRe.exec(text))) out.types.push({ name: m[1], line: text.slice(0, m.index).split('\n').length });
    const hookRe = /\b(use[A-Z]\w*)\s*\(/g;
    while ((m = hookRe.exec(text))) if (out.hooks.indexOf(m[1]) < 0) out.hooks.push(m[1]);
    const jsxRe = /<([A-Z][\w.]*|[a-z][\w-]*)(?=[\s/>])/g;
    const seen = new Set();
    while ((m = jsxRe.exec(text))) {
      const tag = m[1];
      if (['div', 'span', 'p', 'a', 'section', 'button', 'main', 'header', 'footer', 'nav', 'ul', 'li', 'h1', 'h2', 'h3', 'img', 'form', 'input', 'pre', 'code', 'article', 'aside', 'label', 'select', 'option', 'textarea', 'br', 'hr', 'dl', 'dt', 'dd', 'figure', 'figcaption', 'time', 'svg', 'path', 'span'].indexOf(tag) > -1 || /^[A-Z]/.test(tag)) {
        seen.add(tag);
      }
    }
    out.jsx = Array.from(seen);
    const eventRe = /\bon([A-Z][a-zA-Z]+)\s*[:=]/g;
    while ((m = eventRe.exec(text))) if (out.events.indexOf(m[1]) < 0) out.events.push(m[1]);
    const stateRe = /\b(useState|useReducer)\s*[(<]/g;
    while ((m = stateRe.exec(text))) out.state.push(m[1]);
    return out;
  };

  /* ------------------------------------------------------------- css ------ */
  analysis.scanCss = function (text) {
    const colors = new Map();
    const spacing = new Map();
    const fontSizes = new Map();
    let m;
    const colorRe = /#[0-9a-fA-F]{3,8}\b|rgba?\([^)]+\)/g;
    while ((m = colorRe.exec(text))) colors.set(m[0].toLowerCase(), (colors.get(m[0].toLowerCase()) || 0) + 1);
    const spacingRe = /(?:margin|padding|gap|inset|top|right|bottom|left)[^;{]*:\s*([^;]+);/g;
    while ((m = spacingRe.exec(text))) {
      m[1].split(/\s+/).forEach((token) => {
        if (/^-?[\d.]+(px|rem|em|%)$/.test(token)) spacing.set(token, (spacing.get(token) || 0) + 1);
      });
    }
    const fontRe = /font-size\s*:\s*([^;]+);/g;
    while ((m = fontRe.exec(text))) fontSizes.set(m[1].trim(), (fontSizes.get(m[1].trim()) || 0) + 1);
    return {
      colors: Array.from(colors.entries()).sort((a, b) => b[1] - a[1]),
      spacing: Array.from(spacing.entries()).sort((a, b) => b[1] - a[1]),
      fontSizes: Array.from(fontSizes.entries()).sort((a, b) => b[1] - a[1]),
      hasReducedMotion: /prefers-reduced-motion/.test(text),
      hasCustomProperties: /--[\w-]+\s*:/.test(text),
      rules: (text.match(/\{/g) || []).length,
      important: (text.match(/!\s*important/g) || []).length,
      mediaQueries: (text.match(/@media/g) || []).length
    };
  };

  /** Deterministic transformation: hoist repeated colours into custom properties. */
  analysis.extractCssTokens = function (text, opts) {
    const scan = analysis.scanCss(text);
    const candidates = scan.colors.filter(([, count]) => count >= 2 && !/rgba?\(/.test(text.slice(0, 0))).slice(0, 8);
    const usable = [];
    candidates.forEach(([value, count]) => {
      const occurrences = text.split(value).length - 1;
      if (occurrences >= 2 && !/^rgba?\(/.test(value) && !/[0-9a-f]{8}/.test(value) || (count >= 2 && value.length <= 7)) {
        usable.push([value, occurrences]);
      }
    });
    if (!usable.length) {
      return {
        changed: false,
        notes: scan.colors.length
          ? ['No repeated colour literals found — the palette is already de-duplicated (' + scan.colors.length + ' distinct values).']
          : ['No colour literals in this stylesheet.']
      };
    }
    let content = text;
    const declarations = [];
    usable.forEach(([value, occurrences], index) => {
      const name = '--lz-color-' + (index + 1);
      const re = new RegExp(U.escapeRegExp(value) + '(?![0-9a-fA-F])', 'g');
      content = content.replace(re, 'var(' + name + ')');
      declarations.push('  ' + name + ': ' + value + ';  /* ' + occurrences + ' uses */');
    });
    const injection = ':root {\n' + declarations.join('\n') + '\n}\n\n';
    content = injection + content;
    void opts;
    return {
      changed: true,
      content,
      notes: [
        'Hoisted ' + usable.length + ' repeated colour literal(s) into custom properties at the top of the stylesheet.',
        'Every use now references a token, so a palette change is a one-line edit.',
        'No selector, specificity or cascade order changed — the computed values are identical.'
      ],
      tokens: usable
    };
  };

  /** Deterministic transformation: add a reduced-motion guard when missing. */
  analysis.addReducedMotion = function (text) {
    if (/prefers-reduced-motion/.test(text)) {
      return { changed: false, notes: ['A reduced-motion guard already exists in this stylesheet.'] };
    }
    const animated = /animation\s*:|transition\s*:/.test(text);
    const guard = '\n/* Respect the system motion preference. */\n@media (prefers-reduced-motion: reduce) {\n' +
      (animated
        ? '  *, *::before, *::after {\n    animation-duration: 0.001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.001ms !important;\n  }\n'
        : '  /* No animations in this file yet — the guard is here for later. */\n') +
      '}\n';
    return {
      changed: true,
      content: text.replace(/\s*$/, '') + '\n' + guard,
      notes: [
        animated
          ? 'This stylesheet animates but never consults prefers-reduced-motion. Appended a guard that neutralises durations for users who ask for reduced motion.'
          : 'Added a reduced-motion guard placeholder — harmless today, correct the moment motion is introduced.',
        'Uses !important so component-level transitions cannot bypass it.'
      ]
    };
  };

  /* --------------------------------------------------- optimization scan -- */
  analysis.optimizeFindings = function (text, path) {
    const findings = [];
    const lines = text.split('\n');
    const code = U.ext(path) === 'css' || U.ext(path) === 'html';
    if (!code) {
      const counters = {};
      lines.forEach((line, i) => {
        const q = line.match(/document\.querySelector(?:All)?\(\s*['"]([^'"]+)['"]/g);
        if (q) q.forEach((sel) => { counters[sel] = (counters[sel] || 0) + 1; });
        if (/JSON\.parse\(JSON\.stringify\(/.test(line)) {
          findings.push({ line: i + 1, severity: 'warning', message: 'Deep clone via JSON round-trip — it drops Date, Map, Set and undefined values.', suggestion: 'Use structuredClone(value) (baseline in all current browsers) or an explicit copy.' });
        }
        if (/\.map\(/.test(line) && /<[A-Za-z]/.test(line) && !/key=/.test(line)) {
          findings.push({ line: i + 1, severity: 'warning', message: 'Elements rendered in .map() without a key prop — React will reconcile by index and can lose input state.', suggestion: 'Add key={item.id} using a stable identifier.' });
        }
        if (/addEventListener\(\s*['"]scroll/.test(line) && !/passive/.test(line)) {
          findings.push({ line: i + 1, severity: 'hint', message: 'Scroll listener without { passive: true } can force the compositor to wait on the main thread.', suggestion: 'window.addEventListener("scroll", handler, { passive: true })' });
        }
        if (/setInterval\(/.test(line) && !/clearInterval/.test(text)) {
          findings.push({ line: i + 1, severity: 'warning', message: 'setInterval without a matching clearInterval in this file — it survives unmount and leaks.', suggestion: 'Store the handle and clear it in the cleanup path.' });
        }
        if (/useEffect\(\(\)\s*=>\s*\{/.test(line)) {
          const tail = lines.slice(i, i + 24).join('\n');
          const hasDeps = /\}\s*,\s*\[[^\]]*\]\s*\)/.test(tail);
          if (!hasDeps && /\}\s*\)\s*;/.test(tail)) {
            findings.push({ line: i + 1, severity: 'warning', message: 'useEffect without a dependency array runs after every render.', suggestion: 'Add the dependency array ([] for mount-only), or move the logic out of the effect.' });
          }
        }
        if (/for\s*\([^)]*\)\s*\{/.test(line)) {
          const tail = lines.slice(i, i + 12).join('\n');
          if (/innerHTML\s*\+=/.test(tail)) {
            findings.push({ line: i + 1, severity: 'error', message: 'innerHTML += inside a loop reparses the whole subtree on every iteration (quadratic).', suggestion: 'Build a fragment/DocumentFragment and insert once, or use insertAdjacentHTML on a container.' });
          }
        }
      });
      if (findings.length === 0 && /querySelector/.test(text)) {
        findings.push({ line: 1, severity: 'hint', message: 'Repeated DOM lookups in this file: cache the element in a constant if it is queried more than once per call.', suggestion: 'const node = document.querySelector(sel); then reuse node.' });
      }
    } else {
      lines.forEach((line, i) => {
        if (/animation[^;]*;[^}]*transition/.test(line)) {
          findings.push({ line: i + 1, severity: 'hint', message: 'Animating both transform and layout properties in one rule — measure before optimizing.', suggestion: 'Prefer transform/opacity for compositor-only animation.' });
        }
        if (/\*\s*\{[^}]*transition\s*:/.test(text) && i === lines.findIndex((l) => /\*/.test(l))) {
          findings.push({ line: i + 1, severity: 'warning', message: 'A transition on the universal selector applies to every element on the page.', suggestion: 'Scope the transition to the components that animate.' });
        }
        if (/filter\s*:\s*blur\(/.test(line)) {
          findings.push({ line: i + 1, severity: 'hint', message: 'Large blur() radii are expensive to rasterise, especially on repaint.', suggestion: 'Keep the blurred layer on its own compositor layer (will-change: transform) and avoid animating the radius.' });
        }
      });
    }
    return findings.slice(0, 12);
  };

  /* -------------------------------------------------------- narrative ----- */
  analysis.explain = function (text, path, selection) {
    const kind = U.ext(path);
    const lines = U.countLines(text);
    const md = [];
    if (U.LANGS[kind] && ['js', 'jsx', 'ts', 'tsx'].indexOf(U.LANGS[kind].id) > -1) {
      const scan = analysis.scanModule(text, path);
      md.push('**`' + path + '`** — ' + lines + ' lines, ' + (U.LANGS[kind].label || 'JavaScript') + '.');
      if (scan.exports.length) {
        md.push('Exports: ' + scan.exports.map((e) => '`' + e.name + '` (' + e.kind + ', line ' + e.line + ')').join(', ') + '.');
      }
      if (scan.imports.length) {
        md.push('Depends on: ' + scan.imports.map((i) => '`' + i.source + '`').join(', ') + '.');
      }
      if (scan.hooks.length) md.push('React hooks in use: ' + scan.hooks.map((h) => '`' + h + '`').join(', ') + '.');
      if (scan.state.length) md.push('Local state: ' + scan.state.join(', ') + ' — state changes re-render this component and its children.');
      if (scan.events.length) md.push('DOM handlers: ' + scan.events.map((e) => '`on' + e + '`').join(', ') + '.');
      if (scan.jsx.length) md.push('Renders: ' + scan.jsx.slice(0, 18).map((t) => '`<' + t + '>`').join(' ') + '.');
      md.push('');
      md.push('The subtle parts worth knowing:');
      scan.exports.slice(0, 3).forEach((e) => {
        md.push('- `' + e.name + '` is part of the module\'s public surface — changing its signature affects every importer, so keep the shape stable unless you update the call sites.');
      });
      if (scan.hooks.indexOf('useEffect') > -1) {
        md.push('- `useEffect` work is not run during render; anything the effect touches must already be mounted, otherwise the first paint will miss it.');
      }
      if (scan.jsx.indexOf('button') > -1 || scan.events.indexOf('Click') > -1) {
        md.push('- The click handler assumes the target element exists; if the markup is rendered conditionally, guard the reference.');
      }
      if (!scan.imports.length) md.push('- No imports: the file is self-contained, so behaviour is fully determined by the code in front of you.');
      if (!scan.exports.length) md.push('- Nothing is exported — this file only has side effects when loaded.');
    } else if (kind === 'html') {
      const scan = analysis.scanHtml(text);
      md.push('**`' + path + '`** — ' + lines + ' lines of HTML, language attribute `' + (scan.lang || 'unset') + '`.');
      if (scan.headings.length) md.push('Heading outline: ' + scan.headings.map((h) => 'h' + h.level + ' "' + U.truncate(h.text, 44) + '"').join(' → ') + '.');
      if (scan.sections.length) md.push('Landmarks: ' + scan.sections.map((s) => '`<' + s.tag + (s.id ? '#' + s.id : '') + '>`').join(', ') + '.');
      if (scan.buttons.length) md.push('Interactive buttons: ' + scan.buttons.map((b) => '"' + U.truncate(b.text, 30) + '"').join(', ') + '.');
      if (scan.stylesheets.length) md.push('Stylesheets: ' + scan.stylesheets.map((s) => '`' + s + '`').join(', ') + '.');
      md.push('');
      md.push('Checks worth running on this document:');
      if (!scan.hasViewport) md.push('- No viewport meta tag — mobile browsers will assume a 980px layout width.');
      if (!scan.hasMetaDescription) md.push('- No meta description; link previews will fall back to page content.');
      if (!scan.lang) md.push('- `<html lang>` is unset, so screen readers cannot pick the right pronunciation.');
      if (scan.images.some((i) => i.alt == null)) md.push('- ' + scan.images.filter((i) => i.alt == null).length + ' image(s) without an `alt` attribute.');
      if (scan.headings.filter((h) => h.level === 1).length !== 1) md.push('- The document has ' + scan.headings.filter((h) => h.level === 1).length + ' `h1` element(s); exactly one keeps the outline unambiguous.');
      if (md[md.length - 1] === '') md.push('- Nothing structural stood out: viewport, description, language and the heading outline are all in place.');
    } else if (kind === 'css') {
      const scan = analysis.scanCss(text);
      md.push('**`' + path + '`** — ' + scan.rules + ' rules, ' + scan.mediaQueries + ' media queries, ' + scan.colors.length + ' distinct colour values.');
      if (scan.colors.length) md.push('Palette in use: ' + scan.colors.slice(0, 6).map(([c, n]) => '`' + c + '`×' + n).join(', ') + '.');
      if (scan.spacing.length) md.push('Most common spacing steps: ' + scan.spacing.slice(0, 6).map(([v, n]) => '`' + v + '`×' + n).join(', ') + '.');
      md.push('');
      const repeated = scan.colors.filter(([, n]) => n > 1);
      if (repeated.length) md.push('- ' + repeated.length + ' colour literal(s) appear more than once. Hoisting them into custom properties makes a palette change a single edit.');
      if (!scan.hasReducedMotion) md.push('- No `prefers-reduced-motion` guard — users who ask the OS for reduced motion still get every animation.');
      if (scan.important) md.push('- `!important` appears ' + scan.important + ' time(s); each one is a specificity argument you will have to win twice.');
      if (scan.fontSizes.length > 6) md.push('- ' + scan.fontSizes.length + ' distinct font sizes — a type scale of 5–6 steps reads more deliberate.');
    } else {
      md.push('**`' + path + '`** — ' + lines + ' lines.');
      md.push('This format has no structural analyser in the workspace yet; the editor still highlights it and the project search indexes it.');
    }
    if (selection && selection.text) {
      md.push('');
      md.push('Selection: lines ' + selection.startLine + '–' + selection.endLine + ' (' + U.countLines(selection.text) + ' lines, ' + selection.text.length + ' characters).');
    }
    return md.join('\n');
  };

  analysis.document = function (text, path) {
    const kind = U.ext(path);
    const md = [];
    const name = U.basename(path);
    if (['ts', 'tsx', 'js', 'jsx'].indexOf(kind) > -1) {
      const scan = analysis.scanModule(text, path);
      md.push('# ' + name);
      md.push('');
      md.push('Module at `' + path + '` (' + U.countLines(text) + ' lines).');
      md.push('');
      if (scan.types.length) {
        md.push('## Types');
        md.push('');
        scan.types.forEach((t) => md.push('- `' + t.name + '` — line ' + t.line));
        md.push('');
      }
      if (scan.exports.length) {
        md.push('## Exports');
        md.push('');
        scan.exports.forEach((e) => {
          md.push('### `' + e.name + '`');
          md.push('');
          md.push('- Kind: ' + e.kind);
          md.push('- Defined at line ' + e.line);
          md.push('');
        });
      } else {
        md.push('## Exports');
        md.push('');
        md.push('This module exports nothing — it runs for its side effects only.');
        md.push('');
      }
      if (scan.imports.length) {
        md.push('## Dependencies');
        md.push('');
        scan.imports.forEach((i) => md.push('- `' + i.source + '`' + (i.source[0] === '.' ? '' : ' (external)')));
        md.push('');
      }
      md.push('## Notes');
      md.push('');
      if (scan.hooks.length) md.push('- Uses ' + scan.hooks.length + ' React hook(s): ' + scan.hooks.map((h) => '`' + h + '`').join(', ') + '.');
      if (scan.events.length) md.push('- Handles ' + scan.events.length + ' event type(s): ' + scan.events.map((e) => '`on' + e + '`').join(', ') + '.');
      md.push('- Generated from the file\'s actual declarations — verify the descriptions before publishing.');
    } else if (kind === 'html') {
      const scan = analysis.scanHtml(text);
      md.push('# ' + name);
      md.push('');
      md.push('Document at `' + path + '`.');
      md.push('');
      md.push('## Structure');
      md.push('');
      scan.sections.forEach((s) => md.push('- `<' + s.tag + (s.id ? ' id="' + s.id + '"' : '') + '>`'));
      if (scan.headings.length) {
        md.push('');
        md.push('## Content outline');
        md.push('');
        scan.headings.forEach((h) => md.push('  '.repeat(Math.max(0, h.level - 1)) + '- h' + h.level + ': ' + h.text));
      }
      md.push('');
      md.push('## Interactive elements');
      md.push('');
      if (scan.buttons.length) scan.buttons.forEach((b) => md.push('- Button "' + b.text + '"' + (b.id ? ' (`#' + b.id + '`)' : '') + (b.type ? ' type=' + b.type : '')));
      if (scan.links.length) scan.links.forEach((l) => md.push('- Link "' + U.truncate(l.text, 30) + '" → `' + l.href + '`'));
      md.push('');
      md.push('## Assets');
      md.push('');
      scan.stylesheets.forEach((s) => md.push('- Stylesheet: `' + s + '`'));
      scan.scripts.forEach((s) => md.push('- Script: ' + (s.src ? '`' + s.src + '`' : 'inline')));
    } else {
      md.push('# ' + name);
      md.push('');
      md.push('Documentation is generated from structural analysis. This file type (' + (kind || 'unknown') + ') has no analyser yet.');
    }
    return md.join('\n');
  };

  analysis.review = function (files, problems) {
    const md = [];
    const snapshot = analysis.project(files);
    md.push('**Summary.** ' + snapshot.fileCount + ' files, ' + U.fmtNumber(snapshot.lines) + ' lines, ' + U.fmtBytes(snapshot.bytes) + '. ' +
      (snapshot.languages.length ? 'Primarily ' + snapshot.languages[0][0] + '.' : ''));
    md.push('');
    const errors = problems.filter((p) => p.severity === 'error');
    const warnings = problems.filter((p) => p.severity === 'warning');
    md.push('**Static analysis found** ' + errors.length + ' error(s) and ' + warnings.length + ' warning(s).');
    if (errors.length) {
      md.push('');
      md.push('### Defects (fix first)');
      md.push('');
      errors.slice(0, 8).forEach((p) => md.push('- `' + p.path + ':' + p.line + '` — ' + p.message));
    }
    if (warnings.length) {
      md.push('');
      md.push('### Warnings');
      md.push('');
      warnings.slice(0, 10).forEach((p) => md.push('- `' + p.path + ':' + p.line + '` — ' + p.message));
    }
    md.push('');
    md.push('### Engineering notes');
    md.push('');
    const notes = [];
    if (!snapshot.tests.length) notes.push('No test files in the project. Start with the highest-risk interactive element rather than chasing coverage numbers.');
    else notes.push(snapshot.tests.length + ' test file(s) present: ' + snapshot.tests.join(', ') + '.');
    if (!snapshot.hasReadme) notes.push('No README — a new contributor has no entry point.');
    if (!snapshot.hasPackageJson) notes.push('No package.json: if this is meant to be built rather than opened directly, the dependency surface is undocumented.');
    const big = files.filter((f) => U.countLines(f.content || '') > 400);
    if (big.length) notes.push(big.length + ' file(s) exceed 400 lines (' + big.slice(0, 3).map((f) => '`' + f.path + '`').join(', ') + ') — split along responsibility boundaries, not line counts.');
    if (snapshot.todos.length) notes.push(snapshot.todos.length + ' unfinished marker(s), the oldest being `' + snapshot.todos[0].path + ':' + snapshot.todos[0].line + '` (' + snapshot.todos[0].kind + ').');
    const perf = [];
    files.forEach((f) => {
      analysis.optimizeFindings(f.content || '', f.path).forEach((finding) => {
        if (finding.severity !== 'hint') perf.push({ path: f.path, ...finding });
      });
    });
    if (perf.length) {
      notes.push(perf.length + ' pattern(s) with a measurable cost were detected — the two highest impact:');
      perf.slice(0, 2).forEach((p) => notes.push('  - `' + p.path + ':' + p.line + '` — ' + p.message));
    }
    notes.forEach((n) => md.push('- ' + n));
    return md.join('\n');
  };

  /* ------------------------------------------------------- test harness --- */
  /**
   * Build a real test file from the project's actual markup. Assertions are
   * derived from the elements that genuinely exist, so the generated file is
   * meaningful rather than illustrative.
   */
  analysis.generateTests = function (project) {
    const files = project.files || [];
    const entryPath = files.find((f) => /(^|\/)index\.html$/i.test(f.path)) || files.find((f) => /\.html$/i.test(f.path));
    if (!entryPath) {
      return {
        path: 'src/tests/smoke.test.html',
        content: buildTestDocument({
          title: 'Smoke tests',
          sourceName: '(no HTML entry point)',
          checks: [{
            name: 'the module under test loads',
            body: '      // Replace this with a real assertion once an HTML entry exists.\n      assert(true, "placeholder assertion");'
          }]
        }),
        note: 'No HTML entry point found — wrote a placeholder harness.'
      };
    }
    const scan = analysis.scanHtml(entryPath.content || '');
    const checks = [];
    const firstHeading = scan.headings[0];
    if (firstHeading) {
      checks.push({
        name: 'renders the primary heading',
        body: '      const heading = document.querySelector("h' + firstHeading.level + '");\n' +
          '      assert(heading, "expected an h' + firstHeading.level + ' element");\n' +
          '      assert.equal(heading.textContent.trim().length > 0, true, "heading has no text");'
      });
    }
    const button = scan.buttons[0];
    if (button) {
      const selector = button.id ? '#' + button.id : (button.className ? '.' + button.className.split(/\s+/)[0] : 'button');
      checks.push({
        name: 'primary action is present and labelled',
        body: '      const button = document.querySelector(' + JSON.stringify(selector) + ');\n' +
          '      assert(button, "expected ' + selector + '");\n' +
          '      assert(button.textContent.trim().length > 0, "button has no accessible label");'
      });
    }
    const landmark = scan.sections.find((s) => s.id) || scan.sections[0];
    if (landmark) {
      checks.push({
        name: 'landmark region exists',
        body: '      const region = document.querySelector(' + JSON.stringify(landmark.id ? '#' + landmark.id : landmark.tag) + ');\n' +
          '      assert(region, "expected the " + ' + JSON.stringify(landmark.tag || 'section') + ' + " landmark");'
      });
    }
    if (scan.images.length) {
      checks.push({
        name: 'images declare alt text',
        body: '      const images = Array.from(document.querySelectorAll("img"));\n' +
          '      const missing = images.filter(function (img) { return !img.hasAttribute("alt"); });\n' +
          '      assert.equal(missing.length, 0, "images without alt: " + missing.length);'
      });
    }
    if (scan.headings.length > 1) {
      checks.push({
        name: 'heading outline has exactly one h1',
        body: '      const h1s = document.querySelectorAll("h1");\n' +
          '      assert.equal(h1s.length, 1, "h1 count");'
      });
    }
    if (!checks.length) {
      checks.push({ name: 'document loads', body: '      assert(document.body, "expected a body element");' });
    }

    return {
      path: 'src/tests/' + U.slugify(project.name || 'app') + '.test.html',
      content: buildTestDocument({
        title: 'Generated tests — ' + (project.name || 'project'),
        sourceName: entryPath.path,
        source: entryPath.content,
        checks
      }),
      note: 'Assertions were derived from the elements that actually exist in `' + entryPath.path + '`.'
    };
  };

  function buildTestDocument(opts) {
    const checks = opts.checks.map((c) => '    {\n      name: ' + JSON.stringify(c.name) + ',\n      fn: function (ctx) {\n' +
      '      var assert = window.assert;\n' + c.body + '\n      }\n    }').join(',\n');
    return '<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <title>' + opts.title + '</title>\n</head>\n<body>\n' +
      '  <\!--\n    Generated by Luzzes from ' + opts.sourceName + '.\n' +
      '    These tests run inside the workspace sandbox and report back real results.\n' +
      '  -->\n' +
      (opts.source ? indent(extractBody(opts.source), '  ') + '\n' : '  <main id="mount"></main>\n') +
      '  <script>\n    window.__luzzesTests = [\n' + checks + '\n    ];\n  <\/script>\n</body>\n</html>\n';
  }

  function extractBody(html) {
    const m = String(html).match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    let body = m ? m[1] : html;
    body = body.replace(/<script\b[^>]*src=[^>]*><\/script>/gi, '<\!-- script removed for the test sandbox -->');
    return body.trim();
  }
  function indent(text, pad) {
    return text.split('\n').map((l) => (l.trim() ? pad + l : l)).join('\n');
  }

  analysis.extractBody = extractBody;

  /* -------------------------------------------------- relevance ranking --- */
  /**
   * Score files against a query. Real token overlap — this is also the engine's
   * context selector, so what the model sees is explainable.
   */
  analysis.rank = function (files, query, opts) {
    opts = opts || {};
    const tokens = String(query || '').toLowerCase().match(/[a-z0-9_$.-]{2,}/g) || [];
    const unique = Array.from(new Set(tokens)).filter((t) => t.length > 2);
    const scored = files.map((file) => {
      const path = file.path.toLowerCase();
      const content = String(file.content || '').toLowerCase();
      let score = 0;
      const matches = [];
      unique.forEach((token) => {
        if (path.indexOf(token) > -1) { score += 12; matches.push(token + ' (path)'); }
        const occurrences = content.split(token).length - 1;
        if (occurrences) { score += Math.min(6, occurrences) * 2; matches.push(token + '×' + occurrences); }
      });
      if (/index\.html$/.test(path)) score += 3;
      if (opts.activeFile && file.path === opts.activeFile) score += 20;
      if (opts.entry && file.path === opts.entry) score += 8;
      score += Math.min(4, (file.content || '').length / 4000);
      return { file, score, matches };
    });
    return scored.sort((a, b) => b.score - a.score);
  };

  analysis.selectContext = function (files, query, opts) {
    opts = opts || {};
    const limit = opts.limit || 4;
    const ranked = analysis.rank(files, query, opts);
    const picked = [];
    ranked.forEach((entry) => {
      if (picked.length >= limit) return;
      if (entry.score <= 0 && picked.length >= 1) return;
      picked.push(entry.file);
    });
    if (!picked.length) {
      const fallback = files.find((f) => f.path === (opts.entry || '')) || files[0];
      if (fallback) picked.push(fallback);
    }
    return picked;
  };
})();

/* ========== ai/providers.js ========== */
/* ============================================================================
 * Luzzes — ai/providers.js
 *
 * The model adapter layer. Everything the UI knows about a model goes through
 * this interface, so swapping or adding a provider never touches the UI.
 *
 * Provider interface
 * ------------------
 *   id            unique string
 *   label         human name
 *   kind          'demo' | 'local' | 'connected'
 *   description   one line shown in Settings
 *   requiresKey   boolean
 *   keyStorage    'session' | 'memory' | 'none'
 *   config        [{ key, label, type, placeholder, help, required }]
 *   models        [{ id, label, context }]
 *   capabilities  { streaming, tools, vision }
 *   health()      -> Promise<{ ok, detail }>
 *   chat({ messages, model, temperature, system, signal, onDelta })
 *                 -> Promise<{ content, model, usage, requestId, latency }>
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const providers = (LZ.providers = new Map());

  /* ------------------------------------------------------------ registry -- */
  LZ.registerProvider = function (provider) {
    if (!provider || !provider.id) throw new Error('A provider needs an id');
    providers.set(provider.id, provider);
    return provider;
  };
  LZ.getProvider = function (id) { return providers.get(id) || null; };
  LZ.listProviders = function () { return Array.from(providers.values()); };

  /* ------------------------------------------------------- key handling --- */
  const memoryKeys = new Map();
  const KEY_PREFIX = 'luzzes:key:';

  const keys = (LZ.keys = {
    set(providerId, value, storage) {
      memoryKeys.set(providerId, value);
      if (storage === 'session' && value) {
        try { window.sessionStorage.setItem(KEY_PREFIX + providerId, value); } catch (e) { /* sessionStorage blocked */ }
      }
      if (!value) {
        try { window.sessionStorage.removeItem(KEY_PREFIX + providerId); } catch (e) { /* ignore */ }
      }
    },
    get(providerId) {
      if (memoryKeys.has(providerId)) return memoryKeys.get(providerId);
      try { return window.sessionStorage.getItem(KEY_PREFIX + providerId) || ''; } catch (e) { return ''; }
    },
    clear(providerId) { keys.set(providerId, '', 'session'); }
  });

  /* --------------------------------------------------- shared HTTP helper - */
  function normalizeBase(url) {
    return String(url || '').replace(/\/+$/, '');
  }

  /**
   * Chat against any OpenAI-compatible /chat/completions endpoint.
   * Works with LM Studio, Ollama, llama.cpp, vLLM, OpenRouter, OpenAI, Groq…
   */
  async function openAICompatibleChat(cfg) {
    const { baseUrl, apiKey, model, messages, temperature, signal, onDelta, extraHeaders } = cfg;
    const url = normalizeBase(baseUrl) + '/chat/completions';
    const started = performance.now();
    const headers = Object.assign({
      'Content-Type': 'application/json'
    }, extraHeaders || {});
    if (apiKey) headers.Authorization = 'Bearer ' + apiKey;

    const body = {
      model,
      messages,
      temperature: typeof temperature === 'number' ? temperature : 0.2,
      stream: true
    };

    const response = await fetch(url, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal
    });

    if (!response.ok) {
      let detail = '';
      try {
        const text = await response.text();
        try {
          const parsed = JSON.parse(text);
          detail = (parsed.error && (parsed.error.message || parsed.error)) || text;
        } catch (e) { detail = text; }
      } catch (e) { detail = ''; }
      const error = new Error('The model endpoint returned HTTP ' + response.status + (detail ? ': ' + String(detail).slice(0, 300) : ''));
      error.status = response.status;
      throw error;
    }

    const contentType = response.headers.get('content-type') || '';

    // Non-streaming fallback (some local servers ignore stream: true)
    if (!response.body || contentType.indexOf('text/event-stream') < 0) {
      const data = await response.json();
      const content = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
      if (onDelta && content) onDelta(content);
      return {
        content,
        model: data.model || model,
        usage: data.usage || null,
        requestId: data.id || null,
        latency: performance.now() - started,
        streamed: false
      };
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let content = '';
    let usage = null;
    let modelName = model;
    let requestId = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line || line.indexOf('data:') !== 0) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let json;
        try { json = JSON.parse(payload); } catch (e) { continue; }
        if (json.model) modelName = json.model;
        if (json.id) requestId = json.id;
        if (json.usage) usage = json.usage;
        const delta = json.choices && json.choices[0] && (json.choices[0].delta || json.choices[0].message);
        const text = delta && delta.content;
        if (text) {
          content += text;
          if (onDelta) onDelta(text);
        }
      }
    }

    return { content, model: modelName, usage, requestId, latency: performance.now() - started, streamed: true };
  }

  LZ.openAICompatibleChat = openAICompatibleChat;

  /* ======================================================== demo provider = */
  LZ.registerProvider({
    id: 'demo',
    label: 'Luzzes Demo',
    kind: 'demo',
    description: 'No model is contacted. Replies are drafted locally from static analysis of your project and clearly labelled as scripted examples.',
    requiresKey: false,
    keyStorage: 'none',
    config: [],
    models: [
      { id: 'demo-luzzes-1', label: 'Scripted demo responses', context: 'local analysis' }
    ],
    capabilities: { streaming: true, tools: false, vision: false },
    async health() {
      return {
        ok: true,
        detail: 'Demo mode is active. Nothing leaves this browser and no model is contacted.'
      };
    },
    async chat(request) {
      return LZ.demoModel.respond(request);
    }
  });

  /* ======================================================= local provider = */
  LZ.registerProvider({
    id: 'local',
    label: 'Local model (OpenAI-compatible)',
    kind: 'local',
    description: 'Talk to a model server running on this machine — LM Studio, Ollama, llama.cpp or vLLM. No key required unless your server asks for one.',
    requiresKey: false,
    keyStorage: 'memory',
    config: [
      { key: 'baseUrl', label: 'Base URL', type: 'text', placeholder: 'http://localhost:1234/v1', required: true,
        help: 'The /v1 root of your local server. Browser requests go directly from this tab to that address.' },
      { key: 'model', label: 'Model id', type: 'text', placeholder: 'qwen2.5-coder-7b-instruct', required: true,
        help: 'Exact model identifier your server reports.' },
      { key: 'apiKey', label: 'API key (optional)', type: 'password', placeholder: 'not needed for most local servers' }
    ],
    presets: [
      { label: 'LM Studio', baseUrl: 'http://localhost:1234/v1' },
      { label: 'Ollama', baseUrl: 'http://localhost:11434/v1' },
      { label: 'llama.cpp', baseUrl: 'http://localhost:8080/v1' },
      { label: 'vLLM', baseUrl: 'http://localhost:8000/v1' },
      { label: 'text-generation-webui', baseUrl: 'http://localhost:5000/v1' }
    ],
    models: [],
    capabilities: { streaming: true, tools: false, vision: false },
    async health(config) {
      const baseUrl = normalizeBase((config && config.baseUrl) || '');
      if (!baseUrl) return { ok: false, detail: 'Set the base URL of your local server first.' };
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 4000);
        const response = await fetch(baseUrl + '/models', { signal: controller.signal });
        clearTimeout(timer);
        if (!response.ok) return { ok: false, detail: 'Reached ' + baseUrl + ' but /models answered HTTP ' + response.status + '.' };
        const data = await response.json();
        const models = (data.data || data.models || []).map((m) => m.id || m.name).filter(Boolean);
        return { ok: true, detail: models.length ? models.length + ' model(s) available' : 'Server reachable', models };
      } catch (e) {
        const blocked = /Failed to fetch|NetworkError/.test(String(e && e.message));
        return {
          ok: false,
          detail: 'Could not reach ' + baseUrl + '.' +
            (blocked ? ' The request was blocked or refused — check that the server is running, that it allows this origin (CORS), and that this page is not inside a sandboxed preview.' : ' ' + (e && e.message))
        };
      }
    },
    async chat(request) {
      const cfg = request.config || {};
      if (!cfg.baseUrl) {
        const error = new Error('No base URL configured. Open Settings → AI and point Luzzes at your local server.');
        error.code = 'config';
        throw error;
      }
      return openAICompatibleChat({
        baseUrl: cfg.baseUrl,
        apiKey: keys.get('local') || cfg.apiKey || '',
        model: request.model || cfg.model,
        messages: request.messages,
        temperature: request.temperature,
        signal: request.signal,
        onDelta: request.onDelta
      });
    }
  });

  /* =============================================== remote/byok provider --- */
  LZ.registerProvider({
    id: 'connected',
    label: 'Connected provider (API key)',
    kind: 'connected',
    description: 'Any hosted OpenAI-compatible API. Requests go straight from this tab to the provider you configure.',
    requiresKey: true,
    keyStorage: 'session',
    securityNote: 'A key typed into a browser page is visible to that page and to anything that can run script inside it. Use a scoped, rate-limited key, and prefer a small server-side proxy for production.',
    config: [
      { key: 'baseUrl', label: 'Base URL', type: 'text', placeholder: 'https://api.openai.com/v1', required: true,
        help: 'OpenAI-compatible root. OpenRouter: https://openrouter.ai/api/v1, Groq: https://api.groq.com/openai/v1.' },
      { key: 'model', label: 'Model id', type: 'text', placeholder: 'gpt-4o-mini', required: true },
      { key: 'apiKey', label: 'API key', type: 'password', placeholder: 'sk-…', required: true }
    ],
    models: [],
    capabilities: { streaming: true, tools: false, vision: false },
    async health(config) {
      const baseUrl = normalizeBase((config && config.baseUrl) || '');
      const apiKey = keys.get('connected') || (config && config.apiKey) || '';
      if (!baseUrl) return { ok: false, detail: 'Set the provider base URL.' };
      if (!apiKey) return { ok: false, detail: 'Add an API key — it is kept in sessionStorage and cleared when this tab closes.' };
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        const response = await fetch(baseUrl + '/models', {
          headers: { Authorization: 'Bearer ' + apiKey },
          signal: controller.signal
        });
        clearTimeout(timer);
        if (!response.ok) return { ok: false, detail: 'Provider answered HTTP ' + response.status + ' for /models.' };
        const data = await response.json();
        const models = (data.data || data.models || []).map((m) => m.id).filter(Boolean);
        return { ok: true, detail: models.length + ' model(s) visible to this key', models };
      } catch (e) {
        return { ok: false, detail: 'Could not reach ' + baseUrl + ' — ' + (e && e.message) + '. Browser requests need CORS headers from the provider; most hosted APIs only allow this from a server.' };
      }
    },
    async chat(request) {
      const cfg = request.config || {};
      const apiKey = keys.get('connected') || cfg.apiKey || '';
      if (!apiKey) {
        const error = new Error('No API key set for the connected provider.');
        error.code = 'config';
        throw error;
      }
      return openAICompatibleChat({
        baseUrl: cfg.baseUrl,
        apiKey,
        model: request.model || cfg.model,
        messages: request.messages,
        temperature: request.temperature,
        signal: request.signal,
        onDelta: request.onDelta
      });
    }
  });
})();

/* ========== ai/demo-model.js ========== */
/* ============================================================================
 * Luzzes — ai/demo-model.js
 *
 * Demo mode. Two distinct things happen here, and the UI always says which:
 *
 *   1. Local analysis — real. Files are scanned, diagnostics are computed,
 *      patches are produced by deterministic transformation passes.
 *   2. Scripted voice — simulated. The prose is written in advance, streamed
 *      with delays so the interface can be exercised, and every message is
 *      labelled "Scripted example" wherever it appears.
 *
 * No network request is made, and nothing here ever claims work it did not do.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const A = LZ.analysis;
  const demoModel = (LZ.demoModel = {});

  const INTENTS = [
    ['greeting', /^\s*(hi|hey|hello|yo|good (morning|evening))\b|what can you do|who are you/i],
    ['tests', /\b(test|tests|spec|coverage|assertion)\b/i],
    ['fix', /\b(fix|bug|broken|breaks|fails?|failing|error|crash|does ?n[o']t work|not working|issue|throw|undefined is not)\b/i],
    ['optimize', /\b(optimi[sz]e|performance|perf|slow|faster|speed|jank|memory|bundle|latency)\b/i],
    ['refactor', /\b(refactor|clean ?up|restructure|simplify|reorgani[sz]e|extract)\b/i],
    ['docs', /\b(document|docs|documentation|readme|jsdoc)\b/i],
    ['review', /\b(review|audit|critique|feedback|code quality|lgtm|second opinion)\b/i],
    ['ui', /\b(design|ui|ux|premium|polish|beautiful|look|looks|style|styling|css|spacing|typograph|polished|elegant)\b/i],
    ['explain', /\b(explain|what does|walk me through|how does|understand|breakdown|break down)\b/i],
    ['feature', /\b(add|build|create|implement|generate|make|new)\b/i]
  ];

  demoModel.detectIntent = function (text) {
    const input = String(text || '');
    for (const [intent, re] of INTENTS) if (re.test(input)) return intent;
    return 'analyze';
  };

  function chunkify(text, size) {
    const out = [];
    const paragraphs = text.split(/(\n\n)/);
    let buffer = '';
    paragraphs.forEach((part) => {
      if ((buffer + part).length > size && buffer) { out.push(buffer); buffer = ''; }
      buffer += part;
    });
    if (buffer) out.push(buffer);
    return out;
  }

  async function stream(text, onDelta, signal) {
    if (!onDelta) return;
    const chunks = chunkify(text, 68);
    for (const chunk of chunks) {
      if (signal && signal.aborted) return;
      onDelta(chunk);
      await U.sleep(9 + Math.round(Math.random() * 22));
    }
  }

  /* ---------------------------------------------------------- composers --- */
  const C = {};

  C.analyze = function (ctx) {
    const snap = ctx.snapshot;
    const md = [];
    md.push('I read the project before answering: ' + snap.fileCount + ' files, ' + U.fmtNumber(snap.lines) + ' lines, ' + U.fmtBytes(snap.bytes) + '.');
    md.push('');
    if (snap.languages.length) {
      md.push('Composition: ' + snap.languages.slice(0, 4).map(([label, count]) => count + '× ' + label).join(', ') + '.');
    }
    if (snap.entry) md.push('Preview entry point: `' + snap.entry + '`.');
    md.push('');
    if (ctx.problems.length) {
      md.push('**Where I would start.** Static analysis is reporting ' + ctx.problems.length + ' finding(s); the highest severity is `' +
        ctx.problems[0].path + ':' + ctx.problems[0].line + '` — ' + ctx.problems[0].message);
      if (ctx.problems.filter((p) => p.fixable).length) {
        md.push('');
        md.push(ctx.problems.filter((p) => p.fixable).length + ' of them have a deterministic quick fix, so they can be cleared without guessing.');
      }
    } else {
      md.push('Static analysis is clean — no bracket imbalance, no unresolved references, no accessibility debt it can detect.');
    }
    md.push('');
    md.push('If you want a specific outcome, the three highest-leverage prompts right now:');
    md.push('');
    md.push('1. `Review ' + (snap.entry || 'index.html') + '` — I will order the findings by impact.');
    md.push('2. `Write tests for ' + (snap.entry || 'the main page') + '` — assertions derived from the elements that actually exist.');
    md.push('3. `Make the design feel more premium` — I will show the change as a diff before anything is written.');
    return md.join('\n');
  };

  C.explain = function (ctx) {
    const target = ctx.primaryFile;
    if (!target) return C.analyze(ctx);
    const md = [A.explain(target.content || '', target.path, ctx.selection)];
    md.push('');
    md.push('**Next step.** If you want the file to be safer rather than clearer, say `fix ' + target.path + '` — I will propose a diff you can review.');
    return md.join('\n');
  };

  C.review = function (ctx) {
    const md = [A.review(ctx.files, ctx.problems)];
    md.push('');
    md.push('Nothing above is a style opinion: every line maps to a rule that fired on the file, or to a pattern with a measurable cost. Apply the deterministic fixes first, then re-review.');
    return md.join('\n');
  };

  C.fix = function (ctx) {
    const md = [];
    const target = ctx.fixTarget;
    if (target && target.problems.length) {
      const problems = target.problems;
      md.push('I found ' + problems.length + ' problem(s) in `' + target.path + '`. Ordered by severity:');
      md.push('');
      problems.slice(0, 6).forEach((p, i) => {
        md.push((i + 1) + '. **Line ' + p.line + '** — ' + p.message + (p.fixable ? ' *(deterministic fix available)*' : ''));
      });
      const fixable = problems.filter((p) => p.fixable);
      md.push('');
      if (fixable.length) {
        md.push('I applied the ' + fixable.length + ' deterministic fix(es) below: each is a mechanical edit that cannot change behaviour, and the diff is complete.');
      } else {
        md.push('None of these have a mechanical fix — each needs a judgement call, which is why I have not edited the file.');
      }
      md.push('');
      md.push('**What still needs attention.** ' + (problems.length > fixable.length
        ? (problems.length - fixable.length) + ' finding(s) left for you to decide on. They are listed in the Problems panel with the rule that triggered each one.'
        : 'Nothing else in static analysis. Run the preview to confirm the change behaves as expected — I cannot execute your project.'));
      return md.join('\n');
    }
    md.push('I could not see a defect in the context I loaded, and I will not invent one.');
    md.push('');
    md.push('To make this actionable, give me one of:');
    md.push('');
    md.push('- the error text from the console, or the stack trace;');
    md.push('- the file you suspect (mention its path so I can read it);');
    md.push('- the reproduction steps and the element or function that misbehaves.');
    if (ctx.problems.length) {
      md.push('');
      md.push('For reference, the workspace is currently reporting ' + ctx.problems.length + ' finding(s); the first is `' + ctx.problems[0].path + ':' + ctx.problems[0].line + '`.');
    }
    return md.join('\n');
  };

  C.optimize = function (ctx) {
    const md = [];
    const withFindings = [];
    ctx.files.forEach((f) => {
      const findings = A.optimizeFindings(f.content || '', f.path);
      if (findings.length) withFindings.push({ path: f.path, findings });
    });
    if (withFindings.length) {
      md.push('**Measured patterns, not guesses.** These come from scanning the actual source:');
      md.push('');
      withFindings.slice(0, 4).forEach((entry) => {
        entry.findings.slice(0, 3).forEach((finding) => {
          md.push('- `' + entry.path + ':' + finding.line + '` — ' + finding.message);
          if (finding.suggestion) md.push('  → ' + finding.suggestion);
        });
      });
      md.push('');
      md.push('Work order: the quadratic DOM write first (it scales with data), then the listener options (one-line, zero risk), then the render-key issues.');
    } else {
      md.push('No hot-path patterns showed up in the files I read. That is a real result, not a placeholder: I scan for deep clones, un-keyed renders, non-passive scroll listeners, uncleaned intervals, `innerHTML +=` in loops and effect without a dependency array.');
    }
    md.push('');
    md.push('**Measure before you believe me.** I cannot run a profiler from here. Open the browser Performance panel, record the interaction you care about, and check whether the time is in script, style or paint — that tells you which of the above actually matters.');
    return md.join('\n');
  };

  C.refactor = function (ctx) {
    const target = ctx.primaryFile;
    const md = [];
    if (!target) return C.analyze(ctx);
    const scan = A.scanModule(target.content || '', target.path);
    md.push('Reading `' + target.path + '` (' + U.countLines(target.content) + ' lines):');
    md.push('');
    if (scan.exports.length) md.push('- Public surface: ' + scan.exports.map((e) => '`' + e.name + '`').join(', ') + '. I will not change these signatures.');
    if (scan.functions.length) md.push('- ' + scan.functions.length + ' function declaration(s): ' + scan.functions.map((f) => '`' + f.name + '`').join(', ') + '.');
    if (scan.hooks.length) md.push('- Hooks: ' + scan.hooks.map((h) => '`' + h + '`').join(', ') + ' — extraction has to preserve their order.');
    md.push('');
    md.push('**Plan, in order:**');
    md.push('');
    md.push('1. Name the invariants first (exports, prop shape, DOM contract) — everything else is negotiable.');
    md.push('2. Move presentational markup out of logic-heavy functions, one block at a time.');
    md.push('3. Delete duplication rather than abstract it; a shared helper used twice is usually a coincidence.');
    md.push('4. Verify after each step with the preview, not at the end.');
    md.push('');
    md.push('Tell me to proceed and I will return the refactored file as a reviewable diff. I will not touch it unprompted.');
    return md.join('\n');
  };

  C.tests = function (ctx) {
    const md = [];
    if (ctx.testProposal) {
      md.push('I generated a test file from the markup that actually exists in `' + ctx.testSourcePath + '`.');
      md.push('');
      md.push('Included assertions:');
      md.push('');
      ctx.testProposal.checks.forEach((c) => md.push('- ' + c));
      md.push('');
      md.push('The file defines `window.__luzzesTests`, which is the contract the workspace sandbox reads. Apply it, then press **Run tests** in the bottom panel — the pass/fail numbers you see there come from the sandbox, and nothing in the interface reports a test result that the sandbox did not return.');
      md.push('');
      md.push('What I did **not** do: I have not run these tests. I cannot, from here.');
    } else {
      md.push('There is no entry HTML in this project, so there is nothing to assert against yet.');
    }
    return md.join('\n');
  };

  C.docs = function (ctx) {
    const target = ctx.primaryFile;
    if (!target) return C.analyze(ctx);
    return 'Documentation drafted from the real declarations in `' + target.path + '`:\n\n' + A.document(target.content || '', target.path) +
      '\n\nApply it to write the file, or copy the section you want. Every symbol listed above exists in the source — I did not describe anything that is not there.';
  };

  C.ui = function (ctx) {
    const md = [];
    const css = ctx.cssFile;
    md.push('I will work on the visual system rather than the words. Current state of `' + (css ? css.path : 'the stylesheets') + '`:');
    md.push('');
    if (css) {
      const scan = A.scanCss(css.content || '');
      md.push('- ' + scan.rules + ' rules across ' + scan.mediaQueries + ' media queries.');
      if (scan.colors.length) md.push('- ' + scan.colors.length + ' distinct colour values' + (scan.colors[0][1] > 1 ? ', the most repeated being `' + scan.colors[0][0] + '` (' + scan.colors[0][1] + '×)' : '') + '.');
      if (scan.fontSizes.length) md.push('- ' + scan.fontSizes.length + ' distinct font sizes.');
      if (scan.spacing.length) md.push('- Most-used spacing step: `' + scan.spacing[0][0] + '` (' + scan.spacing[0][1] + '×).');
      if (!scan.hasReducedMotion) md.push('- No `prefers-reduced-motion` guard.');
    }
    md.push('');
    md.push('**The change I am proposing** (deterministic pass, shown as a diff):');
    md.push('');
    md.push('1. Hoist repeated colour literals into custom properties at the top of the file so the palette is one edit away.');
    md.push('2. Add the reduced-motion guard if it is missing.');
    md.push('Neither touches a selector, so nothing about the current layout changes — computed values stay identical. If you wanted visual changes instead (rhythm, hierarchy, motion), say which section and I will propose those explicitly.');
    return md.join('\n');
  };

  C.feature = function (ctx) {
    const snap = ctx.snapshot;
    const md = [];
    md.push('Before writing code I need to place the change correctly. Current surface:');
    md.push('');
    md.push('- Entry point: `' + (snap.entry || 'none') + '`');
    md.push('- Components: ' + (ctx.components.length ? ctx.components.slice(0, 6).map((c) => '`' + c.path + '`').join(', ') : 'none in this project'));
    md.push('- Stylesheets: ' + (ctx.stylesheets.length ? ctx.stylesheets.slice(0, 4).map((c) => '`' + c.path + '`').join(', ') : 'none'));
    md.push('');
    md.push('**Plan**');
    md.push('');
    md.push('1. Add the state where it is owned, not where it is displayed.');
    md.push('2. Render from that state; keep the existing class names so the stylesheet keeps working.');
    md.push('3. Add the interaction hook with a keyboard path, then check focus order.');
    md.push('4. Add the test assertions for the new element.');
    md.push('');
    md.push('Describe the feature in one sentence with the element it attaches to and I will write the diff. In demo mode I will not fabricate an implementation for a feature I have not been told the shape of.');
    return md.join('\n');
  };

  C.greeting = function (ctx) {
    const snap = ctx.snapshot;
    return [
      'Luzzes. I have this project loaded: **' + snap.fileCount + ' files, ' + U.fmtNumber(snap.lines) + ' lines**, entry point `' + (snap.entry || 'none') + '`.',
      '',
      'I can read any file in it, explain what it does, propose diffs, generate tests from real markup, and run the workspace\'s static checks. What I cannot do: execute your code, install packages, or reach the network.',
      '',
      'State currently: ' + (ctx.problems.length ? ctx.problems.length + ' static finding(s) open' + (ctx.problems.filter((p) => p.fixable).length ? ' (' + ctx.problems.filter((p) => p.fixable).length + ' with deterministic fixes)' : '') : 'static analysis clean') + '.',
      '',
      'Where do you want to start?'
    ].join('\n');
  };

  /* ------------------------------------------------------------- respond -- */
  /**
   * @param {{messages:Array, context:object, action?:string, userText:string, onDelta?:function, signal?:AbortSignal}} request
   */
  demoModel.respond = async function (request) {
    const started = performance.now();
    const ctx = buildContext(request);
    const intent = request.action || demoModel.detectIntent(request.userText || lastUserText(request.messages));
    const composer = C[intent] || C.analyze;
    let content = composer(ctx);
    const proposals = buildProposals(intent, ctx);
    await stream(content, request.onDelta, request.signal);
    return {
      content,
      model: 'demo-luzzes-1',
      demo: true,
      intent,
      proposals,
      latency: performance.now() - started,
      usage: null,
      notes: ctx.notes
    };
  };

  function lastUserText(messages) {
    const userMessages = (messages || []).filter((m) => m.role === 'user');
    return userMessages.length ? userMessages[userMessages.length - 1].content : '';
  }

  function buildContext(request) {
    const context = request.context || {};
    const files = context.files || [];
    const project = context.project || { files: [] };
    const snapshot = A.project(project.files || []);
    const problems = context.problems || [];
    const entry = snapshot.entry;
    const selection = context.selection || null;

    const byPath = (re) => files.find((f) => re.test(f.path)) || (project.files || []).find((f) => re.test(f.path));
    const primaryFile = (selection && selection.path && files.find((f) => f.path === selection.path)) ||
      files.find((f) => f.path === context.activeFile) || files[0] || null;
    const cssFile = byPath(/\.css$/i);
    const components = (project.files || []).filter((f) => /\.(tsx|jsx|vue|svelte)$/i.test(f.path));
