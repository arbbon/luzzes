<!doctype html>

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<link id="lz-favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234b52e0'/%3E%3Cpath d='M10.4 8.6h3.4v11.2h8.2v3.6H10.4z' fill='%23fff'/%3E%3Ccircle cx='22.6' cy='9.6' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ---------- base.css ---------- */
/* ============================================================================
 * Luzzes — base.css
 * Design tokens, reset, typography and the shared primitive styles used by
 * every surface (buttons, inputs, chips, menus, modals, toasts, empty states).
 * ==========================================================================*/

:root {
  --lz-accent: #4b52e0;
  --lz-accent-strong: #3a41cc;
  --lz-accent-soft: rgba(75, 82, 224, 0.10);
  --lz-accent-fg: #ffffff;

  --lz-bg: #ffffff;
  --lz-surface: #f7f8fa;
  --lz-surface-2: #eff1f5;
  --lz-surface-3: #e6e9ef;
  --lz-border: #e2e5ec;
  --lz-border-strong: #ccd2df;

  --lz-fg: #14161c;
  --lz-fg-muted: #565d6e;
  --lz-fg-subtle: #838b9d;

  --lz-ok: #12855a;
  --lz-warn: #a86400;
  --lz-error: #c1382b;
  --lz-info: #2a63c9;

  --lz-add-bg: rgba(18, 133, 90, 0.09);
  --lz-add-fg: #0f6d4a;
  --lz-del-bg: rgba(193, 56, 43, 0.08);
  --lz-del-fg: #a52e22;

  --lz-shadow-1: 0 1px 2px rgba(16, 19, 26, 0.06);
  --lz-shadow-2: 0 1px 2px rgba(16, 19, 26, 0.06), 0 10px 24px -14px rgba(16, 19, 26, 0.28);
  --lz-shadow-3: 0 24px 60px -28px rgba(16, 19, 26, 0.45), 0 2px 6px rgba(16, 19, 26, 0.06);

  --lz-radius-sm: 7px;
  --lz-radius: 10px;
  --lz-radius-lg: 14px;
  --lz-radius-xl: 20px;

  --lz-font: "Inter", "Inter var", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --lz-mono: "JetBrains Mono", "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;

  --lz-font-xs: 0.6875rem;
  --lz-font-sm: 0.75rem;
  --lz-font-md: 0.8125rem;
  --lz-font-base: 0.875rem;
  --lz-font-lg: 1rem;
  --lz-font-xl: 1.25rem;
  --lz-font-2xl: 1.75rem;

  --lz-row: 26px;
  --lz-gap: 12px;
  --lz-ease: cubic-bezier(0.22, 0.8, 0.22, 1);
  --lz-fast: 140ms;
  --lz-normal: 240ms;

  color-scheme: light;
}

[data-theme="dark"] {
  --lz-accent: #6b74ff;
  --lz-accent-strong: #838bff;
  --lz-accent-soft: rgba(107, 116, 255, 0.16);
  --lz-accent-fg: #0a0b12;

  --lz-bg: #0a0b0f;
  --lz-surface: #101219;
  --lz-surface-2: #151824;
  --lz-surface-3: #1c2030;
  --lz-border: #232838;
  --lz-border-strong: #333a52;

  --lz-fg: #edf0f7;
  --lz-fg-muted: #9aa2b6;
  --lz-fg-subtle: #737b90;

  --lz-ok: #3ddc97;
  --lz-warn: #f0b357;
  --lz-error: #ff7b70;
  --lz-info: #74a9ff;

  --lz-add-bg: rgba(61, 220, 151, 0.10);
  --lz-add-fg: #6ff0b5;
  --lz-del-bg: rgba(255, 123, 112, 0.10);
  --lz-del-fg: #ffa79e;

  --lz-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
  --lz-shadow-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 16px 40px -20px rgba(0, 0, 0, 0.9);
  --lz-shadow-3: 0 30px 70px -30px rgba(0, 0, 0, 0.95), 0 2px 8px rgba(0, 0, 0, 0.6);

  color-scheme: dark;
}

[data-density="compact"] {
  --lz-row: 22px;
  --lz-gap: 9px;
}

/* ------------------------------------------------------------- reset ----- */
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: var(--lz-font);
  font-size: var(--lz-font-base);
  line-height: 1.55;
  color: var(--lz-fg);
  background: var(--lz-bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}

h1, h2, h3, h4, h5, h6 { margin: 0; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
svg { flex: none; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--lz-accent);
  outline-offset: 2px;
  border-radius: 6px;
}

::selection { background: var(--lz-accent-soft); }

.lz-sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--lz-border-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--lz-border-strong); border: 3px solid transparent; border-radius: 10px; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--lz-fg-subtle); background-clip: content-box; }

body.is-resizing { cursor: col-resize; user-select: none; }
body.is-resizing * { pointer-events: none; }

/* ------------------------------------------------------------ buttons ---- */
.lz-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  height: 32px;
  padding: 0 0.72rem;
  border-radius: var(--lz-radius-sm);
  border: 1px solid transparent;
  background: transparent;
  color: var(--lz-fg);
  font-size: var(--lz-font-md);
  font-weight: 520;
  white-space: nowrap;
  transition: background var(--lz-fast) var(--lz-ease), border-color var(--lz-fast) var(--lz-ease),
              transform var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
}
.lz-btn:hover:not(:disabled) { background: var(--lz-surface-2); }
.lz-btn:active:not(:disabled) { transform: translateY(0.5px) scale(0.995); }
.lz-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.lz-btn-primary { background: var(--lz-accent); color: var(--lz-accent-fg); border-color: transparent; }
.lz-btn-primary:hover:not(:disabled) { background: var(--lz-accent-strong); }
.lz-btn-danger { background: var(--lz-error); color: #fff; }
.lz-btn-danger:hover:not(:disabled) { filter: brightness(1.06); }
.lz-btn-sm { height: 26px; font-size: var(--lz-font-sm); padding: 0 0.55rem; gap: 0.35rem; }
.lz-btn-lg { height: 40px; font-size: var(--lz-font-base); padding: 0 1.05rem; border-radius: var(--lz-radius); }
.lz-btn.is-busy { opacity: 0.7; }
.lz-btn-icon { opacity: 0.85; }
.lz-btn-label { line-height: 1; }
.lz-btn-trailing { opacity: 0.7; }

.lz-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px; height: 30px;
  border-radius: var(--lz-radius-sm);
  color: var(--lz-fg-muted);
  transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease), transform var(--lz-fast) var(--lz-ease);
}
.lz-icon-btn:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-icon-btn:active { transform: scale(0.94); }
.lz-icon-btn.is-active { background: var(--lz-accent-soft); color: var(--lz-accent); }
.lz-icon-btn.is-sm { width: 24px; height: 24px; }
.lz-icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.lz-kbd {
  font-family: var(--lz-font);
  font-size: 10.5px;
  font-weight: 550;
  letter-spacing: 0.02em;
  color: var(--lz-fg-subtle);
  background: var(--lz-surface-2);
  border: 1px solid var(--lz-border);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 5px;
  white-space: nowrap;
}

/* ------------------------------------------------------------- inputs ---- */
.lz-input {
  width: 100%;
  height: 32px;
  padding: 0 0.6rem;
  border-radius: var(--lz-radius-sm);
  border: 1px solid var(--lz-border);
  background: var(--lz-bg);
  color: var(--lz-fg);
  font-size: var(--lz-font-md);
  transition: border-color var(--lz-fast) var(--lz-ease), box-shadow var(--lz-fast) var(--lz-ease);
}
.lz-input:hover { border-color: var(--lz-border-strong); }
.lz-input:focus { border-color: var(--lz-accent); box-shadow: 0 0 0 3px var(--lz-accent-soft); outline: none; }
.lz-input::placeholder { color: var(--lz-fg-subtle); }
.lz-select { appearance: none; padding-right: 1.6rem; background-image: linear-gradient(45deg, transparent 50%, var(--lz-fg-subtle) 50%), linear-gradient(135deg, var(--lz-fg-subtle) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

.lz-field { display: grid; gap: 5px; }
.lz-field-label { font-size: var(--lz-font-sm); font-weight: 550; color: var(--lz-fg-muted); }
.lz-field-hint { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); line-height: 1.5; }

.lz-switch { display: inline-flex; align-items: center; gap: 0.55rem; cursor: pointer; font-size: var(--lz-font-md); }
.lz-switch-input { position: absolute; opacity: 0; width: 0; height: 0; }
.lz-switch-track {
  position: relative; width: 34px; height: 19px; border-radius: 999px;
  background: var(--lz-surface-3); border: 1px solid var(--lz-border);
  transition: background var(--lz-fast) var(--lz-ease);
}
.lz-switch-thumb {
  position: absolute; top: 1.5px; left: 1.5px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--lz-bg); box-shadow: var(--lz-shadow-1);
  transition: transform var(--lz-normal) var(--lz-ease);
}
.lz-switch-input:checked + .lz-switch-track { background: var(--lz-accent); border-color: transparent; }
.lz-switch-input:checked + .lz-switch-track .lz-switch-thumb { transform: translateX(15px); background: #fff; }
.lz-switch-input:focus-visible + .lz-switch-track { outline: 2px solid var(--lz-accent); outline-offset: 2px; }

.lz-segmented {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--lz-surface-2); border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm);
}
.lz-segmented-item {
  display: inline-flex; align-items: center; gap: 0.35rem;
  height: 24px; padding: 0 0.55rem; border-radius: 5px;
  font-size: var(--lz-font-sm); color: var(--lz-fg-muted);
  transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
}
.lz-segmented-item:hover { color: var(--lz-fg); }
.lz-segmented-item.is-active { background: var(--lz-bg); color: var(--lz-fg); box-shadow: var(--lz-shadow-1); }

/* ------------------------------------------------------------ badges ----- */
.lz-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: var(--lz-font-xs); font-weight: 560;
  padding: 1px 6px; border-radius: 999px;
  background: var(--lz-surface-2); color: var(--lz-fg-muted); border: 1px solid var(--lz-border);
}
.lz-badge-ok { color: var(--lz-ok); border-color: color-mix(in srgb, var(--lz-ok) 35%, transparent); }

.lz-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--lz-font-xs); font-weight: 540;
  padding: 2px 7px; border-radius: 999px;
  background: var(--lz-surface-2); color: var(--lz-fg-muted);
  border: 1px solid var(--lz-border);
  white-space: nowrap;
  max-width: 100%;
}
.lz-chip > span { overflow: hidden; text-overflow: ellipsis; }
.lz-chip.is-clickable { cursor: pointer; transition: border-color var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease); }
.lz-chip.is-clickable:hover { color: var(--lz-fg); border-color: var(--lz-border-strong); }
.lz-chip-ok { color: var(--lz-ok); border-color: color-mix(in srgb, var(--lz-ok) 30%, transparent); background: color-mix(in srgb, var(--lz-ok) 8%, transparent); }
.lz-chip-warn { color: var(--lz-warn); border-color: color-mix(in srgb, var(--lz-warn) 34%, transparent); background: color-mix(in srgb, var(--lz-warn) 10%, transparent); }
.lz-chip-error { color: var(--lz-error); border-color: color-mix(in srgb, var(--lz-error) 34%, transparent); background: color-mix(in srgb, var(--lz-error) 9%, transparent); }
.lz-chip-info { color: var(--lz-info); border-color: color-mix(in srgb, var(--lz-info) 30%, transparent); background: color-mix(in srgb, var(--lz-info) 8%, transparent); }
.lz-chip-muted { opacity: 0.92; }

.lz-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lz-fg-subtle); flex: none; }
.lz-status-dot.is-busy { background: var(--lz-accent); animation: lz-pulse 1.6s var(--lz-ease) infinite; }
.lz-status-dot.is-ok { background: var(--lz-ok); }
.lz-status-dot.is-error { background: var(--lz-error); }
.lz-status-dot.is-idle { background: var(--lz-fg-subtle); }

@keyframes lz-pulse {
  0% { box-shadow: 0 0 0 0 var(--lz-accent-soft); }
  70% { box-shadow: 0 0 0 6px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.lz-spinner { display: inline-flex; align-items: center; justify-content: center; color: var(--lz-accent); animation: lz-spin 0.9s linear infinite; }
@keyframes lz-spin { to { transform: rotate(360deg); } }

.lz-progress { width: 100%; height: 4px; border-radius: 999px; background: var(--lz-surface-3); overflow: hidden; }
.lz-progress-fill { height: 100%; background: var(--lz-accent); transition: width var(--lz-normal) var(--lz-ease); }

/* ------------------------------------------------------------ tooltips --- */
.lz-tooltip {
  position: fixed; z-index: 9000; max-width: 280px;
  padding: 5px 8px; border-radius: 6px;
  background: var(--lz-fg); color: var(--lz-bg);
  font-size: var(--lz-font-xs); font-weight: 500; line-height: 1.4;
  opacity: 0; transform: translateY(-2px);
  transition: opacity var(--lz-fast) var(--lz-ease), transform var(--lz-fast) var(--lz-ease);
  pointer-events: none;
}
.lz-tooltip.is-visible { opacity: 1; transform: none; }

/* ----------------------------------------------------------- popovers ---- */
.lz-popover {
  position: fixed; z-index: 8000; min-width: 200px; padding: 5px;
  background: var(--lz-surface); border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius); box-shadow: var(--lz-shadow-3);
  animation: lz-pop var(--lz-fast) var(--lz-ease);
}
@keyframes lz-pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }
.lz-popover-item {
  display: flex; align-items: center; gap: 0.5rem;
  width: 100%; padding: 6px 8px; border-radius: var(--lz-radius-sm);
  font-size: var(--lz-font-md); color: var(--lz-fg); text-align: left;
  transition: background var(--lz-fast) var(--lz-ease);
}
.lz-popover-item:hover { background: var(--lz-surface-2); }
.lz-popover-item:disabled { opacity: 0.4; cursor: not-allowed; }
.lz-popover-item.is-danger { color: var(--lz-error); }
.lz-popover-item.is-active { color: var(--lz-accent); }
.lz-popover-label { flex: 1; }
.lz-popover-detail { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }
.lz-popover-check { margin-left: auto; }
.lz-popover-sep { height: 1px; margin: 4px 2px; background: var(--lz-border); }
.lz-popover-heading { padding: 6px 8px 3px; font-size: var(--lz-font-xs); text-transform: uppercase; letter-spacing: 0.07em; color: var(--lz-fg-subtle); }

/* ------------------------------------------------------------- modals ---- */
.lz-modal-backdrop {
  position: fixed; inset: 0; z-index: 7000;
  display: grid; place-items: center;
  padding: 5vh 1rem;
  background: color-mix(in srgb, var(--lz-bg) 55%, rgba(8, 9, 13, 0.55));
  backdrop-filter: blur(6px);
  opacity: 0; transition: opacity var(--lz-normal) var(--lz-ease);
  overflow: auto;
}
.lz-modal-backdrop.is-open { opacity: 1; }
.lz-modal {
  width: 100%; max-width: 560px;
  background: var(--lz-surface);
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius-xl);
  box-shadow: var(--lz-shadow-3);
  display: flex; flex-direction: column;
  max-height: 86vh;
  transform: translateY(8px) scale(0.985);
  opacity: 0;
  transition: transform var(--lz-normal) var(--lz-ease), opacity var(--lz-normal) var(--lz-ease);
}
.lz-modal.is-open { transform: none; opacity: 1; }
.lz-modal.is-sm { max-width: 440px; }
.lz-modal.is-md { max-width: 620px; }
.lz-modal.is-lg { max-width: 880px; }
.lz-modal-head {
  display: flex; align-items: flex-start; gap: 0.75rem;
  padding: 1rem 1rem 0.85rem 1.15rem;
  border-bottom: 1px solid var(--lz-border);
}
.lz-modal-title { font-size: var(--lz-font-lg); font-weight: 600; }
.lz-modal-subtitle { font-size: var(--lz-font-sm); color: var(--lz-fg-muted); margin-top: 3px; }
.lz-modal-head .lz-icon-btn { margin-left: auto; }
.lz-modal-body { padding: 1.1rem 1.15rem; overflow: auto; }
.lz-modal-foot {
  display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem;
  padding: 0.85rem 1.15rem; border-top: 1px solid var(--lz-border);
  background: color-mix(in srgb, var(--lz-surface-2) 45%, transparent);
  border-radius: 0 0 var(--lz-radius-xl) var(--lz-radius-xl);
}
.lz-confirm-message { font-size: var(--lz-font-base); }
.lz-confirm-detail { margin-top: 0.5rem; font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }

/* ------------------------------------------------------------- toasts ---- */
.lz-toasts {
  position: fixed; right: 14px; bottom: 14px; z-index: 8500;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  pointer-events: none;
}
.lz-toast {
  pointer-events: auto;
  display: flex; align-items: flex-start; gap: 0.6rem;
  width: min(380px, calc(100vw - 28px));
  padding: 0.7rem 0.75rem;
  background: var(--lz-surface);
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius);
  box-shadow: var(--lz-shadow-3);
  opacity: 0; transform: translateY(8px) scale(0.98);
  transition: opacity var(--lz-normal) var(--lz-ease), transform var(--lz-normal) var(--lz-ease);
}
.lz-toast.is-visible { opacity: 1; transform: none; }
.lz-toast-icon { margin-top: 1px; color: var(--lz-info); }
.lz-toast.is-success .lz-toast-icon { color: var(--lz-ok); }
.lz-toast.is-warning .lz-toast-icon { color: var(--lz-warn); }
.lz-toast.is-error .lz-toast-icon { color: var(--lz-error); }
.lz-toast-body { flex: 1; min-width: 0; }
.lz-toast-title { font-size: var(--lz-font-md); font-weight: 560; }
.lz-toast-message { font-size: var(--lz-font-sm); color: var(--lz-fg-muted); margin-top: 2px; word-break: break-word; }
.lz-toast-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }

/* -------------------------------------------------------- empty states --- */
.lz-empty {
  display: grid; justify-items: center; gap: 0.5rem;
  padding: 2.2rem 1.2rem; text-align: center;
}
.lz-empty-icon {
  display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
  background: var(--lz-surface-2); color: var(--lz-fg-muted); border: 1px solid var(--lz-border);
  margin-bottom: 0.2rem;
}
.lz-empty-title { font-size: var(--lz-font-base); font-weight: 580; }
.lz-empty-message { font-size: var(--lz-font-sm); color: var(--lz-fg-muted); max-width: 34ch; line-height: 1.55; }
.lz-empty-action { margin-top: 0.6rem; }

/* -------------------------------------------------------------- brand ---- */
.lz-brand { display: inline-flex; align-items: center; gap: 0.5rem; }
.lz-brand-mark {
  display: grid; place-items: center;
  width: 28px; height: 28px; border-radius: 9px;
  background: linear-gradient(140deg, var(--lz-accent), color-mix(in srgb, var(--lz-accent) 60%, #8fe3ff));
  color: #fff;
  box-shadow: 0 6px 18px -10px var(--lz-accent);
  transition: transform var(--lz-normal) var(--lz-ease);
}
.lz-brand:hover .lz-brand-mark { transform: rotate(-4deg) scale(1.04); }
.lz-brand.is-small .lz-brand-mark { width: 24px; height: 24px; border-radius: 7px; }
.lz-brand-name { font-size: 0.95rem; font-weight: 620; letter-spacing: -0.01em; }

/* ------------------------------------------------------------- motion ---- */
.lz-reveal { opacity: 0; transform: translateY(12px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- highlight.css ---------- */
/* ============================================================================
 * Luzzes — highlight.css
 * Syntax colours, Markdown output and the diff presentation.
 * ==========================================================================*/

:root {
  --lz-t-com: #6d7686;
  --lz-t-str: #0d7a52;
  --lz-t-num: #6d3fc4;
  --lz-t-kw: #b3286f;
  --lz-t-fn: #1857c4;
  --lz-t-cls: #a15c00;
  --lz-t-var: #23262f;
  --lz-t-prop: #22557f;
  --lz-t-attr: #7a4bd6;
  --lz-t-tag: #c2410c;
  --lz-t-sel: #b3286f;
  --lz-t-at: #7a4bd6;
  --lz-t-key: #1857c4;
  --lz-t-const: #6d3fc4;
  --lz-t-punct: #7c8492;
  --lz-t-regex: #0d7a52;
  --lz-t-custom: #7a4bd6;
  --lz-t-strong: #14161c;
}

[data-theme="dark"] {
  --lz-t-com: #6f7889;
  --lz-t-str: #8fd9a8;
  --lz-t-num: #d9a9ff;
  --lz-t-kw: #ff8fc4;
  --lz-t-fn: #8fb8ff;
  --lz-t-cls: #ffcf8f;
  --lz-t-var: #dfe4ee;
  --lz-t-prop: #9fd4ff;
  --lz-t-attr: #d9b8ff;
  --lz-t-tag: #ff9a76;
  --lz-t-sel: #ff8fc4;
  --lz-t-at: #d9b8ff;
  --lz-t-key: #8fb8ff;
  --lz-t-const: #d9a9ff;
  --lz-t-punct: #8791a3;
  --lz-t-regex: #8fd9a8;
  --lz-t-custom: #d9b8ff;
  --lz-t-strong: #f2f5fa;
}

.t-com { color: var(--lz-t-com); font-style: italic; }
.t-str { color: var(--lz-t-str); }
.t-num { color: var(--lz-t-num); }
.t-kw { color: var(--lz-t-kw); }
.t-fn { color: var(--lz-t-fn); }
.t-cls { color: var(--lz-t-cls); }
.t-var { color: var(--lz-t-var); }
.t-prop { color: var(--lz-t-prop); }
.t-attr { color: var(--lz-t-attr); }
.t-tag { color: var(--lz-t-tag); }
.t-sel { color: var(--lz-t-sel); }
.t-at { color: var(--lz-t-at); }
.t-key { color: var(--lz-t-key); }
.t-const { color: var(--lz-t-const); }
.t-punct { color: var(--lz-t-punct); }
.t-regex { color: var(--lz-t-regex); }
.t-custom { color: var(--lz-t-custom); }
.t-strong { color: var(--lz-t-strong); font-weight: 620; }
.t-em { font-style: italic; }
.t-del { text-decoration: line-through; opacity: 0.75; }
.t-link { color: var(--lz-accent); text-decoration: underline; }

/* ---------------------------------------------------------- markdown ----- */
.lz-md, .lz-msg-content { font-size: var(--lz-font-base); line-height: 1.65; color: var(--lz-fg); }
.lz-msg-content > * + * { margin-top: 0.7rem; }
.md-p { line-height: 1.68; }
.md-h { font-weight: 600; letter-spacing: -0.01em; margin-top: 1.1rem; }
.md-h1 { font-size: 1.1rem; }
.md-h2 { font-size: 1rem; }
.md-h3 { font-size: 0.9375rem; }
.md-h4, .md-h5, .md-h6 { font-size: var(--lz-font-base); color: var(--lz-fg-muted); }
.md-hr { border: 0; border-top: 1px solid var(--lz-border); margin: 1rem 0; }
.md-list { padding-left: 1.15rem; display: grid; gap: 0.3rem; }
.md-list.md-list-ordered { list-style: decimal; }
.md-li { line-height: 1.6; }
.md-li-task { display: flex; gap: 0.45rem; align-items: flex-start; }
.md-task {
  display: inline-grid; place-items: center; flex: none;
  width: 14px; height: 14px; margin-top: 4px;
  border: 1.5px solid var(--lz-border-strong); border-radius: 4px;
  color: transparent;
}
.md-task.is-done { background: var(--lz-accent); border-color: var(--lz-accent); color: #fff; }
.md-quote {
  margin: 0; padding: 0.15rem 0 0.15rem 0.85rem;
  border-left: 2px solid var(--lz-border-strong);
  color: var(--lz-fg-muted);
}
.md-inline-code {
  font-family: var(--lz-mono);
  font-size: 0.85em;
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--lz-surface-2);
  border: 1px solid var(--lz-border);
  white-space: nowrap;
}
.md-link { color: var(--lz-accent); text-decoration: underline; text-underline-offset: 2px; }
.md-table-wrap { overflow-x: auto; border: 1px solid var(--lz-border); border-radius: var(--lz-radius); }
.md-table { border-collapse: collapse; width: 100%; font-size: var(--lz-font-sm); }
.md-table th, .md-table td { padding: 6px 10px; border-bottom: 1px solid var(--lz-border); text-align: left; }
.md-table th { background: var(--lz-surface-2); font-weight: 580; }

.md-code {
  margin: 0.35rem 0 0;
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius);
  overflow: hidden;
  background: var(--lz-bg);
}
.md-code-head {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 5px 8px 5px 10px;
  background: var(--lz-surface-2);
  border-bottom: 1px solid var(--lz-border);
}
.md-code-lang {
  font-family: var(--lz-mono); font-size: var(--lz-font-xs);
  color: var(--lz-fg-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.md-code-actions { display: flex; gap: 4px; margin-left: auto; }
.md-code-btn {
  font-size: var(--lz-font-xs); font-weight: 550;
  color: var(--lz-fg-muted);
  padding: 2px 7px; border-radius: 5px;
  border: 1px solid transparent;
  transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
}
.md-code-btn:hover { background: var(--lz-surface-3); color: var(--lz-fg); }
.md-code-btn.is-ok { color: var(--lz-ok); }
.md-code-btn.is-error { color: var(--lz-error); }
.md-pre {
  margin: 0; padding: 0.7rem 0.85rem;
  overflow: auto; max-height: 460px;
}
.md-code-body {
  font-family: var(--lz-mono);
  font-size: var(--lz-font-sm);
  line-height: 1.62;
  white-space: pre;
  color: var(--lz-fg);
  tab-size: 2;
}

/* -------------------------------------------------------------- diff ----- */
.lz-diff-body { border-top: 1px solid var(--lz-border); background: var(--lz-bg); max-height: 420px; overflow: auto; }
.lz-diff-hunk { border-bottom: 1px solid var(--lz-border); }
.lz-diff-hunk-head {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 3px 10px;
  background: color-mix(in srgb, var(--lz-surface-2) 70%, transparent);
  font-family: var(--lz-mono); font-size: var(--lz-font-xs);
  color: var(--lz-fg-subtle);
}
.lz-diff-hunk-count { margin-left: auto; font-weight: 600; }
.lz-diff-hunk-count.lz-added { color: var(--lz-add-fg); }
.lz-diff-hunk-count.lz-removed { color: var(--lz-del-fg); }
.lz-diff-line {
  display: flex; align-items: flex-start;
  font-family: var(--lz-mono);
  font-size: var(--lz-font-sm);
  line-height: 1.6;
  white-space: pre;
  min-height: 20px;
}
.lz-diff-gutter { width: 20px; flex: none; text-align: center; opacity: 0.65; user-select: none; }
.lz-diff-text { flex: 1; padding-right: 12px; }
.lz-diff-added { background: var(--lz-add-bg); color: var(--lz-add-fg); }
.lz-diff-removed { background: var(--lz-del-bg); color: var(--lz-del-fg); }
.lz-diff-unchanged { color: var(--lz-fg-muted); }
.lz-diff-unchanged .lz-diff-text { padding-left: 20px; }
.lz-diff-skip {
  display: flex; justify-content: center;
  padding: 3px; font-size: var(--lz-font-xs);
  color: var(--lz-fg-subtle);
  background: var(--lz-surface-2);
  border-bottom: 1px solid var(--lz-border);
}
.lz-diff-blank::after { content: " "; }

.lz-split-row { display: grid; grid-template-columns: 34px 1fr 34px 1fr; font-family: var(--lz-mono); font-size: var(--lz-font-sm); white-space: pre; }
.lz-split-n { color: var(--lz-fg-subtle); text-align: right; padding-right: 6px; user-select: none; background: var(--lz-surface-2); }
.lz-split-code { padding: 0 8px; overflow: hidden; }
.lz-split-del .lz-split-code { background: var(--lz-del-bg); }
.lz-split-add .lz-split-code { background: var(--lz-add-bg); }
.lz-split-empty { background: var(--lz-surface-2); }
.lz-split-skip { grid-column: 1 / -1; text-align: center; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); background: var(--lz-surface-2); }

/* ------------------------------------------------------------- editor ---- */
.lz-code-content .t-com { font-style: italic; }

/* ---------- landing.css ---------- */
/* ============================================================================
 * Luzzes — landing.css
 * ==========================================================================*/

.lz-landing {
  position: relative;
  min-height: 100%;
  overflow-x: clip;
}
.lz-landing.is-entering { opacity: 0; }

.lz-land-wrap { width: min(1080px, calc(100% - 3rem)); margin: 0 auto; }
.lz-land-wrap-wide { width: min(1240px, calc(100% - 2rem)); margin: 0 auto; }

/* ------------------------------------------------------------- nav ------- */
.lz-land-nav {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 1.6rem;
  padding: 0.7rem max(1.5rem, calc((100vw - 1240px) / 2));
  background: color-mix(in srgb, var(--lz-bg) 72%, transparent);
  backdrop-filter: blur(16px) saturate(140%);
  border-bottom: 1px solid transparent;
  transition: border-color var(--lz-normal) var(--lz-ease), background var(--lz-normal) var(--lz-ease);
}
.lz-land-nav.is-scrolled { border-bottom-color: var(--lz-border); }
.lz-land-nav-links { display: flex; gap: 1.35rem; font-size: var(--lz-font-base); color: var(--lz-fg-muted); }
.lz-land-nav-links a { position: relative; padding: 2px 0; transition: color var(--lz-fast) var(--lz-ease); }
.lz-land-nav-links a::after {
  content: ""; position: absolute; left: 0; right: 100%; bottom: -2px; height: 1.5px;
  background: var(--lz-accent); transition: right var(--lz-normal) var(--lz-ease);
}
.lz-land-nav-links a:hover { color: var(--lz-fg); }
.lz-land-nav-links a:hover::after { right: 0; }
.lz-land-nav-actions { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }

/* ------------------------------------------------------------ hero ------- */
.lz-land-hero { position: relative; padding: clamp(3.5rem, 11vh, 7.5rem) 0 clamp(2rem, 5vh, 3rem); isolation: isolate; }
.lz-land-hero-bg { position: absolute; inset: -30% -10% auto -10%; height: 130%; z-index: -1; overflow: hidden; pointer-events: none; }
.lz-land-hero-bg span { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; }
.lz-land-hero-bg span:nth-child(1) {
  width: 46vw; height: 40vw; top: 4%; left: 2%;
  background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--lz-accent) 55%, transparent), transparent 68%);
  animation: lz-drift-a 32s var(--lz-ease) infinite alternate;
}
.lz-land-hero-bg span:nth-child(2) {
  width: 34vw; height: 32vw; top: -4%; right: 4%;
  background: radial-gradient(circle at 60% 40%, rgba(126, 231, 255, 0.30), transparent 66%);
  animation: lz-drift-b 38s var(--lz-ease) infinite alternate;
}
.lz-land-hero-bg span:nth-child(3) {
  width: 30vw; height: 30vw; bottom: -12%; left: 38%;
  background: radial-gradient(circle at 50% 50%, rgba(170, 130, 255, 0.24), transparent 70%);
  animation: lz-drift-c 44s var(--lz-ease) infinite alternate;
}
[data-theme="light"] .lz-land-hero-bg span { opacity: 0.34; }

@keyframes lz-drift-a { to { transform: translate3d(5vw, 3vh, 0) scale(1.1); } }
@keyframes lz-drift-b { to { transform: translate3d(-6vw, 5vh, 0) scale(1.06); } }
@keyframes lz-drift-c { to { transform: translate3d(3vw, -4vh, 0) scale(1.12); } }

.lz-land-hero .lz-land-wrap { display: grid; justify-items: center; text-align: center; gap: 1.15rem; }
.lz-land-hero-badge {
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-size: var(--lz-font-sm); letter-spacing: 0.02em; color: var(--lz-fg-muted);
  padding: 0.35rem 0.8rem; border-radius: 999px;
  border: 1px solid var(--lz-border);
  background: color-mix(in srgb, var(--lz-surface) 80%, transparent);
}
.lz-land-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--lz-accent); animation: lz-pulse 2.4s var(--lz-ease) infinite; }
.lz-land-hero-title {
  font-size: clamp(2.5rem, 6.6vw, 4.4rem);
  font-weight: 660;
  letter-spacing: -0.03em;
  line-height: 1.04;
  margin: 0.35rem 0 0;
}
.lz-land-grad {
  background: linear-gradient(100deg, var(--lz-accent) 0%, #a89bff 45%, #7ee7ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.lz-land-hero-sub { max-width: 60ch; font-size: clamp(1rem, 1.6vw, 1.125rem); color: var(--lz-fg-muted); }
.lz-land-hero-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-top: 0.5rem; }
.lz-land-trust { display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; justify-content: center; margin-top: 1.4rem; font-size: var(--lz-font-sm); color: var(--lz-fg-subtle); list-style: none; }
.lz-land-trust li { display: inline-flex; align-items: center; gap: 0.4rem; }
.lz-land-trust li::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--lz-border-strong); }

/* --------------------------------------------------------- preview ------- */
.lz-land-preview { padding: 1rem 0 clamp(2.5rem, 6vh, 4rem); }
.lz-pv {
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius-xl);
  background: var(--lz-surface);
  box-shadow: var(--lz-shadow-3);
  overflow: hidden;
  font-size: var(--lz-font-sm);
}
.lz-pv-chrome {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.5rem 0.65rem;
  background: var(--lz-surface-2);
  border-bottom: 1px solid var(--lz-border);
}
.lz-pv-dots { display: flex; gap: 5px; padding-left: 4px; }
.lz-pv-dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--lz-border-strong); opacity: 0.7; }
.lz-pv-address {
  display: inline-flex; align-items: center; gap: 0.4rem;
  flex: 1; max-width: 320px;
  height: 24px; padding: 0 0.6rem;
  border-radius: 999px;
  background: var(--lz-bg);
  border: 1px solid var(--lz-border);
  color: var(--lz-fg-subtle);
  font-size: var(--lz-font-xs);
}
.lz-pv-chrome-actions { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }

.lz-pv-body { display: grid; grid-template-columns: 210px minmax(0, 1fr) 300px; min-height: 380px; }
.lz-pv-tree-pane { border-right: 1px solid var(--lz-border); background: var(--lz-surface); padding: 0.5rem 0 0.75rem; }
.lz-pv-pane-head {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 0 0.75rem 0.5rem;
  font-size: var(--lz-font-xs); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--lz-fg-muted);
}
.lz-pv-tree { list-style: none; }
.lz-pv-tree-row {
  display: flex; align-items: center; gap: 0.4rem;
  width: 100%; height: 24px; padding-right: 8px;
  font-size: var(--lz-font-sm); color: var(--lz-fg-muted);
  border-radius: 6px; text-align: left;
  transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
}
.lz-pv-tree-row:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-pv-tree-row.is-active { background: var(--lz-accent-soft); color: var(--lz-accent); font-weight: 540; }
.lz-pv-tree-row.is-folder { color: var(--lz-fg-muted); }
.lz-pv-tree-row span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.lz-pv-editor-pane { display: flex; flex-direction: column; min-width: 0; background: var(--lz-bg); }
.lz-pv-tabs { display: flex; gap: 1px; padding: 0 0.4rem; background: var(--lz-surface); border-bottom: 1px solid var(--lz-border); }
.lz-pv-tab {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.45rem 0.6rem;
  font-size: var(--lz-font-xs); color: var(--lz-fg-subtle);
  border-bottom: 1.5px solid transparent;
}
.lz-pv-tab.is-active { color: var(--lz-fg); border-bottom-color: var(--lz-accent); }
.lz-pv-tab-dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0.5; }
.lz-pv-code-scroll { flex: 1; overflow: auto; max-height: 400px; }
.lz-pv-code { margin: 0; padding: 0.5rem 0 1rem; font-family: var(--lz-mono); font-size: 11.5px; line-height: 1.72; }
.lz-pv-line { display: flex; min-height: 20px; }
.lz-pv-line.is-highlight { background: color-mix(in srgb, var(--lz-accent) 5%, transparent); }
.lz-pv-gutter { width: 40px; flex: none; text-align: right; padding-right: 10px; color: var(--lz-fg-subtle); opacity: 0.6; user-select: none; }
.lz-pv-text { flex: 1; white-space: pre; padding-right: 12px; color: var(--lz-fg); }
.lz-pv-status {
  display: flex; gap: 0.9rem; align-items: center;
  padding: 0.25rem 0.75rem;
  border-top: 1px solid var(--lz-border);
  background: var(--lz-surface);
  font-size: var(--lz-font-xs); color: var(--lz-fg-subtle);
}

.lz-pv-ai-pane { border-left: 1px solid var(--lz-border); background: var(--lz-surface); padding: 0.5rem 0.6rem 0.75rem; display: grid; gap: 0.6rem; align-content: start; }
.lz-pv-spark { color: var(--lz-accent); }
.lz-pv-msg { font-size: var(--lz-font-sm); }
.lz-pv-msg.is-user {
  padding: 0.5rem 0.65rem; border-radius: var(--lz-radius);
  background: var(--lz-surface-2); border: 1px solid var(--lz-border);
  color: var(--lz-fg-muted);
}
.lz-pv-activity { list-style: none; display: grid; gap: 3px; }
.lz-pv-activity-item {
  display: flex; align-items: center; gap: 0.45rem;
  font-size: var(--lz-font-xs); color: var(--lz-fg-subtle);
  opacity: 0; transform: translateY(3px);
  transition: opacity var(--lz-normal) var(--lz-ease), transform var(--lz-normal) var(--lz-ease);
}
.lz-pv-activity-item.is-visible { opacity: 1; transform: none; }
.lz-pv-activity-dot { display: inline-flex; color: var(--lz-ok); }
.lz-pv-activity-label { color: var(--lz-fg); }
.lz-pv-activity-detail { margin-left: auto; font-family: var(--lz-mono); font-size: 10px; opacity: 0.85; }
.lz-pv-reply {
  padding: 0.55rem 0.65rem; border-radius: var(--lz-radius);
  background: var(--lz-accent-soft); border: 1px solid color-mix(in srgb, var(--lz-accent) 26%, transparent);
  color: var(--lz-fg); font-size: var(--lz-font-sm); line-height: 1.55;
  opacity: 0; transform: translateY(4px);
  transition: opacity var(--lz-normal) var(--lz-ease), transform var(--lz-normal) var(--lz-ease);
}
.lz-pv-reply.is-visible { opacity: 1; transform: none; }
.lz-pv-composer {
  margin-top: auto; display: flex; align-items: center; gap: 0.5rem;
  padding: 0.4rem 0.5rem 0.4rem 0.65rem;
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius);
  background: var(--lz-bg);
  color: var(--lz-fg-subtle); font-size: var(--lz-font-xs);
}
.lz-pv-composer-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-pv-composer-send { color: var(--lz-accent); }

.lz-pv-terminal-bar { border-top: 1px solid var(--lz-border); background: var(--lz-bg); padding: 0.5rem 0.75rem 0.65rem; }
.lz-pv-terminal-head { display: flex; align-items: center; gap: 0.45rem; font-size: var(--lz-font-xs); color: var(--lz-fg-muted); }
.lz-pv-term-note { margin-left: auto; color: var(--lz-fg-subtle); font-size: 10.5px; }
.lz-pv-terminal { margin-top: 0.4rem; display: grid; gap: 2px; font-family: var(--lz-mono); font-size: 11px; }
.lz-pv-term-line { opacity: 0; transform: translateX(-3px); transition: opacity var(--lz-normal) var(--lz-ease), transform var(--lz-normal) var(--lz-ease); }
.lz-pv-term-line.is-visible { opacity: 1; transform: none; }
.lz-pv-term-line.is-dim { color: var(--lz-fg-subtle); }
.lz-pv-term-line.is-ok { color: var(--lz-ok); }

/* ---------------------------------------------------------- sections ----- */
.lz-land-section { padding: clamp(3rem, 8vh, 5.5rem) 0; }
.lz-land-section.is-quiet { background: var(--lz-surface); }
.lz-land-eyebrow {
  font-size: var(--lz-font-sm); font-weight: 560; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--lz-accent); margin-bottom: 0.6rem;
}
.lz-land-title { font-size: clamp(1.6rem, 3.6vw, 2.4rem); font-weight: 650; letter-spacing: -0.025em; max-width: 26ch; }
.lz-land-lead { margin-top: 0.85rem; max-width: 68ch; font-size: 1.03rem; color: var(--lz-fg-muted); line-height: 1.65; }
.lz-land-section-action { margin-top: 1.5rem; }
.lz-land-fineprint { font-size: var(--lz-font-sm); color: var(--lz-fg-subtle); max-width: 76ch; line-height: 1.6; }

.lz-land-split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 2rem; margin-top: 2rem; align-items: start; }
.lz-land-split.is-reverse { grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); }
.lz-land-points { display: grid; gap: 1.25rem; }
.lz-land-bullet { display: grid; gap: 0.3rem; }
.lz-land-bullet-icon {
  display: grid; place-items: center; width: 32px; height: 32px;
  border-radius: 10px; margin-bottom: 0.35rem;
  background: var(--lz-accent-soft); color: var(--lz-accent);
  border: 1px solid color-mix(in srgb, var(--lz-accent) 20%, transparent);
}
.lz-land-bullet h3 { font-size: 0.95rem; }
.lz-land-bullet p { font-size: var(--lz-font-base); color: var(--lz-fg-muted); line-height: 1.6; }

.lz-land-convo { display: grid; gap: 0.75rem; }
.lz-land-bubble { padding: 0.8rem 0.9rem; border-radius: var(--lz-radius-lg); font-size: var(--lz-font-base); }
.lz-land-bubble.is-user {
  background: var(--lz-surface); border: 1px solid var(--lz-border);
  color: var(--lz-fg-muted); max-width: 46ch;
}
.lz-land-bubble.is-ai {
  background: color-mix(in srgb, var(--lz-surface) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--lz-accent) 24%, var(--lz-border));
  border-left: 2px solid var(--lz-accent);
}
.lz-land-bubble.is-ai p { line-height: 1.65; }
.lz-land-tools { display: grid; gap: 3px; margin-top: 0.75rem; }
.lz-land-tool { display: flex; align-items: center; gap: 0.45rem; font-size: var(--lz-font-xs); color: var(--lz-fg-muted); }
.lz-land-tool svg { color: var(--lz-ok); }
.lz-land-tool.is-live svg { color: var(--lz-accent); }

.lz-land-diff { border: 1px solid var(--lz-border); border-radius: var(--lz-radius); overflow: hidden; background: var(--lz-bg); }
.lz-land-diff-head {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 6px 10px; background: var(--lz-surface-2); border-bottom: 1px solid var(--lz-border);
  font-size: var(--lz-font-xs); color: var(--lz-fg-muted);
}
.lz-land-diff-file { font-family: var(--lz-mono); }
.lz-land-diff-stat { margin-left: auto; font-family: var(--lz-mono); color: var(--lz-fg-subtle); }
.lz-land-diff-body { padding: 0.5rem 0; font-family: var(--lz-mono); font-size: 11.5px; line-height: 1.72; }
.lz-land-code-line { padding: 0 12px; white-space: pre; color: var(--lz-fg); }
.lz-land-code-line.is-ctx { color: var(--lz-fg-muted); }
.lz-land-code-line.is-add { background: var(--lz-add-bg); color: var(--lz-add-fg); }
.lz-land-code-line.is-del { background: var(--lz-del-bg); color: var(--lz-del-fg); }
.lz-land-k { color: var(--lz-t-kw); }
.lz-land-f { color: var(--lz-t-fn); }
.lz-land-t { color: var(--lz-t-tag); }
.lz-land-a { color: var(--lz-t-attr); }
.lz-land-n { color: var(--lz-t-num); }

.lz-land-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-top: 2rem; }
.lz-land-card {
  padding: 1.15rem;
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius-lg);
  background: var(--lz-surface);
  transition: transform var(--lz-normal) var(--lz-ease), border-color var(--lz-normal) var(--lz-ease);
}
.lz-land-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--lz-accent) 40%, var(--lz-border)); }
.lz-land-card.is-quiet { background: var(--lz-bg); }
.lz-land-card-icon {
  display: grid; place-items: center; width: 34px; height: 34px; margin-bottom: 0.7rem;
  border-radius: 10px; background: var(--lz-surface-2); color: var(--lz-fg-muted); border: 1px solid var(--lz-border);
}
.lz-land-card h3 { font-size: 0.95rem; margin-bottom: 0.4rem; }
.lz-land-card p { font-size: var(--lz-font-base); color: var(--lz-fg-muted); line-height: 1.6; }
.lz-land-list { list-style: none; margin-top: 0.8rem; display: grid; gap: 0.35rem; font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }
.lz-land-list li { display: flex; gap: 0.45rem; align-items: flex-start; }
.lz-land-list li::before { content: ""; width: 4px; height: 4px; margin-top: 8px; border-radius: 50%; background: var(--lz-accent); flex: none; }

.lz-land-steps { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-top: 2rem; }
.lz-land-step { display: grid; gap: 0.5rem; padding-top: 0.9rem; border-top: 1px solid var(--lz-border); }
.lz-land-step-index { font-family: var(--lz-mono); font-size: var(--lz-font-xs); color: var(--lz-accent); }
.lz-land-step h3 { font-size: 0.9375rem; margin-bottom: 0.3rem; }
.lz-land-step p { font-size: var(--lz-font-base); color: var(--lz-fg-muted); line-height: 1.6; }

.lz-land-problems { border: 1px solid var(--lz-border); border-radius: var(--lz-radius-lg); background: var(--lz-surface); overflow: hidden; }
.lz-land-problems-head {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--lz-border);
  font-size: var(--lz-font-sm); font-weight: 560;
}
.lz-land-problems-head .is-error { color: var(--lz-error); }
.lz-land-problem {
  display: flex; align-items: center; gap: 0.6rem;
  padding: 0.5rem 0.8rem; border-bottom: 1px solid var(--lz-border);
  font-size: var(--lz-font-sm);
}
.lz-land-problem-loc { font-family: var(--lz-mono); font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); flex: none; }
.lz-land-problem-msg { color: var(--lz-fg-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-land-problem.is-error { border-left: 2px solid var(--lz-error); }
.lz-land-problem.is-warning { border-left: 2px solid var(--lz-warn); }
.lz-land-problems-note { padding: 0.6rem 0.8rem; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }

.lz-land-nosignup, .lz-land-final {
  padding: clamp(3.5rem, 10vh, 6rem) 0;
  text-align: center;
  border-top: 1px solid var(--lz-border);
}
.lz-land-nosignup .lz-land-wrap, .lz-land-final .lz-land-wrap { display: grid; justify-items: center; gap: 0.9rem; }
.lz-land-nosignup-title { font-size: clamp(1.8rem, 4.2vw, 2.8rem); font-weight: 660; letter-spacing: -0.03em; }
.lz-land-nosignup .lz-land-lead, .lz-land-final p { text-align: center; }
.lz-land-cta-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-top: 0.4rem; }
.lz-land-final { background: var(--lz-surface); }
.lz-land-final h2 { font-size: clamp(1.8rem, 4.2vw, 2.7rem); font-weight: 660; letter-spacing: -0.03em; }

/* ------------------------------------------------------------ footer ----- */
.lz-land-footer { padding: 3rem 0 3.5rem; border-top: 1px solid var(--lz-border); background: var(--lz-bg); }
.lz-land-footer-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 2rem; }
.lz-land-footer-brand { display: grid; gap: 0.4rem; justify-items: start; }
.lz-land-footer-brand p { font-size: var(--lz-font-base); color: var(--lz-fg-muted); }
.lz-land-footer-meta { font-size: var(--lz-font-xs) !important; color: var(--lz-fg-subtle) !important; }
.lz-land-footer-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem; }
.lz-land-footer h4 { font-size: var(--lz-font-sm); text-transform: uppercase; letter-spacing: 0.08em; color: var(--lz-fg-subtle); margin-bottom: 0.6rem; }
.lz-land-footer ul { list-style: none; display: grid; gap: 0.4rem; }
.lz-land-footer li button { font-size: var(--lz-font-base); color: var(--lz-fg-muted); transition: color var(--lz-fast) var(--lz-ease); }
.lz-land-footer li button:hover { color: var(--lz-fg); }
.lz-land-disclaimer {
  margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--lz-border);
  font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); max-width: 90ch; line-height: 1.6;
}

/* -------------------------------------------------------------- docs ----- */
.lz-docs { display: grid; gap: 1.5rem; }
.lz-docs h3 { font-size: var(--lz-font-base); margin-bottom: 0.5rem; }
.lz-docs-keys { list-style: none; display: grid; gap: 0.4rem; }
.lz-docs-keys li { display: flex; align-items: center; gap: 0.6rem; font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }
.lz-docs-keys .lz-kbd { min-width: 68px; text-align: center; }
.lz-docs-list { list-style: none; display: grid; gap: 0.4rem; font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }
.lz-docs-list li { display: flex; gap: 0.5rem; line-height: 1.6; }
.lz-docs-list li::before { content: ""; width: 4px; height: 4px; margin-top: 8px; border-radius: 50%; background: var(--lz-accent); flex: none; }

/* --------------------------------------------------------- responsive ---- */
@media (max-width: 1080px) {
  .lz-pv-body { grid-template-columns: 180px minmax(0, 1fr) 260px; }
}
@media (max-width: 900px) {
  .lz-land-nav-links { display: none; }
  .lz-land-split, .lz-land-split.is-reverse { grid-template-columns: 1fr; }
  .lz-land-grid-3 { grid-template-columns: 1fr; }
  .lz-land-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lz-pv-body { grid-template-columns: 1fr; }
  .lz-pv-tree-pane { display: none; }
  .lz-pv-ai-pane { border-left: 0; border-top: 1px solid var(--lz-border); }
  .lz-land-footer-top { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .lz-land-wrap, .lz-land-wrap-wide { width: calc(100% - 2rem); }
  .lz-land-steps { grid-template-columns: 1fr; }
  .lz-land-footer-cols { grid-template-columns: 1fr 1fr; }
  .lz-land-problem-msg { white-space: normal; }
}

/* ---------- workspace.css ---------- */
/* ============================================================================
 * Luzzes — workspace.css
 * The IDE surface: shell, sidebar, editor, assistant panel, bottom dock.
 * ==========================================================================*/

.lz-workspace-root {
  position: fixed; inset: 0;
  background: var(--lz-bg);
  opacity: 0; transform: translateY(6px);
  transition: opacity var(--lz-normal) var(--lz-ease), transform var(--lz-normal) var(--lz-ease);
}
.lz-workspace-root.is-entering { opacity: 0; transform: translateY(6px); }
.lz-workspace-root:not(.is-entering) { opacity: 1; transform: none; }

.lz-workspace {
  --lz-sidebar: 252px;
  --lz-ai: 396px;
  --lz-bottom: 232px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  height: 100%;
  overflow: hidden;
}
.lz-middle {
  display: grid;
  grid-template-columns: var(--lz-sidebar) auto minmax(0, 1fr) auto var(--lz-ai);
  min-height: 0;
  overflow: hidden;
}
.lz-workspace.is-sidebar-collapsed { --lz-sidebar: 0px; }
.lz-workspace.is-sidebar-collapsed .lz-sidebar,
.lz-workspace.is-sidebar-collapsed .lz-middle > .lz-resizer:first-of-type { display: none; }
.lz-workspace.is-ai-collapsed { --lz-ai: 0px; }
.lz-workspace.is-ai-collapsed .lz-ai-slot,
.lz-workspace.is-ai-collapsed .lz-middle > .lz-resizer:last-of-type { display: none; }
.lz-workspace.is-bottom-collapsed { --lz-bottom: 0px; }
.lz-workspace.is-bottom-collapsed .lz-bottom-slot,
.lz-workspace.is-bottom-collapsed > .lz-resizer { display: none; }

.lz-resizer { position: relative; width: 5px; cursor: col-resize; background: transparent; z-index: 5; }
.lz-resizer::after {
  content: ""; position: absolute; inset: 0 2px; background: transparent;
  transition: background var(--lz-fast) var(--lz-ease);
}
.lz-resizer:hover::after, .lz-resizer:focus-visible::after { background: var(--lz-accent); }
.lz-resizer.is-horizontal { width: auto; height: 5px; cursor: row-resize; }
.lz-resizer.is-horizontal::after { inset: 2px 0; }

/* ------------------------------------------------------------ topbar ----- */
.lz-topbar {
  display: flex; align-items: center; gap: 0.75rem;
  height: 46px; padding: 0 0.6rem 0 0.75rem;
  border-bottom: 1px solid var(--lz-border);
  background: var(--lz-surface);
  position: relative; z-index: 30;
}
.lz-topbar-left { display: flex; align-items: center; gap: 0.55rem; min-width: 0; flex: 1; }
.lz-topbar-right { display: flex; align-items: center; gap: 0.35rem; }
.lz-topbar-divider { width: 1px; height: 18px; background: var(--lz-border); }
.lz-topbar-project {
  display: inline-flex; align-items: center; gap: 0.45rem;
  height: 28px; padding: 0 0.5rem;
  border-radius: var(--lz-radius-sm);
  color: var(--lz-fg);
  font-size: var(--lz-font-md); font-weight: 540;
  transition: background var(--lz-fast) var(--lz-ease);
  max-width: 260px;
}
.lz-topbar-project:hover { background: var(--lz-surface-2); }
.lz-topbar-project-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-topbar-path { display: flex; align-items: center; gap: 0.15rem; min-width: 0; font-size: var(--lz-font-sm); color: var(--lz-fg-subtle); }
.lz-topbar-path svg { opacity: 0.5; }
.lz-topbar-path-root { color: var(--lz-fg-muted); white-space: nowrap; }
.lz-topbar-path-part {
  padding: 2px 4px; border-radius: 5px; color: var(--lz-fg-muted);
  white-space: nowrap; transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
}
.lz-topbar-path-part:last-child { color: var(--lz-fg); }
.lz-topbar-path-part:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-save-indicator { display: inline-flex; align-items: center; gap: 0.35rem; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); white-space: nowrap; }
.lz-save-indicator.is-dirty { color: var(--lz-warn); }
.lz-save-indicator.is-saved { color: var(--lz-ok); }
.lz-save-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.lz-model-chip {
  display: inline-flex; align-items: center; gap: 0.4rem;
  height: 28px; padding: 0 0.5rem;
  border-radius: var(--lz-radius-sm);
  border: 1px solid var(--lz-border);
  background: var(--lz-bg);
  font-size: var(--lz-font-xs); color: var(--lz-fg-muted);
  transition: border-color var(--lz-fast) var(--lz-ease);
}
.lz-model-chip:hover { border-color: var(--lz-border-strong); }
.lz-model-chip.is-demo svg { color: var(--lz-warn); }
.lz-model-chip.is-local svg { color: var(--lz-ok); }
.lz-model-chip.is-connected svg { color: var(--lz-info); }
.lz-model-chip.is-busy { border-color: var(--lz-accent); }
.lz-model-chip-model { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ----------------------------------------------------------- sidebar ----- */
.lz-sidebar { background: var(--lz-surface); border-right: 1px solid var(--lz-border); min-width: 0; display: flex; flex-direction: column; }
.lz-sidebar-inner { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.lz-sidebar-head { display: flex; align-items: flex-start; gap: 0.3rem; padding: 0.7rem 0.6rem 0.6rem 0.8rem; }
.lz-sidebar-head-text { flex: 1; min-width: 0; }
.lz-sidebar-title { font-size: var(--lz-font-base); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-sidebar-sub { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); margin-top: 2px; }
.lz-sidebar-nav {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px;
  padding: 0 0.5rem 0.5rem;
  border-top: 1px solid var(--lz-border);
  order: -1;
  padding-top: 0.5rem;
}
.lz-sidebar-nav-item {
  display: grid; justify-items: center; gap: 3px;
  padding: 6px 2px 5px; border-radius: var(--lz-radius-sm);
  font-size: 10px; color: var(--lz-fg-subtle);
  transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
  position: relative;
}
.lz-sidebar-nav-item > span { font-size: 10.5px; }
.lz-sidebar-nav-item .lz-kbd { display: none; }
.lz-sidebar-nav-item:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-sidebar-nav-item.is-active { background: var(--lz-accent-soft); color: var(--lz-accent); }
.lz-nav-count {
  position: absolute; top: 2px; right: 8px;
  min-width: 15px; height: 15px; padding: 0 3px;
  display: grid; place-items: center;
  border-radius: 999px; background: var(--lz-accent); color: #fff;
  font-size: 9px; font-weight: 620;
}
.lz-sidebar-body { flex: 1; min-height: 0; overflow: auto; padding-bottom: 0.5rem; }
.lz-sidebar-foot {
  display: flex; align-items: center; gap: 3px;
  padding: 0.45rem 0.5rem; border-top: 1px solid var(--lz-border);
}
.lz-sidebar-foot .lz-icon-btn { margin-left: auto; }

/* file tree */
.lz-tree { padding: 2px 0.35rem; }
.lz-tree-row {
  display: flex; align-items: center; gap: 0.35rem;
  height: var(--lz-row); padding-right: 6px;
  border-radius: 6px;
  font-size: var(--lz-font-md); color: var(--lz-fg-muted);
  cursor: pointer; position: relative;
  transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
}
.lz-tree-row:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-tree-row.is-active { background: var(--lz-accent-soft); color: var(--lz-accent); font-weight: 540; }
.lz-tree-row.is-drop-target { background: var(--lz-accent-soft); box-shadow: inset 0 0 0 1px var(--lz-accent); }
.lz-tree-chevron { width: 12px; opacity: 0.7; display: inline-flex; justify-content: center; }
.lz-tree-row.is-folder .lz-tree-chevron { opacity: 0.85; }
.lz-tree-icon { opacity: 0.8; }
.lz-tree-icon.is-file { opacity: 0.6; }
.lz-tree-row.is-active .lz-tree-icon { opacity: 1; }
.lz-tree-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-tree-badge { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.lz-tree-badge.is-error { background: var(--lz-error); }
.lz-tree-badge.is-warning { background: var(--lz-warn); }
.lz-tree-badge.is-hint { background: var(--lz-fg-subtle); }
.lz-tree-actions { display: none; gap: 0; }
.lz-tree-row:hover .lz-tree-actions { display: flex; }
.lz-tree-action { width: 20px !important; height: 20px !important; }
.lz-tree-rename {
  flex: 1; min-width: 0; height: 20px; padding: 0 4px;
  font-size: var(--lz-font-md); font-family: var(--lz-font);
  background: var(--lz-bg); color: var(--lz-fg);
  border: 1px solid var(--lz-accent); border-radius: 4px;
}

/* search */
.lz-search-panel { display: grid; gap: 0.5rem; padding: 0.4rem 0.5rem 0.75rem; }
.lz-search-bar { display: flex; align-items: center; gap: 4px; }
.lz-search-field {
  display: flex; align-items: center; gap: 0.4rem; flex: 1;
  height: 30px; padding: 0 0.5rem;
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm);
  background: var(--lz-bg); color: var(--lz-fg-subtle);
}
.lz-search-field:focus-within { border-color: var(--lz-accent); box-shadow: 0 0 0 3px var(--lz-accent-soft); }
.lz-search-input { flex: 1; border: 0; background: transparent; outline: none; font-size: var(--lz-font-md); color: var(--lz-fg); min-width: 0; }
.lz-search-option {
  width: 26px; height: 26px; border-radius: 5px;
  border: 1px solid var(--lz-border); background: var(--lz-bg);
  font-size: 10.5px; font-weight: 600; color: var(--lz-fg-subtle);
  transition: color var(--lz-fast) var(--lz-ease), border-color var(--lz-fast) var(--lz-ease), background var(--lz-fast) var(--lz-ease);
}
.lz-search-option.is-active { color: var(--lz-accent); border-color: var(--lz-accent); background: var(--lz-accent-soft); }
.lz-search-summary { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); padding: 0 2px; }
.lz-search-hint { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); line-height: 1.6; padding: 0.4rem 2px; }
.lz-search-results { display: grid; gap: 0.5rem; }
.lz-search-group { border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm); overflow: hidden; background: var(--lz-bg); }
.lz-search-group-head {
  display: flex; align-items: center; gap: 0.4rem; width: 100%;
  padding: 5px 7px; background: var(--lz-surface-2);
  font-size: var(--lz-font-xs); color: var(--lz-fg-muted);
  border-bottom: 1px solid var(--lz-border);
}
.lz-search-group-head span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-search-count { margin-left: auto; font-family: var(--lz-mono); }
.lz-search-match {
  display: flex; gap: 0.5rem; align-items: baseline; width: 100%;
  padding: 3px 7px; text-align: left;
  font-family: var(--lz-mono); font-size: 11px; color: var(--lz-fg-muted);
  border-bottom: 1px solid color-mix(in srgb, var(--lz-border) 60%, transparent);
}
.lz-search-match:last-child { border-bottom: 0; }
.lz-search-match:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-search-line { flex: none; width: 22px; text-align: right; color: var(--lz-fg-subtle); }
.lz-search-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-search-text mark { background: color-mix(in srgb, var(--lz-accent) 28%, transparent); color: inherit; border-radius: 3px; }
.lz-search-error { display: flex; gap: 0.5rem; padding: 0.6rem; font-size: var(--lz-font-sm); color: var(--lz-error); border: 1px solid color-mix(in srgb, var(--lz-error) 30%, transparent); border-radius: var(--lz-radius-sm); }
.lz-search-error-detail { color: var(--lz-fg-muted); font-size: var(--lz-font-xs); margin-top: 3px; }

/* changes */
.lz-changes { padding: 0.4rem 0.5rem 1rem; display: grid; gap: 3px; }
.lz-changes-head { display: flex; align-items: center; gap: 0.5rem; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); padding: 0 2px 0.4rem; }
.lz-changes-head .lz-btn { margin-left: auto; }
.lz-change-row { display: flex; align-items: center; gap: 0.45rem; padding: 4px 6px; border-radius: 6px; }
.lz-change-row:hover { background: var(--lz-surface-2); }
.lz-change-icon.is-added { color: var(--lz-ok); }
.lz-change-icon.is-deleted { color: var(--lz-error); }
.lz-change-icon.is-modified { color: var(--lz-warn); }
.lz-change-path { flex: 1; text-align: left; font-size: var(--lz-font-sm); color: var(--lz-fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-change-row:hover .lz-change-path { color: var(--lz-fg); }
.lz-change-meta { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }

/* assets */
.lz-assets { padding: 0.4rem 0.5rem 1rem; display: grid; gap: 0.5rem; }
.lz-assets-head { display: flex; align-items: center; gap: 0.5rem; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }
.lz-assets-head .lz-btn { margin-left: auto; }
.lz-assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 0.5rem; }
.lz-asset { display: grid; gap: 4px; border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm); overflow: hidden; background: var(--lz-bg); }
.lz-asset-thumb { aspect-ratio: 4 / 3; width: 100%; object-fit: cover; background: var(--lz-surface-2); }
.lz-asset-thumb.is-fallback { display: grid; place-items: center; color: var(--lz-fg-subtle); }
.lz-asset-name { font-size: 10.5px; color: var(--lz-fg-muted); padding: 0 4px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------------ editor ----- */
.lz-editor-slot { min-width: 0; display: flex; flex-direction: column; background: var(--lz-bg); }
.lz-editor-host { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.lz-editor { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.lz-tabs {
  display: flex; align-items: stretch; gap: 1px;
  min-height: 34px; padding: 0 0.4rem;
  background: var(--lz-surface);
  border-bottom: 1px solid var(--lz-border);
  overflow-x: auto; scrollbar-width: none;
}
.lz-tabs::-webkit-scrollbar { display: none; }
.lz-tabs-empty { align-self: center; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); padding-left: 0.4rem; }
.lz-tab {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0 0.5rem; max-width: 220px;
  font-size: var(--lz-font-sm); color: var(--lz-fg-subtle);
  border-bottom: 1.5px solid transparent;
  transition: color var(--lz-fast) var(--lz-ease), border-color var(--lz-fast) var(--lz-ease), background var(--lz-fast) var(--lz-ease);
}
.lz-tab:hover { color: var(--lz-fg); background: var(--lz-surface-2); }
.lz-tab.is-active { color: var(--lz-fg); border-bottom-color: var(--lz-accent); background: var(--lz-bg); }
.lz-tab.is-missing { text-decoration: line-through; opacity: 0.6; }
.lz-tab-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lz-warn); flex: none; }
.lz-tab-badge { width: 6px; height: 6px; border-radius: 50%; }
.lz-tab-badge.is-error { background: var(--lz-error); }
.lz-tab-badge.is-warning { background: var(--lz-warn); }
.lz-tab-badge.is-hint { background: var(--lz-fg-subtle); }
.lz-tab .lz-icon-btn { width: 18px; height: 18px; opacity: 0; }
.lz-tab:hover .lz-icon-btn, .lz-tab.is-active .lz-icon-btn { opacity: 1; }

.lz-code { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; }
.lz-code-scroll { overflow: auto; position: relative; }
.lz-code-gutter {
  padding: 8px 0 24px;
  background: var(--lz-bg);
  border-right: 1px solid color-mix(in srgb, var(--lz-border) 60%, transparent);
  user-select: none;
  font-family: var(--lz-mono);
  font-size: var(--lz-editor-font, 13px);
  line-height: 1.65;
  min-width: 54px;
}
.lz-gutter-line { display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 0 8px 0 4px; height: 1.65em; color: var(--lz-fg-subtle); }
.lz-gutter-line.is-active { color: var(--lz-fg); background: color-mix(in srgb, var(--lz-accent) 6%, transparent); }
.lz-gutter-line.is-match { color: var(--lz-accent); }
.lz-gutter-sev { display: inline-flex; width: 11px; }
.lz-gutter-sev.is-error { color: var(--lz-error); }
.lz-gutter-sev.is-warning { color: var(--lz-warn); }
.lz-gutter-sev.is-hint { color: var(--lz-fg-subtle); }
.lz-gutter-num { min-width: 20px; text-align: right; font-size: 0.92em; }
.no-lines .lz-code-gutter { display: none; }

.lz-code-content {
  margin: 0; padding: 8px 16px 40px;
  font-family: var(--lz-mono);
  font-size: var(--lz-editor-font, 13px);
  line-height: 1.65;
  tab-size: 2;
  color: var(--lz-fg);
  outline: none;
  white-space: pre;
  caret-color: var(--lz-accent);
  min-height: 100%;
}
.lz-code.is-wrap .lz-code-content { white-space: pre-wrap; word-break: break-word; }
.lz-code-content .lz-line { min-height: 1.65em; }
.lz-code-content .lz-line:empty::before { content: " "; }
.no-active-line .lz-gutter-line.is-active { background: transparent; }
.lz-binary-preview { display: grid; gap: 0.6rem; justify-items: start; padding: 0.5rem 0; }
.lz-binary-preview img { max-width: min(420px, 100%); border: 1px solid var(--lz-border); border-radius: var(--lz-radius); }
.lz-binary-preview p { font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }

.lz-code-minimap {
  width: 74px; padding: 8px 6px 24px;
  background: var(--lz-surface);
  border-left: 1px solid color-mix(in srgb, var(--lz-border) 60%, transparent);
  overflow: hidden; position: relative;
}
.lz-minimap-line { height: 2px; margin-bottom: 1px; border-radius: 1px; background: var(--lz-fg-subtle); opacity: 0.7; }
.lz-minimap-viewport {
  position: absolute; left: 0; right: 0; top: 0;
  background: color-mix(in srgb, var(--lz-accent) 12%, transparent);
  border-top: 1px solid color-mix(in srgb, var(--lz-accent) 40%, transparent);
  border-bottom: 1px solid color-mix(in srgb, var(--lz-accent) 40%, transparent);
  transition: transform 90ms linear;
  pointer-events: none;
}

.lz-find-bar {
  position: absolute; top: 8px; right: 16px; z-index: 6;
  display: grid; gap: 4px;
  padding: 6px;
  background: var(--lz-surface);
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius);
  box-shadow: var(--lz-shadow-3);
  animation: lz-pop var(--lz-fast) var(--lz-ease);
}
.lz-find-row { display: flex; align-items: center; gap: 5px; color: var(--lz-fg-subtle); }
.lz-find-input, .lz-find-replace {
  width: 190px; height: 26px; padding: 0 6px;
  background: var(--lz-bg); color: var(--lz-fg);
  border: 1px solid var(--lz-border); border-radius: 5px; outline: none;
  font-size: var(--lz-font-sm); font-family: var(--lz-mono);
}
.lz-find-input:focus, .lz-find-replace:focus { border-color: var(--lz-accent); }
.lz-find-count { font-size: var(--lz-font-xs); min-width: 66px; }

.lz-editor-status {
  display: flex; align-items: center; gap: 0.9rem;
  height: 26px; padding: 0 0.6rem 0 0.75rem;
  border-top: 1px solid var(--lz-border);
  background: var(--lz-surface);
  font-size: var(--lz-font-xs); color: var(--lz-fg-subtle);
}
.lz-status-item { white-space: nowrap; }
.lz-status-item.is-button { padding: 1px 5px; border-radius: 4px; color: var(--lz-fg-muted); }
.lz-status-item.is-button:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-status-item.is-ok { color: var(--lz-ok); }
.lz-status-item.is-warning { color: var(--lz-warn); }
.lz-editor-status .lz-btn { margin-left: auto; height: 20px; font-size: 10.5px; }

.lz-editor-welcome { display: grid; place-items: center; height: 100%; }
.lz-editor-welcome[hidden] { display: none; }

.lz-selection-bubble {
  position: fixed; z-index: 6000;
  display: flex; align-items: center; gap: 3px;
  padding: 4px;
  background: var(--lz-surface);
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius);
  box-shadow: var(--lz-shadow-3);
  animation: lz-pop var(--lz-fast) var(--lz-ease);
}
.lz-selection-bubble[hidden] { display: none; }

/* --------------------------------------------------------- ai panel ------ */
.lz-ai-slot { min-width: 0; border-left: 1px solid var(--lz-border); background: var(--lz-surface); }
.lz-ai-panel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto auto; height: 100%; min-height: 0; }
.lz-ai-head {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 0.5rem 0.5rem 0.75rem;
  border-bottom: 1px solid var(--lz-border);
}
.lz-ai-head-left { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
.lz-ai-wordmark { display: inline-flex; align-items: center; gap: 0.4rem; font-size: var(--lz-font-sm); font-weight: 640; letter-spacing: 0.14em; }
.lz-ai-wordmark svg { color: var(--lz-accent); }
.lz-ai-status { display: inline-flex; align-items: center; gap: 0.4rem; font-size: var(--lz-font-xs); color: var(--lz-fg-muted); }
.lz-ai-head-right { display: flex; align-items: center; gap: 2px; margin-left: auto; }

.lz-ai-stream { overflow: auto; padding: 0.85rem 0.85rem 0.5rem; display: grid; gap: 1rem; align-content: start; min-height: 0; }
.lz-msg { display: grid; gap: 0.5rem; }
.lz-msg-head { display: flex; align-items: center; gap: 0.45rem; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }
.lz-msg-avatar {
  display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px;
  background: var(--lz-accent-soft); color: var(--lz-accent);
}
.lz-msg-author { font-size: var(--lz-font-sm); font-weight: 580; color: var(--lz-fg); }
.lz-msg-model { font-family: var(--lz-mono); font-size: 10px; color: var(--lz-fg-subtle); }
.lz-msg-spacer { flex: 1; }
.lz-msg-latency { font-family: var(--lz-mono); font-size: 10px; }
.lz-msg-body.is-user {
  padding: 0.6rem 0.7rem;
  background: var(--lz-surface-2);
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius);
  font-size: var(--lz-font-base);
  color: var(--lz-fg);
  white-space: pre-wrap;
}
.lz-msg-attachments { display: flex; flex-wrap: wrap; gap: 4px; }
.lz-msg-plan { list-style: none; display: grid; gap: 0.45rem; padding: 0.1rem 0; }
.lz-msg-plan li { display: flex; gap: 0.55rem; font-size: var(--lz-font-sm); }
.lz-msg-plan-index {
  flex: none; width: 18px; height: 18px; margin-top: 1px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--lz-surface-2); border: 1px solid var(--lz-border);
  font-size: 10px; color: var(--lz-fg-muted);
}
.lz-msg-plan-title { color: var(--lz-fg); }
.lz-msg-plan-detail, .lz-msg-plan-files { color: var(--lz-fg-subtle); font-size: var(--lz-font-xs); margin-top: 1px; }
.lz-msg-plan-files { font-family: var(--lz-mono); }
.lz-msg-note {
  display: flex; gap: 0.4rem; align-items: flex-start;
  font-size: var(--lz-font-xs); color: var(--lz-fg-subtle);
  padding: 0.4rem 0.5rem;
  border-radius: var(--lz-radius-sm);
  background: color-mix(in srgb, var(--lz-warn) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--lz-warn) 22%, transparent);
}
.lz-msg-note svg { margin-top: 2px; }
.lz-msg-actions { display: flex; flex-wrap: wrap; gap: 4px; }
.lz-msg-selection summary { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); cursor: pointer; }
.lz-msg-selection pre {
  margin: 6px 0 0; padding: 0.5rem 0.6rem; overflow: auto; max-height: 200px;
  background: var(--lz-bg); border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm);
  font-family: var(--lz-mono); font-size: 11.5px;
}

.lz-activity-wrap {
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm);
  background: var(--lz-bg); overflow: hidden;
}
.lz-activity-wrap summary {
  display: flex; align-items: center; gap: 0.4rem;
  padding: 5px 8px; cursor: pointer; list-style: none;
  font-size: var(--lz-font-xs); color: var(--lz-fg-muted);
  background: var(--lz-surface-2);
}
.lz-activity-wrap summary::-webkit-details-marker { display: none; }
.lz-activity { list-style: none; padding: 4px 0; }
.lz-activity-item { display: flex; align-items: center; gap: 0.45rem; padding: 2px 8px; font-size: var(--lz-font-xs); color: var(--lz-fg-muted); }
.lz-activity-mark { display: inline-flex; width: 12px; justify-content: center; }
.lz-activity-item.is-done .lz-activity-mark { color: var(--lz-ok); }
.lz-activity-item.is-running .lz-activity-mark { color: var(--lz-accent); }
.lz-activity-item.is-error .lz-activity-mark { color: var(--lz-error); }
.lz-activity-item.is-skipped { opacity: 0.6; }
.lz-activity-label { color: var(--lz-fg); }
.lz-activity-detail { margin-left: auto; font-family: var(--lz-mono); font-size: 10px; text-align: right; }
.lz-activity-item.is-running { animation: lz-fade-in var(--lz-normal) var(--lz-ease); }
@keyframes lz-fade-in { from { opacity: 0.4; } to { opacity: 1; } }

.lz-patch {
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius);
  background: var(--lz-surface);
  overflow: hidden;
  animation: lz-pop var(--lz-normal) var(--lz-ease);
}
.lz-patch-head { display: grid; gap: 0.4rem; padding: 0.6rem 0.7rem 0.45rem; }
.lz-patch-title { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
.lz-patch-path {
  font-family: var(--lz-mono); font-size: var(--lz-font-sm); color: var(--lz-fg);
  text-decoration: underline; text-decoration-color: var(--lz-border-strong); text-underline-offset: 3px;
}
.lz-patch-path:hover { text-decoration-color: var(--lz-accent); }
.lz-patch-meta { display: flex; align-items: center; gap: 0.45rem; font-family: var(--lz-mono); font-size: var(--lz-font-xs); }
.lz-patch-stat.is-add { color: var(--lz-add-fg); }
.lz-patch-stat.is-del { color: var(--lz-del-fg); }
.lz-patch-status { margin-left: 0.3rem; }
.lz-patch-notes { list-style: none; padding: 0 0.7rem; display: grid; gap: 2px; font-size: var(--lz-font-xs); color: var(--lz-fg-muted); }
.lz-patch-notes li { display: flex; gap: 0.4rem; }
.lz-patch-notes li::before { content: "—"; color: var(--lz-fg-subtle); }
.lz-patch-toolbar {
  display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
  padding: 0.45rem 0.7rem 0.55rem;
}
.lz-patch-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; flex-wrap: wrap; }

.lz-error-card {
  display: grid; gap: 0.45rem;
  padding: 0.7rem 0.75rem;
  border: 1px solid color-mix(in srgb, var(--lz-error) 32%, transparent);
  background: color-mix(in srgb, var(--lz-error) 6%, transparent);
  border-radius: var(--lz-radius);
}
.lz-error-head { display: flex; align-items: center; gap: 0.45rem; color: var(--lz-error); font-size: var(--lz-font-base); font-weight: 560; }
.lz-error-message { font-size: var(--lz-font-sm); color: var(--lz-fg); font-family: var(--lz-mono); word-break: break-word; }
.lz-error-hint { font-size: var(--lz-font-xs); color: var(--lz-fg-muted); line-height: 1.55; }
.lz-error-actions { display: flex; flex-wrap: wrap; gap: 4px; }
.lz-error-details summary { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); cursor: pointer; }
.lz-error-details pre {

.lz-ai-live { padding: 0 0.85rem; }
.lz-ai-live-strip {

.lz-ai-empty { padding: 1.5rem 1rem; display: grid; gap: 1rem; overflow: auto; }

.lz-ai-empty-hero { display: grid; gap: 0.4rem; justify-items: start; }
.lz-ai-empty-hero svg { color: var(--lz-accent); }

.lz-ai-empty-hero p { font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }
.lz-ai-suggestions { display: grid; gap: 5px; }
.lz-ai-suggestion {
  display: flex; align-items: flex-start; gap: 0.5rem;
  padding: 0.5rem 0.6rem; text-align: left;
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm);
  background: var(--lz-bg);
  font-size: var(--lz-font-sm); color: var(--lz-fg-muted);

}

.lz-ai-empty-modes > p { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); margin-bottom: 0.4rem; }
.lz-ai-empty-modes ul { list-style: none; display: grid; gap: 0.4rem; }
.lz-ai-empty-modes li { display: flex; gap: 0.45rem; align-items: flex-start; font-size: var(--lz-font-xs); color: var(--lz-fg-muted); line-height: 1.5; }

.lz-composer { border-top: 1px solid var(--lz-border); padding: 0.5rem 0.6rem 0.65rem; display: grid; gap: 0.45rem; background: var(--lz-surface); }
.lz-composer-actions { display: flex; gap: 3px; flex-wrap: wrap; }
.lz-composer-box {
  display: flex; align-items: flex-end; gap: 0.4rem;
  padding: 0.4rem 0.45rem 0.4rem 0.6rem;
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius);
  background: var(--lz-bg);
  transition: border-color var(--lz-fast) var(--lz-ease), box-shadow var(--lz-fast) var(--lz-ease);
}
.lz-composer-box:focus-within { border-color: var(--lz-accent); box-shadow: 0 0 0 3px var(--lz-accent-soft); }
.lz-composer-input {
  flex: 1; resize: none; border: 0; outline: none; background: transparent;

  max-height: 200px; min-height: 22px; padding: 2px 0;
}
