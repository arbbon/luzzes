.lz-composer-controls { display: flex; gap: 4px; }
.lz-composer-context { display: flex; flex-wrap: wrap; gap: 4px; }
.lz-composer-hint { display: flex; align-items: center; gap: 0.5rem; font-size: 10.5px; color: var(--lz-fg-subtle); }
.lz-composer-hint-sep { width: 3px; height: 3px; border-radius: 50%; background: var(--lz-border-strong); }

/* ------------------------------------------------------------ bottom ---- */
.lz-bottom-slot { min-height: 0; border-top: 1px solid var(--lz-border); background: var(--lz-surface); }
.lz-bottom { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.lz-bottom-tabs {
  display: flex; align-items: center; gap: 2px;
  height: 32px; padding: 0 0.4rem;
  border-bottom: 1px solid var(--lz-border);
}
.lz-bottom-tab {
  display: inline-flex; align-items: center; gap: 0.4rem;
  height: 24px; padding: 0 0.5rem; border-radius: 5px;
  font-size: var(--lz-font-xs); color: var(--lz-fg-subtle);
  transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
}
.lz-bottom-tab:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-bottom-tab.is-active { background: var(--lz-accent-soft); color: var(--lz-accent); }
.lz-bottom-badge {
  min-width: 15px; height: 15px; padding: 0 4px; border-radius: 999px;
  display: grid; place-items: center;
  background: var(--lz-warn); color: #1b1200; font-size: 9.5px; font-weight: 640;
}
.lz-bottom-badge.is-error { background: var(--lz-error); color: #fff; }
.lz-bottom-tabs-spacer { flex: 1; }
.lz-bottom-body { flex: 1; min-height: 0; display: flex; }

.lz-terminal { display: flex; flex-direction: column; width: 100%; min-height: 0; padding: 0.4rem 0.6rem 0.5rem; }
.lz-terminal-output {
  flex: 1; min-height: 0; overflow: auto;
  font-family: var(--lz-mono); font-size: 11.5px; line-height: 1.62;
  padding: 2px 2px 6px;
}
.lz-term-line { white-space: pre-wrap; word-break: break-word; color: var(--lz-fg-muted); }
.lz-term-line.is-input { color: var(--lz-fg); font-weight: 560; }
.lz-term-line.is-info { color: var(--lz-info); }
.lz-term-line.is-success { color: var(--lz-ok); }
.lz-term-line.is-warning { color: var(--lz-warn); }
.lz-term-line.is-error { color: var(--lz-error); }
.lz-term-line.is-dim { color: var(--lz-fg-subtle); }
.lz-terminal-prompt {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 4px 8px;
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm);
  background: var(--lz-bg);
}
.lz-terminal-prompt:focus-within { border-color: var(--lz-accent); }
.lz-terminal-caret { color: var(--lz-accent); font-family: var(--lz-mono); }
.lz-terminal-input {
  flex: 1; border: 0; outline: none; background: transparent;
  font-family: var(--lz-mono); font-size: 12px; color: var(--lz-fg);
}
.lz-terminal-note { font-size: 10.5px; color: var(--lz-fg-subtle); margin-top: 4px; }

.lz-problems { flex: 1; min-height: 0; overflow: auto; padding: 0.4rem 0.6rem 0.6rem; }
.lz-problems-summary { display: flex; align-items: center; gap: 5px; padding-bottom: 0.4rem; flex-wrap: wrap; }
.lz-problems-running, .lz-problems-meta { display: inline-flex; align-items: center; gap: 0.35rem; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }
.lz-problem-group { border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm); margin-bottom: 0.4rem; overflow: hidden; background: var(--lz-bg); }
.lz-problem-group-head { display: flex; align-items: center; gap: 0.45rem; padding: 5px 7px; background: var(--lz-surface-2); }
.lz-problem-file { font-family: var(--lz-mono); font-size: var(--lz-font-sm); color: var(--lz-fg); }
.lz-problem-file:hover { color: var(--lz-accent); }
.lz-problem-count { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); margin-right: auto; }
.lz-problem-row {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 3px 7px; font-size: var(--lz-font-sm);
  border-top: 1px solid color-mix(in srgb, var(--lz-border) 60%, transparent);
}
.lz-problem-row:hover { background: var(--lz-surface); }
.lz-problem-sev.is-error { color: var(--lz-error); }
.lz-problem-sev.is-warning { color: var(--lz-warn); }
.lz-problem-sev.is-hint { color: var(--lz-fg-subtle); }
.lz-problem-loc { font-family: var(--lz-mono); font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); min-width: 44px; text-align: left; }
.lz-problem-loc:hover { color: var(--lz-accent); }
.lz-problem-message { flex: 1; color: var(--lz-fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-problem-rule { font-family: var(--lz-mono); font-size: 10px; color: var(--lz-fg-subtle); }

.lz-output-log { flex: 1; min-height: 0; overflow: auto; padding: 0.4rem 0.6rem 0.6rem; font-size: var(--lz-font-sm); }
.lz-output-line { display: flex; align-items: baseline; gap: 0.5rem; padding: 1px 0; color: var(--lz-fg-muted); }
.lz-output-time { font-family: var(--lz-mono); font-size: 10.5px; color: var(--lz-fg-subtle); }
.lz-output-line.is-success { color: var(--lz-ok); }
.lz-output-line.is-error { color: var(--lz-error); }
.lz-output-line.is-info { color: var(--lz-fg-muted); }

.lz-preview { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.lz-preview-toolbar {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.35rem 0.55rem;
  border-bottom: 1px solid var(--lz-border);
}
.lz-preview-address {
  display: inline-flex; align-items: center; gap: 0.4rem;
  flex: 1; min-width: 0; height: 24px; padding: 0 0.6rem;
  border-radius: 999px; background: var(--lz-bg); border: 1px solid var(--lz-border);
  font-size: var(--lz-font-xs); color: var(--lz-fg-subtle);
}
.lz-preview-url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-preview-entry {
  height: 24px; max-width: 190px; padding: 0 0.4rem;
  background: var(--lz-bg); color: var(--lz-fg-muted);
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm);
  font-size: var(--lz-font-xs); font-family: var(--lz-mono);
}
.lz-preview-viewport {
  flex: 1; min-height: 0; display: grid; place-items: center;
  padding: 0.6rem; background:
    linear-gradient(0deg, var(--lz-surface-2), var(--lz-surface-2)),
    repeating-conic-gradient(var(--lz-surface) 0% 25%, transparent 0% 50%) 50% / 16px 16px;
  overflow: auto;
}
.lz-preview-device {
  width: 100%; height: 100%;
  display: grid; place-items: stretch;
  transition: max-width var(--lz-normal) var(--lz-ease);
}
.lz-preview-device.is-desktop { max-width: 100%; }
.lz-preview-device.is-tablet { max-width: 834px; }
.lz-preview-device.is-mobile { max-width: 390px; }
.lz-preview-frame {
  width: 100%; height: 100%; min-height: 180px;
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius-sm);
  background: #fff;
  box-shadow: var(--lz-shadow-2);
}
.lz-preview-info { padding: 0.25rem 0.6rem; }
.lz-preview-warning { display: flex; align-items: center; gap: 0.45rem; font-size: var(--lz-font-xs); color: var(--lz-warn); }

/* --------------------------------------------------------- overlays ----- */
.lz-loading {
  position: fixed; inset: 0; z-index: 9500;
  display: grid; place-content: center; justify-items: center; gap: 0.85rem;
  background: var(--lz-bg);
  transition: opacity 240ms var(--lz-ease);
}
.lz-loading.is-leaving { opacity: 0; pointer-events: none; }
/* Startup splash: the loader pinned over the first paint, removed once the
   landing page has mounted. Deliberately brief. */
.lz-loading.is-splash { position: fixed; inset: 0; z-index: 90; background: var(--lz-bg); }
.lz-loading-mark {
  display: grid; place-items: center;
  width: 54px; height: 54px; border-radius: 16px;
  background: linear-gradient(140deg, var(--lz-accent), color-mix(in srgb, var(--lz-accent) 55%, #8fe3ff));
  color: #fff;
  box-shadow: 0 20px 50px -24px var(--lz-accent);
  animation: lz-mark-in 520ms var(--lz-ease);
}
@keyframes lz-mark-in {
  from { opacity: 0; transform: translateY(8px) scale(0.94); }
  to { opacity: 1; transform: none; }
}
.lz-loading-word { font-size: 1rem; font-weight: 620; letter-spacing: 0.16em; text-transform: uppercase; }
.lz-loading-message { font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }
.lz-loading-bar { width: 168px; height: 3px; border-radius: 999px; background: var(--lz-surface-3); overflow: hidden; }
.lz-loading-bar span {
  display: block; width: 40%; height: 100%; border-radius: 999px;
  background: var(--lz-accent);
  animation: lz-loading-slide 1.1s var(--lz-ease) infinite;
}
@keyframes lz-loading-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(320%); }
}

.lz-palette-backdrop {
  position: fixed; inset: 0; z-index: 7500;
  background: color-mix(in srgb, var(--lz-bg) 45%, rgba(8, 9, 13, 0.5));
  backdrop-filter: blur(5px);
  display: flex; justify-content: center; align-items: flex-start;
  padding: 10vh 1rem 1rem;
  opacity: 0; transition: opacity var(--lz-fast) var(--lz-ease);
}
.lz-palette-backdrop.is-open { opacity: 1; }
.lz-palette {
  width: min(620px, 100%);
  background: var(--lz-surface);
  border: 1px solid var(--lz-border);
  border-radius: var(--lz-radius-lg);
  box-shadow: var(--lz-shadow-3);
  overflow: hidden;
  transform: translateY(-8px) scale(0.99);
  transition: transform var(--lz-normal) var(--lz-ease);
  display: flex; flex-direction: column; max-height: 70vh;
}
.lz-palette-backdrop.is-open .lz-palette { transform: none; }
.lz-palette-search { display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0.8rem; border-bottom: 1px solid var(--lz-border); color: var(--lz-fg-subtle); }
.lz-palette-input { flex: 1; border: 0; outline: none; background: transparent; font-size: var(--lz-font-lg); color: var(--lz-fg); }
.lz-palette-list { overflow: auto; padding: 5px; }
.lz-palette-group { padding: 7px 8px 3px; font-size: var(--lz-font-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--lz-fg-subtle); }
.lz-palette-item {
  display: flex; align-items: center; gap: 0.6rem; width: 100%;
  padding: 7px 8px; border-radius: var(--lz-radius-sm);
  font-size: var(--lz-font-base); color: var(--lz-fg-muted); text-align: left;
}
.lz-palette-item.is-active { background: var(--lz-accent-soft); color: var(--lz-fg); }
.lz-palette-item.is-active svg { color: var(--lz-accent); }
.lz-palette-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lz-palette-detail { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); font-family: var(--lz-mono); }
.lz-palette-hint { padding: 6px 12px; border-top: 1px solid var(--lz-border); font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); background: var(--lz-surface-2); }
.lz-palette-empty { display: grid; justify-items: center; gap: 0.35rem; padding: 2rem 1rem; color: var(--lz-fg-muted); font-size: var(--lz-font-base); }
.lz-palette-empty-hint { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }

.lz-settings { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 1.25rem; min-height: 340px; }
.lz-settings-nav { display: grid; gap: 2px; align-content: start; }
.lz-settings-nav-item {
  display: flex; align-items: center; gap: 0.55rem;
  padding: 7px 9px; border-radius: var(--lz-radius-sm);
  font-size: var(--lz-font-base); color: var(--lz-fg-muted); text-align: left;
  transition: background var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease);
}
.lz-settings-nav-item:hover { background: var(--lz-surface-2); color: var(--lz-fg); }
.lz-settings-nav-item.is-active { background: var(--lz-accent-soft); color: var(--lz-accent); font-weight: 540; }
.lz-settings-body { min-width: 0; }
.lz-settings-section { display: grid; gap: 0.9rem; }
.lz-settings-section h3 { font-size: var(--lz-font-base); }
.lz-settings-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px solid var(--lz-border); }
.lz-settings-row:last-of-type { border-bottom: 0; }
.lz-settings-row-label { font-size: var(--lz-font-base); }
.lz-settings-row-hint { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); margin-top: 3px; max-width: 52ch; line-height: 1.55; }
.lz-settings-row-control { display: flex; justify-content: flex-end; }
.lz-settings-fields { display: grid; gap: 0.75rem; }
.lz-settings-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.lz-settings-presets { display: grid; gap: 0.4rem; }
.lz-settings-preset-row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.lz-settings-notice {
  display: flex; gap: 0.55rem; align-items: flex-start;
  padding: 0.6rem 0.7rem; border-radius: var(--lz-radius-sm);
  background: var(--lz-surface-2); border: 1px solid var(--lz-border);
  font-size: var(--lz-font-sm); color: var(--lz-fg-muted); line-height: 1.55;
}
.lz-settings-notice svg { margin-top: 2px; color: var(--lz-fg-subtle); }
.lz-provider-health { display: grid; gap: 0.4rem; }
.lz-health-line { display: inline-flex; align-items: center; gap: 0.45rem; font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }
.lz-health-result { display: flex; gap: 0.5rem; align-items: flex-start; padding: 0.55rem 0.65rem; border-radius: var(--lz-radius-sm); font-size: var(--lz-font-sm); line-height: 1.55; }
.lz-health-result.is-ok { background: color-mix(in srgb, var(--lz-ok) 8%, transparent); border: 1px solid color-mix(in srgb, var(--lz-ok) 28%, transparent); color: var(--lz-ok); }
.lz-health-result.is-error { background: color-mix(in srgb, var(--lz-error) 7%, transparent); border: 1px solid color-mix(in srgb, var(--lz-error) 30%, transparent); color: var(--lz-error); }
.lz-health-models { display: flex; flex-wrap: wrap; gap: 4px; }
.lz-storage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.75rem; }
.lz-storage-grid > div { display: grid; gap: 2px; padding: 0.6rem 0.7rem; border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm); background: var(--lz-bg); }
.lz-storage-value { font-size: 1rem; font-weight: 600; }
.lz-storage-label { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }
.lz-about-hero { display: flex; align-items: center; gap: 0.75rem; }
.lz-about-mark {
  display: grid; place-items: center; width: 44px; height: 44px; border-radius: 13px;
  background: linear-gradient(140deg, var(--lz-accent), color-mix(in srgb, var(--lz-accent) 55%, #8fe3ff));
  color: #fff;
}
.lz-about-name { font-weight: 620; }
.lz-about-tag { font-size: var(--lz-font-sm); color: var(--lz-fg-muted); }
.lz-about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.75rem; }
.lz-about-grid > div { display: grid; gap: 2px; padding: 0.55rem 0.65rem; border: 1px solid var(--lz-border); border-radius: var(--lz-radius-sm); background: var(--lz-bg); }

.lz-picker { display: grid; gap: 0.9rem; }
.lz-picker-tabs { display: flex; gap: 4px; }
.lz-picker-tab {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 5px 0.7rem; border-radius: 999px;
  font-size: var(--lz-font-sm); color: var(--lz-fg-muted);
  border: 1px solid var(--lz-border);
}
.lz-picker-tab.is-active { background: var(--lz-accent-soft); color: var(--lz-accent); border-color: transparent; }
.lz-picker-list { display: grid; gap: 6px; }
.lz-picker-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.6rem; border: 1px solid var(--lz-border); border-radius: var(--lz-radius); background: var(--lz-bg); }
.lz-picker-row.is-current { border-color: color-mix(in srgb, var(--lz-accent) 40%, var(--lz-border)); }
.lz-picker-row-main { display: flex; align-items: center; gap: 0.6rem; flex: 1; min-width: 0; }
.lz-picker-name { font-size: var(--lz-font-base); font-weight: 560; }
.lz-picker-meta { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }
.lz-picker-row-actions { display: flex; align-items: center; gap: 4px; }
.lz-picker-new { display: grid; gap: 1rem; }
.lz-template-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.6rem; }
.lz-template {
  display: grid; gap: 0.3rem; justify-items: start;
  padding: 0.8rem; text-align: left;
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius);
  background: var(--lz-bg);
  transition: border-color var(--lz-fast) var(--lz-ease), transform var(--lz-fast) var(--lz-ease);
}
.lz-template:hover { border-color: var(--lz-accent); transform: translateY(-2px); }
.lz-template-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--lz-accent-soft); color: var(--lz-accent); margin-bottom: 0.2rem; }
.lz-template-label { font-size: var(--lz-font-base); font-weight: 560; }
.lz-template-blurb { font-size: var(--lz-font-xs); color: var(--lz-fg-muted); line-height: 1.55; }
.lz-picker-blank { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
.lz-picker-blank .lz-input { max-width: 240px; }
.lz-prompt { display: grid; gap: 0.75rem; }

.lz-welcome { display: grid; gap: 1rem; }
.lz-welcome-choices { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.lz-welcome-choice {
  display: inline-flex; align-items: center; gap: 0.45rem;
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--lz-border); border-radius: 999px;
  background: var(--lz-bg); color: var(--lz-fg-muted); font-size: var(--lz-font-sm);
  transition: border-color var(--lz-fast) var(--lz-ease), color var(--lz-fast) var(--lz-ease), background var(--lz-fast) var(--lz-ease), transform var(--lz-fast) var(--lz-ease);
}
.lz-welcome-choice:hover { color: var(--lz-fg); transform: translateY(-1px); }
.lz-welcome-choice.is-active { background: var(--lz-accent-soft); border-color: color-mix(in srgb, var(--lz-accent) 40%, transparent); color: var(--lz-accent); }
.lz-welcome-prompt { display: grid; gap: 0.4rem; }
.lz-welcome-input {
  width: 100%; resize: vertical; min-height: 84px;
  padding: 0.65rem 0.7rem;
  border: 1px solid var(--lz-border); border-radius: var(--lz-radius);
  background: var(--lz-bg); color: var(--lz-fg);
  font-family: var(--lz-font); font-size: var(--lz-font-base); line-height: 1.55;
  outline: none;
}
.lz-welcome-input:focus { border-color: var(--lz-accent); box-shadow: 0 0 0 3px var(--lz-accent-soft); }
.lz-welcome-hint { font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); line-height: 1.55; }
.lz-welcome-modes { display: flex; flex-wrap: wrap; gap: 0.4rem; }

/* ---------------------------------------------------------- responsive --- */
.lz-mobile-only { display: none; }

@media (max-width: 900px) {
  .lz-workspace { grid-template-rows: auto minmax(0, 1fr) auto; }
  .lz-middle { grid-template-columns: minmax(0, 1fr); }

  .lz-workspace[data-mobile-tab="files"] .lz-sidebar { display: flex; }
  .lz-workspace[data-mobile-tab="editor"] .lz-editor-slot { display: flex; }
  .lz-workspace[data-mobile-tab="chat"] .lz-ai-slot { display: block; }
  .lz-sidebar-nav { grid-template-columns: repeat(4, 1fr); }
  .lz-mobile-only { display: block; order: 3; }

    display: flex; border-top: 1px solid var(--lz-border);
    background: var(--lz-surface); padding: 4px 6px 6px; gap: 4px;
  }
  .lz-mobile-tab {
    flex: 1; display: grid; justify-items: center; gap: 3px;
    padding: 6px 2px; border-radius: var(--lz-radius-sm);
    font-size: 10px; color: var(--lz-fg-subtle);
  }
  .lz-mobile-tab.is-active { background: var(--lz-accent-soft); color: var(--lz-accent); }

  .lz-topbar-path { display: none; }
  .lz-code-minimap { display: none !important; }

  .lz-settings { grid-template-columns: 1fr; }
  .lz-settings-nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 4px; }
  .lz-settings-nav-item { white-space: nowrap; }
  .lz-toasts { left: 12px; right: 12px; bottom: 76px; align-items: stretch; }
  .lz-toast { width: auto; }
  .lz-preview-device.is-tablet, .lz-preview-device.is-mobile { max-width: 100%; }
  .lz-selection-bubble { display: none; }
}

/* ---- folding ----------------------------------------------------------- */
.lz-gutter-fold,
.lz-gutter-fold-spacer { width: 12px; height: 12px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 12px; }
.lz-gutter-fold { border: 0; padding: 0; background: none; color: var(--lz-fg-subtle); cursor: pointer; border-radius: 3px; }
.lz-gutter-fold svg { transition: transform var(--lz-fast) var(--lz-ease); transform: rotate(90deg); }
.lz-gutter-fold.is-collapsed svg { transform: rotate(0deg); }
.lz-gutter-fold:hover { color: var(--lz-fg); background: var(--lz-surface-3); }
.lz-line.is-folded { display: none; }
.lz-fold-chip {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  border: 1px solid var(--lz-border);
  background: var(--lz-surface-2);
  color: var(--lz-fg-muted);
  font: inherit;
  font-size: 0.72rem;
  padding: 0.05rem 0.45rem;
  border-radius: 999px;
  cursor: pointer;
}

.lz-fold-chip:hover { color: var(--lz-fg); border-color: var(--lz-border-strong); }
.lz-code-content .lz-line { position: relative; }

/* ---- inline completion popup ------------------------------------------- */
.lz-complete {
  position: absolute;
  z-index: 6;
  min-width: 220px;
  max-width: 320px;
  padding: 0.25rem;
  border: 1px solid var(--lz-border-strong);
  border-radius: var(--lz-radius);
  background: var(--lz-surface-2);
  box-shadow: var(--lz-shadow-2);
  display: grid;
  gap: 1px;
}
.lz-complete[hidden] { display: none; }
.lz-complete-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  padding: 0.3rem 0.45rem;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--lz-fg);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.lz-complete-item.is-active { background: var(--lz-accent-soft); color: var(--lz-accent-fg); }
.lz-complete-word { font-family: var(--lz-mono); font-size: var(--lz-font-sm); }
.lz-complete-kind { margin-left: auto; font-size: var(--lz-font-xs); color: var(--lz-fg-subtle); }

/* ========== core/util.js ========== */

(function () {

  const SVG_NS = 'http://www.w3.org/2000/svg';

    js: { id: 'js', label: 'JavaScript', comment: '//' },
    jsx: { id: 'js', label: 'JavaScript React', comment: '//' },
    ts: { id: 'ts', label: 'TypeScript', comment: '//' },
    tsx: { id: 'ts', label: 'TypeScript React', comment: '//' },

    md: { id: 'md', label: 'Markdown' },
    svg: { id: 'html', label: 'SVG' },

/* ============================================================================
 * Luzzes — core/worker.js

  function toLines(text) { return text.split('\\n'); }

      matcher.lastIndex = 0;

          col: match.index + 1,
          length: match[0].length,
          text: line.length > 240 ? line.slice(0, 240) : line,
          before: i > 0 ? lines[i - 1].slice(0, 160) : null,
          after: i < lines.length - 1 ? lines[i + 1].slice(0, 160) : null

      matcher = data.isRegex ? new RegExp(data.query, data.caseSensitive ? 'g' : 'gi') : null;
    } catch (error) {

    }

    const needle = data.caseSensitive ? query : query.toLowerCase();
    const results = [];
    let scanned = 0, total = 0;
    let stopped = false;

      if (!asset) { ctx.missing.push(ref + ' (from ' + fromPath + ')'); return match; }
      if ((asset.content || '').length > MAX_INLINE_BYTES) return match;
      ctx.inlined.push(asset.path);
      return 'url("' + assetUrl(asset) + '")';
    });

    return css;
  }

  function inlineCss(path, project, ctx, depth) {
    const file = U.normalizePath(path);
    if (ctx.seen[file] || depth > 6) return '';
    const entry = LZ.projects.file(file);
    if (!entry) {
      if (!isRemote(path)) ctx.missing.push(path + ' (stylesheet)');
      return '';
    }
    ctx.seen[file] = true;
    ctx.inlined.push(file);
    const css = inlineCssText(entry.content || '', file, project, ctx, depth);
    return '/* ' + file + ' */\n' + css;
  }

  /* ----------------------------------------------------------------- html -- */

  function inlineHtml(entryPath, project, ctx) {
    const entry = LZ.projects.file(entryPath);
    if (!entry) return { body: '', head: '' };
    ctx.inlined.push(entry.path);
    let html = entry.content || '';

    /* <link rel="stylesheet" href> */
    html = html.replace(/<link\b[^>]*rel\s*=\s*["']?stylesheet["']?[^>]*>/gi, (tag) => {
      const href = /\bhref\s*=\s*["']([^"']+)["']/i.exec(tag);
      if (!href) return tag;
      const ref = href[1];
      if (isRemote(ref)) { ctx.remote.push(ref); return '<\!-- Luzzes preview: remote stylesheet ' + ref + ' (not loaded offline) -->'; }
      const target = resolve(entryPath, ref);
      const exists = target && LZ.projects.file(target);
      if (!exists) { ctx.missing.push(ref + ' (stylesheet)'); return '<\!-- Luzzes preview: missing stylesheet ' + ref + ' -->'; }
      const css = inlineCss(target, project, ctx, 0);
      return '<style data-from="' + U.escapeHtml(target) + '">\n' + css + '\n</style>';
    });

    /* <style> blocks may contain @import / url() too */
    html = html.replace(/<style\b([^>]*)>([\s\S]*?)<\/style>/gi, (match, attrs, css) => {
      if (!/@import|url\(/i.test(css)) return match;
      return '<style' + attrs + '>' + inlineCssText(css, entryPath, project, ctx, 0) + '</style>';
    });

    /* <script src> */
    html = html.replace(/<script\b([^>]*)\bsrc\s*=\s*["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (match, pre, src, post) => {
      if (isRemote(src)) { ctx.remote.push(src); return '<\!-- Luzzes preview: remote script ' + src + ' (not loaded offline) -->'; }
      const target = resolve(entryPath, src);
      const file = target ? LZ.projects.file(target) : null;
      if (!file) { ctx.missing.push(src + ' (script)'); return '<\!-- Luzzes preview: missing script ' + src + ' -->'; }
      ctx.inlined.push(file.path);
      const attrs = (pre + ' ' + post).replace(/\s+/g, ' ').trim();
      return '<script data-from="' + U.escapeHtml(file.path) + '"' + (attrs ? ' ' + attrs : '') + '>\n' + escapeScript(file.content) + '\n<\/script>';
    });

    /* <img src>, <source src>, <video poster> etc. */
    html = html.replace(/(\b(?:src|poster)\s*=\s*)(["'])([^"']+)\2/gi, (match, lead, quote, ref) => {
      if (isRemote(ref) || ref.charAt(0) === '#' || !/\.[a-z0-9]{1,6}$/i.test(ref)) {
        if (/^https?:|^\/\//i.test(ref)) ctx.remote.push(ref);
        return match;
      }
      const target = resolve(entryPath, ref);
      const file = target ? LZ.projects.file(target) : null;
      if (!file) { ctx.missing.push(ref + ' (asset)'); return match; }
      ctx.inlined.push(file.path);
      return lead + quote + assetUrl(file) + quote;
    });

    /* links to files inside the project open in the editor instead of navigating */
    html = html.replace(/<a\b([^>]*?)href\s*=\s*["']([^"']+)["']([^>]*)>/gi, (match, pre, ref, post) => {
      if (isRemote(ref)) return match;
      const target = resolve(entryPath, ref);
      if (!target || !LZ.projects.file(target)) return match;
      const hrefAttr = /\bhref\s*=\s*["'][^"']+["']/i;
      return '<a data-luzzes-file="' + U.escapeHtml(target) + '" ' + (pre + ' href="' + U.escapeHtml(ref) + '" ' + post).replace(/\s+/g, ' ').replace(hrefAttr, 'href="#"') + '>';
    });

    /* viewport meta if the author forgot it */
    if (!/<meta\b[^>]*name\s*=\s*["']viewport["']/i.test(html)) {
      html = html.replace(/<head\b[^>]*>/i, (tag) => tag + '\n  <meta name="viewport" content="width=device-width, initial-scale=1">');
    }
    if (!/<meta\b[^>]*charset/i.test(html)) {
      html = html.replace(/<head\b[^>]*>/i, (tag) => tag + '\n  <meta charset="utf-8">');
    }

    /* strip any nested <html>/<head>/<body> so the result composes cleanly */
    const headMatch = /<head\b[^>]*>([\s\S]*?)<\/head>/i.exec(html);
    const head = headMatch ? headMatch[1].replace(/<meta\b[^>]*charset[^>]*>/gi, '').trim() : '';
    const bodyMatch = /<body\b[^>]*>([\s\S]*?)<\/body>/i.exec(html);
    const body = bodyMatch ? bodyMatch[1] : html.replace(/[\s\S]*?<head\b[^>]*>[\s\S]*?<\/head>/i, '');
    return { head, body };
  }

  /* ----------------------------------------------------------------- api --- */

  preview.build = function (project, entryPath) {
    const ctx = { inlined: [], remote: [], missing: [], seen: {} };
    const target = project || LZ.projects.get().current;
    if (!target || !target.files || !target.files.length) {
      return { html: shell('en', '<p style="font:14px system-ui;color:#7b8095;padding:2rem">Nothing to preview yet — create a file first.</p>'), inlined: [], remote: [], missing: [], entry: null };
    }
    const htmlFiles = target.files.filter((f) => /\.html?$/i.test(f.path));
    const entry = (entryPath && target.files.some((f) => f.path === entryPath) ? entryPath : null)
      || (htmlFiles.some((f) => f.path === 'index.html') ? 'index.html' : null)
      || (htmlFiles[0] && htmlFiles[0].path)
      || (target.files[0] && target.files[0].path);

    const file = target.files.find((f) => f.path === entry);
    if (!file) return { html: shell('en', '<p>Entry file not found.</p>'), inlined: [], remote: [], missing: [], entry: null };

    if (/\.md$/i.test(entry)) {
      ctx.inlined.push(entry);
      const rendered = LZ.md && LZ.md.render
        ? LZ.md.render(file.content)
        : '<pre>' + U.escapeHtml(file.content) + '</pre>';
      return { html: shell('markdown', rendered, null), inlined: ctx.inlined, remote: ctx.remote, missing: ctx.missing, entry };
    }

    if (!/\.html?$/i.test(entry)) {
      /* a script or stylesheet was chosen as the entry point — show the source read-only */
      ctx.inlined.push(entry);
      const body = '<body style="font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;padding:1.5rem;white-space:pre-wrap">'
        + U.escapeHtml(file.content || '') + '</body>';
      return { html: shell('en', body, null), inlined: ctx.inlined, remote: ctx.remote, missing: ctx.missing, entry };
    }

    const parts = inlineHtml(entry, target, ctx);
    const html = shell('en', parts.body || '', parts.head);

    /* de-duplicate the report */
    const uniq = (list) => list.filter((item, index) => list.indexOf(item) === index);
    return {
      html,
      entry,
      inlined: uniq(ctx.inlined),
      remote: uniq(ctx.remote),
      missing: uniq(ctx.missing)
    };
  };

  preview.summary = function (built) {
    const bits = [];
    if (built.inlined.length) bits.push(built.inlined.length + ' file' + (built.inlined.length === 1 ? '' : 's') + ' inlined');
    if (built.missing.length) bits.push(built.missing.length + ' missing reference' + (built.missing.length === 1 ? '' : 's'));
    if (built.remote.length) bits.push(built.remote.length + ' remote reference' + (built.remote.length === 1 ? '' : 's') + ' (offline sandbox)');
    return bits.join(' · ') || 'self-contained';
  };
})();

/* ========== core/store.js ========== */
/* ============================================================================
 * Luzzes — core/store.js
 * Local persistence: IndexedDB for projects/conversations, localStorage for
 * lightweight UI + settings state. No account, no network, no server.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const store = (LZ.store = {});

  const DB_NAME = 'luzzes';
  const DB_VERSION = 1;
  const STORES = ['projects', 'conversations', 'meta', 'assets'];

  let dbPromise = null;
  let idbBroken = !U.supports.indexedDB;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { idbBroken = true; reject(e); return; }
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach((name) => {
          if (!db.objectStoreNames.contains(name)) {
            db.createObjectStore(name, { keyPath: name === 'meta' ? 'key' : 'id' });
          }
        });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { idbBroken = true; reject(req.error); };
      req.onblocked = () => reject(new Error('IndexedDB upgrade blocked by another tab.'));
    }).catch((err) => { idbBroken = true; throw err; });
    return dbPromise;
  }

  function tx(name, mode) {
    return openDB().then((db) => db.transaction(name, mode).objectStore(name));
  }
  function reqAsPromise(request) {
    return new Promise((resolve, reject) => {
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  /* --------------------------------------------------- localStorage layer -- */
  const NS = 'luzzes:';
  const local = (store.local = {
    get(key, fallback) {
      try {
        const raw = window.localStorage.getItem(NS + key);
        if (raw == null) return fallback;
        return JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { window.localStorage.setItem(NS + key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    },
    remove(key) { try { window.localStorage.removeItem(NS + key); } catch (e) { /* ignore */ } },
    keys() {
      const out = [];
      try {
        for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.indexOf(NS) === 0) out.push(k.slice(NS.length));
        }
      } catch (e) { /* ignore */ }
      return out;
    }
  });

  /** Is localStorage actually usable (sandboxed frames and private mode block it)? */
  let localOK = null;
  store.localAvailable = function () {
    if (localOK !== null) return localOK;
    try {
      const probe = NS + '__probe';
      window.localStorage.setItem(probe, '1');
      window.localStorage.removeItem(probe);
      localOK = true;
    } catch (e) { localOK = false; }
    return localOK;
  };

  /* --------------------------------------------------------- project CRUD -- */
  store.available = () => !idbBroken;

  /**
   * What persistence this context actually offers:
   *   indexeddb | localstorage | memory
   * The workspace stays fully usable in every case — it just has to be honest
   * about what will survive a reload.
   */
  store.backend = function () {
    if (!idbBroken) return 'indexeddb';
    if (store.localAvailable()) return 'localstorage';
    return 'memory';
  };

  store.listProjects = async function () {
    try {
      const os = await tx('projects', 'readonly');
      const all = await reqAsPromise(os.getAll());
      const stripped = all.map((p) => Object.assign({}, p, {
        files: (p.files || []).map((f) => ({ id: f.id, path: f.path, modified: f.modified, size: (f.content || '').length }))
      }));
      return stripped.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    } catch (e) {
      const fallback = local.get('projects-fallback', []);
      return fallback.map((p) => Object.assign({}, p, { files: (p.files || []).map((f) => ({ id: f.id, path: f.path, modified: f.modified })) }));
    }
  };

  store.getProject = async function (id) {
    try {
      const os = await tx('projects', 'readonly');
      return (await reqAsPromise(os.get(id))) || null;
    } catch (e) {
      const fallback = local.get('projects-fallback', []);
      return fallback.find((p) => p.id === id) || null;
    }
  };

  store.saveProject = async function (project) {
    project.updatedAt = Date.now();
    try {
      const os = await tx('projects', 'readwrite');
      await reqAsPromise(os.put(project));
      return { mode: 'indexeddb' };
    } catch (e) {
      // fallback keeps the session usable, with a smaller size budget
      const list = local.get('projects-fallback', []);
      const index = list.findIndex((p) => p.id === project.id);
      if (index > -1) list[index] = project; else list.push(project);
      const ok = local.set('projects-fallback', list);
      return { mode: ok ? 'localstorage' : 'none', error: ok ? null : e };
    }
  };

  store.deleteProject = async function (id) {
    try {
      const os = await tx('projects', 'readwrite');
      await reqAsPromise(os.delete(id));
    } catch (e) {
      const list = local.get('projects-fallback', []).filter((p) => p.id !== id);
      local.set('projects-fallback', list);
    }
    await store.deleteConversation(id);
  };

  store.renameProject = async function (id, name) {
    const project = await store.getProject(id);
    if (!project) return null;
    project.name = name;
    await store.saveProject(project);
    return project;
  };

  /* ---------------------------------------------------- conversation CRUD -- */
  store.getConversation = async function (projectId) {
    try {
      const os = await tx('conversations', 'readonly');
      return (await reqAsPromise(os.get(projectId))) || null;
    } catch (e) {
      return local.get('conv-' + projectId, null);
    }
  };
  store.saveConversation = async function (projectId, messages) {
    const doc = { id: projectId, messages, updatedAt: Date.now() };
    try {
      const os = await tx('conversations', 'readwrite');
      await reqAsPromise(os.put(doc));
    } catch (e) {
      local.set('conv-' + projectId, doc);
    }
    return doc;
  };
  store.deleteConversation = async function (projectId) {
    try {
      const os = await tx('conversations', 'readwrite');
      await reqAsPromise(os.delete(projectId));
    } catch (e) { local.remove('conv-' + projectId); }
  };

  /* ------------------------------------------------------------ meta KV --- */
  store.getMeta = async function (key, fallback) {
    try {
      const os = await tx('meta', 'readonly');
      const row = await reqAsPromise(os.get(key));
      return row ? row.value : fallback;
    } catch (e) { return local.get('meta-' + key, fallback); }
  };
  store.setMeta = async function (key, value) {
    try {
      const os = await tx('meta', 'readwrite');
      await reqAsPromise(os.put({ key, value, updatedAt: Date.now() }));
    } catch (e) { local.set('meta-' + key, value); }
    return value;
  };

  /* -------------------------------------------------------------- assets -- */
  store.putAsset = async function (asset) {
    try {
      const os = await tx('assets', 'readwrite');
      await reqAsPromise(os.put(asset));
      return true;
    } catch (e) { return false; }
  };
  store.listAssets = async function () {
    try {
      const os = await tx('assets', 'readonly');
      return await reqAsPromise(os.getAll());
    } catch (e) { return []; }
  };

  /* ------------------------------------------------------- bulk helpers --- */
  store.exportAll = async function () {
    const projects = [];
    const list = await store.listProjects();
    for (const summary of list) {
      const full = await store.getProject(summary.id);
      const conv = await store.getConversation(summary.id);
      projects.push({ project: full, conversation: conv });
    }
    return {
      format: 'luzzes-export',
      version: 1,
      exportedAt: new Date().toISOString(),
      settings: local.get('settings', null),
      workspace: local.get('workspace', null),
      projects
    };
  };

  store.clearAll = async function () {
    try {
      const db = await openDB();
      await Promise.all(STORES.map((name) => reqAsPromise(db.transaction(name, 'readwrite').objectStore(name).clear())));
    } catch (e) { /* fall through */ }
    local.keys().forEach((k) => local.remove(k));
    return true;
  };

  store.usage = async function () {
    const list = await store.listProjects();
    let bytes = 0;
    for (const summary of list) {
      const full = await store.getProject(summary.id);
      (full && full.files ? full.files : []).forEach((f) => { bytes += (f.content || '').length; });
    }
    let lsBytes = 0;
    local.keys().forEach((k) => {
      try { lsBytes += (window.localStorage.getItem(NS + k) || '').length + k.length; } catch (e) { /* ignore */ }
    });
    return { projects: list.length, projectBytes: bytes, localBytes: lsBytes, backend: idbBroken ? 'localStorage' : 'IndexedDB' };
  };

  /* ------------------------------------------------- import / export ---- */
  store.exportProjectFiles = function (project) {
    return (project.files || []).map((f) => ({ id: f.id, path: f.path, name: U.basename(f.path), language: U.detectLang(f.path).label, content: f.content, modified: f.modified }));
  };

  store.makeProject = function (name, files, opts) {
    opts = opts || {};
    const now = Date.now();
    return {
      id: opts.id || U.uid('prj'),
      name: name || 'Untitled project',
      createdAt: opts.createdAt || now,
      updatedAt: opts.updatedAt || now,
      description: '',
      isDemo: !!opts.isDemo,
      files: (files || []).map((f) => ({
        id: f.id || U.uid('file'),
        path: U.normalizePath(f.path),
        content: f.content == null ? '' : f.content,
        modified: f.modified || now,
        binary: !!f.binary,
        dataUrl: f.dataUrl || null
      })),
      settings: {}
    };
  };
})();

/* ========== core/state.js ========== */
/* ============================================================================
 * Luzzes — core/state.js
 * A dependency-free reactive store. Stores hold plain objects, notify on
 * change, and optionally persist a slice to localStorage (debounced).
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;

  /**
   * @param {object} initial
   * @param {{persistKey?:string, pick?:function, throttleMs?:number}} [opts]
   */
  LZ.createStore = function createStore(initial, opts) {
    opts = opts || {};
    const listeners = new Set();
    let state = Object.assign({}, initial);

    const flush = opts.persistKey ? U.debounce(() => {
      LZ.store.local.set(opts.persistKey, opts.pick ? opts.pick(state) : state);
    }, opts.throttleMs || 260) : null;

    function get() { return state; }

    function notify(patch, meta) {
      listeners.forEach((fn) => {
        try { fn(state, patch, meta); } catch (e) { console.error('[luzzes:store]', e); }
      });
    }

    function set(patch, meta) {
      if (typeof patch === 'function') patch = patch(state);
      if (!patch) return state;
      let changed = false;
      const next = Object.assign({}, state);
      for (const key in patch) {
        if (patch[key] !== state[key]) { next[key] = patch[key]; changed = true; }
      }
      if (!changed) return state;
      state = next;
      if (flush) flush();
      notify(patch, meta);
      return state;
    }

    return {
      get, set,
      /** set a nested value via dotted path: store.setIn('editor.fontSize', 15) */
      setIn(path, value, meta) {
        const parts = String(path).split('.');
        const root = Object.assign({}, state);
        let cursor = root;
        for (let i = 0; i < parts.length - 1; i++) {
          cursor[parts[i]] = Object.assign({}, cursor[parts[i]] || {});
          cursor = cursor[parts[i]];
        }
        if (cursor[parts[parts.length - 1]] === value) return state;
        cursor[parts[parts.length - 1]] = value;
        return set(root, meta);
      },
      getIn(path, fallback) {
        const parts = String(path).split('.');
        let cursor = state;
        for (let i = 0; i < parts.length; i++) {
          if (cursor == null) return fallback;
          cursor = cursor[parts[i]];
        }
        return cursor === undefined ? fallback : cursor;
      },
      subscribe(fn, opts2) {
        listeners.add(fn);
        if (opts2 && opts2.immediate) fn(state, null, { initial: true });
        return () => listeners.delete(fn);
      },
      reset(next) {
        state = Object.assign({}, initial, next || {});
        notify(state, { reset: true });
        return state;
      },
      /** re-read persisted value (used on startup) */
      hydrate() {
        if (!opts.persistKey) return state;
        const saved = LZ.store.local.get(opts.persistKey, null);
        if (saved && typeof saved === 'object') state = Object.assign({}, state, saved);
        return state;
      }
    };
  };

  /* ------------------------------------------------------------- selectors */
  LZ.select = function select(store, projection, handler) {
    let last;
    const run = (state) => {
      const value = projection(state);
      if (value === last) return;
      last = value;
      handler(value);
    };
    run(store.get());
    return store.subscribe(run);
  };
})();

  const MAIN_JS = `/* Luzzes Landing — progressive enhancement only. */
(function () {
  'use strict';

  var storage = {
    get: function (key) {
      try { return window.localStorage.getItem(key); } catch (e) { return null; }
    },
    set: function (key, value) {
      try { window.localStorage.setItem(key, value); } catch (e) { /* storage may be blocked in sandboxes */ }
    }
  };

  /* Theme ---------------------------------------------------------------- */
  var root = document.documentElement;
  var saved = storage.get('luzzes-landing-theme');
  if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);

  var toggle = document.getElementById('theme-toggle');
  if (toggle) {
    toggle.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      storage.set('luzzes-landing-theme', next);
      toggle.animate(
        [{ transform: 'rotate(0deg)' }, { transform: 'rotate(180deg)' }],
        { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' }
      );
    });
  }

  /* Sticky nav shadow ---------------------------------------------------- */
  var nav = document.querySelector('.nav');
  var onScroll = function () {
    if (!nav) return;
    nav.classList.toggle('is-scrolled', window.scrollY > 8);
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* Code stage tabs ------------------------------------------------------ */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.stage-tab'));
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (other) {
        var active = other === tab;
        other.classList.toggle('is-active', active);
        other.setAttribute('aria-selected', String(active));
      });
      var panels = document.querySelectorAll('.stage-code');
      Array.prototype.forEach.call(panels, function (panel) {
        panel.hidden = panel.getAttribute('data-panel') !== tab.getAttribute('data-file');
      });
    });
  });

  /* Reveal on scroll ----------------------------------------------------- */
  var items = document.querySelectorAll('.reveal');
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || !('IntersectionObserver' in window)) {
    Array.prototype.forEach.call(items, function (el) { el.classList.add('is-visible'); });
  } else {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
    Array.prototype.forEach.call(items, function (el, index) {
      el.style.transitionDelay = Math.min(index * 45, 260) + 'ms';
      observer.observe(el);
    });
  }
})();
`;

type HeroProps = {
  headline?: string;
  subline?: string;
  accent?: string;
  onStart?: () => void;
};

/**
 * Landing hero. Adds a restrained animated backdrop and a two-tone headline
 * while preserving the existing props and className contract.

export function Hero({
  headline = 'Build anything',
  subline = 'Turn ideas into working software, directly in your browser.',
  accent = 'with Luzzes',
  onStart,
}: HeroProps) {
  const sectionRef = useRef<HTMLElement | null>(null);
  const layersRef = useRef<HTMLDivElement | null>(null);

  useEffect(() => {
    const layers = layersRef.current;
    if (!layers) return;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) return;

    // Respect the reduced-motion preference before starting any animation.
    let frame = 0;
    let offset = 0;
    const drift = () => {
      offset += 0.15;
      layers.style.transform = 'translate3d(0,' + (Math.sin(offset / 40) * 12).toFixed(2) + 'px,0)';
      frame = requestAnimationFrame(drift);
    };
    frame = requestAnimationFrame(drift);
    return () => cancelAnimationFrame(frame);
  }, []);

        <span />

  const THEME_TS = `export type Theme = 'light' | 'dark';

const STORAGE_KEY = 'luzzes-landing-theme';

export function readTheme(): Theme {
  try {
    const value = window.localStorage.getItem(STORAGE_KEY);
    if (value === 'light' || value === 'dark') return value;
  } catch (error) {
    // Storage can be unavailable (private mode, sandboxed frames).
  }
  return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

export function applyTheme(theme: Theme): void {
  document.documentElement.setAttribute('data-theme', theme);
  try {
    window.localStorage.setItem(STORAGE_KEY, theme);
  } catch (error) {
    // Non-fatal: the theme simply will not persist.
  }
}
`;

    const id = ++toastId;
    const entry = Object.assign({
      id, kind: 'info', title: '', message: '', duration: 4200, actions: []
    }, typeof toast === 'string' ? { title: toast } : toast);
    ui.set({ toasts: ui.get().toasts.concat([entry]) });
    if (entry.duration > 0) {
      setTimeout(() => ui.dismissToast(id), entry.duration);
    }
    return id;
  };
  ui.dismissToast = function (id) {
    ui.set({ toasts: ui.get().toasts.filter((t) => t.id !== id) });
  };
  ui.openDialog = function (dialog) { ui.set({ dialog }); };
  ui.closeDialog = function () { ui.set({ dialog: null }); };
})();

/* ========== state/projects.js ========== */
/* ============================================================================
 * Luzzes — state/projects.js
 * The project store: files, persistence, import/export. Everything happens in
 * the browser — IndexedDB when available, localStorage otherwise.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;

  const SORT_KEY = (a, b) => {
    const aFolder = a.indexOf('/') > -1;
    const bFolder = b.indexOf('/') > -1;
    if (a === b) return 0;
    return U.naturalCompare(a, b);
  };
  void SORT_KEY;

  const projects = LZ.projects = LZ.createStore({
    ready: false,
    list: [],
    current: null,
    fileIndex: {},
    dirty: false,
    saving: false,
    lastSavedAt: null,
    backend: 'IndexedDB',
    note: null
  });

  projects.buildIndex = function (project) {
    const index = {};
    (project && project.files ? project.files : []).forEach((f) => { index[f.path] = f; });
    return index;
  };

  projects.setCurrent = function (project) {
    projects.set({
      current: project,
      fileIndex: projects.buildIndex(project),
      ready: true,
      dirty: false
    });
    if (project) LZ.store.local.set('last-project', project.id);
  };

  projects.fileList = function () {
    const project = projects.get().current;
    return project && project.files ? project.files : [];
  };

  projects.file = function (path) {
    return projects.get().fileIndex[path] || null;
  };

  projects.read = function (path) {
    const f = projects.file(path);
    return f ? (f.content == null ? '' : f.content) : null;
  };

  /* ------------------------------------------------------------ lifecycle - */
  /**
   * Load the last project, or seed the demo one on a first run.
   *
   * Storage is best-effort on purpose: a sandboxed frame (or private mode) can
   * block both IndexedDB and localStorage. The workspace still starts — in
   * memory — and says so rather than failing to open.
   */
  projects.init = async function () {
    const backend = LZ.store.backend();
    let list = [];
    if (backend !== 'memory') {
      try { list = await LZ.store.listProjects(); } catch (e) { list = []; }
    }

    const demoProject = LZ.demo.project();

    if (!list.length) {
      // First run (or no persistence): seed the demo project so the workspace is never empty.
      if (backend !== 'memory') {
        try { await LZ.store.saveProject(demoProject); } catch (e) { /* storage refused — keep going */ }
        try { await LZ.store.saveConversation(demoProject.id, LZ.demo.conversation().messages); } catch (e) { /* ignore */ }
        try { list = await LZ.store.listProjects(); } catch (e) { list = []; }
      }
      if (!list.length) {
        list = [{
          id: demoProject.id, name: demoProject.name, createdAt: demoProject.createdAt,
          updatedAt: demoProject.updatedAt, fileCount: demoProject.files.length, isDemo: true
        }];
      }
      LZ.store.local.set('demo-conversation-live', true);
    }

    const lastId = LZ.store.local.get('last-project', null);
    const target = list.filter((p) => p.id === lastId)[0] || list[0];
    let full = null;
    if (target && backend !== 'memory') {
      try { full = await LZ.store.getProject(target.id); } catch (e) { full = null; }
    }

    projects.set({
      list,
      backend,
      note: backend === 'indexeddb' ? null
        : backend === 'localstorage' ? 'IndexedDB is unavailable here — projects are kept in localStorage, which has a much smaller limit.'
          : 'This page is running somewhere that blocks browser storage (a sandboxed frame or private mode). Everything works, but nothing is saved after you reload — export anything you want to keep.'
    });
    projects.setCurrent(full || LZ.store.makeProject(demoProject.name, demoProject.files, { id: demoProject.id, isDemo: true }));
    return projects.get().current;
  };

  projects.refreshList = async function () {
    const list = await LZ.store.listProjects();
    projects.set({ list });
    return list;
  };

  projects.open = async function (id) {
    const full = await LZ.store.getProject(id);
    if (!full) {
      LZ.ui.toast({ kind: 'error', title: 'Project not found', message: 'It may have been deleted from local storage.' });
      return null;
    }
    projects.setCurrent(full);
    LZ.bus.emit('project:open', full);
    return full;
  };

  projects.create = async function (opts) {
    opts = opts || {};
    let files = opts.files;
    if (!files && opts.templateId) {
      const template = LZ.demo.templateById(opts.templateId);
      files = template.files.map((f) => ({ path: f.path, content: f.content }));
      if (!opts.name) opts.name = template.label;
    }
    const project = LZ.store.makeProject(opts.name || 'Untitled project', files || []);
    project.description = opts.description || '';
    await LZ.store.saveProject(project);
    await projects.refreshList();
    projects.setCurrent(project);
    LZ.bus.emit('project:open', project);
    return project;
  };

  projects.rename = async function (name) {
    const project = projects.get().current;
    if (!project) return null;
    project.name = name.trim() || project.name;
    await LZ.store.saveProject(project);
    projects.set({ current: Object.assign({}, project) });
    await projects.refreshList();
    return project;
  };

  projects.duplicate = async function (id) {
    const source = await LZ.store.getProject(id);
    if (!source) return null;
    const copy = JSON.parse(JSON.stringify(source));
    copy.id = U.uid('prj');
    copy.name = source.name + ' copy';
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    copy.isDemo = false;
    copy.files.forEach((f) => { f.id = U.uid('file'); });
    await LZ.store.saveProject(copy);
    await projects.refreshList();
    return copy;
  };

  projects.remove = async function (id) {
    await LZ.store.deleteProject(id);
    const list = await LZ.store.listProjects();
    projects.set({ list });
    const current = projects.get().current;
    if (current && current.id === id) {
      if (list.length) await projects.open(list[0].id);
      else await projects.create({ name: 'Untitled project', templateId: 'blank' });
    }
    return true;
  };

  /* -------------------------------------------------------------- saving - */
  let scheduled = null;

  projects.markDirty = function () {
    if (!projects.get().dirty) projects.set({ dirty: true });
    LZ.bus.emit('project:dirty', true);
    if (LZ.settings.getIn('editor.autoSave', true)) projects.scheduleSave();
  };

  projects.scheduleSave = function (delay) {
    clearTimeout(scheduled);
    scheduled = setTimeout(() => projects.save(), delay == null ? 900 : delay);
  };

  projects.save = async function () {
    const project = projects.get().current;
    if (!project) return null;
    if (projects.get().saving) { projects.scheduleSave(400); return null; }
    projects.set({ saving: true });
    const result = await LZ.store.saveProject(project);
    const backend = result.mode === 'indexeddb' ? 'IndexedDB' : result.mode === 'localstorage' ? 'localStorage' : 'unavailable';
    projects.set({
      saving: false,
      dirty: result.mode === 'none',
      lastSavedAt: result.mode === 'none' ? projects.get().lastSavedAt : Date.now(),
      backend,
      note: result.mode === 'none'
        ? 'Local storage is unavailable in this browser context — changes are only in memory.'
        : null
    });
    await projects.refreshList();
    LZ.bus.emit('project:saved', { at: projects.get().lastSavedAt, mode: result.mode });
    return result;
  };

  /* ------------------------------------------------------- file mutation - */
  function touch(project, file) {
    file.modified = Date.now();
    project.updatedAt = Date.now();
  }

  projects.createFile = function (path, content, opts) {
    const project = projects.get().current;
    if (!project) return null;
    path = U.normalizePath(path);
    if (!path) return null;
    if (project.files.some((f) => f.path === path)) {
      LZ.ui.toast({ kind: 'warning', title: 'Already exists', message: path + ' is already in this project.' });
      return null;
    }
    const file = {
      id: U.uid('file'),
      path,
      content: content == null ? '' : content,
      modified: Date.now(),
      binary: !!(opts && opts.binary),
      dataUrl: opts && opts.dataUrl ? opts.dataUrl : null
    };
    project.files.push(file);
    touch(project, file);
    projects.set({ current: Object.assign({}, project), fileIndex: projects.buildIndex(project) });
    projects.markDirty();
    LZ.bus.emit('file:created', file);
    return file;
  };

  projects.createFolder = function (path) {
    const project = projects.get().current;
    if (!project) return null;
    path = U.normalizePath(path).replace(/\/+$/, '');
    const keeper = path + '/.gitkeep';
    if (project.files.some((f) => f.path.indexOf(path + '/') === 0)) {
      LZ.ui.toast({ kind: 'info', title: 'Folder already exists', message: path + '/' });
      return null;
    }
    return projects.createFile(keeper, '');
  };

  projects.writeFile = function (path, content, opts) {
    const project = projects.get().current;
    if (!project) return null;
    const file = projects.file(path);
    if (!file) return projects.createFile(path, content);
    if (file.content === content) return file;
    if (!(opts && opts.silent)) {
      LZ.workspace.pushHistory(path, file.content);
    }
    file.content = content;
    touch(project, file);
    projects.set({ current: Object.assign({}, project), fileIndex: projects.buildIndex(project) });
    projects.markDirty();
    LZ.bus.emit('file:changed', { path, file, origin: (opts && opts.origin) || 'user' });
    return file;
  };

  projects.renamePath = function (oldPath, newPath) {
    const project = projects.get().current;
    if (!project) return false;
    oldPath = U.normalizePath(oldPath);
    newPath = U.normalizePath(newPath);
    if (!newPath || oldPath === newPath) return false;
    if (project.files.some((f) => f.path === newPath)) {
      LZ.ui.toast({ kind: 'warning', title: 'Name already used', message: newPath + ' exists.' });
      return false;
    }
    const file = projects.file(oldPath);
    if (file) {
      file.path = newPath;
      touch(project, file);
    } else {
      // folder rename: move every descendant
      project.files.forEach((f) => {
        if (f.path.indexOf(oldPath + '/') === 0) {
          f.path = newPath + f.path.slice(oldPath.length);
          touch(project, f);
        }
      });
    }
    projects.set({ current: Object.assign({}, project), fileIndex: projects.buildIndex(project) });
    projects.markDirty();
    LZ.workspace.handlePathChange(oldPath, newPath);
    LZ.bus.emit('file:renamed', { from: oldPath, to: newPath });
    return true;
  };

  projects.deletePath = function (path) {
    const project = projects.get().current;
    if (!project) return false;
    const before = project.files.length;
    const isFolder = project.files.some((f) => f.path === path + '/.gitkeep') || project.files.some((f) => f.path.indexOf(path + '/') === 0);
    project.files = project.files.filter((f) => {
      if (f.path === path) return false;
      if (isFolder && f.path.indexOf(path + '/') === 0) return false;
      return true;
    });
    if (project.files.length === before) return false;
    touch(project, { modified: Date.now() });
    projects.set({ current: Object.assign({}, project), fileIndex: projects.buildIndex(project) });
    projects.markDirty();
    LZ.workspace.handlePathRemoved(path, isFolder);
    LZ.bus.emit('file:deleted', { path, isFolder });
    return true;
  };

  projects.moveFile = function (fromPath, toFolder) {
    const name = U.basename(fromPath);
    const next = U.joinPath(toFolder, name);
    return projects.renamePath(fromPath, next);
  };

  /* ---------------------------------------------------------------- tree - */
  /**
   * Build a nested tree from flat file paths.
   * @returns {Array<{type:'folder'|'file', name, path, children?, file?}>}
   */
  projects.buildTree = function (files) {
    const root = { type: 'folder', name: '', path: '', children: [] };
    const folders = { '': root };
    const ensureFolder = (path) => {
      if (folders[path]) return folders[path];
      const parentPath = U.dirname(path);
      const parent = ensureFolder(parentPath);
      const node = { type: 'folder', name: U.basename(path), path, children: [] };
      parent.children.push(node);
      folders[path] = node;
      return node;
    };
    files.forEach((file) => {
      const dir = U.dirname(file.path);
      const folder = ensureFolder(dir);
      folder.children.push({
        type: 'file', name: U.basename(file.path), path: file.path, file
      });
    });
    const sortNode = (node) => {
      node.children.sort((a, b) => {
        if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
        return U.naturalCompare(a.name, b.name);
      });
      node.children.forEach((c) => { if (c.type === 'folder') sortNode(c); });
    };
    sortNode(root);
    return root.children;
  };

  /* ------------------------------------------------------------- import -- */
  projects.importEntries = function (entries, opts) {
    opts = opts || {};
    const project = opts.project || projects.get().current;
    if (!project) return { added: 0 };
    const prefix = opts.prefix ? U.normalizePath(opts.prefix).replace(/\/+$/, '') + '/' : '';
    let added = 0;
    entries.forEach((entry) => {
      const path = U.normalizePath(prefix + entry.path);
      if (!path || path.endsWith('/')) return;
      const existing = project.files.find((f) => f.path === path);
      const content = entry.content == null ? '' : entry.content;
      if (existing) {
        if (opts.overwrite !== false && existing.content !== content) {
          LZ.workspace.pushHistory(path, existing.content);
          existing.content = content;
          existing.modified = Date.now();
          added++;
        }
        return;
      }
      project.files.push({
        id: U.uid('file'), path, content, modified: Date.now(),
        binary: !!entry.binary, dataUrl: entry.dataUrl || null
      });
      added++;
    });
    project.updatedAt = Date.now();
    projects.set({ current: Object.assign({}, project), fileIndex: projects.buildIndex(project) });
    projects.markDirty();
    LZ.bus.emit('project:imported', { count: added });
    return { added, total: entries.length };
  };

  /** Import a .zip or .json project file into a new project. */
  projects.importProjectFile = async function (file) {
    const name = (file.name || 'imported').replace(/\.(zip|json)$/i, '');
    if (/\.json$/i.test(file.name || '')) {
      const text = await U.readFileText(file);
      const data = JSON.parse(text);
      const source = data.project || data;
      const project = LZ.store.makeProject(source.name || name, source.files || []);
      project.description = source.description || 'Imported from ' + file.name;
      await LZ.store.saveProject(project);
      await projects.refreshList();
      projects.setCurrent(project);
      return project;
    }
    const entries = await LZ.zip.read(file);
    const dec = new TextDecoder();
    const files = entries
      .filter((e) => !/(^|\/)(\.DS_Store|Thumbs\.db)$/.test(e.path))
      .map((e) => {
        const looksBinary = U.isBinaryName(e.path);
        if (looksBinary && U.isImage(e.path)) {
          let bin = '';
          try { bin = btoa(String.fromCharCode.apply(null, e.data.slice(0, 400000))); } catch (err) { bin = ''; }
          const ext = U.ext(e.path);
          const mime = ext === 'svg' ? 'image/svg+xml' : 'image/' + (ext === 'jpg' ? 'jpeg' : ext);
          return { path: e.path, content: '', binary: true, dataUrl: 'data:' + mime + ';base64,' + bin };
        }
        if (looksBinary) return { path: e.path, content: '/* binary file — ' + U.fmtBytes(e.data.length) + ' */', binary: true };
        return { path: e.path, content: dec.decode(e.data) };
      });
    const project = LZ.store.makeProject(name || 'Imported project', files);
    project.description = 'Imported from ' + file.name;
    await LZ.store.saveProject(project);
    await projects.refreshList();
    projects.setCurrent(project);
    return project;
  };

  projects.importFilesIntoCurrent = async function (fileList) {
    const entries = [];
    const dec = new TextDecoder();
    for (const file of fileList) {
      const relative = file.webkitRelativePath || file.name;
      if (U.isBinaryName(relative)) {
        if (U.isImage(relative)) {
          const dataUrl = await U.readFileDataURL(file);
          entries.push({ path: relative, content: '', binary: true, dataUrl });
        }
        continue;
      }
      const content = dec.decode(new Uint8Array(await file.arrayBuffer()));
      entries.push({ path: relative, content });
    }
    return projects.importEntries(entries, { prefix: '' });
  };

  /* ------------------------------------------------------------- export -- */
  projects.exportEntries = function (project) {
    project = project || projects.get().current;
    return (project.files || []).map((f) => {
      if (f.binary && f.dataUrl) {
        const base64 = f.dataUrl.split(',')[1] || '';
        const bin = atob(base64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return { path: f.path, data: bytes };
      }
      return { path: f.path, data: f.content == null ? '' : f.content };
    });
  };

  projects.exportZip = async function () {
    const project = projects.get().current;
    if (!project) return null;
    const blob = await LZ.zip.create(projects.exportEntries(project));
    U.download(U.slugify(project.name) + '.zip', blob);
    return blob;
  };

  projects.exportJSON = function () {
    const project = projects.get().current;
    if (!project) return null;
    const payload = {
      format: 'luzzes-project',
      version: 1,
      exportedAt: new Date().toISOString(),
      project: {
        name: project.name,
        description: project.description || '',
        createdAt: project.createdAt,
        files: project.files.map((f) => ({
          path: f.path, content: f.content, binary: !!f.binary, dataUrl: f.dataUrl || null, modified: f.modified
        })),
        settings: project.settings || {}
      }
    };
    U.download(U.slugify(project.name) + '.json', JSON.stringify(payload, null, 2), 'application/json');
    return payload;
  };

  projects.downloadFile = function (path) {
    const file = projects.file(path);
    if (!file) return false;
    if (file.binary && file.dataUrl) {
      U.download(U.basename(path), file.dataUrl.replace(/^data:[^,]+,/, ''), 'application/octet-stream');
      return true;
    }
    U.download(U.basename(path), file.content || '');
    return true;
  };

  /* ------------------------------------------------------------ file I/O - */
  projects.exportEntries = projects.exportEntries;

  projects.stats = function (project) {
    project = project || projects.get().current;
    if (!project) return { files: 0, bytes: 0, languages: [] };
    let bytes = 0;
    const languages = new Map();
    project.files.forEach((f) => {
      bytes += (f.content || '').length;
      const info = U.detectLang(f.path);
      languages.set(info.label, (languages.get(info.label) || 0) + 1);
    });
    return {
      files: project.files.length,
      bytes,
      languages: Array.from(languages.entries()).sort((a, b) => b[1] - a[1])
    };
  };
})();

/* ========== state/workspace.js ========== */
/* ============================================================================
 * Luzzes — state/workspace.js
 * Open editors, panel geometry, terminal/output logs, diagnostics and the
 * per-file undo history. Persisted: layout only (via LZ.store.local).
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;

  const savedLayout = LZ.store.local.get('workspace-layout', null) || {};

  const workspace = LZ.workspace = LZ.createStore({
    openFiles: [],
    activeFile: null,
    previewPath: null,
    cursor: { line: 1, col: 1 },
    selection: null,
    panelSizes: Object.assign({ sidebar: 252, ai: 396, bottom: 232 }, savedLayout.panelSizes || {}),
    bottomTab: savedLayout.bottomTab || 'terminal',    // terminal | problems | output | preview
    previewDevice: savedLayout.previewDevice || 'desktop',
    previewNonce: 0,
    previewUrlLabel: 'preview.local/',
    terminal: [],
    output: [],
    problems: { list: [], byPath: {}, counts: { error: 0, warning: 0, hint: 0 }, scannedAt: null },
    tests: null,
    lintRunning: false,
    history: {},
    activity: []
  });

  /* ------------------------------------------------------------- layout --- */
  const persistLayout = U.debounce(() => {
    const s = workspace.get();
    LZ.store.local.set('workspace-layout', {
      panelSizes: s.panelSizes,
      bottomTab: s.bottomTab,
      previewDevice: s.previewDevice
    });
  }, 400);

  workspace.setPanelSize = function (key, value) {
    const panelSizes = Object.assign({}, workspace.get().panelSizes);
    panelSizes[key] = Math.round(value);
    workspace.set({ panelSizes });
    persistLayout();
    LZ.bus.emit('layout:change', panelSizes);
  };

  workspace.setBottomTab = function (tab) {
    workspace.set({ bottomTab: tab });
    LZ.ui.set({ bottomCollapsed: false });
    persistLayout();
  };

  workspace.setPreviewDevice = function (device) {
    workspace.set({ previewDevice: device });
    persistLayout();
  };

  workspace.refreshPreview = function (reason) {
    workspace.set({ previewNonce: workspace.get().previewNonce + 1 });
    workspace.output({ kind: 'info', text: 'Preview refreshed' + (reason ? ' — ' + reason : '') });
  };

  /* -------------------------------------------------------------- files --- */
  workspace.openFile = function (path, opts) {
    if (!path) return;
    const open = workspace.get().openFiles.slice();
    if (open.indexOf(path) < 0) open.push(path);
    workspace.set({ openFiles: open, activeFile: path });
    if (!opts || opts.focus !== false) {
      LZ.ui.set({ mobileTab: 'editor' });
    }
    LZ.bus.emit('editor:opened', path);
  };

  workspace.closeFile = function (path) {
    const open = workspace.get().openFiles.filter((p) => p !== path);
    let active = workspace.get().activeFile;
    if (active === path) {
      const index = workspace.get().openFiles.indexOf(path);
      active = open[Math.min(index, open.length - 1)] || null;
    }
    workspace.set({ openFiles: open, activeFile: active });
  };

  workspace.closeOtherFiles = function (path) {
    workspace.set({ openFiles: [path], activeFile: path });
  };

  workspace.setActiveFile = function (path) {
    if (workspace.get().activeFile === path) return;
    workspace.set({ activeFile: path });
    const open = workspace.get().openFiles;
    if (open.indexOf(path) < 0) workspace.set({ openFiles: open.concat([path]) });
  };

  workspace.handlePathChange = function (from, to) {
    const s = workspace.get();
    const open = s.openFiles.map((p) => (p === from ? to : p.indexOf(from + '/') === 0 ? to + p.slice(from.length) : p));
    const active = s.activeFile === from ? to : s.activeFile && s.activeFile.indexOf(from + '/') === 0 ? to + s.activeFile.slice(from.length) : s.activeFile;
    const history = {};
    Object.keys(s.history).forEach((k) => {
      history[k === from ? to : k.indexOf(from + '/') === 0 ? to + k.slice(from.length) : k] = s.history[k];
    });
    workspace.set({ openFiles: open, activeFile: active, history });
  };

  workspace.handlePathRemoved = function (path, isFolder) {
    const keep = (p) => !(p === path || (isFolder && p.indexOf(path + '/') === 0));
    const s = workspace.get();
    const open = s.openFiles.filter(keep);
    const history = {};
    Object.keys(s.history).forEach((k) => { if (keep(k)) history[k] = s.history[k]; });
    workspace.set({
      openFiles: open,
      activeFile: keep(s.activeFile) ? s.activeFile : (open[0] || null),
      history
    });
  };

  workspace.setCursor = function (line, col) {
    workspace.set({ cursor: { line, col } });
  };

  workspace.setSelection = function (selection) {
    workspace.set({ selection });
  };

  /* ------------------------------------------------------- undo history -- */
  workspace.pushHistory = function (path, previousContent) {
    const history = Object.assign({}, workspace.get().history);
    const entry = history[path] || { past: [], future: [] };
    entry.past = entry.past.concat([previousContent]).slice(-40);
    entry.future = [];
    history[path] = entry;
    workspace.set({ history });
  };

  workspace.canUndo = function (path) {
    const entry = workspace.get().history[path || workspace.get().activeFile];
    return !!(entry && entry.past.length);
  };
  workspace.canRedo = function (path) {
    const entry = workspace.get().history[path || workspace.get().activeFile];
    return !!(entry && entry.future.length);
  };
  workspace.undo = function (path) {
    path = path || workspace.get().activeFile;
    const current = LZ.projects.read(path);
    if (current == null) return false;
    const history = Object.assign({}, workspace.get().history);
    const entry = history[path];
    if (!entry || !entry.past.length) return false;
    const previous = entry.past[entry.past.length - 1];
    entry.past = entry.past.slice(0, -1);
    entry.future = entry.future.concat([current]);
    history[path] = entry;
    workspace.set({ history });
    LZ.projects.writeFile(path, previous, { silent: true, origin: 'undo' });
    return true;
  };
  workspace.redo = function (path) {
    path = path || workspace.get().activeFile;
    const current = LZ.projects.read(path);
    const history = Object.assign({}, workspace.get().history);
    const entry = history[path];
    if (!entry || !entry.future.length) return false;
    const next = entry.future[entry.future.length - 1];
    entry.future = entry.future.slice(0, -1);
    entry.past = entry.past.concat([current]);
    history[path] = entry;
    workspace.set({ history });
    LZ.projects.writeFile(path, next, { silent: true, origin: 'redo' });
    return true;
  };

  /* ------------------------------------------------------------ logging --- */
  let logId = 0;
  function push(listName, entry) {
    const list = workspace.get()[listName].concat([Object.assign({ id: ++logId, at: Date.now() }, entry)]);
    const trimmed = list.length > 400 ? list.slice(list.length - 400) : list;
    workspace.set({ [listName]: trimmed });
    LZ.bus.emit(listName + ':append', entry);
  }
  workspace.terminal = function (entry) { push('terminal', typeof entry === 'string' ? { text: entry, kind: 'output' } : entry); };
  workspace.output = function (entry) { push('output', typeof entry === 'string' ? { text: entry, kind: 'info' } : entry); };
  workspace.clearLog = function (name) { workspace.set({ [name]: [] }); };

  /* ------------------------------------------------------- diagnostics ---- */
  const runLint = U.debounce(async function () {
    const project = LZ.projects.get().current;
    if (!project) return;
    workspace.set({ lintRunning: true });
    const started = performance.now();
    const files = project.files.filter((f) => !f.binary).map((f) => ({ path: f.path, content: f.content || '' }));
    // Diagnostics are deterministic and fast (sub-10ms for typical projects);
    // they run on the main thread so the rules stay in one place. Project-wide
    // search — the genuinely expensive pass — runs in a Web Worker.
    let result;
    try {
      result = LZ.lint.project(files);
    } catch (e) {
      result = { list: [], byPath: {}, counts: { error: 0, warning: 0, hint: 0 }, scannedAt: Date.now() };
    }
    const elapsed = performance.now() - started;
    const previous = workspace.get().problems;
    // keep one shape for diagnostics in the store: {list, byPath, counts, scannedAt}
    workspace.set({
      problems: {
        list: result.list || result.problems || [],
        byPath: result.byPath || {},
        counts: result.counts || { error: 0, warning: 0, hint: 0 },
        scannedAt: result.scannedAt || Date.now()
      },
      lintRunning: false
    });
    if (previous && previous.scannedAt && result.counts.error > previous.counts.error) {
      LZ.ui.toast({
        kind: 'error',
        title: 'New error in ' + project.name,
        message: U.plural(result.counts.error, 'error') + ' detected while typing.',
        actions: [{ label: 'Open problems', onClick: () => workspace.setBottomTab('problems') }]
      });
    }
    LZ.bus.emit('lint:done', { result, elapsed });
    return result;
  }, 700);

  workspace.analyze = function () { return runLint(); };

  LZ.bus.on('file:changed', () => runLint());
  LZ.bus.on('file:created', () => runLint());
  LZ.bus.on('file:deleted', () => runLint());
  LZ.bus.on('file:renamed', () => runLint());
  LZ.bus.on('project:open', () => runLint());
  LZ.bus.on('project:imported', () => runLint());

  /* ------------------------------------------------------------- tests ---- */
  workspace.runTests = async function () {
    const project = LZ.projects.get().current;
    if (!project) return null;
    const files = project.files.filter((f) => !f.binary).map((f) => ({ path: f.path, content: f.content || '' }));
    workspace.output({ kind: 'info', text: 'Running browser tests in a sandboxed iframe…' });
    workspace.setBottomTab('output');
    const result = await LZ.testrunner.run(files);
