    const stylesheets = (project.files || []).filter((f) => /\.css$/i.test(f.path));

    const fixTarget = (() => {
      const byFile = new Map();
      problems.forEach((p) => {
        if (!byFile.has(p.path)) byFile.set(p.path, []);
        byFile.get(p.path).push(p);
      });
      let best = null;
      byFile.forEach((list, path) => {
        if (!best || list.length > best.problems.length) best = { path, problems: list };
      });
      if (best) best.problems = best.problems.slice().sort((a, b) => a.severityRank - b.severityRank);
      return best;
    })();

    const testProposal = (() => {
      const entryFile = (project.files || []).find((f) => f.path === entry);
      if (!entryFile) return null;
      const scan = A.scanHtml(entryFile.content || '');
      const checks = [];
      if (scan.headings[0]) checks.push('the primary h' + scan.headings[0].level + ' renders with text');
      if (scan.buttons[0]) checks.push('the primary button exists and is labelled ("' + U.truncate(scan.buttons[0].text, 28) + '")');
      if (scan.sections.some((s) => s.id)) checks.push('a landmark region is reachable by id');
      if (scan.images.length) checks.push('every img declares alt text');
      if (scan.headings.filter((h) => h.level === 1).length) checks.push('exactly one h1 on the page');
      return { checks, sourcePath: entryFile.path };
    })();

    const notes = [];
    if (context.problems) notes.push(problems.length + ' findings read from local analysis');

    return {
      files, project, snapshot, problems, selection, entry,
      primaryFile, cssFile, components, stylesheets, fixTarget, testProposal,
      testSourcePath: testProposal ? testProposal.sourcePath : null,
      notes
    };
  }

  /* ------------------------------------------------------ local passes ---- */
  /**
   * Deterministic transformations proposed as reviewable diffs. These are real
   * edits computed from the file contents; the label in the UI says which pass
   * produced them.
   */
  function buildProposals(intent, ctx) {
    const proposals = [];
    if (intent === 'ui' && ctx.cssFile) {
      let content = ctx.cssFile.content || '';
      const notes = [];
      const tokens = A.extractCssTokens(content);
      if (tokens.changed) { content = tokens.content; notes.push.apply(notes, tokens.notes); }
      else notes.push.apply(notes, tokens.notes);
      const motion = A.addReducedMotion(content);
      if (motion.changed) { content = motion.content; notes.push.apply(notes, motion.notes); }
      else notes.push.apply(notes, motion.notes);
      if (content !== (ctx.cssFile.content || '')) {
        proposals.push({
          path: ctx.cssFile.path,
          after: content,
          summary: 'Hoist colour tokens' + (motion.changed ? ' + reduced-motion guard' : ''),
          notes,
          origin: 'local-pass',
          originLabel: 'Deterministic local pass'
        });
      }
    }

    if (intent === 'fix' && ctx.fixTarget) {
      const file = (ctx.project.files || []).find((f) => f.path === ctx.fixTarget.path);
      if (file) {
        let content = file.content || '';
        const applied = [];
        const fixes = ctx.fixTarget.problems.filter((p) => p.fixable).slice(0, 12);
        // apply from the bottom up so earlier line numbers stay valid
        fixes.slice().sort((a, b) => b.line - a.line).forEach((problemItem) => {
          const result = LZ.lint.applyFix(problemItem, content);
          if (result) { content = result.text; applied.push(result.note); }
        });
        if (content !== (file.content || '')) {
          const after = LZ.lint.project([{ path: file.path, content }]);
          proposals.push({
            path: file.path,
            after: content,
            summary: applied.length + ' deterministic fix(es)',
            notes: applied.concat('Re-checked after editing: ' + LZ.lint.summaryText(after.counts) + ' remain in this file.'),
            origin: 'local-pass',
            originLabel: 'Deterministic local pass'
          });
        }
      }
    }

    if (intent === 'tests') {
      const generated = A.generateTests(ctx.project);
      if (generated) {
        proposals.push({
          path: generated.path,
          after: generated.content,
          before: null,
          summary: 'New test harness',
          notes: [generated.note, 'Run it with the Run tests button — the results come from the sandbox, not from me.'],
          origin: 'local-pass',
          originLabel: 'Generated from project structure'
        });
      }
    }

    if (intent === 'docs' && ctx.primaryFile) {
      const docs = A.document(ctx.primaryFile.content || '', ctx.primaryFile.path);
      const targetPath = 'docs/' + U.basename(ctx.primaryFile.path).replace(/\.[^.]+$/, '') + '.md';
      proposals.push({
        path: targetPath,
        after: docs,
        before: null,
        summary: 'Reference documentation',
        notes: ['Written from the declarations that exist in `' + ctx.primaryFile.path + '`.'],
        origin: 'local-pass',
        originLabel: 'Generated from source declarations'
      });
    }

    return proposals;
  }

  demoModel.buildContext = buildContext;
})();

/* ========== ai/engine.js ========== */
/* ============================================================================
 * Luzzes — ai/engine.js
 *
 * The orchestration layer between the UI and a provider. It:
 *   - builds context from the real project (ranked, explainable selection)
 *   - runs tool activity steps that genuinely execute (search, read, lint)
 *   - calls whichever provider is configured, and says which one it is
 *   - turns returned code into reviewable diffs
 *   - never reports a result it did not obtain
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const prompts = LZ.prompts;
  const analysis = LZ.analysis;

  const CONFIG_KEY = 'provider-config';
  const engine = (LZ.engine = {});
  let controller = null;
  let lastRequest = null;

  /* ------------------------------------------------------------- config --- */
  engine.config = function () {
    return LZ.store.local.get(CONFIG_KEY, { local: {}, connected: {} });
  };
  /**
   * Write provider settings.
   *
   * Secrets never reach localStorage. A field is treated as a secret when the
   * provider declares it as a password field or when its name looks like a
   * credential; those values go to LZ.keys, which keeps them in memory and — at
   * most — in sessionStorage for the current tab. Everything else is persisted
   * as ordinary settings so the workspace can restore it next time.
   */
  engine.setConfig = function (providerId, patch) {
    const provider = LZ.getProvider(providerId) || {};
    const fields = provider.config || [];
    const isSecret = (name) => {
      const field = fields.filter((f) => f.key === name)[0];
      if (field) return field.type === 'password' || /(key|token|secret)/i.test(field.key);
      return /(apiKey|api_key|token|secret|password)/i.test(name);
    };

    const config = engine.config();
    const next = Object.assign({}, config[providerId] || {});
    Object.keys(patch || {}).forEach((name) => {
      const value = patch[name];
      if (isSecret(name)) {
        LZ.keys.set(providerId, value || '', provider.keyStorage || 'memory');
        delete next[name];
      } else if (value === '' || value == null) {
        delete next[name];
      } else {
        next[name] = value;
      }
    });

    config[providerId] = next;
    LZ.store.local.set(CONFIG_KEY, config);

    return Object.assign({
      hasApiKey: !!LZ.keys.get(providerId),
      keyStorage: provider.keyStorage || 'none'
    }, next);
  };
  engine.providerId = function () { return LZ.settings.getIn('ai.providerId', 'demo'); };
  engine.provider = function () { return LZ.getProvider(engine.providerId()); };
  engine.mode = function () {
    const provider = engine.provider();
    return provider ? provider.kind : 'demo';
  };
  engine.modelId = function () {
    const provider = engine.provider();
    const configured = engine.config()[engine.providerId()] || {};
    return LZ.settings.getIn('ai.model', '') || configured.model || (provider.models[0] ? provider.models[0].id : 'unknown');
  };

  engine.setProvider = function (providerId) {
    const provider = LZ.getProvider(providerId);
    if (!provider) return null;
    const config = engine.config()[providerId] || {};
    LZ.settings.set({
      ai: Object.assign({}, LZ.settings.get().ai, {
        providerId,
        model: config.model || (provider.models[0] ? provider.models[0].id : '')
      })
    });
    LZ.bus.emit('ai:provider', provider);
    return provider;
  };

  engine.health = async function () {
    const provider = engine.provider();
    if (!provider) return { ok: false, detail: 'No provider selected.' };
    const config = Object.assign({}, engine.config()[provider.id] || {}, { model: engine.modelId() });
    try {
      const result = await provider.health(config);
      LZ.ai.set({ providerHealth: Object.assign({ providerId: provider.id, at: Date.now() }, result) });
      return result;
    } catch (e) {
      const result = { ok: false, detail: (e && e.message) || 'Health check failed.' };
      LZ.ai.set({ providerHealth: Object.assign({ providerId: provider.id, at: Date.now() }, result) });
      return result;
    }
  };

  /* ------------------------------------------------------------ context --- */
  engine.context = function (opts) {
    opts = opts || {};
    const project = LZ.projects.get().current;
    const files = (project && project.files ? project.files : []).filter((f) => !f.binary);
    const query = opts.query || '';
    const selection = opts.selection || LZ.workspace.get().selection;
    const activeFile = LZ.workspace.get().activeFile;
    const snapshot = analysis.project(files);
    const entry = LZ.workspace.entryFile();
    const level = LZ.settings.getIn('ai.contextLevel', 'project');
    const limit = level === 'file' ? 1 : 4;

    const selected = analysis.selectContext(files, query + ' ' + (activeFile || ''), {
      activeFile, entry, limit
    });
    // always keep the active file and the preview entry in view
    const ensure = (path) => {
      if (!path) return;
      const file = files.find((f) => f.path === path);
      if (file && !selected.some((f) => f.path === path)) selected.unshift(file);
    };
    ensure(activeFile);
    if (level === 'project') ensure(entry);

    return {
      project, files, snapshot, entry, selection,
      activeFile,
      selected: selected.slice(0, level === 'file' ? 2 : 5),
      problems: LZ.workspace.get().problems.list || []
    };
  };

  engine.buildRequest = function (userText, opts) {
    opts = opts || {};
    const ctx = engine.context({ query: userText, selection: opts.selection });
    const contextText = prompts.buildContext({
      files: ctx.selected.map((f) => ({ path: f.path, content: f.content })),
      entry: ctx.entry,
      problems: ctx.problems,
      selection: ctx.selection,
      userText: null
    });
    const history = LZ.ai.get().conversation.messages
      .filter((m) => m.status !== 'error' && m.content && !m.demo)
      .map((m) => ({ role: m.role, content: m.content }));

    return {
      provider: engine.provider(),
      providerId: engine.providerId(),
      model: engine.modelId(),
      temperature: LZ.settings.getIn('ai.temperature', 0.2),
      messages: prompts.buildMessages({
        history,
        userText,
        context: contextText,
        instruction: opts.instruction || ''
      }),
      context: {
        project: ctx.project,
        files: ctx.selected.map((f) => ({ path: f.path, content: f.content })),
        selection: ctx.selection,
        problems: ctx.problems,
        activeFile: ctx.activeFile
      },
      action: opts.action || null
    };
  };

  /* ------------------------------------------------------ code extraction - */
  /**
   * Parse fenced code blocks that declare a target file.
   * Only blocks with an explicit `file=` hint are turned into patches — the
   * engine does not guess which file a snippet belongs to.
   */
  engine.extractProposals = function (content) {
    const proposals = [];
    const fenceRe = /```([^\n`]*)\n([\s\S]*?)```/g;
    let m;
    while ((m = fenceRe.exec(content))) {
      const info = m[1].trim();
      const fileMatch = info.match(/(?:file|path|filename)\s*[=:]\s*([^\s]+)/i);
      if (!fileMatch) continue;
      const path = U.normalizePath(fileMatch[1].replace(/^["']|["']$/g, ''));
      const code = m[2].replace(/\n$/, '');
      const existing = LZ.projects.file(path);
      proposals.push({
        path,
        before: existing ? existing.content : null,
        after: code,
        summary: existing ? 'Proposed edit' : 'New file',
        origin: 'model',
        originLabel: 'Returned by ' + engine.modelId()
      });
    }
    // De-duplicate: last block for a path wins (models often self-correct).
    const byPath = new Map();
    proposals.forEach((p) => byPath.set(p.path, p));
    return Array.from(byPath.values());
  };

  /* ------------------------------------------------------------ pipeline -- */
  function activity(label, detail) { return LZ.ai.startActivity(label, detail); }
  function finish(entry, status, detail) { LZ.ai.finishActivity(entry.id, status, detail); }

  /** Store updates replace message objects — always hand back the live one. */
  function currentMessage(id) {
    return LZ.ai.get().conversation.messages.filter((m) => m.id === id)[0] || null;
  }

  engine.send = async function (userText, opts) {
    opts = opts || {};
    const text = String(userText || '').trim();
    if (!text && !opts.action) return null;
    if (LZ.ai.get().status === 'thinking' || LZ.ai.get().status === 'streaming') {
      LZ.ui.toast({ kind: 'info', title: 'Luzzes is already working', message: 'Stop the current run or wait for it to finish.' });
      return null;
    }

    const provider = engine.provider();
    if (!provider) {
      LZ.ui.toast({ kind: 'error', title: 'No provider configured', message: 'Open Settings → AI to choose one.' });
      return null;
    }

    LZ.ai.set({ status: 'thinking', error: null, activity: [], lastRequestAt: Date.now() });
    LZ.ai.set({ stats: Object.assign({}, LZ.ai.get().stats, { turns: LZ.ai.get().stats.turns + 1 }) });

    const userMessage = opts.hideUserMessage ? null : LZ.ai.pushMessage({
      role: 'user', content: text, attachments: opts.attachments || null,
      action: opts.action || null, selection: opts.selection || null
    });

    const assistant = LZ.ai.pushMessage({
      role: 'assistant', content: '', status: 'streaming', mode: provider.kind,
      model: engine.modelId(), activity: [], plan: null, at: Date.now()
    });

    controller = new AbortController();
    const signal = controller.signal;

    try {
      /* --- real step 1: read the project ---------------------------------- */
      const step1 = activity('Analyzing project', 'counting files');
      const request = engine.buildRequest(text, opts);
      const snapshot = analysis.project(request.context.project ? request.context.project.files : []);
      finish(step1, 'done', snapshot.fileCount + ' files · ' + U.fmtBytes(snapshot.bytes) + ' · ' +
        snapshot.languages.slice(0, 2).map(([l, c]) => c + '× ' + l).join(', '));

      /* --- real step 2: select context ------------------------------------ */
      const step2 = activity('Selecting context', 'ranking files against the request');
      const chosen = request.context.files.map((f) => f.path);
      finish(step2, chosen.length ? 'done' : 'skipped',
        chosen.length ? chosen.map((p) => U.basename(p)).join(', ') : 'no files matched — using the entry point');

      /* --- real step 3: read the chosen files ----------------------------- */
      const step3 = activity('Reading files', chosen.join(', ') || 'entry point');
      finish(step3, 'done', U.plural(chosen.length, 'file') + ' · ' +
        U.fmtBytes(request.context.files.reduce((sum, f) => sum + (f.content || '').length, 0)) + ' of context');

      if (request.context.selection) {
        const sel = activity('Reading selection', (request.context.selection.path || 'active file') + ' lines ' + request.context.selection.startLine + '–' + request.context.selection.endLine);
        finish(sel, 'done');
      }

      /* --- provider call -------------------------------------------------- */
      let result;
      if (provider.kind === 'demo') {
        const step = activity('Drafting response locally', 'demo mode — no model endpoint is contacted');
        result = await provider.chat({
          messages: request.messages,
          model: request.model,
          temperature: request.temperature,
          context: request.context,
          action: opts.action || null,
          userText: text,
          config: engine.config()[provider.id] || {},
          signal,
          onDelta: (chunk) => {
            if (signal.aborted) return;
            LZ.ai.set({ status: 'streaming' });
            LZ.ai.appendToMessage(assistant.id, chunk);
          }
        });
        finish(step, 'done', 'scripted example drafted from ' + result.intent + ' intent');
      } else {
        const host = (engine.config()[provider.id] || {}).baseUrl || 'the configured endpoint';
        const step = activity('Requesting ' + result0Model(provider, request), 'streaming from ' + host);
        result = await provider.chat({
          messages: request.messages,
          model: request.model,
          temperature: request.temperature,
          config: engine.config()[provider.id] || {},
          signal,
          onDelta: (chunk) => {
            if (signal.aborted) return;
            LZ.ai.set({ status: 'streaming' });
            LZ.ai.appendToMessage(assistant.id, chunk);
          }
        });
        finish(step, 'done', result.streamed ? 'streamed response received' : 'response received (endpoint did not stream)');
      }

      if (signal.aborted) {
        LZ.ai.updateMessage(assistant.id, { status: 'stopped', note: 'Stopped before completion.' });
        LZ.ai.set({ status: 'ready' });
        activity('Stopped by user', '').status = 'done';
        return currentMessage(assistant.id) || assistant;
      }

      /* --- proposals -> reviewable diffs ---------------------------------- */
      const proposals = (result.proposals && result.proposals.length)
        ? result.proposals
        : engine.extractProposals(result.content || '');
      const patchIds = [];
      proposals.forEach((proposal) => {
        const step = activity('Preparing diff', proposal.path);
        const patch = LZ.ai.addPatch({
          path: proposal.path,
          before: proposal.before === undefined ? (LZ.projects.read(proposal.path) || null) : proposal.before,
          after: proposal.after,
          summary: proposal.summary || 'Proposed change',
          notes: proposal.notes || [],
          origin: proposal.origin || 'model',
          originLabel: proposal.originLabel || ('Returned by ' + engine.modelId()),
          messageId: assistant.id
        });
        patchIds.push(patch.id);
        const model = LZ.diff.compute(patch.before || '', patch.after || '');
        finish(step, 'done', model.stats.added + ' added · ' + model.stats.removed + ' removed in ' + U.basename(patch.path));
      });

      /* --- real step: validation ----------------------------------------- */
      if (patchIds.length) {
        const step = activity('Validating', 'static checks on the affected files');
        const touched = new Set(proposals.map((p) => p.path));
        const files = (request.context.project.files || []).map((f) => {
          if (!touched.has(f.path)) return { path: f.path, content: f.content || '' };
          const proposal = proposals.find((p) => p.path === f.path);
          return { path: f.path, content: proposal ? proposal.after : (f.content || '') };
        });
        const lintResult = LZ.lint.project(files);
        const touchedCounts = lintResult.problems.filter((p) => touched.has(p.path));
        finish(step, 'done', touchedCounts.length
          ? touchedCounts.length + ' finding(s) remain in the proposed files'
          : 'no findings introduced in the proposed files');
        LZ.ai.updateMessage(assistant.id, { validation: { counting: touchedCounts.length, scanned: files.length } });
      }

      /* --- finalize ------------------------------------------------------- */
      LZ.ai.updateMessage(assistant.id, {
        status: 'complete',
        mode: provider.kind,
        model: result.model || request.model,
        demo: !!result.demo,
        note: result.demo
          ? 'Scripted example, drafted locally from static analysis of this project. No model endpoint was contacted.'
          : null,
        latency: result.latency,
        usage: result.usage || null,
        patchIds,
        action: opts.action || null,
        tools: LZ.ai.get().activity.map((a) => ({ label: a.label, detail: a.detail, status: a.status }))
      });
      LZ.ai.set({
        status: 'ready',
        stats: Object.assign({}, LZ.ai.get().stats, {
          lastLatency: result.latency,
          tokens: LZ.ai.get().stats.tokens + ((result.usage && result.usage.total_tokens) || 0)
        })
      });
      LZ.bus.emit('ai:response', { messageId: assistant.id, patchIds });
      return currentMessage(assistant.id) || assistant;
    } catch (error) {
      const aborted = error && (error.name === 'AbortError' || signal.aborted);
      if (aborted) {
        LZ.ai.updateMessage(assistant.id, { status: 'stopped', note: 'Stopped before completion.' });
        LZ.ai.set({ status: 'ready' });
        return currentMessage(assistant.id) || assistant;
      }
      const message = (error && error.message) || 'The request failed.';
      LZ.ai.updateMessage(assistant.id, {
        status: 'error',
        content: LZ.ai.get().conversation.messages.find((m) => m.id === assistant.id).content ||
          'Luzzes couldn\'t complete that request.',
        error: {
          message,
          detail: (error && error.stack) || null,
          code: error && error.code,
          providerId: LZ.engine.providerId()
        },
        retryText: text,
        retryAction: opts.action || null
      });
      LZ.ai.set({ status: 'error', error: { message, at: Date.now() } });
      LZ.bus.emit('ai:error', { message });
      return currentMessage(assistant.id) || assistant;
    } finally {
      controller = null;
    }
  };

  function result0Model(provider, request) {
    return (request.model || provider.label) + '';
  }

  engine.retry = function (messageId) {
    const message = LZ.ai.get().conversation.messages.find((m) => m.id === messageId);
    if (!message) return null;
    const index = LZ.ai.get().conversation.messages.indexOf(message);
    // drop the failed exchange and re-run it
    const conversation = LZ.ai.get().conversation;
    conversation.messages = conversation.messages.slice(0, index);
    LZ.ai.set({ conversation: Object.assign({}, conversation) });
    return engine.send(message.retryText || '', { action: message.retryAction || null, hideUserMessage: true });
  };

  engine.stop = function () {
    if (controller) controller.abort();
    LZ.ai.set({ status: 'ready' });
    return true;
  };

  /* --------------------------------------------------------- quick actions */
  engine.quickAction = async function (kind, opts) {
    opts = opts || {};
    const action = prompts.actions[kind];
    if (!action) return null;
    const selection = opts.selection || LZ.workspace.get().selection;
    const activeFile = LZ.workspace.get().activeFile;
    const scope = selection && selection.text
      ? selection.path + ' · lines ' + selection.startLine + '–' + selection.endLine
      : (activeFile || 'the project');
    const note = { kind: 'action', action: kind, label: action.label, scope };
    return engine.send(action.label + ' — ' + scope, {
      action: kind,
      instruction: action.instruction,
      selection: selection,
      hideUserMessage: false,
      attachments: [note]
    });
  };

  /* ------------------------------------------------------------- patches -- */
  engine.applyPatch = function (patchId, opts) {
    const patch = LZ.ai.patch(patchId);
    if (!patch) return false;
    const current = LZ.projects.read(patch.path);
    let content = patch.after;
    if (opts && opts.hunkIndexes && current != null) {
      const model = LZ.diff.compute(current, patch.after);
      content = LZ.diff.applyHunks(current, model, opts.hunkIndexes);
    }
    if (current == null) {
      LZ.projects.createFile(patch.path, content, { origin: 'luzzes' });
      LZ.workspace.output({ kind: 'success', text: 'Created ' + patch.path });
    } else {
      LZ.projects.writeFile(patch.path, content, { origin: 'luzzes' });
      LZ.workspace.output({ kind: 'success', text: 'Applied changes to ' + patch.path });
    }
    LZ.ai.setPatchStatus(patchId, 'applied');
    LZ.workspace.openFile(patch.path);
    if (/\.html?$|\.css$|\.js$|\.tsx?$|\.jsx?$/i.test(patch.path)) {
      if (LZ.settings.getIn('workspace.previewAutoRefresh', true)) LZ.workspace.refreshPreview('files changed');
    }
    LZ.ui.toast({
      kind: 'success', title: 'Change applied', message: patch.path,
      actions: [{ label: 'Undo', onClick: () => { LZ.workspace.undo(patch.path); LZ.workspace.refreshPreview('undo'); } }]
    });
    LZ.bus.emit('patch:applied', { patchId, path: patch.path });
    return true;
  };

  engine.rejectPatch = function (patchId, reason) {
    const patch = LZ.ai.patch(patchId);
    if (!patch) return false;
    LZ.ai.setPatchStatus(patchId, 'rejected');
    LZ.workspace.output({ kind: 'info', text: 'Rejected proposed changes to ' + patch.path + (reason ? ' — ' + reason : '') });
    LZ.bus.emit('patch:rejected', { patchId, path: patch.path });
    return true;
  };

  engine.loadConversationFor = async function (project) {
    if (!project) return false;
    const loaded = await LZ.ai.loadConversation(project.id);
    if (loaded && LZ.ai.get().conversation.messages.length) {
      LZ.ai.set({ activity: [], patches: [] });
      return true;
    }
    if (project.isDemo) {
      const conversation = LZ.demo.conversation();
      LZ.ai.set({
        conversation: {
          messages: conversation.messages,
          createdAt: conversation.createdAt,
          model: conversation.model,
          demo: true
        },
        activity: [],
        patches: []
      });
      // materialise the scripted patch against the real file contents
      const hero = LZ.demo.heroPatch();
      const current = LZ.projects.read(hero.path);
      if (current != null && current !== hero.after) {
        LZ.ai.addPatch({
          path: hero.path,
          before: current,
          after: hero.after,
          summary: hero.summary,
          notes: hero.notes,
          origin: 'demo-script',
          originLabel: 'Scripted demo patch',
          messageId: 'm2'
        });
      }
      return true;
    }
    LZ.ai.set({ conversation: { messages: [], createdAt: Date.now(), model: engine.modelId(), demo: false }, activity: [], patches: [] });
    return false;
  };

  LZ.bus.on('project:open', (project) => { engine.loadConversationFor(project); });
})();

/* ========== ui/components.js ========== */
/* ============================================================================
 * Luzzes — ui/components.js
 * Reusable interface primitives. Every one is keyboard reachable and
 * screen-reader labelled; none of them depend on a framework.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const I = LZ.icons;
  const h = U.h;
  const ui = (LZ.ui = LZ.ui || {});
  const components = (LZ.components = LZ.components || {});

  /* ------------------------------------------------------------- button --- */
  components.button = function (opts) {
    const el = h('button', {
      type: 'button',
      class: 'lz-btn ' + (opts.kind ? 'lz-btn-' + opts.kind : '') + (opts.size ? ' lz-btn-' + opts.size : ''),
      disabled: opts.disabled || null,
      'aria-label': opts.ariaLabel || null,
      title: opts.title || null,
      onClick: opts.onClick || null
    });
    if (opts.icon) el.appendChild(I.el(opts.icon, opts.iconSize || 15, 'lz-btn-icon'));
    if (opts.label) el.appendChild(h('span.lz-btn-label', { text: opts.label }));
    if (opts.shortcut) el.appendChild(h('kbd.lz-kbd', { text: U.shortcutLabel(opts.shortcut) }));
    if (opts.trailingIcon) el.appendChild(I.el(opts.trailingIcon, 14, 'lz-btn-trailing'));
    el.setBusy = (busy) => {
      el.classList.toggle('is-busy', !!busy);
      el.disabled = !!busy || !!opts.disabled;
    };
    return el;
  };

  components.iconButton = function (opts) {
    const el = h('button', {
      type: 'button',
      class: 'lz-icon-btn' + (opts.active ? ' is-active' : '') + (opts.size === 'sm' ? ' is-sm' : ''),
      'aria-label': opts.label,
      'aria-pressed': opts.pressed != null ? String(!!opts.pressed) : null,
      title: opts.title || opts.label,
      disabled: opts.disabled || null,
      onClick: opts.onClick || null
    }, I.el(opts.icon, opts.iconSize || 16));
    return el;
  };

  /* ------------------------------------------------------------ tooltip --- */
  let tooltipEl = null, tooltipTimer = null;
  function tooltipRoot() {
    if (!tooltipEl) {
      tooltipEl = h('div.lz-tooltip', { role: 'tooltip', attrs: { 'aria-hidden': 'true' } });
      document.body.appendChild(tooltipEl);
    }
    return tooltipEl;
  }
  components.tooltip = function (el, text, opts) {
    if (!text) return el;
    opts = opts || {};
    const show = () => {
      clearTimeout(tooltipTimer);
      tooltipTimer = setTimeout(() => {
        const tip = tooltipRoot();
        tip.textContent = text;
        tip.classList.add('is-visible');
        const rect = el.getBoundingClientRect();
        const placement = opts.placement || 'bottom';
        tip.style.left = '0px';
        tip.style.top = '-9999px';
        const tipRect = tip.getBoundingClientRect();
        let left = rect.left + rect.width / 2 - tipRect.width / 2;
        left = U.clamp(left, 8, window.innerWidth - tipRect.width - 8);
        const top = placement === 'top' ? rect.top - tipRect.height - 8 : rect.bottom + 8;
        tip.style.left = left + 'px';
        tip.style.top = top + 'px';
      }, opts.delay == null ? 420 : opts.delay);
    };
    const hide = () => {
      clearTimeout(tooltipTimer);
      if (tooltipEl) tooltipEl.classList.remove('is-visible');
    };
    el.addEventListener('mouseenter', show);
    el.addEventListener('mouseleave', hide);
    el.addEventListener('focus', show);
    el.addEventListener('blur', hide);
    el.addEventListener('click', hide);
    return el;
  };

  /* ----------------------------------------------------------- dropdown --- */
  let openPopover = null;
  components.closePopovers = function () {
    if (openPopover) { openPopover.remove(); openPopover = null; }
  };

  /**
   * @param {HTMLElement} anchor
   * @param {Array<{label, icon, shortcut, onSelect, danger, disabled, separator}>} items
   */
  components.popover = function (anchor, items, opts) {
    opts = opts || {};
    components.closePopovers();
    const rect = anchor.getBoundingClientRect();
    const menu = h('div.lz-popover', {
      role: 'menu',
      style: {
        left: Math.min(rect.left, window.innerWidth - (opts.width || 240) - 12) + 'px',
        top: (opts.placement === 'top' ? Math.max(8, rect.top - 8) : rect.bottom + 6) + 'px',
        width: opts.width ? opts.width + 'px' : null,
        transform: opts.placement === 'top' ? 'translateY(-100%)' : null
      }
    });
    const buttons = [];
    items.forEach((item) => {
      if (!item) return;
      if (item.separator) { menu.appendChild(h('div.lz-popover-sep', { role: 'separator' })); return; }
      if (item.heading) { menu.appendChild(h('div.lz-popover-heading', { text: item.heading })); return; }
      const button = h('button.lz-popover-item' + (item.active ? '.is-active' : '') + (item.danger ? '.is-danger' : ''), {
        type: 'button', role: 'menuitem', disabled: item.disabled || null,
        'aria-checked': item.active != null ? String(!!item.active) : null,
        onClick: () => {
          components.closePopovers();
          if (item.onSelect) item.onSelect();
        }
      }, [
        item.icon ? I.el(item.icon, 15) : null,
        h('span.lz-popover-label', { text: item.label }),
        item.detail ? h('span.lz-popover-detail', { text: item.detail }) : null,
        item.shortcut ? h('kbd.lz-kbd', { text: U.shortcutLabel(item.shortcut) }) : null,
        item.active ? I.el('check', 14, 'lz-popover-check') : null
      ]);
      buttons.push(button);
      menu.appendChild(button);
    });
    document.body.appendChild(menu);
    openPopover = menu;
    const first = buttons.find((b) => !b.disabled);
    if (first) first.focus({ preventScroll: true });

    function onKey(event) {
      const index = buttons.indexOf(document.activeElement);
      if (event.key === 'Escape') { event.preventDefault(); components.closePopovers(); anchor.focus(); }
      if (event.key === 'ArrowDown') { event.preventDefault(); (buttons[index + 1] || buttons[0]).focus(); }
      if (event.key === 'ArrowUp') { event.preventDefault(); (buttons[index - 1] || buttons[buttons.length - 1]).focus(); }
      if (event.key === 'Tab') { components.closePopovers(); }
    }
    function onDocClick(event) {
      if (!menu.contains(event.target) && !anchor.contains(event.target)) components.closePopovers();
    }
    menu.addEventListener('keydown', onKey);
    setTimeout(() => document.addEventListener('mousedown', onDocClick), 0);
    const cleanup = () => document.removeEventListener('mousedown', onDocClick);
    menu.addEventListener('lz:close', cleanup);
    return menu;
  };

  /* ---------------------------------------------------------- segmented --- */
  components.segmented = function (opts) {
    const el = h('div.lz-segmented', { role: 'tablist', 'aria-label': opts.label || 'View' });
    const buttons = opts.options.map((option) => {
      const button = h('button.lz-segmented-item' + (option.value === opts.value ? '.is-active' : ''), {
        type: 'button', role: 'tab',
        'aria-selected': String(option.value === opts.value),
        title: option.title || option.label,
        onClick: () => {
          buttons.forEach((b) => { b.classList.remove('is-active'); b.setAttribute('aria-selected', 'false'); });
          button.classList.add('is-active');
          button.setAttribute('aria-selected', 'true');
          opts.onChange(option.value);
        }
      }, [option.icon ? I.el(option.icon, 14) : null, option.label ? h('span', { text: option.label }) : null]);
      return button;
    });
    buttons.forEach((b) => el.appendChild(b));
    el.setValue = (value) => {
      buttons.forEach((b, i) => {
        const active = opts.options[i].value === value;
        b.classList.toggle('is-active', active);
        b.setAttribute('aria-selected', String(active));
      });
    };
    return el;
  };

  /* ------------------------------------------------------------- switch --- */
  components.switchControl = function (opts) {
    const id = U.uid('sw');
    const input = h('input.lz-switch-input', {
      type: 'checkbox', id, checked: opts.checked || null,
      onChange: (e) => opts.onChange(e.target.checked)
    });

      input,
      h('span.lz-switch-track', { attrs: { 'aria-hidden': 'true' } }, h('span.lz-switch-thumb')),
      opts.label ? h('span.lz-switch-label', { text: opts.label }) : null
    ]);
    return el;
  };

  components.field = function (opts) {
    return h('div.lz-field', [
      h('label.lz-field-label', { attrs: { for: opts.id || null }, text: opts.label }),
      opts.control,
      opts.hint ? h('p.lz-field-hint', { text: opts.hint }) : null
    ]);
  };

  components.textInput = function (opts) {
    return h('input.lz-input', Object.assign({
      type: opts.type || 'text',
      value: opts.value == null ? '' : opts.value,
      placeholder: opts.placeholder || '',
      autocomplete: 'off',
      spellcheck: 'false',
      onInput: opts.onInput || null,
      onChange: opts.onChange || null,
      onKeydown: opts.onKeydown || null,
      attrs: { 'aria-label': opts.label || opts.placeholder || 'Input' }
    }, opts.attrs || {}));
  };

  components.select = function (opts) {
    const el = h('select.lz-input.lz-select', {
      onChange: (e) => opts.onChange(e.target.value),
      attrs: { 'aria-label': opts.label || 'Select' }
    });

  components.badge = function (text, kind) {
    return h('span.lz-badge' + (kind ? '.lz-badge-' + kind : ''), { text });
  };

  components.chip = function (opts) {
    const el = h('span.lz-chip' + (opts.kind ? '.lz-chip-' + opts.kind : '') + (opts.onClick ? '.is-clickable' : ''), {
      role: opts.onClick ? 'button' : null,
      tabindex: opts.onClick ? '0' : null,
      onClick: opts.onClick || null,
      onKeydown: opts.onClick ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); opts.onClick(); } } : null,
      title: opts.title || null
    }, [opts.icon ? I.el(opts.icon, 13) : null, h('span', { text: opts.label })]);

  };

  components.statusDot = function (kind, label) {
    return h('span.lz-status-dot' + (kind ? '.is-' + kind : ''), {
      role: 'img', attrs: { 'aria-label': label || kind || 'status' }
    });
  };

  components.spinner = function (size) {
    return h('span.lz-spinner', { style: { width: (size || 14) + 'px', height: (size || 14) + 'px' }, attrs: { 'aria-hidden': 'true' } }, I.el('loader', size || 14));
  };

  components.emptyState = function (opts) {
    return h('div.lz-empty', [
      opts.icon ? h('div.lz-empty-icon', I.el(opts.icon, 22)) : null,
      h('h3.lz-empty-title', { text: opts.title }),
      opts.message ? h('p.lz-empty-message', { text: opts.message }) : null,

    }, h('div.lz-progress-fill', { style: { width: U.clamp(progress * 100, 0, 100) + '%' } }));
  };

  /* ------------------------------------------------------------- modal ---- */
  components.modal = function (opts) {
    const previousFocus = document.activeElement;
    const titleId = U.uid('dlg-title');

    const close = () => {
      document.removeEventListener('keydown', onKey);
      backdrop.classList.remove('is-open');
      panel.classList.remove('is-open');
      setTimeout(() => {
        backdrop.remove();
        if (previousFocus && previousFocus.focus) previousFocus.focus({ preventScroll: true });
        if (opts.onClose) opts.onClose();
      }, 180);
    };

    const panel = h('div.lz-modal' + (opts.size ? '.is-' + opts.size : ''), {
      role: 'dialog', 'aria-modal': 'true', attrs: { 'aria-labelledby': titleId }
    });
    const head = h('header.lz-modal-head', [
      h('h2.lz-modal-title', { id: titleId, text: opts.title || '' }),
      opts.subtitle ? h('p.lz-modal-subtitle', { text: opts.subtitle }) : null,
      components.iconButton({ icon: 'close', label: 'Close dialog', onClick: close })
    ]);
    const body = h('div.lz-modal-body', opts.content);

    panel.appendChild(body);

      if (event.key === 'Escape' && opts.dismissable !== false) { event.stopPropagation(); close(); return; }

          .filter((el) => el.offsetParent !== null);
        if (!focusables.length) return;
        const first = focusables[0], last = focusables[focusables.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    }
    document.addEventListener('keydown', onKey);
    document.body.appendChild(backdrop);

      backdrop.classList.add('is-open');
      panel.classList.add('is-open');

    menu.addEventListener('lz:close', observer);
    const remove = () => { fakeAnchor.remove(); document.removeEventListener('mousedown', check); };
    function check(e) { if (!menu.contains(e.target)) remove(); }
    document.addEventListener('mousedown', check);
    return menu;
  };

  /* ----------------------------------------------------------- resizer ---- */
  /**
   * Drag handle between panels. `onDrag(delta, event)` receives the pixel delta
   * since the previous frame; `onEnd()` is called on release.
   */
  components.resizer = function (opts) {
    const el = h('div.lz-resizer' + (opts.orientation === 'horizontal' ? '.is-horizontal' : ''), {
      role: 'separator',
      'aria-orientation': opts.orientation === 'horizontal' ? 'horizontal' : 'vertical',
      'aria-label': opts.label || 'Resize panel',
      tabindex: '0',
      title: opts.label || 'Drag to resize'

    function onPointerMove(event) {
      if (!start) return;
      const delta = opts.orientation === 'horizontal' ? event.clientY - start.y : event.clientX - start.x;
      start.x = event.clientX;
      start.y = event.clientY;
      opts.onDrag(delta, event);
    }
    function onPointerUp() {
      if (!start) return;
      start = null;
      document.body.classList.remove('is-resizing');
      window.removeEventListener('pointermove', onPointerMove);
      window.removeEventListener('pointerup', onPointerUp);
      if (opts.onEnd) opts.onEnd();
    }
    el.addEventListener('pointerdown', (event) => {
      start = { x: event.clientX, y: event.clientY };
      document.body.classList.add('is-resizing');
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      event.preventDefault();
    });
    el.addEventListener('dblclick', () => { if (opts.onReset) opts.onReset(); });
    el.addEventListener('keydown', (event) => {
      const step = event.shiftKey ? 48 : 16;
      if (opts.orientation === 'horizontal') {
        if (event.key === 'ArrowUp') { opts.onDrag(-step, event); event.preventDefault(); }
        if (event.key === 'ArrowDown') { opts.onDrag(step, event); event.preventDefault(); }
      } else {
        if (event.key === 'ArrowLeft') { opts.onDrag(-step, event); event.preventDefault(); }
        if (event.key === 'ArrowRight') { opts.onDrag(step, event); event.preventDefault(); }

  };

    const renders = new Map();

    function render(state) {
      const seen = new Set();
      state.toasts.forEach((toast) => {
        seen.add(toast.id);
        if (renders.has(toast.id)) return;
        const kindIcon = { success: 'checkCircle', error: 'error', warning: 'warning', info: 'info' }[toast.kind] || 'info';
        const el = h('div.lz-toast' + (toast.kind ? '.is-' + toast.kind : ''), { role: 'alert' }, [
          I.el(kindIcon, 16, 'lz-toast-icon'),
          h('div.lz-toast-body', [
            toast.title ? h('p.lz-toast-title', { text: toast.title }) : null,
            toast.message ? h('p.lz-toast-message', { text: toast.message }) : null,
            toast.actions && toast.actions.length
              ? h('div.lz-toast-actions', toast.actions.map((action) => components.button({
                label: action.label, size: 'sm',
                onClick: () => { LZ.ui.dismissToast(toast.id); if (action.onClick) action.onClick(); }
              })))
              : null
          ]),
          components.iconButton({ icon: 'close', label: 'Dismiss notification', size: 'sm', onClick: () => LZ.ui.dismissToast(toast.id) })
        ]);
        host.appendChild(el);
        requestAnimationFrame(() => el.classList.add('is-visible'));
        renders.set(toast.id, el);
      });
      renders.forEach((el, id) => {
        if (seen.has(id)) return;
        el.classList.remove('is-visible');
        setTimeout(() => el.remove(), 220);
        renders.delete(id);
      });
    }
    render(LZ.ui.get());
    LZ.ui.subscribe((state, patch) => { if (patch.toasts) render(state); });
    return host;
  };

  /* -------------------------------------------------------------- brand --- */
  components.brand = function (opts) {
    opts = opts || {};
    const el = h('a.lz-brand' + (opts.small ? '.is-small' : ''), { href: '#', 'aria-label': 'Luzzes home' }, [

    ]);
    el.addEventListener('click', (event) => {
      event.preventDefault();
      if (opts.onClick) opts.onClick();
    });
    return el;
  };
})();

  /**
   * The Problems illustration is not a mock-up: it runs the same static
   * analysis the workspace runs, over the demo project that ships with it, and
   * shows whatever it actually returns.
   */
  function analyserReport() {
    try {
      const files = LZ.demo.project().files.filter((f) => !f.binary).map((f) => ({ path: f.path, content: f.content || '' }));
      const report = LZ.lint.project(files);
      const order = { error: 0, warning: 1, hint: 2 };
      const findings = report.problems
        .slice()
        .sort((a, b) => (order[a.severity] - order[b.severity]) || a.path.localeCompare(b.path) || a.line - b.line)
        .slice(0, 4);
      const counts = report.counts;
      const chipLabel = counts.error + ' error' + (counts.error === 1 ? '' : 's') + ' · ' +
        counts.warning + ' warning' + (counts.warning === 1 ? '' : 's') + ' · ' +
        counts.hint + ' hint' + (counts.hint === 1 ? '' : 's');
      const notesCopy = findings.length
        ? 'Real output: the analyser run over this demo project when the page loaded. Every line cites the file, the line and the rule that fired.'
        : 'Real output: the analyser run over this demo project — nothing to report right now.';
      return { findings, chipLabel, rank: counts.error + counts.warning, notesCopy };
    } catch (error) {
      return { findings: [], chipLabel: 'analyser unavailable', rank: 0, notesCopy: 'The analyser could not run here: ' + (error && error.message) };
    }
  }

    /* reveal on scroll */
    const items = U.qsa('.reveal', root);
    if (U.prefersReducedMotion() || !('IntersectionObserver' in window)) {
      items.forEach((el) => el.classList.add('is-visible'));
    } else {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        });
      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.1 });
      items.forEach((el, index) => {
        el.style.transitionDelay = Math.min(index * 30, 200) + 'ms';
        observer.observe(el);
      });
    }

    /* sticky nav border */
    const navEl = U.qs('.lz-land-nav', root);
    const onScroll = () => { if (navEl) navEl.classList.toggle('is-scrolled', window.scrollY > 10); };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    return root;
  };

    const sidebarHandle = components.resizer({
      orientation: 'vertical', label: 'Resize sidebar',
      onDrag: (delta) => {
        const sizes = LZ.workspace.get().panelSizes;
        LZ.workspace.setPanelSize('sidebar', U.clamp(sizes.sidebar + delta, MIN.sidebar, MAX.sidebar));
      }
    });

    /* ------------------------------------------------------------- editor -- */
    const editorSlot = h('div.lz-editor-slot');

    /* ---------------------------------------------------------- ai panel --- */
    const aiSlot = h('div.lz-ai-slot');
    const aiHandle = components.resizer({
      orientation: 'vertical', label: 'Resize assistant panel',
      onDrag: (delta) => {
        const sizes = LZ.workspace.get().panelSizes;
        LZ.workspace.setPanelSize('ai', U.clamp(sizes.ai - delta, MIN.ai, MAX.ai));
      }
    });

    /* ------------------------------------------------------------- bottom -- */
    const bottomSlot = h('div.lz-bottom-slot');
    const bottomHandle = components.resizer({
      orientation: 'horizontal', label: 'Resize bottom panel',
      onDrag: (delta) => {
        const sizes = LZ.workspace.get().panelSizes;
        LZ.workspace.setPanelSize('bottom', U.clamp(sizes.bottom - delta, MIN.bottom, MAX.bottom));
      }
    });

    const middle = h('div.lz-middle', [sidebarSlot, sidebarHandle, editorSlot, aiHandle, aiSlot]);

    const workspace = h('div.lz-workspace', [
      topbar,
      middle,
      bottomHandle,
      bottomSlot
    ]);

    /* -------------------------------------------------------- mobile tabs -- */
    const mobileTabs = h('nav.lz-mobile-tabs', { attrs: { 'aria-label': 'Workspace panels' } });
    const tabs = ['files', 'editor', 'chat', 'preview'];
    const TAB_LABELS = { files: 'Files', editor: 'Editor', chat: 'Luzzes', preview: 'Preview' };
    const TAB_ICONS = { files: 'folder', editor: 'code', chat: 'sparkle', preview: 'eye' };
    const TAB_TITLES = {
      files: 'Project files and search',
      editor: 'The editor',
      chat: 'Ask Luzzes',
      preview: 'Live preview of the entry document'
    };
    const tabButtons = tabs.map((tab) => {
      const button = h('button.lz-mobile-tab', {
        type: 'button',
        onClick: () => {
          LZ.ui.set({ mobileTab: tab });
          if (tab === 'preview') LZ.actions.openPreview();
        },
        title: TAB_TITLES[tab],
        attrs: { 'aria-label': TAB_TITLES[tab] }
      }, [
        I.el(TAB_ICONS[tab], 17),
        h('span', { text: TAB_LABELS[tab] })
      ]);
      return button;
    });
    tabButtons.forEach((b) => mobileTabs.appendChild(b));

    const mobileBar = h('div.lz-mobile-only', mobileTabs);
    workspace.appendChild(mobileBar);

    /* --------------------------------------------------------- behaviour -- */
    function applyLayout() {
      const state = LZ.workspace.get();
      const uiState = LZ.ui.get();
      const sizes = state.panelSizes;
      const mobile = LZ.shell.isMobile();

      workspace.style.setProperty('--lz-sidebar', sizes.sidebar + 'px');
      workspace.style.setProperty('--lz-ai', sizes.ai + 'px');
      workspace.style.setProperty('--lz-bottom', sizes.bottom + 'px');

      workspace.classList.toggle('is-sidebar-collapsed', mobile ? false : uiState.sidebarCollapsed);
      workspace.classList.toggle('is-ai-collapsed', mobile ? false : uiState.aiPanelCollapsed);
      workspace.classList.toggle('is-bottom-collapsed', uiState.bottomCollapsed);
      workspace.classList.toggle('is-mobile', mobile);
      workspace.dataset.mobileTab = uiState.mobileTab;

      tabButtons.forEach((button, index) => {
        const active = tabs[index] === uiState.mobileTab;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-current', active ? 'true' : 'false');
      });
    }

    /* top bar content */
    function renderProject() {
      const project = LZ.projects.get().current;
      if (!project) return;
      U.clear(projectButton);
      projectButton.appendChild(I.el('layers', 14));
      projectButton.appendChild(h('span.lz-topbar-project-name', { text: project.name }));
      projectButton.appendChild(components.chip({
        label: LZ.projects.get().backend === 'localStorage' ? 'local' : 'saved locally',
        kind: 'muted'
      }));
    }
    projectButton.addEventListener('click', () => LZ.actions.openProjectPicker());

    function renderBreadcrumb() {
      const path = LZ.workspace.get().activeFile;
      U.clear(breadcrumb);
      const project = LZ.projects.get().current;
      breadcrumb.appendChild(h('span.lz-topbar-path-root', { text: project ? project.name : '' }));
      if (!path) {
        breadcrumb.appendChild(I.el('chevronRight', 12));
        breadcrumb.appendChild(h('span', { text: 'no file open' }));
        return;
      }
      const parts = path.split('/');
      parts.forEach((part, index) => {
        breadcrumb.appendChild(I.el('chevronRight', 11));
        const segment = h('button.lz-topbar-path-part', { type: 'button', text: part });
        segment.addEventListener('click', () => {
          const partial = parts.slice(0, index + 1).join('/');
          if (index === parts.length - 1) LZ.workspace.openFile(path);
          else if (LZ.projects.file(partial)) LZ.workspace.openFile(partial);
          else LZ.ui.set({ sidebarCollapsed: false, activeLeftSection: 'files' });
        });
        breadcrumb.appendChild(segment);
      });
    }

    function renderSave() {
      const state = LZ.projects.get();
      U.clear(dirtyIndicator);
      if (state.saving) {
        dirtyIndicator.appendChild(components.spinner(12));
        dirtyIndicator.appendChild(h('span', { text: 'Saving…' }));
        dirtyIndicator.className = 'lz-save-indicator is-saving';
      } else if (state.dirty) {
        dirtyIndicator.appendChild(h('span.lz-save-dot', { attrs: { 'aria-hidden': 'true' } }));
        dirtyIndicator.appendChild(h('span', { text: 'Unsaved' }));
        dirtyIndicator.className = 'lz-save-indicator is-dirty';
      } else if (state.lastSavedAt) {
        dirtyIndicator.appendChild(I.el('check', 12));
        dirtyIndicator.appendChild(h('span', { text: 'Saved ' + U.timeAgo(state.lastSavedAt) }));
        dirtyIndicator.className = 'lz-save-indicator is-saved';
      } else {
        dirtyIndicator.className = 'lz-save-indicator';
      }
    }

    function renderModelChip() {
      const provider = LZ.engine.provider();
      const kind = provider ? provider.kind : 'demo';
      const mode = LZ.ai.get().status;
      U.clear(modelChip);
      modelChip.className = 'lz-model-chip is-' + kind + (mode === 'thinking' || mode === 'streaming' ? ' is-busy' : '');
      modelChip.appendChild(I.el(kind === 'demo' ? 'sparkle' : kind === 'local' ? 'cpu' : 'globe', 14));
      modelChip.appendChild(h('span.lz-model-chip-model', { text: LZ.engine.modelId() }));
      modelChip.appendChild(components.chip({
        label: kind === 'demo' ? 'Demo mode' : kind === 'local' ? 'Local model' : 'Connected',
        kind: kind === 'demo' ? 'warn' : 'ok'
      }));
    }
    modelChip.addEventListener('click', () => LZ.actions.openSettings('ai'));

    /* subscriptions */
    LZ.workspace.subscribe(applyLayout);
    LZ.ui.subscribe((state, patch) => {
      if (patch.sidebarCollapsed !== undefined || patch.aiPanelCollapsed !== undefined ||
        patch.bottomCollapsed !== undefined || patch.mobileTab !== undefined) applyLayout();
    });
    LZ.projects.subscribe((state, patch) => {
      if (patch.current || patch.backend) { renderProject(); renderBreadcrumb(); }
      renderSave();
    });
    LZ.workspace.subscribe((state, patch) => { if (patch.activeFile !== undefined || patch.openFiles) renderBreadcrumb(); });
    LZ.ai.subscribe((state, patch) => { if (patch.status || patch.conversation) renderModelChip(); });
    LZ.settings.subscribe((state, patch) => { if (patch.ai) renderModelChip(); });
    LZ.bus.on('ai:provider', renderModelChip);

    applyLayout();
    renderProject();
    renderBreadcrumb();
    renderSave();
    renderModelChip();

    shell.element = workspace;
    shell.slots = { sidebar: sidebarSlot, editor: editorSlot, ai: aiSlot, bottom: bottomSlot, topbar };
    return workspace;
  };

  shell.isMobile = function () {
    return window.matchMedia('(max-width: 900px)').matches;
  };

  shell.observeViewport = function () {
    const query = window.matchMedia('(max-width: 900px)');
    const handler = () => {
      LZ.workspace.set({ layoutMode: query.matches ? 'mobile' : 'desktop' });
      if (query.matches) LZ.ui.set({ mobileTab: LZ.ui.get().mobileTab || 'chat' });
    };
    if (query.addEventListener) query.addEventListener('change', handler);
    else if (query.addListener) query.addListener(handler);
    handler();
  };
})();

/* ========== ui/sidebar.js ========== */
/* ============================================================================
 * Luzzes — ui/sidebar.js
 * Left rail: project switcher, file tree, project search, session changes,
 * assets and the settings shortcut.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const I = LZ.icons;
  const h = U.h;
  const components = LZ.components;

  const sidebar = (LZ.sidebar = {});
  const SECTIONS = ['files', 'search', 'changes', 'assets'];

  /* Tree open/collapsed state, persisted between sessions. */
  const openFolders = new Set(LZ.store.local.get('tree-open', ['src', 'src/components', 'src/styles']));
  function persistOpen() { LZ.store.local.set('tree-open', Array.from(openFolders)); }

  /* Session change tracking — real edits observed in this session. */
  const changes = new Map();
  LZ.bus.on('file:changed', (payload) => {
    if (payload.origin === 'undo' || payload.origin === 'redo') return;
    record(payload.path, 'modified');
  });
  LZ.bus.on('file:created', (file) => record(file.path, 'added'));
  LZ.bus.on('file:deleted', (payload) => record(payload.path, 'deleted'));
  LZ.bus.on('file:renamed', (payload) => { changes.delete(payload.from); record(payload.to, 'renamed'); });
  LZ.bus.on('patch:applied', () => renderIfVisible());

  function record(path, kind) {
    const entry = changes.get(path) || { path, kind, at: Date.now(), count: 0 };
    entry.count++;
    entry.at = Date.now();
    if (entry.kind === 'added' && kind === 'modified') entry.kind = 'added';
    else entry.kind = kind;
    changes.set(path, entry);
    LZ.ui.set({ changeCount: changes.size });
    renderIfVisible();
  }

  let visible = false;
  let currentSection = 'files';
  let rerender = () => {};

  /* ------------------------------------------------------------ file tree -- */
  function fileTree() {
    const project = LZ.projects.get().current;
    const container = h('div.lz-tree', { role: 'tree', attrs: { 'aria-label': 'Project files' } });
    if (!project || !project.files.length) {
      container.appendChild(components.emptyState({
        icon: 'file',
        title: 'Your project is empty.',
        message: 'Create a file to start building.',
        action: components.button({
          label: 'Create your first file', kind: 'primary', size: 'sm',
          onClick: () => LZ.actions.promptNewFile()
        })
      }));
      return container;
    }

    const nodes = LZ.projects.buildTree(project.files.filter((f) => !f.hidden));
    const activePath = LZ.workspace.get().activeFile;

    function renderNodes(list, depth, parent) {
      list.forEach((node) => {
        if (node.type === 'folder') {
          const isOpen = openFolders.has(node.path);
          const folderRow = h('div.lz-tree-row.is-folder', {
            role: 'treeitem', tabindex: '0',
            'aria-expanded': String(isOpen),
            style: { paddingLeft: (8 + depth * 13) + 'px' },
            onClick: () => {
              if (openFolders.has(node.path)) openFolders.delete(node.path);
              else openFolders.add(node.path);
              persistOpen();
              rerender();
            },
            onKeydown: (event) => {
              if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); folderRow.click(); }
              if (event.key === 'ArrowRight') { openFolders.add(node.path); persistOpen(); rerender(); }
              if (event.key === 'ArrowLeft') { openFolders.delete(node.path); persistOpen(); rerender(); }
            },
            onContextmenu: (event) => folderMenu(event, node)
          }, [
            I.el(isOpen ? 'chevronDown' : 'chevronRight', 12, 'lz-tree-chevron'),
            I.el(isOpen ? 'folderOpen' : 'folder', 14, 'lz-tree-icon'),
            h('span.lz-tree-label', { text: node.name }),
            h('span.lz-tree-actions', [
              treeAction('plus', 'New file in ' + node.name, () => LZ.actions.promptNewFile(node.path + '/')),
              treeAction('edit', 'Rename folder', () => inlineRename(node.path, true)),
              treeAction('trash', 'Delete folder', () => LZ.actions.deletePath(node.path))
            ])
          ]);
          container.appendChild(folderRow);
          if (isOpen) renderNodes(node.children, depth + 1, container);
          return;
        }
        const isActive = node.path === activePath;
        const dot = LZ.workspace.get().problems.byPath[node.path];
        const worst = dot && dot.length ? dot[0].severity : null;
        const row = h('div.lz-tree-row' + (isActive ? '.is-active' : ''), {
          role: 'treeitem', tabindex: '0',
          'aria-selected': String(isActive),
          style: { paddingLeft: (8 + depth * 13) + 'px' },
          onClick: () => LZ.workspace.openFile(node.path),
          onKeydown: (event) => {
            if (event.key === 'Enter') LZ.workspace.openFile(node.path);
            if (event.key === 'F2') { event.preventDefault(); inlineRename(node.path); }
          },
          onContextmenu: (event) => fileMenu(event, node.path),
          attrs: { draggable: 'true' }
        }, [
          h('span.lz-tree-chevron'),
          I.el(I.fileIconName(node.path), 14, 'lz-tree-icon is-file'),
          h('span.lz-tree-label', { text: node.name }),
          worst ? h('span.lz-tree-badge.is-' + worst, { title: dot.length + ' problem(s)' }) : null,
          h('span.lz-tree-actions', [
            treeAction('edit', 'Rename file', () => inlineRename(node.path)),
            treeAction('trash', 'Delete file', () => LZ.actions.deletePath(node.path))
          ])
        ]);
        row.addEventListener('dragstart', (event) => {
          event.dataTransfer.setData('text/luzzes-path', node.path);
          event.dataTransfer.effectAllowed = 'move';
        });
        container.appendChild(row);
      });
    }

    function treeAction(icon, label, onClick) {
      const button = components.iconButton({
        icon, label, size: 'sm',
        onClick: (event) => { event.stopPropagation(); onClick(); }
      });
      button.classList.add('lz-tree-action');
      return button;
    }

    renderNodes(nodes, 0, container);

    /* drop targets for folders */
    container.addEventListener('dragover', (event) => {
      const row = event.target.closest('.lz-tree-row.is-folder');
      if (!row) return;
      event.preventDefault();
      U.qsa('.lz-tree-row', container).forEach((r) => r.classList.remove('is-drop-target'));
      row.classList.add('is-drop-target');
    });
    container.addEventListener('dragleave', (event) => {
      const row = event.target.closest('.lz-tree-row.is-folder');
      if (row) row.classList.remove('is-drop-target');
    });
    container.addEventListener('drop', (event) => {
      const row = event.target.closest('.lz-tree-row.is-folder');
      const path = event.dataTransfer.getData('text/luzzes-path');
      if (!row || !path) return;
      event.preventDefault();
      U.qsa('.lz-tree-row', container).forEach((r) => r.classList.remove('is-drop-target'));
      const folderPath = row.querySelector('.lz-tree-label').textContent;
      const target = findFolder(nodes, folderPath);
      if (target) LZ.projects.moveFile(path, target.path);
    });

    function findFolder(list, name, parentPath) {
      for (const node of list) {
        if (node.type === 'folder') {
          if (node.name === name && (parentPath === undefined || U.dirname(node.path) === parentPath)) return node;
          const deeper = findFolder(node.children, name);
          if (deeper) return deeper;
        }
      }
      return null;
    }

    return container;
  }

  function inlineRename(path, isFolder) {
    const label = Array.from(document.querySelectorAll('.lz-tree-row .lz-tree-label'))
      .find((el) => el.textContent === U.basename(path));
    if (!label) return;
    const input = h('input.lz-tree-rename', {
      value: U.basename(path),
      attrs: { 'aria-label': 'New name' },
      onBlur: () => commit(),
      onKeydown: (event) => {
        if (event.key === 'Enter') { event.preventDefault(); commit(); }
        if (event.key === 'Escape') { event.preventDefault(); cancel(); }
      }
    });
    function commit() {
      const value = input.value.trim();
      input.replaceWith(label);
      if (!value || value === U.basename(path)) return;
      const next = U.joinPath(U.dirname(path), value);
      LZ.projects.renamePath(path, next);
      if (isFolder) LZ.workspace.setBottomTab('problems');
    }
    function cancel() { input.replaceWith(label); }
    label.replaceWith(input);
    input.focus();
    input.select();
  }

  function fileMenu(event, path) {
    const isImage = U.isImage(path);
    components.contextMenu(event, [
      { label: 'Open', icon: 'fileCode', onSelect: () => LZ.workspace.openFile(path) },
      { label: 'Open in preview', icon: 'eye', disabled: !/\.html?$/i.test(path), onSelect: () => LZ.actions.openPreview(path) },
      { separator: true },
      { label: 'Rename', icon: 'edit', shortcut: 'F2', onSelect: () => inlineRename(path) },
      { label: 'Duplicate', icon: 'copy', onSelect: () => LZ.actions.duplicateFile(path) },
      { label: 'Download file', icon: 'download', onSelect: () => LZ.projects.downloadFile(path) },
      { label: 'Copy path', icon: 'copy', onSelect: () => {
        U.copyText(path).then((ok) => LZ.ui.toast({ kind: ok ? 'success' : 'error', title: ok ? 'Path copied' : 'Copy failed', message: path }));
      } },
      { separator: true },
      { label: 'Ask Luzzes to review it', icon: 'sparkle', onSelect: () => {
        LZ.workspace.openFile(path);
        LZ.engine.send('Review `' + path + '` and list the problems in order of impact.', { action: 'review' });
      } },
      { label: isImage ? 'Insert in preview' : 'Find references', icon: 'find', disabled: isImage, onSelect: () => {
        LZ.ui.set({ activeLeftSection: 'search' });
        LZ.sidebar.search(U.basename(path));
      } },
      { separator: true },
      { label: 'Delete', icon: 'trash', danger: true, onSelect: () => LZ.actions.deletePath(path) }
    ]);
  }

  function folderMenu(event, node) {
    components.contextMenu(event, [
      { label: 'New file here', icon: 'plus', onSelect: () => LZ.actions.promptNewFile(node.path + '/') },
      { label: 'New folder here', icon: 'folder', onSelect: () => LZ.actions.promptNewFolder(node.path + '/') },
      { separator: true },
      { label: 'Rename folder', icon: 'edit', onSelect: () => inlineRename(node.path, true) },
      { label: 'Delete folder', icon: 'trash', danger: true, onSelect: () => LZ.actions.deletePath(node.path) }
    ]);
  }

  /* --------------------------------------------------------------- search -- */
  const search = {
    query: '',
    isRegex: false,
    caseSensitive: false,
    result: null,
    busy: false
  };

  function searchPanel() {
    const input = h('input.lz-search-input', {
      type: 'search', value: search.query,
      placeholder: 'Search across the project…',
      attrs: { 'aria-label': 'Search project', spellcheck: 'false' },
      onInput: U.debounce((event) => {
        search.query = event.target.value;
        runSearch();
      }, 220),
      onKeydown: (event) => {
        if (event.key === 'Enter') { event.preventDefault(); runSearch(); }
        if (event.key === 'ArrowDown') { event.preventDefault(); focusResult(1); }
        if (event.key === 'ArrowUp') { event.preventDefault(); focusResult(-1); }
      }
    });
    const results = h('div.lz-search-results');
    const summary = h('div.lz-search-summary');

    const regexToggle = h('button.lz-search-option', {
      type: 'button', text: '.*', title: 'Treat the query as a regular expression',
      onClick: () => { search.isRegex = !search.isRegex; regexToggle.classList.toggle('is-active', search.isRegex); runSearch(); }
    });
    const caseToggle = h('button.lz-search-option', {
      type: 'button', text: 'Aa', title: 'Match case',
      onClick: () => { search.caseSensitive = !search.caseSensitive; caseToggle.classList.toggle('is-active', search.caseSensitive); runSearch(); }
    });

    function focusResult(direction) {
      const rows = U.qsa('.lz-search-match', results);
      if (!rows.length) return;
      const index = rows.indexOf(document.activeElement);
      const next = rows[U.clamp(index + direction, 0, rows.length - 1)] || rows[0];
      next.focus();
    }

    async function runSearch() {
      const query = search.query.trim();
      U.clear(results);
      if (!query) {
        U.clear(summary);
        results.appendChild(h('p.lz-search-hint', { text: 'Search file contents and paths. Results update as you type.' }));
        return;
      }
      search.busy = true;
      summary.textContent = 'Searching…';
      const files = LZ.projects.fileList().filter((f) => !f.binary).map((f) => ({ path: f.path, content: f.content || '' }));
      try {
        const result = await LZ.worker.search(files, query, {
          isRegex: search.isRegex,
          caseSensitive: search.caseSensitive,
          limit: 400
        });
        search.result = result;
        search.busy = false;
        renderResults(result);
      } catch (error) {
        search.busy = false;
        U.clear(results);
        results.appendChild(h('div.lz-search-error', [
          I.el('warning', 15),
          h('div', [
            h('p', { text: 'That search could not run.' }),
            h('p.lz-search-error-detail', { text: error.message })
          ])
        ]));
        summary.textContent = '';
      }
    }

    function renderResults(result) {
      U.clear(results);
      const engine = result.engine === 'main-thread' ? 'main thread' : 'worker';
      summary.textContent = result.total === 0
        ? 'No matches in ' + result.scanned + ' files'
        : result.total + ' match' + (result.total === 1 ? '' : 'es') + ' in ' + result.results.length +
          ' file' + (result.results.length === 1 ? '' : 's') + ' · ' + engine + ' · ' + Math.round(result.elapsed) + ' ms';
      if (!result.total) {
        results.appendChild(components.emptyState({
          icon: 'search',
          title: 'Nothing matched',
          message: 'Try a shorter query, or disable case sensitivity.'
        }));
        return;
      }
      result.results.forEach((group) => {
        const groupEl = h('div.lz-search-group', [
          h('button.lz-search-group-head', {
            type: 'button',
            onClick: () => LZ.workspace.openFile(group.path)
          }, [
            I.el(I.fileIconName(group.path), 13),
            h('span', { text: group.path }),
            h('span.lz-search-count', { text: String(group.matches.length) })
          ])
        ]);
        group.matches.forEach((match) => {
          const row = h('button.lz-search-match', {
            type: 'button',
            onClick: () => LZ.actions.openFileAt(group.path, match.line, match.col, match.length)
          }, [
            h('span.lz-search-line', { text: String(match.line) }),
            h('span.lz-search-text', { html: highlight(match) })
          ]);
          groupEl.appendChild(row);
        });
        results.appendChild(groupEl);
      });
    }

    function highlight(match) {
      const text = U.escapeHtml(match.text.trim());
      const needle = U.escapeRegExp(search.isRegex ? '' : search.query);
      if (!needle) return text;
      const re = new RegExp(needle, search.caseSensitive ? '' : 'i');
      return text.replace(re, (m) => '<mark>' + m + '</mark>');
    }

    const panel = h('div.lz-search-panel', [
      h('div.lz-search-bar', [
        h('div.lz-search-field', [I.el('search', 14), input]),
        regexToggle,
        caseToggle
      ]),
      summary,
      results
    ]);
    if (search.query) setTimeout(runSearch, 0);
    else results.appendChild(h('p.lz-search-hint', { text: 'Search file contents and paths. Results update as you type.' }));
    setTimeout(() => input.focus(), 30);
    return panel;
  }

  sidebar.search = function (query) {
    search.query = query;

  /* -------------------------------------------------------- session changes */

    const container = h('div.lz-changes');
    if (!changes.size) {
      container.appendChild(components.emptyState({

        title: 'No changes yet',
        message: 'Edits made in this session appear here, with a one-click revert. This is not a git repository — it is a session log.'

    }
    const list = Array.from(changes.values()).sort((a, b) => b.at - a.at);
    container.appendChild(h('div.lz-changes-head', [
      h('span', { text: list.length + ' changed file' + (list.length === 1 ? '' : 's') }),
      components.button({
        label: 'Discard all', size: 'sm',
        onClick: async () => {
          const ok = await components.confirm({
            title: 'Discard session changes?',
            message: 'Every file edited in this session will be restored to the content it had when the project was opened.',
            detail: 'Only available for files still in the undo history.',
            confirmLabel: 'Discard changes', danger: true
          });
          if (!ok) return;
          let reverted = 0;
          list.forEach((entry) => {
            while (LZ.workspace.canUndo(entry.path)) { LZ.workspace.undo(entry.path); reverted++; }
          });
          changes.clear();
          LZ.ui.set({ changeCount: 0 });
          LZ.workspace.refreshPreview('changes discarded');
          LZ.ui.toast({ kind: 'success', title: 'Session changes discarded', message: reverted + ' edit(s) reverted.' });

      const iconKind = entry.kind === 'added' ? 'plus' : entry.kind === 'deleted' ? 'minus' : 'edit';

        I.el(iconKind, 13, 'lz-change-icon is-' + entry.kind),

        h('span.lz-change-meta', { text: entry.count + ' edit' + (entry.count === 1 ? '' : 's') }),
        components.iconButton({
          icon: 'undo', label: 'Revert ' + entry.path, size: 'sm',
          disabled: !LZ.workspace.canUndo(entry.path) || null,
          onClick: () => {
            while (LZ.workspace.canUndo(entry.path)) LZ.workspace.undo(entry.path);
            changes.delete(entry.path);
            LZ.ui.set({ changeCount: changes.size });
            LZ.workspace.refreshPreview('reverted ' + U.basename(entry.path));
            rerender();
          }
        })
      ]));
    });
    return container;
  }

        h('div.lz-sidebar-head-text', [

          h('p.lz-sidebar-sub', {
            text: project

        ]);
        nav.appendChild(button);
      });

      const sectionContent = currentSection === 'files' ? fileTree()
        : currentSection === 'search' ? searchPanel()
          : currentSection === 'changes' ? changesPanel()
            : assetsPanel();

      panel.appendChild(h('div.lz-sidebar-body', [sectionContent]));

      panel.appendChild(h('div.lz-sidebar-foot', [
        components.button({ label: 'New project', icon: 'plus', size: 'sm', onClick: () => LZ.actions.openProjectPicker('new') }),

        components.iconButton({ icon: 'settings', label: 'Settings', onClick: () => LZ.actions.openSettings() })
      ]));

      panel.appendChild(nav);
    };

    LZ.ui.subscribe((state, patch) => {
      if (patch.activeLeftSection !== undefined || patch.sidebarCollapsed !== undefined) rerender();
