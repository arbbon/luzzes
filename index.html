          { label: 'Export conversation (.md)', icon: 'download', onSelect: () => chat.exportConversation() },
          { label: 'Copy last reply', icon: 'copy', onSelect: () => {
            const messages = LZ.ai.get().conversation.messages.filter((m) => m.role === 'assistant');
            const last = messages[messages.length - 1];
            if (last) U.copyText(last.content).then(() => LZ.ui.toast({ kind: 'success', title: 'Reply copied' }));
          } },
          { separator: true },
          { label: 'Clear conversation', icon: 'trash', danger: true, onSelect: async () => {
            const ok = await components.confirm({
              title: 'Clear this conversation?',
              message: 'Messages are removed from local storage. Applied changes are not reverted.'
            });
            if (ok) { LZ.ai.clearConversation(); LZ.ui.toast({ kind: 'success', title: 'Conversation cleared' }); }
          } }
        ]) }),
        components.iconButton({ icon: 'settings', label: 'AI settings', onClick: () => LZ.actions.openSettings('ai') }),
        components.iconButton({ icon: 'panelRight', label: 'Collapse assistant panel', onClick: () => LZ.actions.toggleAi() })
      ])
    ]);

    const stream = h('div.lz-ai-stream', { role: 'log', attrs: { 'aria-live': 'polite', 'aria-label': 'Conversation' } });
    const liveActivity = h('div.lz-ai-live');
    const empty = h('div.lz-ai-empty');
    const composerEl = composer();
    const panel = h('div.lz-ai-panel', [header, stream, liveActivity, empty, composerEl]);

    let rendered = new Map();
    let lastLength = 0;

    function renderStatus() {
      const state = LZ.ai.get();
      const slot = U.qs('.lz-ai-status', header);
      U.clear(slot);
      const provider = LZ.engine.provider();
      const kind = provider ? provider.kind : 'demo';
      if (state.status === 'thinking' || state.status === 'streaming') {
        slot.appendChild(components.statusDot('busy', 'working'));
        slot.appendChild(h('span', { text: state.status === 'thinking' ? 'Thinking' : 'Writing' }));
      } else if (state.status === 'error') {
        slot.appendChild(components.statusDot('error', 'error'));
        slot.appendChild(h('span', { text: 'Needs attention' }));
      } else {
        slot.appendChild(components.statusDot(kind === 'demo' ? 'idle' : 'ok', 'ready'));
        slot.appendChild(h('span', { text: 'Ready' }));
      }
      if (kind === 'demo') {
        slot.appendChild(components.chip({ label: 'Demo mode', kind: 'warn', title: 'No model endpoint is contacted in demo mode.' }));
      }
    }

    function renderEmpty() {
      const messages = LZ.ai.get().conversation.messages;
      empty.hidden = messages.length > 0;
      if (messages.length) return;
      U.clear(empty);
      const project = LZ.projects.get().current;
      empty.appendChild(h('div.lz-ai-empty-hero', [
        I.el('sparkle', 20),
        h('h2', { text: 'What should we build?' }),
        h('p', { text: project
          ? 'Luzzes can read ' + project.name + ', propose changes as diffs, and run the workspace checks.'
          : 'Create a project to get started.' })
      ]));
      const suggestions = LZ.prompts.emptyStateSuggestions(project);
      const list = h('div.lz-ai-suggestions');
      suggestions.forEach((suggestion) => {
        list.appendChild(h('button.lz-ai-suggestion', {
          type: 'button',
          onClick: () => { composerEl.setValue(suggestion.text); composerEl.focus(); }
        }, [I.el(LZ.prompts.actions[suggestion.kind] ? LZ.prompts.actions[suggestion.kind].icon : 'sparkle', 14), h('span', { text: suggestion.text })]));
      });
      empty.appendChild(list);
      empty.appendChild(h('div.lz-ai-empty-modes', [
        h('p', { text: 'How Luzzes answers depends on the provider you configure:' }),
        h('ul', [
          h('li', [components.chip({ label: 'Demo mode', kind: 'warn' }), h('span', { text: 'Replies drafted locally from static analysis — labelled wherever they appear.' })]),
          h('li', [components.chip({ label: 'Local model', kind: 'ok' }), h('span', { text: 'A server on your machine, such as LM Studio or Ollama.' })]),
          h('li', [components.chip({ label: 'Connected provider', kind: 'ok' }), h('span', { text: 'A hosted API you configure directly.' })])
        ])
      ]));
    }

    function renderActivity() {
      const state = LZ.ai.get();
      U.clear(liveActivity);
      const running = state.activity.filter((a) => a.status === 'running');
      if (!running.length || !LZ.settings.getIn('ai.showToolActivity', true)) return;
      liveActivity.appendChild(h('div.lz-ai-live-strip', [
        components.spinner(12),
        h('span', { text: running[running.length - 1].label }),
        running[running.length - 1].detail ? h('span.lz-ai-live-detail', { text: running[running.length - 1].detail }) : null
      ]));
    }

    function renderStream(opts) {
      const messages = LZ.ai.get().conversation.messages;
      const keepScroll = opts && opts.keepScroll;
      const nearBottom = stream.scrollHeight - stream.scrollTop - stream.clientHeight < 120;

      // remove elements for messages that no longer exist
      const ids = new Set(messages.map((m) => m.id));
      rendered.forEach((el, id) => {
        if (!ids.has(id)) { el.remove(); rendered.delete(id); }
      });

      messages.forEach((message, index) => {
        let el = rendered.get(message.id);
        if (!el) {
          el = messageEl(message, { refresh: () => renderStream() });
          rendered.set(message.id, el);
          const nextMessage = messages[index + 1];
          const anchor = nextMessage ? rendered.get(nextMessage.id) : null;
          if (anchor && anchor.parentNode === stream) stream.insertBefore(el, anchor);
          else stream.appendChild(el);
        } else if (el.update) {
          el.update(message);
        }
      });

      if (!keepScroll && (nearBottom || LZ.ai.get().status === 'streaming')) {
        stream.scrollTop = stream.scrollHeight;
      }
      renderEmpty();
      renderStatus();
      renderActivity();
    }

    /* streaming updates: patch the last assistant element without rebuilding */
    LZ.ai.subscribe((state, patch) => {
      if (patch.conversation) {
        const messages = state.conversation.messages;
        const last = messages[messages.length - 1];
        const length = last ? (last.content || '').length : 0;
        const structural = messages.length !== rendered.size || (last && !rendered.has(last.id));
        if (structural) renderStream();
        else if (length !== lastLength) {
          lastLength = length;
          const el = last && rendered.get(last.id);
          if (el && el.update) el.update(last);
          if (stream.scrollHeight - stream.scrollTop - stream.clientHeight < 200) stream.scrollTop = stream.scrollHeight;
        } else renderStream({ keepScroll: true });
      }
      if (patch.status || patch.activity) { renderStatus(); renderActivity(); }
      if (patch.patches) renderStream({ keepScroll: true });
    });

    LZ.bus.on('patch:applied', () => renderStream({ keepScroll: true }));
    LZ.bus.on('patch:rejected', () => renderStream({ keepScroll: true }));
    LZ.projects.subscribe((state, patch) => { if (patch.current) renderEmpty(); });

    renderStream();
    chat.focusComposer = () => composerEl.focus();
    return panel;
  };

  chat.exportConversation = function () {
    const conversation = LZ.ai.get().conversation;
    const lines = ['# Luzzes conversation', '', 'Exported ' + new Date().toISOString(), ''];
    conversation.messages.forEach((message) => {
      lines.push('## ' + (message.role === 'user' ? 'You' : 'Luzzes') + ' — ' + new Date(message.at).toLocaleString());
      if (message.mode === 'demo') lines.push('*Demo mode · scripted example*');
      lines.push('');
      lines.push(message.content || '');
      if (message.patchIds && message.patchIds.length) {
        message.patchIds.forEach((id) => {
          const patch = LZ.ai.patch(id);
          if (!patch) return;
          lines.push('');
          lines.push('```diff');
          lines.push(LZ.diff.unified(patch.before || '', patch.after || '', 'a/' + patch.path, 'b/' + patch.path));
          lines.push('```');
        });
      }
      lines.push('');
    });
    U.download('luzzes-conversation.md', lines.join('\n'));
  };
})();

/* ========== ui/bottom.js ========== */
/* ============================================================================
 * Luzzes — ui/bottom.js
 * The bottom dock: an honest browser terminal, live diagnostics, the output
 * log and the sandboxed preview.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const I = LZ.icons;
  const h = U.h;
  const components = LZ.components;

  const bottom = (LZ.bottom = {});

  /* ------------------------------------------------------- command line --- */
  const history = [];
  let historyIndex = -1;

  const COMMANDS = {
    help: () => [
      { kind: 'info', text: 'Browser workspace commands — these run in this tab:' },
      { text: '  ls [path]            list project files' },
      { text: '  open <path>          open a file in the editor' },
      { text: '  preview [path]       render a file in the preview panel' },
      { text: '  search <query>       search the project (worker)' },
      { text: '  lint [path]          re-run static analysis' },
      { text: '  test                 run the sandboxed test harness' },
      { text: '  explain <path>       ask Luzzes to explain a file' },
      { text: '  review               ask Luzzes to review the project' },
      { text: '  save | export        persist or download the project' },
      { text: '  format [path]        trim whitespace, normalise indentation' },
      { text: '  theme light|dark|system' },
      { text: '  clear                clear this panel' },
      { text: 'There is no shell, no server and no package manager here — commands like' },
      { text: 'npm install, git or node cannot run in a browser tab, and Luzzes will say so.' }
    ],
    ls: (args) => {
      const prefix = args[0] ? U.normalizePath(args[0]).replace(/\/+$/, '') + '/' : '';
      const files = LZ.projects.fileList().filter((f) => f.path.indexOf(prefix) === 0);
      if (!files.length) return [{ kind: 'error', text: 'No files under ' + (prefix || 'the project root') + '.' }];
      const out = files.slice(0, 200).map((f) => ({
        text: '  ' + f.path.replace(prefix, '') + '  ' + U.fmtBytes((f.content || '').length)
      }));
      if (files.length > 200) out.push({ text: '  … ' + (files.length - 200) + ' more' });
      return out;
    },
    open: (args) => {
      const path = matchPath(args.join(' '));
      if (!path) return [{ kind: 'error', text: 'No file matches "' + args.join(' ') + '".' }];
      LZ.workspace.openFile(path);
      return [{ kind: 'success', text: 'Opened ' + path }];
    },
    cat: (args) => {
      const path = matchPath(args.join(' '));
      if (!path) return [{ kind: 'error', text: 'No file matches "' + args.join(' ') + '".' }];
      const content = LZ.projects.read(path) || '';
      return [{ kind: 'info', text: path + ' (' + U.countLines(content) + ' lines)' }].concat(
        content.split('\n').slice(0, 60).map((line) => ({ text: '  ' + line }))
      );
    },
    preview: (args) => {
      const path = args[0] ? matchPath(args.join(' ')) : null;
      LZ.workspace.setBottomTab('preview');
      if (path) LZ.actions.openPreview(path);
      LZ.workspace.refreshPreview('requested from the terminal');
      return [{ kind: 'success', text: 'Preview refreshed' + (path ? ' on ' + path : '') + '.' }];
    },
    search: async (args) => {
      const query = args.join(' ');
      if (!query) return [{ kind: 'error', text: 'Usage: search <query>' }];
      const files = LZ.projects.fileList().filter((f) => !f.binary).map((f) => ({ path: f.path, content: f.content || '' }));
      const result = await LZ.worker.search(files, query, { limit: 60 });
      if (!result.total) return [{ kind: 'info', text: 'No matches for "' + query + '" in ' + result.scanned + ' files.' }];
      const out = [{ kind: 'info', text: result.total + ' match(es) across ' + result.results.length + ' file(s) — engine: ' + (result.engine || 'worker') }];
      result.results.slice(0, 12).forEach((group) => {
        out.push({ kind: 'success', text: group.path });
        group.matches.slice(0, 4).forEach((match) => out.push({ text: '  ' + match.line + ': ' + match.text.trim().slice(0, 110) }));
      });
      return out;
    },
    lint: () => {
      LZ.workspace.analyze();
      LZ.ui.set({ activeLeftSection: 'files' });
      return [{ kind: 'success', text: 'Static analysis queued — results appear in the Problems tab.' }];
    },
    test: async () => {
      LZ.workspace.runTests();
      return [{ kind: 'info', text: 'Running tests in a sandboxed iframe…' }];
    },
    explain: (args) => {
      const path = args[0] ? matchPath(args.join(' ')) : LZ.workspace.get().activeFile;
      if (!path) return [{ kind: 'error', text: 'Usage: explain <path>' }];
      LZ.workspace.openFile(path);
      LZ.engine.send('Explain `' + path + '` — structure first, then the subtle parts.', { action: 'explain' });
      return [{ kind: 'info', text: 'Asked Luzzes to explain ' + path }];
    },
    review: () => {
      LZ.engine.send('Review this project and order the findings by impact.', { action: 'review' });
      return [{ kind: 'info', text: 'Review requested.' }];
    },
    save: async () => {
      const result = await LZ.projects.save();
      return [{ kind: result && result.mode !== 'none' ? 'success' : 'error', text: result && result.mode !== 'none' ? 'Saved to ' + result.mode + '.' : 'Local storage is unavailable in this context.' }];
    },
    export: async () => {
      await LZ.projects.exportZip();
      return [{ kind: 'success', text: 'Project exported as a .zip' }];
    },
    format: (args) => {
      const path = args[0] ? matchPath(args.join(' ')) : LZ.workspace.get().activeFile;
      if (!path) return [{ kind: 'error', text: 'No file to format.' }];
      const result = LZ.actions.formatDocument(path);
      return [{ kind: result.changed ? 'success' : 'info', text: result.note }];
    },
    theme: (args) => {
      const mode = (args[0] || '').toLowerCase();
      if (['light', 'dark', 'system'].indexOf(mode) < 0) return [{ kind: 'error', text: 'Usage: theme light|dark|system' }];
      LZ.settings.setValue('appearance.theme', mode);
      LZ.applyTheme();
      return [{ kind: 'success', text: 'Theme set to ' + mode + '.' }];
    },
    clear: () => {
      LZ.workspace.clearLog('terminal');
      return [];
    },
    echo: (args) => [{ text: args.join(' ') }]
  };

  function matchPath(query) {
    const cleaned = String(query || '').trim().replace(/^["']|["']$/g, '');
    if (!cleaned) return null;
    const files = LZ.projects.fileList();
    const exact = files.find((f) => f.path === cleaned);
    if (exact) return exact.path;
    const endsWith = files.find((f) => f.path.endsWith('/' + cleaned) || f.path.endsWith(cleaned));
    if (endsWith) return endsWith.path;
    const base = files.find((f) => U.basename(f.path).toLowerCase() === cleaned.toLowerCase());
    if (base) return base.path;
    const fuzzy = files.find((f) => f.path.toLowerCase().indexOf(cleaned.toLowerCase()) > -1);
    return fuzzy ? fuzzy.path : null;
  }

  const SHELL_LIKE = /^(npm|npx|yarn|pnpm|git|node|python|pip|docker|make|cargo|go|brew|apt|curl|wget|ssh|cd|sudo|ls\s+-la|mkdir|rm|cp|mv|touch|chmod)\b/;

  async function runCommand(input) {
    const raw = String(input || '').trim();
    if (!raw) return;
    LZ.workspace.terminal({ kind: 'input', text: '$ ' + raw });
    history.push(raw);
    historyIndex = history.length;
    const parts = raw.split(/\s+/);
    const name = parts[0].toLowerCase();
    const args = parts.slice(1);

    if (SHELL_LIKE.test(raw) && name !== 'ls' && name !== 'cat') {
      const hasLocalEquivalent = { git: 'Changes', npm: 'Import', node: 'test' }[name];
      LZ.workspace.terminal({
        kind: 'warning',
        text: 'Browser environment: "' + name + '" is not available. This workspace has no shell, no server and no package manager — nothing here can execute native commands.'
      });
      if (name === 'npm' || name === 'yarn' || name === 'pnpm') {
        LZ.workspace.terminal({ kind: 'info', text: 'Package installation is unavailable in this workspace. Dependencies only matter if you build the project outside Luzzes — the preview runs your files directly.' });
      }
      if (hasLocalEquivalent) LZ.workspace.terminal({ kind: 'info', text: 'Closest workspace equivalent: type "help" and look for the ' + hasLocalEquivalent.toLowerCase() + ' command.' });
      return;
    }

    const command = COMMANDS[name];
    if (!command) {
      LZ.workspace.terminal({ kind: 'error', text: 'Unknown command: ' + name + '. Type "help" for the list of workspace commands.' });
      return;
    }
    try {
      const output = await command(args);
      (output || []).forEach((entry) => LZ.workspace.terminal(entry));
    } catch (error) {
      LZ.workspace.terminal({ kind: 'error', text: 'That command failed: ' + (error.message || error) });
    }
  }
  bottom.runCommand = runCommand;

  /* --------------------------------------------------------- terminal UI -- */
  function terminalPane() {
    const output = h('div.lz-terminal-output', { role: 'log', attrs: { 'aria-live': 'polite' } });
    const input = h('input.lz-terminal-input', {
      type: 'text',
      placeholder: 'Type a workspace command — try "help"',
      attrs: { 'aria-label': 'Workspace command', spellcheck: 'false', autocomplete: 'off' },
      onKeydown: (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          const value = input.value;
          input.value = '';
          runCommand(value);
        }
        if (event.key === 'ArrowUp') {
          event.preventDefault();
          if (historyIndex > 0) { historyIndex--; input.value = history[historyIndex] || ''; }
        }
        if (event.key === 'ArrowDown') {
          event.preventDefault();
          if (historyIndex < history.length - 1) { historyIndex++; input.value = history[historyIndex] || ''; }
          else { historyIndex = history.length; input.value = ''; }
        }
        if (event.key === 'Tab') {
          event.preventDefault();
          const parts = input.value.split(/\s+/);
          const last = parts[parts.length - 1] || '';
          const candidates = LZ.projects.fileList().map((f) => f.path).filter((p) => p.indexOf(last) === 0);
          if (candidates.length) { parts[parts.length - 1] = candidates[0]; input.value = parts.join(' '); }
        }
      }
    });

    function renderLog() {
      const entries = LZ.workspace.get().terminal;
      U.clear(output);
      if (!entries.length) {
        output.appendChild(h('div.lz-terminal-boot', [
          { kind: 'info', text: 'Luzzes browser workspace · ' + (LZ.projects.get().backend || 'IndexedDB') + ' storage' },
          { kind: 'dim', text: 'This is not a shell. Type "help" to see what can actually run here.' }
        ].map((entry) => h('div.lz-term-line.is-dim', { text: entry.text }))));
      }
      entries.forEach((entry) => {
        output.appendChild(h('div.lz-term-line' + (entry.kind ? '.is-' + entry.kind : ''), { text: entry.text }));
      });
      output.scrollTop = output.scrollHeight;
    }

    renderLog();
    LZ.workspace.subscribe((state, patch) => { if (patch.terminal) renderLog(); });

    const pane = h('div.lz-terminal', [
      output,
      h('div.lz-terminal-prompt', [h('span.lz-terminal-caret', { text: '›' }), input]),
      h('p.lz-terminal-note', {
        text: 'Commands act on the workspace only: files, search, analysis and the preview. Nothing is executed by the operating system.'
      })
    ]);
    setTimeout(() => input.focus({ preventScroll: true }), 40);
    return pane;
  }

  /* --------------------------------------------------------- problems UI -- */
  function problemsPane() {
    const list = h('div.lz-problems');
    const summary = h('div.lz-problems-summary');
    const groupShown = new Map();   // path -> how many rows of that file are expanded

    function render() {
      const state = LZ.workspace.get();
      const problems = state.problems;
      U.clear(summary);
      U.clear(list);
      const counts = problems.counts || { error: 0, warning: 0, hint: 0 };
      summary.appendChild(components.chip({
        label: counts.error + ' error' + (counts.error === 1 ? '' : 's'),
        kind: counts.error ? 'error' : 'muted', icon: 'error'
      }));
      summary.appendChild(components.chip({
        label: counts.warning + ' warning' + (counts.warning === 1 ? '' : 's'),
        kind: counts.warning ? 'warn' : 'muted', icon: 'warning'
      }));
      summary.appendChild(components.chip({ label: counts.hint + ' hint' + (counts.hint === 1 ? '' : 's'), kind: 'muted', icon: 'info' }));
      if (state.lintRunning) summary.appendChild(h('span.lz-problems-running', [components.spinner(12), h('span', { text: 'Analysing…' })]));
      else if (problems.scannedAt) summary.appendChild(h('span.lz-problems-meta', { text: 'Computed locally · ' + U.timeAgo(problems.scannedAt) }));

      if (!problems.list.length) {
        list.appendChild(components.emptyState({
          icon: 'checkCircle',
          title: 'No problems found',
          message: 'The analyser checks structure, references, accessibility and performance patterns. It reports only what it can prove from the source.',
          action: components.button({ label: 'Re-run analysis', size: 'sm', onClick: () => LZ.workspace.analyze() })
        }));
        return;
      }

      const byPath = problems.byPath;
      Object.keys(byPath).sort().forEach((path) => {
        const entries = byPath[path];
        const errors = entries.filter((p) => p.severity === 'error').length;
        const group = h('div.lz-problem-group', [
          h('div.lz-problem-group-head', [
            I.el(I.fileIconName(path), 13),
            h('button.lz-problem-file', { type: 'button', text: path, onClick: () => LZ.workspace.openFile(path) }),
            h('span.lz-problem-count', { text: entries.length + (errors ? ' · ' + errors + ' error' + (errors === 1 ? '' : 's') : '') }),
            components.button({
              label: 'Ask Luzzes to fix',
              icon: 'sparkle',
              size: 'sm',
              onClick: () => {
                LZ.workspace.openFile(path);
                LZ.engine.send('Fix the problems reported in `' + path + '`. Start with the highest severity and explain the root cause before the edit.', { action: 'fix' });
              }
            }),
            components.button({
              label: 'Fix all (deterministic)',
              icon: 'apply',
              size: 'sm',
              disabled: entries.filter((p) => p.fixable).length ? null : true,
              onClick: () => LZ.actions.fixFileProblems(path)
            })
          ])
        ]);
        // Very large lists (a file saved mid-edit, for instance) are rendered in
        // pages: the analyser output is kept whole, only the DOM is limited.
        const shown = entries.slice(0, groupShown.get(path) || 40);
        shown.forEach((problemItem) => {
          group.appendChild(h('div.lz-problem-row.is-' + problemItem.severity, [
            I.el(problemItem.severity === 'error' ? 'error' : problemItem.severity === 'warning' ? 'warning' : 'info', 13, 'lz-problem-sev'),
            h('button.lz-problem-loc', {
              type: 'button',
              text: problemItem.line + ':' + problemItem.col,
              title: 'Open at line ' + problemItem.line,
              onClick: () => LZ.actions.openFileAt(path, problemItem.line, problemItem.col)
            }),
            h('span.lz-problem-message', { text: problemItem.message }),
            h('span.lz-problem-rule', { text: problemItem.rule }),
            problemItem.fixable
              ? components.button({
                label: problemItem.fixLabel || 'Fix', size: 'sm',
                onClick: async (event) => {
                  const content = LZ.projects.read(path) || '';
                  const result = LZ.lint.applyFix(problemItem, content);
                  if (!result) { LZ.ui.toast({ kind: 'error', title: 'Fix could not be applied', message: 'The file changed since the analysis ran. Re-run the analysis.' }); return; }
                  LZ.workspace.pushHistory(path, content);
                  LZ.projects.writeFile(path, result.text, { origin: 'quick-fix', silent: true });
                  LZ.workspace.openFile(path);
                  if (/\.html?$|\.css$/i.test(path)) LZ.workspace.refreshPreview('quick fix applied');
                  LZ.ui.toast({
                    kind: 'success', title: 'Fix applied', message: result.note,
                    actions: [{ label: 'Undo', onClick: () => { LZ.workspace.undo(path); LZ.workspace.refreshPreview('undo'); } }]
                  });
                  event.currentTarget.disabled = true;
                }
              })
              : components.button({
                label: 'Explain', size: 'sm',
                onClick: () => {
                  LZ.workspace.openFile(path);
                  LZ.engine.send('Explain the problem reported at `' + path + ':' + problemItem.line + '` and what a correct fix looks like. Do not guess: base the answer on the file contents.', { action: 'explain' });
                }
              })
          ]));
        });
        if (entries.length > shown.length) {
          group.appendChild(h('button.lz-problem-more', {
            type: 'button',
            text: 'Show all ' + entries.length + ' findings in this file',
            onClick: () => { groupShown.set(path, entries.length); render(); }
          }));
        }
        list.appendChild(group);
      });
    }

    render();
    LZ.workspace.subscribe((state, patch) => { if (patch.problems || patch.lintRunning) render(); });
    return list;
  }

  /* ----------------------------------------------------------- output ----- */
  function outputPane() {
    const log = h('div.lz-output-log', { role: 'log', attrs: { 'aria-live': 'polite' } });
    function render() {
      const entries = LZ.workspace.get().output;
      U.clear(log);
      if (!entries.length) {
        log.appendChild(components.emptyState({
          icon: 'list',
          title: 'Nothing logged yet',
          message: 'Changes, preview refreshes and validation results are recorded here as they happen.'
        }));
        return;
      }
      entries.forEach((entry) => {
        log.appendChild(h('div.lz-output-line' + (entry.kind ? '.is-' + entry.kind : ''), [
          h('span.lz-output-time', { text: U.fmtClock(entry.at) }),
          I.el(entry.kind === 'error' ? 'error' : entry.kind === 'success' ? 'check' : 'dot', 11),
          h('span', { text: entry.text })
        ]));
      });
      log.scrollTop = log.scrollHeight;
    }
    render();
    LZ.workspace.subscribe((state, patch) => { if (patch.output) render(); });
    return log;
  }

  /* ---------------------------------------------------------- preview ----- */
  function previewPane() {
    const frame = h('iframe.lz-preview-frame', {
      sandbox: LZ.preview.sandbox,
      title: 'Project preview',
      attrs: { referrerpolicy: 'no-referrer' }
    });
    const deviceWrap = h('div.lz-preview-device');
    const urlLabel = h('span.lz-preview-url');
    const entrySelect = h('select.lz-preview-entry', { attrs: { 'aria-label': 'Preview entry file' } });
    const info = h('div.lz-preview-info');
    let built = null;

    function buildEntryOptions() {
      const files = LZ.projects.fileList().filter((f) => /\.html?$/i.test(f.path));
      U.clear(entrySelect);
      if (!files.length) {
        entrySelect.appendChild(h('option', { text: 'no HTML entry', value: '' }));
        return;
      }
      const current = LZ.workspace.entryFile();
      files.forEach((file) => {
        entrySelect.appendChild(h('option', {
          value: file.path, text: file.path, selected: file.path === current || null
        }));
      });
    }

    function render() {
      const project = LZ.projects.get().current;
      if (!project) return;
      const entry = LZ.workspace.get().previewPath || LZ.workspace.entryFile();
      built = LZ.preview.build(project, entry);
      frame.setAttribute('srcdoc', built.html);
      urlLabel.textContent = 'preview.local/' + (built.entry || '');
      buildEntryOptions();
      U.clear(info);
      if (built.missing && built.missing.length) {
        info.appendChild(h('div.lz-preview-warning', [
          I.el('warning', 13),
          h('span', { text: built.missing.length + ' reference(s) point at files that are not in this project: ' + built.missing.slice(0, 3).join(', ') })
        ]));
      }
      if (built.remote && built.remote.length) {
        info.appendChild(h('div.lz-preview-warning', [
          I.el('globe', 13),
          h('span', { text: built.remote.length + ' remote reference(s) stay remote — this sandbox has no network access, so they will not load: ' + built.remote.slice(0, 2).join(', ') })
        ]));
      }
      const device = LZ.workspace.get().previewDevice;
      deviceWrap.className = 'lz-preview-device is-' + device;
    }

    entrySelect.addEventListener('change', () => {
      LZ.workspace.set({ previewPath: entrySelect.value });
      LZ.store.local.set('preview-entry', entrySelect.value);
      render();
    });

    const devices = components.segmented({
      label: 'Preview viewport',
      value: LZ.workspace.get().previewDevice,
      options: [
        { value: 'desktop', icon: 'desktop', title: 'Desktop · 100%' },
        { value: 'tablet', icon: 'tablet', title: 'Tablet · 834px' },
        { value: 'mobile', icon: 'mobile', title: 'Phone · 390px' }
      ],
      onChange: (value) => { LZ.workspace.setPreviewDevice(value); deviceWrap.className = 'lz-preview-device is-' + value; }
    });

    const toolbar = h('div.lz-preview-toolbar', [
      components.iconButton({ icon: 'refresh', label: 'Refresh preview', onClick: () => LZ.workspace.refreshPreview('manual refresh') }),
      components.iconButton({ icon: 'external', label: 'Open the preview document in a new tab', onClick: () => {
        try {
          const blob = new Blob([built ? built.html : ''], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const opened = window.open(url, '_blank', 'noopener');
          if (!opened) LZ.ui.toast({ kind: 'warning', title: 'Popup blocked', message: 'Allow popups, or export the project and open the file locally.' });
        } catch (e) {
          LZ.ui.toast({ kind: 'error', title: 'Could not open a new tab', message: 'Download the file instead.' });
        }
      } }),
      h('div.lz-preview-address', [I.el('lock', 12), urlLabel]),
      entrySelect,
      devices
    ]);

    /* messages from the sandboxed document */
    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (!data.__luzzes) return;
      if (data.kind === 'error') {
        LZ.workspace.output({ kind: 'error', text: 'Preview error: ' + data.message + (data.line ? ' (line ' + data.line + ')' : '') });
      } else if (data.kind === 'navigate') {
        const path = data.path;
        if (LZ.projects.file(path)) {
          LZ.workspace.openFile(path);
          LZ.workspace.output({ kind: 'info', text: 'Opened ' + path + ' from a preview link' });
        }
      } else if (data.kind === 'ready') {
        LZ.workspace.output({ kind: 'success', text: 'Preview rendered ' + (data.title || 'the document') });
      }
    });

    LZ.projects.subscribe((state, patch) => {
      if (patch.current || patch.fileIndex) {
        if (LZ.settings.getIn('workspace.previewAutoRefresh', true)) render();
        else buildEntryOptions();
      }
    });
    LZ.workspace.subscribe((state, patch) => {
      if (patch.previewNonce !== undefined || patch.previewPath || patch.previewDevice) render();
    });
    LZ.bus.on('patch:applied', () => { if (LZ.settings.getIn('workspace.previewAutoRefresh', true)) render(); });

    render();

    const pane = h('div.lz-preview', [
      toolbar,
      h('div.lz-preview-viewport', deviceWrap, [frame]),
      info
    ]);
    return pane;
  }

  /* ------------------------------------------------------------- panel ---- */
  bottom.render = function () {
    const TABS = [
      { id: 'terminal', label: 'Terminal', icon: 'terminal' },
      { id: 'problems', label: 'Problems', icon: 'warning' },
      { id: 'output', label: 'Output', icon: 'list' },
      { id: 'preview', label: 'Preview', icon: 'eye' }
    ];
    const tabBar = h('div.lz-bottom-tabs', { role: 'tablist', attrs: { 'aria-label': 'Bottom panel' } });
    const body = h('div.lz-bottom-body');
    let active = LZ.workspace.get().bottomTab;
    const panes = {};

    function paneFor(id) {
      if (!panes[id]) {
        panes[id] = id === 'terminal' ? terminalPane()
          : id === 'problems' ? problemsPane()
            : id === 'output' ? outputPane()
              : previewPane();
      }
      return panes[id];
    }

    function renderTabs() {
      U.clear(tabBar);
      const counts = LZ.workspace.get().problems.counts || {};
      TABS.forEach((tab) => {
        const isActive = tab.id === active;
        const button = h('button.lz-bottom-tab' + (isActive ? '.is-active' : ''), {
          type: 'button', role: 'tab', 'aria-selected': String(isActive),
          onClick: () => { active = tab.id; LZ.workspace.setBottomTab(tab.id); renderTabs(); renderBody(); }
        }, [
          I.el(tab.icon, 13),
          h('span', { text: tab.label }),
          tab.id === 'problems' && (counts.error || counts.warning)
            ? h('span.lz-bottom-badge' + (counts.error ? '.is-error' : ''), { text: String((counts.error || 0) + (counts.warning || 0)) })
            : null
        ]);
        tabBar.appendChild(button);
      });
      tabBar.appendChild(h('div.lz-bottom-tabs-spacer'));
      tabBar.appendChild(components.iconButton({
        icon: 'trash', label: 'Clear this panel', size: 'sm',
        onClick: () => {
          if (active === 'terminal') LZ.workspace.clearLog('terminal');
          else if (active === 'output') LZ.workspace.clearLog('output');
          else if (active === 'problems') LZ.workspace.analyze();
          else LZ.workspace.refreshPreview('reload');
        }
      }));
      tabBar.appendChild(components.iconButton({
        icon: LZ.ui.get().bottomCollapsed ? 'chevronUp' : 'chevronDown',
        label: LZ.ui.get().bottomCollapsed ? 'Expand panel' : 'Collapse panel',
        size: 'sm',
        onClick: () => LZ.actions.toggleBottom()
      }));
    }

    function renderBody() {
      U.clear(body);
      body.appendChild(paneFor(active));
    }

    LZ.workspace.subscribe((state, patch) => {
      if (patch.bottomTab && patch.bottomTab !== active) { active = patch.bottomTab; renderTabs(); renderBody(); }
      if (patch.problems) renderTabs();
    });
    LZ.ui.subscribe((state, patch) => { if (patch.bottomCollapsed !== undefined) renderTabs(); });

    renderTabs();
    renderBody();
    return h('div.lz-bottom', [tabBar, body]);
  };
})();

/* ========== ui/overlays.js ========== */
/* ============================================================================
 * Luzzes — ui/overlays.js
 * Command palette, settings, project picker, the "what are we building?"
 * welcome screen and the startup screen.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const I = LZ.icons;
  const h = U.h;
  const components = LZ.components;

  const overlays = (LZ.overlays = {});

  /* --------------------------------------------------------- startup ------ */
  overlays.loading = function (message) {
    const label = h('p.lz-loading-message', { text: message || 'Preparing workspace…' });
    const el = h('div.lz-loading', [
      h('div.lz-loading-mark', I.el('logoMark', 30)),
      h('span.lz-loading-word', { text: 'Luzzes' }),
      label,
      h('div.lz-loading-bar', h('span'))
    ]);
    return {
      el,
      setMessage: (text) => { label.textContent = text; },
      remove: () => {
        el.classList.add('is-leaving');
        setTimeout(() => el.remove(), 260);
      }
    };
  };

  /* ------------------------------------------------------ command palette - */
  function buildCommandIndex() {
    const commands = [
      { id: 'new-project', label: 'New project', icon: 'plus', group: 'Project', run: () => LZ.actions.openProjectPicker('new') },
      { id: 'open-project', label: 'Open project…', icon: 'folder', group: 'Project', run: () => LZ.actions.openProjectPicker('open') },
      { id: 'import', label: 'Import project…', icon: 'upload', group: 'Project', run: () => LZ.actions.importProject() },
      { id: 'export-zip', label: 'Export project as .zip', icon: 'download', group: 'Project', run: () => LZ.actions.exportProject('zip') },
      { id: 'export-json', label: 'Export project as .json', icon: 'download', group: 'Project', run: () => LZ.actions.exportProject('json') },
      { id: 'save', label: 'Save project', icon: 'check', shortcut: 'mod+s', group: 'Project', run: () => LZ.actions.save() },

      { id: 'new-folder', label: 'New folder…', icon: 'folder', group: 'Files', run: () => LZ.actions.promptNewFolder('') },
      { id: 'search', label: 'Search across project', icon: 'search', shortcut: 'mod+shift+f', group: 'Files', run: () => LZ.actions.focusSearch() },
      { id: 'find-file', label: 'Go to file…', icon: 'fileCode', shortcut: 'mod+p', group: 'Files', run: () => overlays.palette({ mode: 'files' }) },
      { id: 'ask', label: 'Ask Luzzes…', icon: 'sparkle', group: 'Assistant', run: () => LZ.actions.focusComposer() },
      { id: 'review', label: 'Review the project', icon: 'shield', group: 'Assistant', run: () => LZ.engine.quickAction('review') },
      { id: 'explain-file', label: 'Explain the active file', icon: 'book', group: 'Assistant', run: () => LZ.engine.quickAction('explain') },
      { id: 'tests', label: 'Generate tests', icon: 'beaker', group: 'Assistant', run: () => LZ.engine.quickAction('tests') },
      { id: 'docs', label: 'Generate documentation', icon: 'document', group: 'Assistant', run: () => LZ.engine.quickAction('docs') },
      { id: 'optimize', label: 'Find performance problems', icon: 'bolt', group: 'Assistant', run: () => LZ.engine.quickAction('optimize') },
      { id: 'clear-conversation', label: 'Clear the conversation', icon: 'trash', group: 'Assistant', run: () => { LZ.ai.clearConversation(); LZ.ui.toast({ kind: 'success', title: 'Conversation cleared' }); } },
      { id: 'run-tests', label: 'Run tests in the sandbox', icon: 'beaker', group: 'Workspace', run: () => LZ.actions.runTests() },

  overlays.palette = function (opts) {
    opts = opts || {};
    const previousFocus = document.activeElement;
    const state = { index: 0, items: [], query: '' };

    const input = h('input.lz-palette-input', {
      type: 'text',
      placeholder: opts.mode === 'files' ? 'Go to file…' : 'Search commands, files and actions…',
      attrs: { 'aria-label': 'Command palette', spellcheck: 'false', autocomplete: 'off', role: 'combobox', 'aria-expanded': 'true' }
    });
    const list = h('div.lz-palette-list', { role: 'listbox' });
    const hint = h('div.lz-palette-hint');
    const panel = h('div.lz-palette', { role: 'dialog', 'aria-modal': 'true', attrs: { 'aria-label': 'Command palette' } }, [
      h('div.lz-palette-search', [I.el('search', 16), input, h('kbd.lz-kbd', { text: 'Esc' })]),
      list,
      hint
    ]);
    const backdrop = h('div.lz-palette-backdrop', {
      onClick: (event) => { if (event.target === backdrop) close(); }
    }, panel);

    function close() {
      backdrop.classList.remove('is-open');
      setTimeout(() => {
        backdrop.remove();
        if (previousFocus && previousFocus.focus) previousFocus.focus({ preventScroll: true });
      }, 140);
      LZ.ui.set({ commandPaletteOpen: false });
    }

    function buildItems(query) {
      const items = [];
      const q = query.trim().toLowerCase();
      if (opts.mode !== 'files') {
        buildCommandIndex().forEach((command) => {
          const haystack = (command.label + ' ' + command.group + ' ' + command.id).toLowerCase();
          const score = q ? fuzzyScore(haystack, q) : 1;
          if (q && score <= 0) return;
          items.push(Object.assign({}, command, { score, type: 'command' }));
        });
      }
      const files = LZ.projects.fileList();
      files.forEach((file) => {
        const score = q ? fuzzyScore(file.path.toLowerCase(), q) : 0.4;
        if (q && score <= 0) return;
        items.push({
          id: 'file:' + file.path,
          label: file.path,
          detail: U.plural(U.countLines(file.content || ''), 'line'),
          icon: I.fileIconName(file.path),
          group: 'Files',
          type: 'file',
          score: score + (opts.mode === 'files' ? 2 : 0),
          run: () => {
            LZ.workspace.openFile(file.path);
            if (opts.onPick) opts.onPick(file.path);
          }
        });
      });
      if (!q) {
        LZ.projects.get().list.slice(0, 4).forEach((project) => {
          if (project.id === (LZ.projects.get().current || {}).id) return;
          items.push({
            id: 'project:' + project.id,
            label: 'Open project · ' + project.name,
            detail: U.timeAgo(project.updatedAt || project.createdAt),
            icon: 'layers',
            group: 'Projects',
            type: 'project',
            score: 0.3,
            run: () => LZ.projects.open(project.id)
          });
        });
      }
      return items.sort((a, b) => b.score - a.score).slice(0, 40);
    }

    function fuzzyScore(haystack, needle) {
      if (haystack.indexOf(needle) > -1) return 3 - haystack.indexOf(needle) / 100;
      let index = 0, score = 0;
      for (let i = 0; i < needle.length; i++) {
        const found = haystack.indexOf(needle[i], index);
        if (found < 0) return 0;
        score += found === index ? 0.5 : 0.1;
        index = found + 1;
      }
      return score;
    }

    function render() {
      const items = buildItems(input.value);
      state.items = items;
      state.index = U.clamp(state.index, 0, Math.max(0, items.length - 1));
      U.clear(list);
      if (!items.length) {
        list.appendChild(h('div.lz-palette-empty', [
          I.el('search', 16),
          h('p', { text: 'Nothing matched “' + input.value + '”' }),
          h('p.lz-palette-empty-hint', { text: 'Try a file name, or a word from a command.' })
        ]));
        hint.textContent = '';
        return;
      }
      let lastGroup = null;
      items.forEach((item, index) => {
        if (item.group !== lastGroup) {
          lastGroup = item.group;
          list.appendChild(h('div.lz-palette-group', { text: item.group }));
        }
        const row = h('button.lz-palette-item' + (index === state.index ? '.is-active' : ''), {
          type: 'button', role: 'option', 'aria-selected': String(index === state.index),
          onMouseenter: () => { state.index = index; render(); },
          onClick: () => { close(); item.run(); }
        }, [
          I.el(item.icon || 'arrowRight', 15),
          h('span.lz-palette-label', { text: item.label }),
          item.detail ? h('span.lz-palette-detail', { text: item.detail }) : null,
          item.shortcut ? h('kbd.lz-kbd', { text: U.shortcutLabel(item.shortcut) }) : null
        ]);
        list.appendChild(row);
      });
      const active = U.qs('.lz-palette-item.is-active', list);
      if (active) active.scrollIntoView({ block: 'nearest' });
      hint.textContent = items.length + ' result' + (items.length === 1 ? '' : 's') + ' · ↑↓ to move · ↵ to run';
    }

    input.addEventListener('input', () => { state.index = 0; render(); });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown') { event.preventDefault(); state.index = Math.min(state.index + 1, state.items.length - 1); render(); }
      if (event.key === 'ArrowUp') { event.preventDefault(); state.index = Math.max(state.index - 1, 0); render(); }
      if (event.key === 'Enter') {
        event.preventDefault();
        const item = state.items[state.index];
        if (item) { close(); item.run(); }
      }
      if (event.key === 'Tab') { event.preventDefault(); }
    });
    document.addEventListener('keydown', function onKey(event) {
      if (event.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); }
    });

    document.body.appendChild(backdrop);
    requestAnimationFrame(() => { backdrop.classList.add('is-open'); input.focus(); });
    render();
    LZ.ui.set({ commandPaletteOpen: true });
    return { close, setQuery: (q) => { input.value = q; render(); } };
  };

            LZ.ui.toast({ kind: 'success', title: 'Settings reset' });
          } })
        ]),
        counts ? h('p.lz-settings-row-hint', { text: 'Workspace analysis: ' + counts.error + ' errors · ' + counts.warning + ' warnings · ' + counts.hint + ' hints.' }) : null
      ]));
    }

    function renderBody() {
      U.clear(body);
      if (section === 'appearance') renderAppearance();
      else if (section === 'editor') renderEditor();
      else if (section === 'ai') renderAi();
      else if (section === 'workspace') renderWorkspace();
      else if (section === 'storage') renderStorage();
      else renderAbout();
    }

    const dialog = components.modal({
      title: 'Settings',
      subtitle: 'Everything is stored locally in this browser',
      size: 'lg',
      content: h('div.lz-settings', [nav, body])
    });
    function render() { renderNav(); renderBody(); }
    render();
    return dialog;
  };

  /* ------------------------------------------------------ project picker -- */
  overlays.projectPicker = function (mode) {
    let tab = mode === 'new' ? 'new' : 'open';
    const body = h('div.lz-picker-body');
    const tabs = h('div.lz-picker-tabs');

    function renderTabs() {
      U.clear(tabs);
      [{ id: 'open', label: 'Open', icon: 'folder' }, { id: 'new', label: 'New', icon: 'plus' }].forEach((item) => {
        const active = tab === item.id;
        tabs.appendChild(h('button.lz-picker-tab' + (active ? '.is-active' : ''), {
          type: 'button', 'aria-selected': String(active), role: 'tab',
          onClick: () => { tab = item.id; renderTabs(); renderBody(); }
        }, [I.el(item.icon, 14), h('span', { text: item.label })]));
      });
    }

    function renderOpen() {
      const list = LZ.projects.get().list;
      const wrap = h('div.lz-picker-list');
      if (!list.length) {
        wrap.appendChild(components.emptyState({
          icon: 'plus', title: 'Start building something.',
          message: 'No projects are stored in this browser yet.',
          action: components.button({ label: 'Create project', kind: 'primary', size: 'sm', onClick: () => { tab = 'new'; renderTabs(); renderBody(); } })
        }));
        return wrap;
      }
      list.forEach((project) => {
        const isCurrent = (LZ.projects.get().current || {}).id === project.id;
        wrap.appendChild(h('div.lz-picker-row' + (isCurrent ? '.is-current' : ''), [
          h('div.lz-picker-row-main', [
            I.el('layers', 16),
            h('div', [
              h('p.lz-picker-name', { text: project.name }),
              h('p.lz-picker-meta', {
                text: (project.files ? project.files.length : 0) + ' files · updated ' + U.timeAgo(project.updatedAt || project.createdAt) + (isCurrent ? ' · open now' : '')
              })
            ])
          ]),
          h('div.lz-picker-row-actions', [
            components.button({
              label: isCurrent ? 'Open' : 'Open', size: 'sm', kind: isCurrent ? null : 'primary',
              onClick: async () => { await LZ.projects.open(project.id); dialog.close(); }
            }),
            components.iconButton({ icon: 'moreVertical', label: 'Project options', onClick: (event) => components.popover(event.currentTarget, [
              { label: 'Rename…', icon: 'edit', onSelect: async () => {
                const next = await overlays.prompt({ title: 'Rename project', label: 'Project name', value: project.name });
                if (next) { await LZ.projects.rename(project.id, next); render(); }
              } },
              { label: 'Duplicate', icon: 'copy', onSelect: async () => { await LZ.projects.duplicate(project.id); render(); LZ.ui.toast({ kind: 'success', title: 'Project duplicated' }); } },
              { label: 'Export .zip', icon: 'download', onSelect: async () => {
                const full = await LZ.store.getProject(project.id);
                const blob = await LZ.zip.create((full.files || []).map((f) => ({ path: f.path, data: f.content || '' })));
                U.download(U.slugify(full.name) + '.zip', blob);
              } },
              { separator: true },
              { label: 'Delete', icon: 'trash', danger: true, onSelect: async () => {
                const ok = await components.confirm({
                  title: 'Delete “' + project.name + '”?',
                  message: 'The project and its conversation are removed from this browser.',
                  detail: 'Export it first if you want a copy outside the browser.',
                  confirmLabel: 'Delete project', danger: true
                });
                if (ok) { await LZ.projects.remove(project.id); render(); }
              } }
            ]) })
          ])
        ]));
      });
      return wrap;
    }

    function renderNew() {
      const wrap = h('div.lz-picker-new');
      const grid = h('div.lz-template-grid');
      LZ.demo.templates.forEach((template) => {
        grid.appendChild(h('button.lz-template', {
          type: 'button',
          onClick: async () => {
            const project = await LZ.projects.create({ templateId: template.id, name: template.id === 'demo' ? 'Luzzes Landing copy' : template.label });
            dialog.close();
            LZ.ui.toast({ kind: 'success', title: 'Project created', message: project.name + ' · ' + project.files.length + ' files' });
          }
        }, [
          h('span.lz-template-icon', I.el(template.icon, 18)),
          h('span.lz-template-label', { text: template.label }),
          h('span.lz-template-blurb', { text: template.blurb })
        ]));
      });
      wrap.appendChild(grid);

      const nameInput = components.textInput({ placeholder: 'Project name', label: 'Project name' });
      const createBlank = components.button({
        label: 'Create empty project', kind: 'primary',
        onClick: async () => {
          const project = await LZ.projects.create({ name: nameInput.value.trim() || 'Untitled project', templateId: 'blank' });
          dialog.close();
          LZ.ui.toast({ kind: 'success', title: 'Project created', message: project.name });
        }
      });
      wrap.appendChild(h('div.lz-picker-blank', [
        nameInput,
        createBlank,
        components.button({ label: 'Import a .zip or .json', icon: 'upload', onClick: async () => { dialog.close(); LZ.actions.importProject(); } })
      ]));
      return wrap;
    }

    function renderBody() {
      U.clear(body);
      body.appendChild(tab === 'new' ? renderNew() : renderOpen());
    }
    const dialog = components.modal({
      title: 'Projects',
      subtitle: 'Stored in this browser — no account involved',
      size: 'md',
      content: h('div.lz-picker', [tabs, body])
    });
    function render() { renderTabs(); renderBody(); }
    render();
    return dialog;
  };

  /* --------------------------------------------------------- prompt ------ */
  overlays.prompt = function (opts) {
    return new Promise((resolve) => {
      const input = components.textInput({
        value: opts.value || '',
        placeholder: opts.placeholder || '',
        label: opts.label || 'Value',
        attrs: { 'data-autofocus': 'true' },
        onKeydown: (event) => {
          if (event.key === 'Enter') { event.preventDefault(); finish(input.value); }
        }
      });
      function finish(value) { dialog.close(); resolve(value); }
      const dialog = components.modal({
        title: opts.title || 'Enter a value',
        size: 'sm',
        content: h('div.lz-prompt', [
          components.field({ label: opts.label || '', control: input, hint: opts.hint || null })
        ]),
        footer: [
          components.button({ label: 'Cancel', onClick: () => finish(null) }),
          components.button({ label: opts.confirmLabel || 'Save', kind: 'primary', onClick: () => finish(input.value) })
        ],
        onClose: () => resolve(null)
      });
      setTimeout(() => input.focus(), 60);
    });
  };

  /* --------------------------------------------------------- welcome ----- */
  overlays.welcome = function (opts) {
    const CHOICES = [
      { id: 'landing', label: 'Landing page', icon: 'layoutBottom', template: 'blank' },
      { id: 'webapp', label: 'Web app', icon: 'codeBlock', template: 'blank' },
      { id: 'dashboard', label: 'Dashboard', icon: 'panels', template: 'dashboard' },
      { id: 'portfolio', label: 'Portfolio', icon: 'fileImage', template: 'blank' },
      { id: 'saas', label: 'SaaS interface', icon: 'layers', template: 'blank' },
      { id: 'component', label: 'Component', icon: 'box', template: 'component' },
      { id: 'scratch', label: 'Start from scratch', icon: 'plus', template: 'blank' }
    ];
    let choice = null;
    const promptInput = h('textarea.lz-welcome-input', {
      rows: '3',
      placeholder: 'Build a modern portfolio website for a photographer with a fullscreen gallery and a dark theme.',
      attrs: { 'aria-label': 'Describe what you want to build' }
    });
    const choiceRow = h('div.lz-welcome-choices');
    CHOICES.forEach((item) => {
      const button = h('button.lz-welcome-choice', {
        type: 'button', 'aria-pressed': 'false',
        onClick: () => {
          choice = choice === item.id ? null : item.id;
          U.qsa('.lz-welcome-choice', choiceRow).forEach((b) => {
            const active = b.dataset.id === choice;
            b.classList.toggle('is-active', active);
            b.setAttribute('aria-pressed', String(active));
          });
        }
      }, [I.el(item.icon, 16), h('span', { text: item.label })]);
      button.dataset.id = item.id;
      choiceRow.appendChild(button);
    });

    const dialog = components.modal({
      title: 'What are we building?',
      subtitle: 'Pick a starting point, or describe the outcome in a sentence.',
      size: 'md',
      content: h('div.lz-welcome', [
        choiceRow,
        h('div.lz-welcome-prompt', [
          promptInput,
          h('p.lz-welcome-hint', { text: 'Luzzes starts from a real template and tells you exactly what it scaffolded. In demo mode it will not pretend to have written code it has not written.' })
        ]),
        h('div.lz-welcome-modes', [
          components.chip({ label: 'No signup', kind: 'ok', icon: 'check' }),
          components.chip({ label: 'Demo mode by default', kind: 'warn', icon: 'sparkle' }),
          components.chip({ label: 'Bring your own model', kind: 'muted', icon: 'cpu' })
        ])
      ]),
      footer: [
        components.button({ label: 'Open the demo project', onClick: () => { dialog.close(); if (opts.onDone) opts.onDone(); } }),
        components.button({
          label: 'Build with Luzzes', kind: 'primary', icon: 'sparkle',
          onClick: () => {
            const description = promptInput.value.trim();
            const item = CHOICES.find((c) => c.id === choice);
            dialog.close();
            LZ.actions.startFromDescription(description, item ? item.template : null);
          }
        })
      ],
      onClose: () => { if (opts.onDone) opts.onDone(); }
    });

    setTimeout(() => promptInput.focus(), 80);
    return dialog;
  };
})();

/* ========== main.js ========== */
/* ============================================================================
 * Luzzes — main.js
 * Theme handling, the action registry used by every interface surface, global
 * keyboard shortcuts and the bootstrap sequence.
 * ==========================================================================*/
(function () {
  const LZ = (window.LZ = window.LZ || {});
  const U = LZ.util;
  const I = LZ.icons;
  const h = U.h;
  const components = LZ.components;

  /* --------------------------------------------------------------- theme -- */
  LZ.applyTheme = function () {
    const theme = LZ.settings.resolvedTheme();
    const root = document.documentElement;
    root.setAttribute('data-theme', theme);
    root.dataset.density = LZ.settings.getIn('appearance.density', 'comfortable');
    const favicon = document.getElementById('lz-favicon');
    if (favicon) favicon.setAttribute('href', I.favicon(theme === 'dark' ? '#5b63f5' : '#4b52e0'));
    LZ.bus.emit('theme:change', theme);
  };
  LZ.settings.subscribe((state, patch) => { if (patch.appearance) LZ.applyTheme(); });

  /* ------------------------------------------------------------- actions -- */
  const actions = (LZ.actions = {});

  actions.goHome = function () {
    window.location.hash = '';
    LZ.ui.set({ view: 'landing' });
  };

  actions.openWorkspace = async function () {
    if (LZ.ui.get().view === 'workspace') return;
    const loading = LZ.overlays.loading('Preparing workspace…');
    document.body.appendChild(loading.el);
    try {
      await LZ.app.projectsReady;
      loading.setMessage('Mounting panels…');
      await U.raf();
      LZ.ui.set({ view: 'workspace' });
      LZ.app.mountWorkspace();
      await U.sleep(160);
    } catch (error) {
      LZ.ui.toast({ kind: 'error', title: 'The workspace could not start', message: (error && error.message) || 'Unknown error' });
    } finally {
      loading.remove();
      if (!LZ.store.local.get('welcome-seen', false)) {
        LZ.store.local.set('welcome-seen', true);
        setTimeout(() => LZ.overlays.welcome({}), 420);
      }
    }
  };

  actions.save = async function () {
    const result = await LZ.projects.save();
    if (!result) return;
    if (result.mode === 'none') {
      LZ.ui.toast({ kind: 'error', title: 'Could not save', message: 'Local storage is unavailable in this browser context. Use Export to keep a copy.' });
    } else {
      LZ.ui.toast({ kind: 'success', title: 'Project saved', message: 'Written to ' + result.mode + '.' });
    }
  };

  actions.toggleSidebar = function () { LZ.ui.set({ sidebarCollapsed: !LZ.ui.get().sidebarCollapsed }); };
  actions.toggleAi = function () { LZ.ui.set({ aiPanelCollapsed: !LZ.ui.get().aiPanelCollapsed }); };
  actions.toggleBottom = function () { LZ.ui.set({ bottomCollapsed: !LZ.ui.get().bottomCollapsed }); };
  actions.togglePreview = function () {
    const state = LZ.workspace.get();
    if (state.bottomTab === 'preview' && !LZ.ui.get().bottomCollapsed) LZ.ui.set({ bottomCollapsed: true });
    else { LZ.workspace.set({ bottomTab: 'preview' }); LZ.ui.set({ bottomCollapsed: false }); }
  };
  actions.openPreview = function (path) {
    if (path) {
      LZ.workspace.set({ previewPath: path });
      LZ.store.local.set('preview-entry', path);
    }
    LZ.workspace.set({ bottomTab: 'preview' });
    LZ.ui.set({ bottomCollapsed: false, mobileTab: LZ.shell.isMobile() ? 'preview' : LZ.ui.get().mobileTab });
    LZ.workspace.refreshPreview();
  };
  actions.runTests = async function () {
    if (LZ.shell.isMobile()) LZ.ui.set({ mobileTab: 'preview' });
    await LZ.workspace.runTests();
  };
  actions.openSettings = function (section) {
    if (section) LZ.ui.set({ settingsSection: section });
    LZ.overlays.settings(section || LZ.ui.get().settingsSection);
  };
  actions.openPalette = function (opts) { LZ.overlays.palette(opts); };
  actions.openProjectPicker = function (mode) { LZ.overlays.projectPicker(mode); };
  actions.focusComposer = function () {
    LZ.ui.set({ aiPanelCollapsed: false, mobileTab: LZ.shell.isMobile() ? 'chat' : LZ.ui.get().mobileTab });
    if (LZ.chat.focusComposer) setTimeout(() => LZ.chat.focusComposer(), 60);
  };
  actions.focusSearch = function () {
    LZ.ui.set({ activeLeftSection: 'search', sidebarCollapsed: false, mobileTab: LZ.shell.isMobile() ? 'files' : LZ.ui.get().mobileTab });
  };
  actions.resetLayout = function () {
    LZ.workspace.set({ panelSizes: { sidebar: 252, ai: 396, bottom: 232 } });
    LZ.ui.set({ sidebarCollapsed: false, aiPanelCollapsed: false, bottomCollapsed: false });
    LZ.ui.toast({ kind: 'success', title: 'Layout reset' });
  };

  actions.openFileAt = function (path, line, col, length) {
    LZ.workspace.openFile(path);
    const view = LZ.editor.activeView;
    if (!view) return;
    setTimeout(() => {
      if (view.getState().path !== path) view.setFile(path);
      view.goTo(line, col, length);
    }, 40);
  };

  actions.promptNewFile = async function (dir) {
    const value = await LZ.overlays.prompt({
      title: 'New file',
      label: 'Path',
      value: dir || '',
      placeholder: 'src/components/Button.tsx',
      hint: 'Folders are created automatically. Images and other binary files can be added from Assets.'
    });
    if (!value) return;
    const path = U.normalizePath(value);
    if (/\/$/.test(value.trim()) || !U.basename(path).includes('.')) {
      LZ.projects.createFolder(path.replace(/\/+$/, ''));
      LZ.ui.toast({ kind: 'success', title: 'Folder created', message: path + '/' });
      return;
    }
    LZ.projects.createFile(path, '');
    LZ.workspace.openFile(path);
    LZ.ui.toast({ kind: 'success', title: 'File created', message: path });
  };

  actions.promptNewFolder = async function (dir) {
    const value = await LZ.overlays.prompt({
      title: 'New folder', label: 'Path', value: dir || '', placeholder: 'src/components'
    });
    if (!value) return;
    LZ.projects.createFolder(value);
    LZ.ui.toast({ kind: 'success', title: 'Folder created', message: value + '/' });
  };

  actions.deletePath = async function (path) {
    const isFolder = LZ.projects.fileList().some((f) => f.path.indexOf(path + '/') === 0);
    const ok = await components.confirm({
      title: 'Delete ' + (isFolder ? 'folder' : 'file') + '?',
      message: path + (isFolder ? ' and everything inside it' : '') + ' will be removed from this project.',
      detail: 'Deletions cannot be undone from the Changes panel — export the project first if you need a copy.',
      confirmLabel: 'Delete', danger: true
    });
    if (!ok) return;
    LZ.projects.deletePath(path);
    LZ.ui.toast({ kind: 'success', title: 'Deleted', message: path });
  };

  actions.duplicateFile = function (path) {
    const content = LZ.projects.read(path);
    if (content == null) return;
    const base = U.basename(path);
    const ext = base.includes('.') ? base.slice(base.lastIndexOf('.')) : '';
    const stem = ext ? base.slice(0, -ext.length) : base;
    const target = U.joinPath(U.dirname(path), stem + '-copy' + ext);
    LZ.projects.createFile(target, content);
    LZ.workspace.openFile(target);
  };

  actions.importProject = function () {
    const input = h('input', { type: 'file', accept: '.zip,.json,application/zip,application/json', style: { display: 'none' } });
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      input.remove();
      if (!file) return;
      const toastId = LZ.ui.toast({ kind: 'info', title: 'Importing ' + file.name, message: 'Reading the archive locally…', duration: 0 });
      try {
        const project = await LZ.projects.importProjectFile(file);
        LZ.ui.dismissToast(toastId);
        LZ.ui.toast({ kind: 'success', title: 'Project imported', message: project.name + ' · ' + project.files.length + ' files' });
        LZ.ui.set({ activeLeftSection: 'files' });
      } catch (error) {
        LZ.ui.dismissToast(toastId);
        LZ.ui.toast({
          kind: 'error', title: 'Import failed',
          message: (error && error.message) || 'The file could not be read.',
          actions: [{ label: 'Try plain files instead', onClick: () => actions.importFilesAsProject() }]
        });
      }
    });
    document.body.appendChild(input);
    input.click();
  };

  actions.importFilesAsProject = function () {
    const input = h('input', { type: 'file', multiple: true, style: { display: 'none' } });
    input.addEventListener('change', async () => {
      const files = Array.prototype.slice.call(input.files || []);
      input.remove();
      if (!files.length) return;
      let added = 0;
      if (files.some((f) => /\.zip$/i.test(f.name))) {
        for (const file of files) {
          try { const project = await LZ.projects.importProjectFile(file); added += project.files.length; } catch (e) { /* skip */ }
        }
      } else {
        const result = await LZ.projects.importFilesIntoCurrent(files);
        added = result.added;
      }
      LZ.ui.toast({ kind: 'success', title: 'Import complete', message: added + ' file(s) added to the project.' });
    });
    document.body.appendChild(input);
    input.click();
  };

  actions.importAssets = function () {
    const input = h('input', { type: 'file', multiple: true, accept: 'image/*', style: { display: 'none' } });
    input.addEventListener('change', async () => {
      const files = Array.prototype.slice.call(input.files || []);
      input.remove();
      if (!files.length) return;
      for (const file of files) {
        const dataUrl = await U.readFileDataURL(file);
        const path = 'public/' + U.slugify(file.name.replace(/\.[^.]+$/, '')) + '.' + U.ext(file.name);
        LZ.projects.createFile(path, '', { binary: true, dataUrl });
      }
      LZ.workspace.refreshPreview('assets added');
      LZ.ui.toast({ kind: 'success', title: 'Assets added', message: files.length + ' file(s) stored with the project.' });
    });
    document.body.appendChild(input);
    input.click();
  };

  actions.exportProject = async function (format) {
    const kind = format || 'zip';
    if (kind === 'json') {
      LZ.projects.exportJSON();
      LZ.ui.toast({ kind: 'success', title: 'Project exported', message: 'Written as project JSON.' });
      return;
    }
    const toastId = LZ.ui.toast({ kind: 'info', title: 'Building the archive…', message: 'Compressing locally', duration: 0 });
    try {
      await LZ.projects.exportZip();
      LZ.ui.dismissToast(toastId);
      LZ.ui.toast({ kind: 'success', title: 'Archive ready', message: 'Saved to your downloads folder.' });
    } catch (error) {
      LZ.ui.dismissToast(toastId);
      LZ.ui.toast({ kind: 'error', title: 'Export failed', message: (error && error.message) || 'Could not build the archive.' });
    }
  };

  actions.exportConversation = function () { LZ.chat.exportConversation(); };

  actions.formatDocument = function (path) {
    path = path || LZ.workspace.get().activeFile;
    if (!path) return { changed: false, note: 'No file to format.' };
    const before = LZ.projects.read(path) || '';
    const tabSize = LZ.settings.getIn('editor.tabSize', 2);
    let after = before.replace(/\t/g, ' '.repeat(tabSize));
    after = after.split('\n').map((line) => line.replace(/[ \t]+$/, '')).join('\n');
    after = after.replace(/\n{3,}/g, '\n\n').replace(/\s*$/, '\n');
    if (after === before) return { changed: false, note: 'Already formatted — no trailing whitespace, tabs or excess blank lines.' };
    LZ.workspace.pushHistory(path, before);
    LZ.projects.writeFile(path, after, { origin: 'format', silent: true });
    const view = LZ.editor.activeView;
    if (view && view.getState().path === path) view.applyContent(after);
    LZ.ui.toast({ kind: 'success', title: 'Formatted', message: path, actions: [{ label: 'Undo', onClick: () => { LZ.workspace.undo(path); const v = LZ.editor.activeView; if (v) v.applyContent(LZ.projects.read(path) || ''); } }] });
    return { changed: true, note: 'Trimmed whitespace and normalised indentation in ' + path + '.' };
  };

  actions.fixFileProblems = function (path) {
    const problems = (LZ.workspace.get().problems.byPath[path] || []).filter((p) => p.fixable);
    if (!problems.length) {
      LZ.ui.toast({ kind: 'info', title: 'Nothing to fix mechanically', message: 'Remaining findings need a judgement call. Ask Luzzes to fix them.' });
      return;
    }
    const original = LZ.projects.read(path) || '';
    let content = original;
    const notes = [];
    problems.slice().sort((a, b) => b.line - a.line).forEach((problemItem) => {
      const result = LZ.lint.applyFix(problemItem, content);
      if (result) { content = result.text; notes.push(result.note); }
    });
    if (content === original) return;
    LZ.workspace.pushHistory(path, original);
    LZ.projects.writeFile(path, content, { origin: 'quick-fix', silent: true });
    const view = LZ.editor.activeView;
    if (view && view.getState().path === path) view.applyContent(content);
    LZ.workspace.openFile(path);
    if (/\.html?$|\.css$/i.test(path)) LZ.workspace.refreshPreview('quick fixes applied');
    LZ.ui.toast({
      kind: 'success', title: problems.length + ' fix(es) applied', message: path,
      actions: [{ label: 'Undo', onClick: () => {
        LZ.workspace.undo(path);
        const v = LZ.editor.activeView;
        if (v) v.applyContent(LZ.projects.read(path) || '');
      } }]
    });
  };

  /** Scaffold from a description. Real files, real template, honest reporting. */
  actions.startFromDescription = async function (description, templateId) {
    const text = String(description || '');
    const keyword = /dashboard|admin|metrics|analytics/i.test(text) ? 'dashboard'
      : /component|button|widget|input/i.test(text) ? 'component'
        : /portfolio|gallery|photograph/i.test(text) ? 'blank'
          : null;
    const chosen = templateId || keyword || 'blank';
    const project = await LZ.projects.create({
      name: text ? U.titleCase(U.truncate(U.md.plain(text).split(/[.,]/)[0], 42)) : 'Untitled project',
      templateId: chosen
    });
    LZ.ui.set({ view: 'workspace', activeLeftSection: 'files' });
    LZ.app.mountWorkspace();
    const template = LZ.demo.templateById(chosen);
    const files = project.files.map((f) => f.path);
    LZ.chat.focusComposer && setTimeout(() => LZ.chat.focusComposer(), 80);
    await LZ.engine.send(
      (text ? text + '\n\n' : '') +
      'I created "' + project.name + '" from the ' + template.label + ' template (' + files.length + ' files: ' + files.join(', ') + '). ' +
      'Tell me what to build next — I will plan it, then return changes as diffs.',
      { action: 'feature', hideUserMessage: true }
    );
    LZ.ui.toast({
      kind: 'success',
      title: 'Project scaffolded',
      message: template.label + ' · ' + files.length + ' files written to local storage.'
    });
  };

  /* ----------------------------------------------------------- shortcuts -- */
  const SHORTCUTS = [
    { combo: 'mod+k', run: () => LZ.overlays.palette() },
    { combo: 'mod+shift+p', run: () => LZ.overlays.palette() },
    { combo: 'mod+p', run: () => LZ.overlays.palette({ mode: 'files' }) },
    { combo: 'mod+shift+f', get view() { return LZ.ui.get().view; }, run: () => actions.focusSearch() },
    { combo: 'mod+s', run: () => actions.save() },
    { combo: 'mod+b', run: () => actions.toggleAi() },
    { combo: 'mod+j', run: () => actions.toggleBottom() },
    { combo: 'mod+shift+e', run: () => actions.toggleSidebar() },
    { combo: 'mod+/', run: () => { LZ.landing.openDocs(); } }
  ];

  document.addEventListener('keydown', (event) => {
    const mod = U.modKey(event);
    const key = event.key.length === 1 ? event.key.toLowerCase() : event.key.toLowerCase();
    const combo = (mod ? 'mod+' : '') + (event.shiftKey && event.key.length === 1 ? 'shift+' : '') + key;
    const normalized = combo.replace('mod+shift+', 'mod+shift+');

    if (mod && event.key === 'Enter') {
      event.preventDefault();
      if (LZ.ui.get().view === 'landing') actions.openWorkspace();
      else actions.focusComposer();
      return;
    }
    for (const shortcut of SHORTCUTS) {
      if (shortcut.combo === normalized || shortcut.combo === combo) {
        if (shortcut.combo.indexOf('f') > -1 && !event.shiftKey && shortcut.combo === 'mod+shift+f') continue;
        event.preventDefault();
        shortcut.run();
        return;
      }
    }
    if (event.key === 'F2' && LZ.workspace.get().activeFile) {
      // rename handled in the tree; ignore here
      return;
    }
  });

  /* --------------------------------------------------------------- boot --- */
  const app = (LZ.app = {});
  app.projectsReady = null;

  app.mountLanding = function () {
    const root = document.getElementById('app');
    if (root.dataset.view === 'landing') return;
    const landing = LZ.landing.render({ onOpen: actions.openWorkspace });
    U.clear(root);
    landing.classList.add('is-entering');
    root.appendChild(landing);
    root.dataset.view = 'landing';
    requestAnimationFrame(() => landing.classList.remove('is-entering'));
    window.scrollTo({ top: 0 });
  };

  app.mountWorkspace = function () {
    const root = document.getElementById('app');
    if (root.dataset.view === 'workspace') return;
    U.clear(root);

    const shellEl = LZ.shell.build();
    const sidebarEl = LZ.sidebar.render();
    const editorEl = LZ.editor.render();
    const chatEl = LZ.chat.render();
    const bottomEl = LZ.bottom.render();

    shellEl.querySelector('.lz-sidebar').appendChild(sidebarEl);
    shellEl.querySelector('.lz-editor-slot').appendChild(editorEl);
    shellEl.querySelector('.lz-ai-slot').appendChild(chatEl);
    shellEl.querySelector('.lz-bottom-slot').appendChild(bottomEl);

    const workspace = h('div.lz-workspace-root', [shellEl]);
    workspace.classList.add('is-entering');
    root.appendChild(workspace);
    root.dataset.view = 'workspace';
    document.body.appendChild(components.toastHost());
    LZ.shell.observeViewport();
    requestAnimationFrame(() => workspace.classList.remove('is-entering'));

    // first file: open the entry document so the editor is never blank on start
    const state = LZ.workspace.get();
    if (!state.activeFile) {
      const entry = LZ.workspace.entryFile();
      if (entry) LZ.workspace.openFile(entry, { focus: false });
      else if (LZ.projects.fileList().length) LZ.workspace.openFile(LZ.projects.fileList()[0].path, { focus: false });
    }
    LZ.workspace.analyze();
  };

  app.boot = async function () {
    const root = document.getElementById('app');

    // A deliberately short opening screen: the mark and the wordmark, then the
    // page. It is removed as soon as the first view is on screen.
    const splash = LZ.overlays.loading('Preparing workspace…');
    splash.el.classList.add('is-splash');
    if (root) { U.clear(root); root.appendChild(splash.el); }

    LZ.applyTheme();
    if (LZ.settings.getIn('workspace.restoreLayout', true) === false) {
      LZ.workspace.set({ panelSizes: { sidebar: 252, ai: 396, bottom: 232 } });
    }
    LZ.store.local.set('booted-at', Date.now());

    await U.raf();
    app.mountLanding();
    setTimeout(() => splash.remove(), U.prefersReducedMotion() ? 0 : 260);

    // projects load in the background so the landing page paints immediately
    app.projectsReady = (async () => {
      const project = await LZ.projects.init();
      if (project) {
        await LZ.engine.loadConversationFor(project);
        LZ.engine.health().then((result) => {
          if (!result.ok) LZ.workspace.output({ kind: 'info', text: 'Provider check: ' + result.detail });
        });
      }
      return project;
    })().catch((error) => {
      console.error('[luzzes] project init failed', error);
      LZ.ui.toast({ kind: 'error', title: 'Local storage problem', message: 'Projects could not be loaded. The workspace will run in memory only.' });
    });

    // keep the workspace in sync with whatever project is current
    LZ.bus.on('project:open', (project) => {
      LZ.workspace.set({ openFiles: [], activeFile: null, previewPath: null });
      const entry = LZ.workspace.entryFile();
      if (entry) LZ.workspace.openFile(entry, { focus: false });
      LZ.workspace.analyze();
      if (project && project.isDemo) {
        LZ.workspace.output({ kind: 'info', text: 'Demo project loaded — ' + project.files.length + ' files. Ask Luzzes anything about it.' });
      }
    });

    window.addEventListener('hashchange', () => {
      if (!window.location.hash && LZ.ui.get().view === 'workspace') {
        // keep the workspace; hashes are used for landing anchors only
      }
    });
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', app.boot);
  else app.boot();
})();

</script>
</body>
</html>
