<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Luzzes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234b52e0'/%3E%3Cpath d='M10.4 8.6h3.4v11.2h8.2v3.6H10.4z' fill='%23fff'/%3E%3Ccircle cx='22.6' cy='9.6' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0a0b0f;
    color: #e7e9ef;
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  @media (prefers-color-scheme: light) {
    body { background: #ffffff; color: #16181d; }
    .mark { background: #4b52e0; }
    a { color: #4b52e0; }
  }
  .wrap { max-width: 30rem; display: grid; gap: 1rem; justify-items: center; }
  .mark {
    width: 44px; height: 44px; border-radius: 12px; background: #5b63f5;
    color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 1.3rem;
  }
  h1 { margin: 0; font-size: 1.35rem; letter-spacing: -0.01em; }
  p { margin: 0; opacity: 0.75; }
  a { color: #9aa2ff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">L</div>
    <h1>That page is not here</h1>
    <p id="msg">Sending you back to the workspace…</p>
    <p><a id="home" href="./">Open Luzzes</a></p>
  </div>
<script>
  /* Send the visitor to the project root. GitHub Pages serves this file for any
     unknown path, so the first path segment is the repository name (for a
     project site) — everything after it is the missing path. */
  (function () {
    var segments = location.pathname.split('/').filter(Boolean);
    var base = segments.length ? '/' + segments[0] + '/' : '/';
    document.getElementById('home').setAttribute('href', base);
    setTimeout(function () { location.replace(base); }, 1200);
  })();
</script>
</body>
</html>
